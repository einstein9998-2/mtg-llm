id: tron2-b-masticore-destroys-nothing-indestructible-the-one-ring
title: "Discarding Force of Will to Argentum Masticore and targeting The One Ring: indestructible, so it survives; the Masticore also stays"
area: card
cards: [Argentum Masticore, Force of Will, The One Ring, Null Rod]
tags: [argentum-masticore, reflexive-trigger, indestructible, the-one-ring, destroy, tron-sideboard]
derived_from: oracle
source:
  - {kind: oracle, card: Argentum Masticore, text: "When you discard a card this way, destroy target nonland permanent an opponent controls with mana value less than or equal to the mana value of the discarded card.", verified: true, note: "entry in oracle-additions-B.json"}
  - {kind: oracle, card: The One Ring, text: "Indestructible", verified: true}
  - {kind: cr, ref: "702.12b", text: "A permanent with indestructible can’t be destroyed.", verified: true}
setup:
  turn: 2
  active: p1
  phase: end
  p0:
    hand: ["Force of Will @fow"]
    battlefield: ["Argentum Masticore @mast"]
    library_pad: 10
  p1:
    battlefield: ["The One Ring @ring", "Null Rod @rod"]
    library_pad: 10
script:
  - advance: {to: upkeep, of: p0}
  - resolve_top: true
  - p0: {decision: yes_no, purpose: discard_to_keep_masticore, answer: true}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@fow"]}
  - p0:
      decision: choose_target
      slot: 0
      expect_options: {include: ["@ring", "@rod"], count: 2}
      answer: "@ring"
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      graveyard: [Force of Will]
      battlefield: [{card: Argentum Masticore}]
    p1:
      battlefield: [{card: The One Ring}, {card: Null Rod}]
      graveyard: []
notes: >
  Force of Will has mana value 5, so The One Ring (4) and Null Rod (2) are both legal targets: an indestructible
  permanent can still be targeted. The destroy instruction does nothing to it (702.12b) and it stays on the battlefield.
  The upkeep cost was paid (a card was discarded), so the Masticore stays. A wrong engine removes indestructible
  permanents from the candidates, or destroys it.
