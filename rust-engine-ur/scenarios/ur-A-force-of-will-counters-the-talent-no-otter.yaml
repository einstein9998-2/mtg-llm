id: ur-a-force-of-will-counters-the-talent-no-otter
title: "Force of Will counters Stormchaser's Talent on the stack: it goes to the graveyard and no Otter is created"
area: card
cards: ["Stormchaser's Talent", Island, Force of Will, Brainstorm]
tags: [stormchasers-talent, class, force-of-will, counterspell, alternative-cost, enters-trigger-never-happens, ur-alternate]
derived_from: oracle
source:
  - {kind: oracle, card: Force of Will, text: "You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: oracle, card: "Stormchaser's Talent", text: "When this Class enters, create a 1/1 blue and red Otter creature token with prowess.", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: cr, ref: "701.6a", text: "A countered spell is put into its owner’s graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Stormchaser's Talent @talent"]
    battlefield: ["Island @is1"]
    library_pad: 10
  p1:
    hand: ["Force of Will @fow", "Brainstorm @bs"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@talent", pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@talent"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: ["Stormchaser's Talent"]
      battlefield: [{card: Island, tapped: true}]
    p1:
      life: 19
      graveyard: [Force of Will]
      exile: [Brainstorm]
      hand: []
notes: >
  The Talent never enters, so its enters trigger never happens: p0's battlefield is only the tapped Island and the
  Talent is in the graveyard (it could be returned later only by another effect, not by its own level 2). A wrong engine
  creates the Otter on cast.
