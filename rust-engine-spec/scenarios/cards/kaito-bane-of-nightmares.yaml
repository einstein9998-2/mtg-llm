id: kaito-on-opponents-turn-is-a-noncreature-planeswalker
title: On the opponent's turn Kaito is not a creature (Fatal Push cannot target him), and Lightning Bolt to Kaito removes 3 loyalty and kills him
area: card
cards: ["Kaito, Bane of Nightmares", Fatal Push, Lightning Bolt, Swamp, Mountain]
tags: [kaito, planeswalker, damage-to-planeswalker, state-based-actions, layer-4]
derived_from: cr
source:
  - {kind: oracle, card: "Kaito, Bane of Nightmares", text: "During your turn, as long as Kaito has one or more loyalty counters on him, he's a 3/4 Ninja creature and has hexproof.", verified: true}
  - {kind: oracle, card: Lightning Bolt, text: "Lightning Bolt deals 3 damage to any target.", verified: true}
  - {kind: cr, ref: "115.4", text: "These targets may be creatures, players, planeswalkers, or battles.", verified: true}
  - {kind: cr, ref: "120.3c", text: "Damage dealt to a planeswalker causes that many loyalty counters to be removed from that planeswalker.", verified: true}
  - {kind: cr, ref: "704.5i", text: "If a planeswalker has loyalty 0, it's put into its owner's graveyard.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    battlefield: [{card: "Kaito, Bane of Nightmares", as: kaito, counters: {loyalty: 3}}]
    library_pad: 10
  p1:
    hand: ["Fatal Push @push", "Lightning Bolt @bolt"]
    battlefield: ["Swamp @s1", "Mountain @m1"]
    library_pad: 10
script:
  - check: {p0: {battlefield: [{card: "Kaito, Bane of Nightmares", keywords_exclude: [hexproof], counters: {loyalty: 3}}]}}
  - expect_illegal: {p1: {t: cast, card: "@push", targets: ["@kaito"]}}
  - p1: {t: cast, card: "@bolt", targets: ["@kaito"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      battlefield: []
      graveyard: ["Kaito, Bane of Nightmares"]
    p1:
      hand: [Fatal Push]
      graveyard: [Lightning Bolt]
notes: >
  "During your turn" is p0's turn only, so on p1's turn Kaito is just a planeswalker: no hexproof, not a creature, so
  Fatal Push ("target creature") has no legal target in him, while Bolt ("any target") can target him. 3 damage removes
  3 loyalty counters (120.3c), loyalty 0 puts him into the graveyard (704.5i).
---
id: kaito-minus-two-stun-counters-keep-creature-tapped-through-untap
title: Kaito's -2 taps a creature with two stun counters; in its controller's untap step it stays tapped and loses one counter
area: card
cards: ["Kaito, Bane of Nightmares", "Phelia, Exuberant Shepherd", Plains]
tags: [kaito, loyalty-ability, stun-counters, replacement-effect, untap-step]
derived_from: cr
source:
  - {kind: oracle, card: "Kaito, Bane of Nightmares", text: "Tap target creature. Put two stun counters on it.", verified: true}
  - {kind: cr, ref: "122.1d", text: "That effect is \"If a permanent with a stun counter on it would become untapped, instead remove a stun counter from it.\"", verified: true}
  - {kind: cr, ref: "606.3", text: "A player may activate a loyalty ability of a permanent they control any time they have priority and the stack is empty during a main phase of their turn, but only if no player has previously activated a loyalty ability of that permanent that turn.", verified: true}
  - {kind: cr, ref: "502.3", text: "Third, the active player determines which permanents they control will untap. Then they untap them all simultaneously.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main2
  p0:
    battlefield: [{card: "Kaito, Bane of Nightmares", as: kaito, counters: {loyalty: 3}}]
    library_pad: 10
  p1:
    battlefield: ["Phelia, Exuberant Shepherd @ph", {card: Plains, as: pl, tapped: true}]
    library_pad: 10
script:
  - p0: {t: activate, source: "@kaito", ability: 3, targets: ["@ph"]}
  - check:
      stack: [{kind: activated, source: "@kaito", controller: p0}]
      p0: {battlefield: [{card: "Kaito, Bane of Nightmares", counters: {loyalty: 1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      p1: {battlefield: [{card: "Phelia, Exuberant Shepherd", tapped: true, counters: {stun: 2}}, {card: Plains, tapped: true}]}
  - advance: {to: upkeep, of: p1}
expect:
  - at: after_script
    turn: 4
    phase: upkeep
    active: p1
    pending: {actor: p1, kind: priority}
    p1:
      battlefield:
        - {card: "Phelia, Exuberant Shepherd", tapped: true, counters: {stun: 1}}
        - {card: Plains, tapped: false}
notes: >
  Ability index 3: Kaito's activated abilities in Oracle order are ninjutsu (0), +1 (1), 0 (2), -2 (3); the static ability
  is not counted. The loyalty cost is paid on activation (3 to 1). In p1's untap step the Plains untaps, but Phelia's
  untap is replaced by removing one stun counter (122.1d): still tapped, one counter left. Main 2 is used so that no attack
  declaration is raised on the way (Kaito is a creature on p0's turn). A wrong engine untaps Phelia, removes both counters,
  or removes a counter without the untap event.
---
id: kaito-zero-surveils-two-and-draws-when-opponent-lost-life
title: Kaito's 0 surveils 2 and then draws one card because the opponent lost life this turn
area: card
cards: ["Kaito, Bane of Nightmares", Lightning Bolt, Mountain, Ponder, Brainstorm, Island]
tags: [kaito, loyalty-ability, surveil, turn-history, life-loss]
derived_from: oracle
source:
  - {kind: oracle, card: "Kaito, Bane of Nightmares", text: "0: Surveil 2. Then draw a card for each opponent who lost life this turn.", verified: true}
  - {kind: cr, ref: "701.25a", text: "To \"surveil N\" means to look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: [{card: "Kaito, Bane of Nightmares", as: kaito, counters: {loyalty: 3}}, "Mountain @m1"]
    library: ["Ponder @l1", "Brainstorm @l2", "Island @l3"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: activate, source: "@kaito", ability: 2}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: ["@l1"], on_top_order: ["@l2"]}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Brainstorm]
      graveyard: [Lightning Bolt, Ponder]
      library_top: [Island]
      battlefield_contains: [{card: "Kaito, Bane of Nightmares", counters: {loyalty: 3}}]
    p1: {life: 17}
notes: >
  Bolt makes p1 lose 3 life this turn. Kaito's 0 costs no loyalty. Surveil 2 looks at Ponder and Brainstorm; Ponder goes
  to the graveyard and Brainstorm stays on top; then p0 draws one card (one opponent lost life): Brainstorm. Ability index
  2 is the 0 ability (see the -2 scenario for the index count). A wrong engine draws before surveilling or ignores the
  life-loss history.
---
