    p0:
      hand: []
      graveyard: []
      battlefield:
        - {card: Forest, tapped: true}
        - {card: Forest, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: false}
        - {card: "Koma, World-Eater", controller: p0}
    p1:
      hand: []
      graveyard: [Daze]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}]
notes: >
  The third source of "can't be countered" in the pool (after Veil of Summer and Cavern of Souls): printed text on the
  spell itself. Koma costs {3}{G}{G}{U}{U}; seven lands are tapped and one Mountain stays untapped so that the Daze
  payment is a real choice. p0 declines (118.12a); the counter cannot happen (101.2); Koma resolves. Force of Will on
  Koma is already covered by koma-world-eater.yaml; this one covers the "unless pays" path.
