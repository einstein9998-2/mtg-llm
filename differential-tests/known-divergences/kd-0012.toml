id = "kd-0012"
title = "Engine: Animate Dead's leaves-the-battlefield trigger exists even if its enters trigger never resolved (one extra empty stack object)"
status = "accepted"
who_is_right = "design"
cr_citation = "CR 603.10a, 603.7; Animate Dead Oracle (the leave trigger is part of the enters ability's text, a delayed trigger in Forge's script)"
rulings = []
affected_oracles = ["engine"]
match = { kinds = ["WINDOW"], cards = ["Animate Dead"], feature_tags = [] }
