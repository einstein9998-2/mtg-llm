id: orims-chant-kicked-creature-entering-later-with-haste-cannot-attack
title: "After kicked Orim's Chant resolves, a creature that enters later this turn with haste (Shallow Grave) still cannot attack, and the Chant caster can still cast Shallow Grave"
area: card
cards: ["Orim's Chant", Plains, Swamp, Shallow Grave, Ocelot Pride]
tags: [orims-chant, kicker, kicked, haste, declare-attackers, creatures-cant-attack, rules-modifying-effect, shallow-grave, caster-unaffected]
derived_from: oracle
source:
  - {kind: oracle, card: "Orim's Chant", text: "If this spell was kicked, creatures can't attack this turn.", verified: true, note: "Orim's Chant Oracle text supplied by the engine owner from Scryfall data; the card is not yet in reference/oracle.json (an entry is provided in NOTES.md)"}
  - {kind: oracle, card: "Orim's Chant", text: "Kicker {W} (You may pay an additional {W} as you cast this spell.)", verified: true, note: "Orim's Chant Oracle text supplied by the engine owner from Scryfall data; the card is not yet in reference/oracle.json (an entry is provided in NOTES.md)"}
  - {kind: cr, ref: "611.2c", text: "A continuous effect generated by the resolution of a spell or ability that doesn’t modify the characteristics or change the controller of any objects modifies the rules of the game, so it can affect objects that weren’t affected when that continuous effect began.", verified: true}
  - {kind: cr, ref: "508.1c", text: "The active player checks each creature they control to see whether it’s affected by any restrictions (effects that say a creature can’t attack, or that it can’t attack unless some condition is met). If any restrictions are being disobeyed, the declaration of attackers is illegal.", verified: true}
  - {kind: cr, ref: "702.10b", text: "If a creature has haste, it can attack even if it hasn’t been controlled by its controller continuously since their most recent turn began.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Orim's Chant @chant", "Shallow Grave @sg"]
    battlefield: ["Plains @pl1", "Plains @pl2", "Swamp @s1", "Swamp @s2"]
    graveyard: ["Ocelot Pride @op"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@chant", kicked: true, targets: [{player: p1}], pay: {tap: ["@pl1", "@pl2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
  - p0: {t: cast, card: "@sg", pay: {tap: ["@s1", "@s2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0:
        graveyard: ["Orim's Chant", "Shallow Grave"]
        battlefield_contains: [{card: Ocelot Pride, controller: p0, sick: true, keywords: [haste], tapped: false}]
  - advance: {to: main2, of: p0}
expect:
  - at: after_script
    turn: 3
    phase: main2
    active: p0
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains: [{card: Ocelot Pride, tapped: false, attacking: false, keywords: [haste]}]
    p1: {life: 20}
notes: >
  Orim's Chant's attack clause modifies the rules of the game, not objects, so it applies to creatures that did not exist
  on the battlefield when it resolved (611.2c): the haste creature that enters afterwards cannot attack even though haste
  would satisfy 508.1a (compare shallow-grave-returns-top-creature-card-with-haste, where the same creature is offered as an
  attacker). p0 is the Chant caster and targeted p1, so p0's own Shallow Grave is castable. Ocelot Pride is the only
  creature card in p0's graveyard. The exile at the next end step is not reached (the scenario stops in main phase 2).
  Wrong engines snapshot the set of creatures when Chant resolves, as for a continuous effect that modifies objects.
