tags: [magus-of-the-moon, layers, timing, symmetric-effect, static-ability-starts]
derived_from: cr
source:
  - {kind: oracle, card: Magus of the Moon, text: "Nonbasic lands are Mountains.", verified: true}
  - {kind: cr, ref: "611.3a", text: "A continuous effect generated by a static ability isn’t “locked in”; it applies at any given moment to whatever its text indicates.", verified: true}
  - {kind: cr, ref: "305.7", text: "If an effect sets a land’s subtype to one or more of the basic land types, the land no longer has its old land type.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Magus of the Moon @magus", "Brainstorm @bs"]
    battlefield: ["Mountain @m1", "Mountain @m2", "Mountain @m3", "Volcanic Island @volc"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      legal: {p0: {include: [{t: cast, card: "@bs"}]}}
  - p0: {t: cast, card: "@magus", pay: {tap: ["@m1", "@m2", "@m3"]}}
  - check:
      stack: [{kind: spell, card: "@magus", controller: p0}]
      pending: {actor: p0, kind: priority}
      legal: {p0: {include: [{t: cast, card: "@bs"}]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      p0: {battlefield_contains: [{card: Magus of the Moon, sick: true}, {card: Volcanic Island, tapped: false, subtypes: [Mountain]}]}
  - expect_illegal: {p0: {t: cast, card: "@bs"}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Brainstorm]
      battlefield:
        - {card: Magus of the Moon}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Volcanic Island, tapped: false}
notes: >
  While Magus is a spell on the stack its static ability does nothing, so Brainstorm (an instant) can still be cast
  with Volcanic Island's {U} (the second check). The effect starts the moment Magus is on the battlefield and it also
  covers its controller's own lands ("Nonbasic lands", no controller restriction): Brainstorm is no longer castable. No
  spell is cast in between, so nothing else changes. Wrong engines: Magus applying from the stack, applying only to
  opponents, or only from the next turn.
