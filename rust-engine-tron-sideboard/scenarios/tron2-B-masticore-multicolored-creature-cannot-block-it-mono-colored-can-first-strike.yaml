notes: >
  Lavinia ({W}{U}) is multicolored, so she cannot block a creature with protection from multicolored (702.16f); the
  declaration with her as a blocker is rejected. Containment Priest ({1}{W}) is monocolored and may block. The Masticore's
  first strike (5 damage) kills the 2/2 Priest in the first-strike damage step, before the Priest deals regular damage,
  so the Masticore takes no damage at all; the blocked Masticore deals nothing to p1 (still 20). Wrong engines: allow the
  multicolored block, ignore first strike, or let the dead Priest deal damage.
