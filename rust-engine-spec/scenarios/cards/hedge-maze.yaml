id: hedge-maze-daze-returns-it-as-an-island
title: Hedge Maze is an Island, so Daze's alternative cost may return it (a Forest alone may not be returned)
area: card
cards: [Hedge Maze, Forest, Daze, Brainstorm, Island]
tags: [hedge-maze, daze, alternative-cost, island-subtype, counter-unless-pay]
derived_from: oracle
source:
  - {kind: oracle, card: Daze, text: "You may return an Island you control to its owner's hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Daze, text: "Counter target spell unless its controller pays {1}.", verified: true}
  - {kind: oracle, card: Hedge Maze, text: "({T}: Add {G} or {U}.)", verified: true}
  - {kind: cr, ref: "118.9", text: "An alternative cost is a cost listed in a spell's text ... that its controller may pay rather than paying the spell's mana cost.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Daze @daze"]
    battlefield: ["Hedge Maze @hm", "Forest @fo"]
    library_pad: 10
  p1:
    hand: ["Brainstorm @bs"]
    battlefield: ["Island @pisl"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@bs", pay: auto}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@daze", alt_cost: {return_island: "@fo"}, targets: ["@bs"]}}
  - p0: {t: cast, card: "@daze", alt_cost: {return_island: "@hm"}, targets: ["@bs"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      hand: [Hedge Maze]
      graveyard: [Daze]
      battlefield: [{card: Forest}]
    p1:
      hand_count: 0
      graveyard: [Brainstorm]
notes: >
  Hedge Maze has the subtype Island, so it can be returned as Daze's alternative cost; a Forest cannot. p1's only
  Island is tapped for Brainstorm, so p1 cannot pay {1} and there is no pay prompt: Brainstorm is countered. The
  returned Hedge Maze is a card in p0's hand again (it will enter tapped and surveil again if replayed). Daze comes
  from the opposing deck; the interaction with a dual land that has the Island type is the point.
