id: uncounterable-daze-veil-in-response-decline-resolves
title: Veil of Summer resolves in response to Daze already on the stack, so the targeted spell survives when its controller declines to pay {1}
area: card
cards: [Veil of Summer, Grafdigger's Cage, Daze, Forest, Mountain, Island]
tags: [daze, counter-unless-pay, cant-be-countered, veil-of-summer, in-response, hard-cast, yes-no-decision, rule-modification]
derived_from: cr
source:
  - {kind: oracle, card: Daze, text: "Counter target spell unless its controller pays {1}.", verified: true}
  - {kind: oracle, card: Veil of Summer, text: "Spells you control can't be countered this turn.", verified: true}
  - {kind: oracle, card: Veil of Summer, text: "Draw a card if an opponent has cast a blue or black spell this turn.", verified: true}
  - {kind: cr, ref: "611.2c", text: "A continuous effect generated by the resolution of a spell or ability that doesn't modify the characteristics or change the controller of any objects modifies the rules of the game, so it can affect objects that weren't affected when that continuous effect began.", verified: true}
  - {kind: cr, ref: "118.12a", text: "Some spells, activated abilities, and triggered abilities read, “[Do something] unless [a player does something else].” This means the same thing as “[A player may do something else]. If [that player] doesn’t, [do something].”", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can't happen, the \"can't\" effect takes precedence.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Veil of Summer @veil", "Grafdigger's Cage @cage"]
    battlefield: ["Forest @f", "Mountain @m1", "Mountain @m2"]
    library: ["Island @top"]
    library_pad: 10
  p1:
    hand: ["Daze @daze"]
    battlefield: ["Island @j1", "Island @j2"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@cage", pay: {tap: ["@m1"]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@daze", targets: ["@cage"], pay: auto}
  - p1: {t: pass}
  - p0: {t: cast, card: "@veil", pay: {tap: ["@f"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack:
        - {kind: spell, card: "@cage", controller: p0}
        - {kind: spell, card: "@daze", controller: p1, targets: ["@cage"]}
      pending: {actor: p0, kind: priority}
      p0: {hand: [Island], graveyard: [Veil of Summer]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: yes_no, purpose: pay_for_daze, answer: false, expect_options: {include: [true, false]}}
  - check:
      stack: [{kind: spell, card: "@cage", controller: p0}]
      pending: {actor: p0, kind: priority}
      p1: {graveyard: [Daze]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Island]
      graveyard: [Veil of Summer]
      battlefield:
        - {card: Forest, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: false}
        - {card: "Grafdigger's Cage", controller: p0}
    p1:
      hand: []
      graveyard: [Daze]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}]
notes: >
  Veil resolves above Daze, while Cage is already on the stack. "Spells you control can't be countered this turn" is a
  rules-modifying effect (611.2c), so it applies to the Cage spell that was already on the stack. Veil also draws:
  p1 cast Daze, a blue spell, this turn (p0 draws the Island from the top of the library). When Daze then resolves, p0
  is still offered the pay choice (118.12a), declines, and Cage is not countered (101.2). A wrong engine applies Veil
  only to spells cast after it resolved, or checks uncounterability once, when the counter spell was cast.
