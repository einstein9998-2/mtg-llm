id: containment-priest-does-not-exile-aluren-cast-creature
title: Containment Priest does not affect Acererak cast through Aluren, because it was cast
area: matchup
cards: [Acererak the Archlich, Aluren, Containment Priest]
tags: [aluren, containment-priest, cast-vs-put, replacement, aluren-acererak-loop]
derived_from: oracle
source:
  - {kind: oracle, card: Containment Priest, text: "If a nontoken creature would enter and it wasn't cast, exile it instead.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    battlefield: ["Containment Priest @cp"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: [{kind: triggered, source: "@acer", controller: p0}]
    pending: {actor: p0, kind: priority}
    p0: {exile: [], battlefield_contains: [{card: Acererak the Archlich}]}
notes: >
  A spell cast without paying its mana cost is still cast; the Priest's replacement applies only to creatures that were not
  cast. Bug caught: treating "free" as "put onto the battlefield".
---
id: aluren-cast-counts-for-cori-steel-cutter-flurry
title: A creature cast for free through Aluren is a spell cast and can be the second spell that triggers flurry
area: matchup
cards: [Aluren, Cori-Steel Cutter, Lightning Bolt, Dragon's Rage Channeler, Volcanic Island, Monk Token]
tags: [aluren, flurry, cast-trigger, spells-cast-count, any-player]
derived_from: oracle
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Flurry — Whenever you cast your second spell each turn, create a 1/1 white Monk creature token with prowess. You may attach this Equipment to it.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: cr, ref: "603.3", text: "Once an ability has triggered, its controller puts it on the stack as an object that's not a card the next time a player would receive priority.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt", "Dragon's Rage Channeler @drc"]
    battlefield: ["Cori-Steel Cutter @cut", "Volcanic Island @volc"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - p1: {t: cast, card: "@drc", alt_cost: {free: aluren}}
  - label: flurry-on-stack
    check:
      stack:
        - {kind: spell, card: "@bolt", controller: p1}
        - {kind: spell, card: "@drc", controller: p1}
        - {kind: triggered, source: "@cut", controller: p1}
      pending: {actor: p1, kind: priority}
      p1: {spells_cast_this_turn: 2}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: yes_no, purpose: attach_equipment, answer: false}
expect:
  - at: after_script
    stack:
      - {kind: spell, card: "@bolt", controller: p1}
      - {kind: spell, card: "@drc", controller: p1}
    pending: {actor: p1, kind: priority}
    p1:
      battlefield:
        - {card: Cori-Steel Cutter}
        - {card: Volcanic Island, tapped: true}
        - {token: Monk Token, pt: [1, 1]}
notes: >
  p1 (the UR player) uses p0's Aluren on p1's own turn with Bolt on the stack. The DRC cast is p1's second spell this turn,
  so flurry triggers, and the trigger is put on the stack above DRC before p1 gets priority. Bug caught: free casts not
  counted as casts.
---
id: aluren-creature-cast-does-not-trigger-drc-surveil
