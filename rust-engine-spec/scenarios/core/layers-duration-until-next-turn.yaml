id: fungi-cavern-minus-four-lasts-until-room-controllers-next-turn
title: Fungi Cavern's -4/-0 on an opponent's Murktide lasts through that opponent's whole turn and ends by the dungeon owner's next turn
area: core
cards: [Murktide Regent]
tags: [layers, layer-7c, duration, until-your-next-turn, dungeon, room-ability, combat]
derived_from: cr
source:
  - {kind: oracle, card: Lost Mine of Phandelver, text: "Target creature gets -4/-0 until your next turn.", verified: false, note: "room text from oracle.json dungeons.Lost Mine of Phandelver.rooms.Fungi Cavern; the validator accepts verified oracle sources only for cards, so this exact room text is marked unverified (schema request)"}
  - {kind: cr, ref: "309.4c", text: "Each room ability is controlled by the player who owns the dungeon card that is that ability's source.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as \"until end of turn\").", verified: true}
