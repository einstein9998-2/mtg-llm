id: skyclave-apparition-etb-target-restrictions
title: Skyclave Apparition's ETB can exile only an opponent's nonland, nontoken permanent with mana value 4 or less
area: card
cards: [Skyclave Apparition, "Phelia, Exuberant Shepherd", Aether Vial, Griselbrand, Overlord of the Balemurk, Plains]
tags: [skyclave-apparition, etb-trigger, targeting, mana-value, token, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Skyclave Apparition, text: "When this creature enters, exile up to one target nonland, nontoken permanent you don't control with mana value 4 or less.", verified: true}
  - {kind: cr, ref: "202.3", text: "The mana value of an object is a number equal to the total amount of mana in its mana cost, regardless of color.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Skyclave Apparition @sky"]
    battlefield: ["Plains @w1", "Plains @w2", "Plains @w3", "Aether Vial @myvial"]
    library_pad: 10
  p1:
    battlefield:
      - "Phelia, Exuberant Shepherd @ph"
      - "Aether Vial @pvial"
      - "Griselbrand @gris"
      - "Overlord of the Balemurk @ov"
      - "Plains @pw"
      - {token: Goblin Token, as: gob}
    library_pad: 10
script:
  - p0: {t: cast, card: "@sky", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: choose_target
      slot: 0
      answer: "@ph"
      expect_options: {include: ["@ph", "@pvial"], exclude: ["@gris", "@ov", "@pw", "@gob", "@myvial", "@sky", "@w1"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p1:
      exile: ["Phelia, Exuberant Shepherd"]
      battlefield:
        - {card: Aether Vial}
        - {card: Griselbrand}
        - {card: Overlord of the Balemurk}
        - {card: Plains}
        - {token: Goblin Token}
notes: >
  Mana values: Phelia {1}{W} = 2, Aether Vial {1} = 1 (legal); Griselbrand 8 and Overlord {3}{B}{B} = 5 (too high);
  Plains is a land; the Goblin is a token; p0's own Vial is controlled by p0. A wrong engine compares power instead of
  mana value, allows tokens or lands, or offers p0's own permanents.
