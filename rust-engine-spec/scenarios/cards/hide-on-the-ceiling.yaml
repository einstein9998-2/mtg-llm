id: hide-on-the-ceiling-cast-in-end-step-returns-at-the-following-end-step
title: Hide on the Ceiling cast during the opponent's end step returns the creature at the next turn's end step, not during this turn's cleanup
area: card
cards: [Hide on the Ceiling, Murktide Regent, Island]
tags: [hide-on-the-ceiling, delayed-trigger, end-step, next-end-step, turn-structure, new-object]
derived_from: cr
source:
  - {kind: oracle, card: Hide on the Ceiling, text: "Return the exiled cards to the battlefield under their owners' control at the beginning of the next end step.", verified: true}
  - {kind: cr, ref: "603.7a", text: "A delayed triggered ability won’t trigger until it has actually been created, even if its trigger event occurred just beforehand.", verified: true}
  - {kind: cr, ref: "603.7b", text: "A delayed triggered ability will trigger only once—the next time its trigger event occurs—unless it has a stated duration", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
  - {kind: oracle, card: Murktide Regent, text: "This creature enters with a +1/+1 counter on it for each instant and sorcery card exiled with it.", verified: true}
  - {kind: cr, ref: "607.2q", text: "If a permanent spell has an ability printed on it that allows one or more cards to be exiled while paying a cost to cast it and the permanent that spell becomes has an ability that refers to cards “exiled with [this object],” those abilities are linked. The second ability refers only to cards exiled to pay the cost of the spell that became that permanent.", verified: true}
setup:
  turn: 4
  active: p0
  phase: end
  priority: p0
  p0:
    battlefield:
      - {card: Murktide Regent, as: murk, counters: {"+1/+1": 2}}
    library_pad: 10
  p1:
    hand: ["Hide on the Ceiling @hide"]
    battlefield: ["Island @j1", "Island @j2"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: cast, card: "@hide", x: 1, targets: ["@murk"], pay: {tap: ["@j1", "@j2"]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      phase: end
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {exile: [Murktide Regent], battlefield: []}
  - advance: {to: main1, of: p1}
  - check:
      turn: 5
      stack: []
      p0: {exile: [Murktide Regent], battlefield: []}
  - advance: {to: end, of: p1}
  - check:
      stack: [{kind: triggered, controller: p1}]
  - resolve_top: true
expect:
  - at: after_script
    turn: 5
    phase: end
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      exile: []
      battlefield: [{card: Murktide Regent, pt: [3, 3], sick: true}]
    p1:
      graveyard: [Hide on the Ceiling]
notes: >
  Hide resolves during turn 4's end step, after that step began; its delayed trigger did not exist when "the beginning
  of the end step" happened (603.7a), so it waits for the next end step: p1's, on turn 5. Murktide stays exiled through
  p0's cleanup, p1's untap, upkeep, draw and main phase (p1 has no creatures, so the advances raise no attack
  declaration). The trigger is controlled by p1 (Hide's controller) and returns Murktide under its owner p0's control as
  a new object: no +1/+1 counters, and none from its own enters ability, which counts cards exiled with it by delve
  while casting it (it was not cast), so 3/3. Wrong engines: return during turn 4's cleanup, at p0's next end step, or
  with the old counters.
