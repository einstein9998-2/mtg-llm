expect:
  - at: after_script
    turn: 6
    active: p0
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 19, command: [{dungeon: Lost Mine of Phandelver, room: Fungi Cavern}]}
    p1: {battlefield: [{card: Murktide Regent, pt: [5, 5], counters: {"+1/+1": 2}, tapped: true}]}
notes: >
  The room ability is put on the stack directly by setup (marker already in Fungi Cavern), so no venture movement is
  involved. It is p0's ability (309.4c), so "your next turn" is p0's next turn, not the turn of the creature's
  controller. Murktide 3/3 + two counters = 5/5, -4/-0 = 1/5. The effect survives p0's cleanup (it is not "until end
  of turn", 514.2) and is still active during p1's turn 5: p1's Murktide attacks and deals only 1 (p0 20 -> 19). By p0's
  turn 6 main phase it has ended: 5/5 (still tapped, since p1 untaps only in p1's untap step). The CR defines no exact
  end point for "until your next turn" (see refs note), so the scenario asserts only p1's turn and p0's next main phase.
  p0 controls no creatures, so no declare-blockers choice exists; p1 attacking makes the trivial one-creature combat
  damage assignment unnecessary. A wrong engine ends the effect in cleanup, ends it when the affected creature's
  controller's turn begins, or never ends it.
