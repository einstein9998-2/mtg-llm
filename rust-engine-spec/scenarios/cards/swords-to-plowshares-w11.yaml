id: swords-negative-power-gains-zero-life
title: Swords to Plowshares on a creature with negative power gives zero life, not a life loss
area: card
cards: [Swords to Plowshares, Dismember, Plains, Quantum Riddler]
tags: [swords-to-plowshares, dismember, negative-power, life-gain, phyrexian-mana]
derived_from: cr
source:
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: oracle, card: Dismember, text: "Target creature gets -5/-5 until end of turn.", verified: true}
  - {kind: cr, ref: "107.1b", text: "If a calculation that would determine the result of an effect yields a negative number, zero is used instead", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Dismember @dis", "Swords to Plowshares @stp"]
    battlefield: ["Plains @pl1", "Plains @pl2"]
    library_pad: 10
  p1:
    battlefield: ["Quantum Riddler @qr"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@dis", phyrexian: [life, life], targets: ["@qr"], pay: {tap: ["@pl1"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      p0: {life: 16}
      p1: {battlefield: [{card: Quantum Riddler, pt: [-1, 1]}]}
  - p0: {t: cast, card: "@stp", targets: ["@qr"], pay: {tap: ["@pl2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 16, graveyard: [Dismember, Swords to Plowshares]}
    p1: {life: 20, exile: [Quantum Riddler], battlefield: []}
notes: >
  Dismember paid with {1} (a Plains) and 4 life (p0 20 -> 16) makes Riddler -1/1, which survives (toughness 1). Swords
  then exiles it; its power is -1, and a player can't gain negative life: 107.1b says zero is used, so p1 stays at 20.
  Bug caught: p1 losing 1 life (life change by a signed amount).
