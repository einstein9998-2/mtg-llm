id: tron-b-ensnaring-bridge-power-vs-hand-boundary
title: "Ensnaring Bridge: power equal to the Bridge controller's hand size may attack, greater may not (and the attacker's own big hand does not help)"
area: card
cards: [Ensnaring Bridge, Ocelot Pride, "Phelia, Exuberant Shepherd", Brainstorm, Island]
tags: [ensnaring-bridge, declare-attackers, attack-restriction, hand-size, boundary, mask-validity, negative]
derived_from: oracle
source:
  - {kind: oracle, card: Ensnaring Bridge, text: "Creatures with power greater than the number of cards in your hand can't attack.", verified: true}
  - {kind: cr, ref: "508.1c", text: "The active player checks each creature they control to see whether it’s affected by any restrictions (effects that say a creature can’t attack, or that it can’t attack unless some condition is met). If any restrictions are being disobeyed, the declaration of attackers is illegal.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    hand: [Island, Island, Island, Island, Island]
    battlefield: ["Ocelot Pride @op", "Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
  p1:
    hand: [Brainstorm]
    battlefield: ["Ensnaring Bridge @br"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {decision: declare_attackers, attacks: [{creature: "@ph", target: {player: p1}}]}}
  - expect_illegal: {p0: {decision: declare_attackers, attacks: [{creature: "@op", target: {player: p1}}, {creature: "@ph", target: {player: p1}}]}}
  - p0: {decision: declare_attackers, attacks: [{creature: "@op", target: {player: p1}}], expect_options: {include: ["@op"], exclude: ["@ph"]}}
expect:
  - at: after_script
    phase: declare_attackers
    p0:
      battlefield:
        - {card: Ocelot Pride, attacking: true, tapped: true}
        - {card: "Phelia, Exuberant Shepherd", attacking: false, tapped: false}
notes: >
  The Bridge belongs to p1, whose hand is one card. Ocelot Pride (power 1) is not greater than 1 and may attack; Phelia (power 2)
  is greater and may not, alone or in a group (508.1c makes the whole declaration illegal). p0's own hand of five cards is
  irrelevant: "your hand" is the Bridge controller's. A wrong engine counts the attacker's controller's hand, or uses >=.
