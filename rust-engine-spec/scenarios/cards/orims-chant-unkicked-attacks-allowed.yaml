notes: >
  The attack restriction exists only "if this spell was kicked". The cast declines the kicker, so p0's Ocelot Pride is
  offered as an attacker at the declare attackers step and attacks p1 (no blockers exist, so no block decision). The
  scenario stops at the declare attackers priority, before damage. Control for the kicked scenarios; a wrong engine
  applies the creature restriction whether or not the spell was kicked.
