id: ur-b-price-of-progress-zero-nonbasic-lands-deals-zero
title: "Price of Progress with only basic lands on both sides deals 0 damage to each player and still resolves"
area: card
cards: [Price of Progress, Brainstorm, Mountain, Island, Forest, Plains]
tags: [price-of-progress, nonbasic-land, zero-damage, basic-supertype, damage-to-each-player]
derived_from: oracle
source:
  - {kind: oracle, card: Price of Progress, text: "Price of Progress deals damage to each player equal to twice the number of nonbasic lands that player controls.", verified: true}
  - {kind: cr, ref: "205.4c", text: "Any land with the supertype “basic” is a basic land. Any land that doesn’t have this supertype is a nonbasic land, even if it has a basic land type.", verified: true}
  - {kind: cr, ref: "120.3a", text: "Damage dealt to a player by a source without infect causes that player to lose that much life.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Price of Progress @pop", "Brainstorm @bs"]
    battlefield: ["Mountain @m", "Island @i", "Forest @f"]
    library_pad: 10
  p1:
    battlefield: ["Island", "Plains", "Forest"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@pop", pay: {tap: ["@m", "@i"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      hand: [Brainstorm]
      graveyard: [Price of Progress]
    p1:
      life: 20
notes: >
  No player controls a nonbasic land, so twice zero is 0 damage to each player: nobody loses life. The spell is not
  countered or removed for "doing nothing": it resolves and goes to the graveyard. A wrong engine counts every land,
  or deals a minimum of 1, or leaves the spell on the stack.
