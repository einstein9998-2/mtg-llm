    hand: ["Disruptor Flute @fl"]
    battlefield: ["Island @i1", "Island @i2", "Mountain @m1", "Mountain @m2", "Cori-Steel Cutter @cut", "Containment Priest @cp"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@fl", pay: {tap: ["@i1", "@i2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_name, answer: "Cori-Steel Cutter"}
  - expect_illegal: {p0: {t: activate, source: "@cut", ability: 0, targets: ["@cp"]}}
