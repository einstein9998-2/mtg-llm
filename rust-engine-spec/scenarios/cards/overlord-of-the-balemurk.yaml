id: overlord-last-time-counter-removed-becomes-creature
title: When the last time counter is removed from an impending Overlord, it becomes a 5/5 creature
area: card
cards: [Overlord of the Balemurk]
tags: [overlord-of-the-balemurk, impending, time-counters, type-changing, end-step]
derived_from: cr
source:
  - {kind: cr, ref: "702.176a", text: "“As long as this permanent’s impending cost was paid and it has a time counter on it, it’s not a creature,”", verified: true}
  - {kind: oracle, card: Overlord of the Balemurk, text: "it enters with five time counters and isn't a creature until the last is removed", verified: true}
setup:
  turn: 3
  active: p0
  phase: main2
  p0:
    battlefield: [{card: Overlord of the Balemurk, as: ov, counters: {time: 1}, flags: {impending_paid: true}}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      p0: {battlefield: [{card: Overlord of the Balemurk, counters: {time: 1}, types: [Enchantment]}]}
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, source: "@ov", controller: p0}]
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: Overlord of the Balemurk, counters: {}, pt: [5, 5], types: [Enchantment, Creature]}]
notes: >
  Setup flag impending_paid records that the Overlord entered via its impending cost (reachable: four earlier end steps
  removed four counters). Removing the last time counter ends the "not a creature" effect, so it is a 5/5 Enchantment
  Creature. A wrong engine keeps it noncreature (tracking "was impending" instead of "has a time counter") or makes it
  a creature at a different counter count.
