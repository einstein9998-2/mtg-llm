id: aluren-defense-grid-taxes-free-cast-on-opponents-turn
title: Defense Grid adds {3} to an Aluren cast made on the opponent's turn; with three lands p0 casts one creature, then cannot cast another
area: card
cards: [Aluren, Defense Grid, Faerie Macabre, "Spider-Woman, Stunning Savior", Swamp]
tags: [aluren, defense-grid, cost-increase, alternative-cost, opponents-turn]
derived_from: cr
source:
  - {kind: cr, ref: "118.9d", text: "If an alternative cost is being paid to cast a spell, any additional costs, cost increases, and cost reductions that affect that spell are applied to that alternative cost.", verified: true}
  - {kind: cr, ref: "601.2f", text: "The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions.", verified: true}
  - {kind: oracle, card: Defense Grid, text: "Each spell costs {3} more to cast except during its controller's turn.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: cr, ref: "118.3", text: "A player can't pay a cost without having the necessary resources to pay it fully.", verified: true}
setup:
  turn: 6
  active: p1
  phase: end
  priority: p1
  p0:
    hand: ["Faerie Macabre @fm", "Spider-Woman, Stunning Savior @sw"]
    battlefield: ["Aluren @alu", "Swamp @s1", "Swamp @s2", "Swamp @s3"]
    library_pad: 10
  p1:
    battlefield: ["Defense Grid @dg"]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: cast, card: "@fm", alt_cost: {free: aluren}, pay: auto}
  - check:
      stack: [{kind: spell, card: "@fm", controller: p0}]
      p0: {battlefield: [{card: Aluren}, {card: Swamp, tapped: true}, {card: Swamp, tapped: true}, {card: Swamp, tapped: true}], mana_pool: {}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@sw", alt_cost: {free: aluren}, pay: auto}}
expect:
  - at: after_script
    pending: {actor: p0, kind: priority}
    stack: []
    p0:
      hand: ["Spider-Woman, Stunning Savior"]
      battlefield:
        - {card: Aluren}
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: true}
        - {card: Faerie Macabre}
notes: >
  Aluren's "without paying their mana costs" is an alternative cost; the cost increase still applies on top (118.9d,
  601.2f), so each free cast costs {3} on p1's turn. Three Swamps pay for one; the second cast is not offered. After the
  Faerie resolves, p1 (active) gets priority and passes, so p0 gets priority again in the end step. Bugs caught: the tax
  skipped because the spell is "free", the tax paid but the cast also demanding the mana cost.
---
