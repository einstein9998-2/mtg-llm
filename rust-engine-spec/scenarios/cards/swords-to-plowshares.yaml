id: stp-instant-speed-exiles-attacker-on-opponents-turn
title: Swords to Plowshares cast in the declare attackers step on the opponent's turn exiles the attacker and its controller gains 3
area: card
cards: [Swords to Plowshares, Plains, Murktide Regent]
tags: [swords-to-plowshares, instant-timing, combat, exile, life-gain]
derived_from: oracle
source:
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "117.1a", text: "A player may cast an instant spell any time they have priority.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
setup:
  turn: 4
  active: p1
  phase: begin_combat
  p0:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    battlefield: ["Murktide Regent @murk"]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: declare_attackers, attacks: [{creature: "@murk", target: {player: p0}}]}
  - p1: {t: pass}
  - p0: {t: cast, card: "@stp", targets: ["@murk"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    phase: declare_attackers
    active: p1
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 20
      graveyard: [Swords to Plowshares]
    p1:
      life: 23
      battlefield: []
      exile: [Murktide Regent]
notes: >
  p1 is the active player. After attackers are declared p1 gets priority first and passes; p0 casts Swords as an
  instant. After it resolves the active player (p1) gets priority. The 3/3 Murktide (no counters) gives p1 3 life.
  A wrong engine refuses an instant on the opponent's turn or gives priority to the caster after resolution.
