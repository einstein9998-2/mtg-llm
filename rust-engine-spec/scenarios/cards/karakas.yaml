id: karakas-targets-only-legendary-creatures
title: Karakas cannot target a nonlegendary creature or a legendary land, only a legendary creature
area: card
cards: [Karakas, Murktide Regent, "Spider-Woman, Stunning Savior", "Boseiju, Who Endures"]
tags: [karakas, targeting, legendary, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Karakas, text: "{T}: Return target legendary creature to its owner's hand.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Karakas @k"]
    library_pad: 10
  p1:
    battlefield: ["Murktide Regent @murk", "Spider-Woman, Stunning Savior @sw", "Boseiju, Who Endures @bos"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate, source: "@k", ability: 1, targets: ["@murk"]}}
  - expect_illegal: {p0: {t: activate, source: "@k", ability: 1, targets: ["@bos"]}}
  - p0: {t: activate, source: "@k", ability: 1, targets: ["@sw"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p1:
      hand: ["Spider-Woman, Stunning Savior"]
      battlefield: [{card: Murktide Regent}, {card: "Boseiju, Who Endures"}]
notes: >
  Murktide is not legendary; Boseiju is legendary but a land, not a creature. Spider-Woman is a legendary creature and is
  returned (positive control).
