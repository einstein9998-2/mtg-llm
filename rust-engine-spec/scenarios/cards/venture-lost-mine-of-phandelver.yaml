id: lost-mine-storeroom-without-creature-is-removed
title: Storeroom's ability with no creature on the battlefield has no legal target and is removed; the marker stays in Storeroom
area: card
cards: [Acererak the Archlich, Aluren]
tags: [venture, room-ability, targeting, no-legal-target, lost-mine, aluren-acererak-loop]
derived_from: cr
source:
  - {kind: cr, ref: "603.3d", text: "If a choice is required when the triggered ability goes on the stack but no legal choices can be made for it, or if a rule or a continuous effect otherwise makes the ability illegal, the ability is simply removed from the stack.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "Lost Mine of Phandelver, Storeroom: Put a +1/+1 counter on target creature.", verified: false, note: "dungeon room text from reference/oracle.json dungeons section"}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    command: [{dungeon: Lost Mine of Phandelver, room: Goblin Lair}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - resolve_top: true
  - resolve_top: true
  - p0: {decision: choose_room, answer: Storeroom, expect_options: {exact: [Storeroom, Dark Pool]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      command: [{dungeon: Lost Mine of Phandelver, room: Storeroom}]
      hand: [Acererak the Archlich]
      battlefield: [{card: Aluren}]
notes: >
  This is the trap of looping with Acererak through Storeroom: Acererak has already returned to hand when the Storeroom
  ability would go on the stack, and no other creature exists, so there is no legal target and the ability is removed
  (no choose_target decision; the next decision is p0's priority with an empty stack). The marker still moved. Bugs
  caught: a target prompt with no candidates, targeting the Acererak card in hand, refusing to let p0 pick Storeroom.
---
