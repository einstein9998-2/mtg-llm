id: voice-opponent-can-still-activate-abilities
title: Voice of Victory stops only spells; the opponent can still activate Wasteland during its controller's turn
area: card
cards: [Voice of Victory, Lightning Bolt, Wasteland, Plateau, Mountain]
tags: [voice-of-victory, casting-restriction, activated-abilities, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Voice of Victory, text: "Your opponents can't cast spells during your turn.", verified: true}
  - {kind: oracle, card: Wasteland, text: "{T}, Sacrifice this land: Destroy target nonbasic land.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: [{card: Voice of Victory, as: voice, sick: true}, "Plateau @plat"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Wasteland @w", "Mountain @m"]
    library_pad: 10
script:
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@bolt", targets: [{player: p0}]}}
  - p1: {t: activate, source: "@w", ability: 1, targets: ["@plat"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: Voice of Victory}]
      graveyard: [Plateau]
    p1:
      hand: [Lightning Bolt]
      graveyard: [Wasteland]
notes: >
  "Can't cast spells" does not restrict activating abilities. Wasteland's destroy ability (index 1; index 0 is its mana
  ability) is legal for p1 on p0's turn and resolves normally, while Bolt stays uncastable although p1 has an untapped
  Mountain. A wrong engine blocks every priority action of the opponent, not just casting.
