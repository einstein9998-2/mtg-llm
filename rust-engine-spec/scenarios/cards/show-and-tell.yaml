id: show-and-tell-put-in-permanent-cannot-be-countered-by-force-of-will
title: A permanent put in by Show and Tell is not a spell, so Force of Will has nothing to counter
area: card
cards: [Show and Tell, Omniscience, Force of Will, Brainstorm, Island]
tags: [show-and-tell, put-onto-battlefield, not-cast, force-of-will, mask-validity, omniscience]
derived_from: cr
source:
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: cr, ref: "601.2a", text: "To propose the casting of a spell, a player first moves that card (or that copy of a card) from where it is to the stack.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Show and Tell @snt", "Omniscience @omni"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library_pad: 10
  p1:
    hand: ["Force of Will @fow", "Brainstorm @pbs", "Island @ph"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@snt", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: simultaneous_secret_choice, answer: "@omni"}
  - p1: {decision: simultaneous_secret_choice, answer: null}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@pbs", pay_life: 1}, targets: ["@omni"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      battlefield_contains: [{card: Omniscience, types: [Enchantment]}]
    p1:
      life: 20
      hand: [Force of Will, Brainstorm, Island]
notes: >
  After Show and Tell resolves p0 has priority, passes on the empty stack, and p1 receives priority. Force of Will needs
  a target spell; Omniscience entered the battlefield without being cast and nothing else is on the stack, so the cast is
  not offered, and nothing is paid (life 20, hand intact). A wrong engine would treat "put onto the battlefield" as a cast
  that can be countered.
---
