id: tomb-cradle-creates-atropal-and-completes
title: Cradle of the Death God creates The Atropal, and Tomb of Annihilation is completed once that ability has resolved
area: card
cards: [Acererak the Archlich, Aluren, The Atropal]
tags: [venture, room-ability, token, legendary-token, dungeon-completion, state-based-actions, tomb]
derived_from: cr
source:
  - {kind: cr, ref: "704.5t", text: "If a player's venture marker is on the bottommost room of a dungeon card, and that dungeon card isn't the source of a room ability that has triggered but not yet left the stack, the dungeon card's owner removes it from the game.", verified: true}
  - {kind: cr, ref: "309.7", text: "A player completes a dungeon as that dungeon card is removed from the game.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "Tomb of Annihilation: Sandfall Cell leads to Cradle of the Death God (bottom); Cradle of the Death God: Create The Atropal, a legendary 4/4 black God Horror creature token with deathtouch.", verified: false, note: "dungeon room text and arrows from reference/oracle.json dungeons section"}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    command: [{dungeon: Tomb of Annihilation, room: Sandfall Cell}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - resolve_top: true
  - resolve_top: true
  - label: cradle-on-stack
    check:
      stack: [{kind: triggered, controller: p0, text_contains: "The Atropal"}]
      p0:
        hand: [Acererak the Archlich]
        command: [{dungeon: Tomb of Annihilation, room: Cradle of the Death God}]
        completed_dungeons: []
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Acererak the Archlich]
      command: []
      completed_dungeons: [Tomb of Annihilation]
      battlefield:
        - {card: Aluren}
        - {token: The Atropal, pt: [4, 4], keywords: [deathtouch], colors: [B], supertypes: [Legendary], sick: true}
notes: >
  This venture's ETB trigger still returned Acererak (the condition was true when it resolved; Tomb was completed only
  afterwards), so Acererak ends in hand; the next cast stays (see the path scenarios). The dungeon is removed by the
  state-based action, not by a further venture.
---
