id: boros-b-trap-countered-by-force-of-will-exiles-nothing
title: "A free Mindbreak Trap countered by Force of Will exiles nothing: the targeted spell resolves"
area: card
cards: [Mindbreak Trap, Force of Will, Ponder, Lightning Bolt, Lotus Petal, Mishra's Bauble, Mountain]
tags: [mindbreak-trap, force-of-will, counterspell, alternative-cost, three-spells, countered-no-effect, boros]
derived_from: cr
source:
  - {kind: oracle, card: Mindbreak Trap, text: "If an opponent cast three or more spells this turn, you may pay {0} rather than pay this spell's mana cost.", verified: true, note: "entry in oracle-additions-B.json"}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn’t resolve and none of its effects occur. A countered spell is put into its owner’s graveyard.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Mindbreak Trap @trap"]
    library_pad: 10
  p1:
    hand: ["Lotus Petal @petal", "Mishra's Bauble @bauble", "Lightning Bolt @bolt", "Force of Will @fow", "Ponder @pon"]
    battlefield: ["Mountain @mt"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@petal", pay: auto}
  - resolve_top: true
  - p1: {t: cast, card: "@bauble", pay: auto}
  - resolve_top: true
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: cast, card: "@trap", alt_cost: {three_spells: true}, targets: ["@bolt"]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@pon", pay_life: 1}, targets: ["@trap"]}
  - resolve_top: true
  - label: trap-countered
    check:
      priority: p1
      stack: [{kind: spell, card: "@bolt", controller: p1}]
      p0: {graveyard: [Mindbreak Trap]}
      p1: {life: 19, graveyard: [Force of Will], exile: [Ponder]}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 17
      graveyard: [Mindbreak Trap]
      exile: []
    p1:
      life: 19
      graveyard: [Force of Will, Lightning Bolt]
      exile: [Ponder]
      spells_cast_this_turn: 4
notes: >
  p1 casts Petal, Bauble and then a Lightning Bolt (three spells), so the Trap is free. p1 answers with Force of Will
  (pitching Ponder, paying 1 life: 19), which counters the Trap: it goes to p0's graveyard without doing anything, so
  nothing is exiled and the Bolt, still on the stack, resolves (p0 20 to 17) and then sits in p1's graveyard. Force of
  Will counts as p1's fourth spell this turn. A wrong engine exiles the Bolt anyway (resolving the Trap despite the
  counter).
