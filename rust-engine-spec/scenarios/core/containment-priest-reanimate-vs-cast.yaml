id: containment-priest-cast-from-hand-creature-enters-normally
title: Under Containment Priest a creature that is cast from hand enters normally
area: core
symmetric: true
cards: [Containment Priest, Ocelot Pride, Plains]
tags: [replacement-effect, containment-priest, negative-case, control-case]
derived_from: oracle
source:
  - {kind: oracle, card: Containment Priest, text: "If a nontoken creature would enter and it wasn't cast, exile it instead.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Ocelot Pride @op"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    battlefield: ["Containment Priest @cp"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@op", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: Plains, tapped: true}, {card: Ocelot Pride, controller: p0, tapped: false}]
      exile: []
notes: >
  Control case for a sibling scenario: the same replacement ignores a creature
  spell that resolves into a permanent, because that creature was cast. A wrong engine exiles every nontoken creature
  entering under the Priest.
