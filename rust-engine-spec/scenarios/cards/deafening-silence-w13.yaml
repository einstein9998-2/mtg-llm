id: deafening-silence-second-noncreature-spell-not-offered
title: Under an opponent's Deafening Silence a player who already cast one noncreature spell this turn is not offered a second
area: card
symmetric: true
cards: [Deafening Silence, Lightning Bolt, Mountain]
tags: [deafening-silence, casting-restriction, legal-action-mask, negative-case, symmetric]
derived_from: oracle
source:
  - {kind: oracle, card: Deafening Silence, text: "Each player can't cast more than one noncreature spell each turn.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @b1", "Lightning Bolt @b2"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    battlefield: ["Deafening Silence @ds"]
    library_pad: 10
script:
  - check:
      legal: {p0: {include: [{t: cast, card: "@b1"}, {t: cast, card: "@b2"}]}}
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: {tap: ["@m1"]}}
  - expect_illegal: {p0: {t: cast, card: "@b2", targets: [{player: p1}], pay: {tap: ["@m2"]}}}
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@b2", targets: [{player: p1}], pay: {tap: ["@m2"]}}}
  - check:
      legal: {p0: {include: [{t: pass}], exclude: [{t: cast, card: "@b2"}]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Lightning Bolt]
      graveyard: [Lightning Bolt]
      spells_cast_this_turn: 1
      battlefield: [{card: Mountain, tapped: true}, {card: Mountain, tapped: false}]
    p1:
      life: 17
notes: >
  Deafening Silence is controlled by p1 but says "Each player", so it restricts p0 too. Before any spell both Bolts
  are offered; after the first Bolt is cast the second is excluded, both while the first is on the stack and after it
  resolves, although an untapped Mountain could pay for it. symmetric: the runner repeats with seats swapped.
---
id: deafening-silence-creature-spell-still-allowed
title: Deafening Silence does not restrict creature spells; after a noncreature spell a creature can still be cast
area: card
cards: [Deafening Silence, Lightning Bolt, Ocelot Pride, Mountain, Plains]
tags: [deafening-silence, casting-restriction, creature-spell, control-case]
derived_from: oracle
source:
  - {kind: oracle, card: Deafening Silence, text: "Each player can't cast more than one noncreature spell each turn.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @b1", "Ocelot Pride @op"]
    battlefield: ["Mountain @m", "Plains @pl"]
    library_pad: 10
  p1:
    battlefield: ["Deafening Silence @ds"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: {tap: ["@m"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      legal: {p0: {include: [{t: cast, card: "@op"}]}}
  - p0: {t: cast, card: "@op", pay: {tap: ["@pl"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      spells_cast_this_turn: 2
      hand: []
      battlefield_contains: [{card: Ocelot Pride, controller: p0}]
    p1:
      life: 17
notes: >
  The restriction counts and limits only noncreature spells. Ocelot Pride is a creature spell, so it is offered and
  resolves after the Bolt. A wrong engine counts every spell. Control case for
  deafening-silence-second-noncreature-spell-not-offered.
