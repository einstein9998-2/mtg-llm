id: boros-a-static-prison-target-restrictions-nonland-opponents-only
title: "Static Prison's target must be a nonland permanent an opponent controls: lands and its controller's own permanents are not offered"
area: card
cards: [Static Prison, "Phelia, Exuberant Shepherd", Aether Vial, Karakas, Plains, Guide of Souls]
tags: [static-prison, targeting, mask-validity, nonland, opponent-controls, boros]
derived_from: oracle
source:
  - {kind: oracle, card: Static Prison, text: "exile target nonland permanent an opponent controls until this enchantment leaves the battlefield", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: cr, ref: "115.2", text: "Only permanents are legal targets for spells and abilities", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Static Prison @sp"]
    battlefield: ["Plains @pl", "Guide of Souls @guide"]
    library_pad: 10
  p1:
    battlefield: ["Phelia, Exuberant Shepherd @ph", "Aether Vial @vial", "Karakas @kar", "Plains @pw"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@sp", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@vial", expect_options: {include: ["@ph", "@vial"], exclude: ["@kar", "@pw", "@guide", "@sp", "@pl"], count: 2}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    p0:
      energy: 2
      battlefield:
        - {card: Static Prison}
        - {card: Plains, tapped: true}
        - {card: Guide of Souls}
    p1:
      battlefield: [{card: "Phelia, Exuberant Shepherd"}, {card: Karakas}, {card: Plains}]
      exile: [Aether Vial]
notes: >
  Exactly two legal targets: Phelia (creature) and Aether Vial (artifact). Karakas (a legendary nonbasic land) and Plains
  are lands; Guide of Souls and the Prison itself are controlled by p0, not an opponent. Choosing the Vial exiles it and
  leaves everything else alone. A wrong engine offers lands (as "Wasteland-style" targets) or offers its own permanents.
