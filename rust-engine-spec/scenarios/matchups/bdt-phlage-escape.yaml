id: mu-bdt-phlage-escape-stays-and-kills-phelia
title: Phlage cast with escape enters, its sacrifice trigger does nothing because it escaped, and its damage trigger kills Phelia
area: matchup
cards: ["Phlage, Titan of Fire's Fury", "Phelia, Exuberant Shepherd", Swords to Plowshares, Erode, Arid Mesa, Ocelot Pride, Plateau, Mountain, Plains]
tags: [matchup, boros-vs-dt, phlage, escape, alternative-cost, cast-from-graveyard, order-triggers, etb-trigger]
derived_from: cr
source:
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "When Phlage enters, sacrifice it unless it escaped.", verified: true}
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Whenever Phlage enters or attacks, it deals 3 damage to any target and you gain 3 life.", verified: true}
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Escape—{R}{R}{W}{W}, Exile five other cards from your graveyard.", verified: true}
  - {kind: cr, ref: "702.138a", text: "“Escape [cost]” means “You may cast this card from your graveyard by paying [cost] rather than paying its mana cost.”", verified: true}
  - {kind: cr, ref: "702.138b", text: "A spell or permanent “escaped” if that spell or the spell that became that permanent as it resolved was cast from a graveyard with an escape ability.", verified: true}
  - {kind: cr, ref: "603.4", text: "A triggered ability may read \"When/Whenever/At [trigger event], if [condition], [effect].\"", verified: true}
  - {kind: cr, ref: "603.3b", text: "First, each player, in APNAP order, puts each triggered ability they control with a trigger condition that isn't another ability triggering on the stack in any order they choose.", verified: true}
setup:
  turn: 6
  active: p0
  phase: main1
  p0:
    battlefield: ["Mountain @m1", "Mountain @m2", "Plains @w1", "Plains @w2"]
    graveyard: ["Phlage, Titan of Fire's Fury @ph", "Swords to Plowshares @g1", "Erode @g2", "Arid Mesa @g3", "Ocelot Pride @g4", "Plateau @g5"]
    library_pad: 10
  p1:
    battlefield: ["Phelia, Exuberant Shepherd @phe"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ph", alt_cost: {escape: {exile: ["@g1", "@g2", "@g3", "@g4", "@g5"]}}, pay: auto}
  - check:
      stack: [{kind: spell, card: "@ph", controller: p0}]
      p0: {graveyard: [], exile: [Swords to Plowshares, Erode, Arid Mesa, Ocelot Pride, Plateau]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: order_triggers
      answer:
        - {source: "@ph", text_contains: "sacrifice it unless it escaped"}
        - {source: "@ph", text_contains: "deals 3 damage"}
  - p0: {decision: choose_target, slot: 0, answer: "@phe"}
  - check:
      stack:
        - {kind: triggered, source: "@ph", controller: p0, text_contains: "sacrifice"}
        - {kind: triggered, source: "@ph", controller: p0, text_contains: "deals 3 damage", targets: ["@phe"]}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      p1: {graveyard: ["Phelia, Exuberant Shepherd"], battlefield: []}
      p0: {life: 23}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 23
      graveyard: []
      exile: [Swords to Plowshares, Erode, Arid Mesa, Ocelot Pride, Plateau]
      battlefield:
        - {card: "Phlage, Titan of Fire's Fury", pt: [6, 6], sick: true}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
    p1:
      life: 20
      graveyard: ["Phelia, Exuberant Shepherd"]
notes: >
  Escape pays {R}{R}{W}{W} with the four basics and exiles exactly the five other cards (the whole set is one choice).
  "Sacrifice it unless it escaped" is not an intervening-if clause (603.4 needs "if" right after the trigger event), so
  the ability triggers on entry and simply does nothing on resolution because this Phlage escaped (702.138b). Both
  triggers are p0's, so p0 orders them (603.3b); the damage trigger is on top here, kills the 2/2 Phelia and gains p0 3.
  RISK: an engine that models the clause as an intervening "if" would raise no order_triggers decision; the final state
  is the same. A wrong engine sacrifices the escaped Phlage, lets Phlage count toward its own five cards, or charges the
  printed {1}{R}{W} instead.
---
id: mu-bdt-grafdiggers-cage-stops-phlage-escape
title: With D&T's Grafdigger's Cage on the battlefield, Phlage cannot be cast with escape even though the cost could be paid
area: matchup
cards: ["Phlage, Titan of Fire's Fury", "Grafdigger's Cage", Swords to Plowshares, Erode, Arid Mesa, Ocelot Pride, Plateau, Mountain, Plains]
tags: [matchup, boros-vs-dt, grafdiggers-cage, phlage, escape, cast-from-graveyard, casting-restriction, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: "Grafdigger's Cage", text: "Players can't cast spells from graveyards or libraries.", verified: true}
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Escape—{R}{R}{W}{W}, Exile five other cards from your graveyard.", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can't happen, the \"can't\" effect takes precedence.", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
setup:
  turn: 6
  active: p0
  phase: main1
  p0:
    battlefield: ["Mountain @m1", "Mountain @m2", "Plains @w1", "Plains @w2"]
    graveyard: ["Phlage, Titan of Fire's Fury @ph", "Swords to Plowshares @g1", "Erode @g2", "Arid Mesa @g3", "Ocelot Pride @g4", "Plateau @g5"]
    library_pad: 10
  p1:
    battlefield: ["Grafdigger's Cage @cage"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@ph", alt_cost: {escape: {exile: ["@g1", "@g2", "@g3", "@g4", "@g5"]}}, pay: auto}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    legal: {p0: {include: [{t: pass}], exclude: [{t: cast, card: "@ph"}]}}
    p0:
      graveyard: ["Phlage, Titan of Fire's Fury", Swords to Plowshares, Erode, Arid Mesa, Ocelot Pride, Plateau]
      exile: []
      battlefield:
        - {card: Mountain, tapped: false}
        - {card: Mountain, tapped: false}
        - {card: Plains, tapped: false}
        - {card: Plains, tapped: false}
notes: >
  Same p0 state as mu-bdt-phlage-escape-stays-and-kills-phelia (positive control, where the escape is legal). The Cage's
  "can't cast spells from graveyards" beats escape's permission (101.2, 601.3), so no cast of Phlage is offered and
  nothing is tapped or exiled. A wrong engine checks only the cost.
---
id: mu-bdt-quarry-copy-of-phlage-sacrificed-but-deals-3
title: A Lazotep Quarry token copy of Phlage did not escape, so it is sacrificed by its own trigger; its damage trigger still deals 3 and gains 3
area: matchup
cards: [Lazotep Quarry, "Phlage, Titan of Fire's Fury", Plateau, Mountain, Plains]
tags: [matchup, boros-vs-dt, lazotep-quarry, phlage, token-copy, escape, order-triggers, last-known-information]
derived_from: cr
source:
  - {kind: oracle, card: Lazotep Quarry, text: "Create a token that's a copy of it, except it's a 4/4 black Zombie.", verified: true}
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "When Phlage enters, sacrifice it unless it escaped.", verified: true}
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Whenever Phlage enters or attacks, it deals 3 damage to any target and you gain 3 life.", verified: true}
  - {kind: cr, ref: "702.138b", text: "A spell or permanent “escaped” if that spell or the spell that became that permanent as it resolved was cast from a graveyard with an escape ability.", verified: true}
  - {kind: cr, ref: "707.2a", text: "A copy acquires the abilities of the object it’s copying because those values are derived from its rules text.", verified: true}
  - {kind: cr, ref: "113.7a", text: "The source can still perform the action even though it no longer exists.", verified: true}
setup:
  turn: 6
  active: p0
  phase: main1
  p0:
    graveyard: ["Phlage, Titan of Fire's Fury @gph"]
    battlefield: ["Lazotep Quarry @q", "Plateau @l1", "Plateau @l2", "Plateau @l3", "Mountain @l4", "Plains @l5"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@q", ability: 2, x: 3, sacrifice: ["@q"], targets: ["@gph"], pay: {tap: ["@l1", "@l2", "@l3", "@l4", "@l5"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - bind: {as: tok, find: {name: "Phlage, Titan of Fire's Fury", controller: p0, token: true}}
    note: "Reviewer: the exiled Phlage card also matches name + controller p0 (CR 108.4a: a card with no controller uses its owner), so the find also requires token: true; the only match is the token on the battlefield."
  - p0:
      decision: order_triggers
      answer:
        - {source: "@tok", text_contains: "deals 3 damage"}
        - {source: "@tok", text_contains: "sacrifice it unless it escaped"}
  - p0: {decision: choose_target, slot: 0, answer: {player: p1}}
  - check:
      stack:
        - {kind: triggered, source: "@tok", controller: p0, text_contains: "deals 3 damage", targets: [{player: p1}]}
        - {kind: triggered, source: "@tok", controller: p0, text_contains: "sacrifice"}
      pending: {actor: p0, kind: priority}
      p0: {exile: ["Phlage, Titan of Fire's Fury"], battlefield_contains: [{card: "Phlage, Titan of Fire's Fury", token: true, pt: [4, 4]}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@tok", controller: p0, text_contains: "deals 3 damage"}]
      p0:
        battlefield:
          - {card: Plateau, tapped: true}
          - {card: Plateau, tapped: true}
          - {card: Plateau, tapped: true}
          - {card: Mountain, tapped: true}
          - {card: Plains, tapped: true}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 23
      exile: ["Phlage, Titan of Fire's Fury"]
      graveyard: [Lazotep Quarry]
      battlefield:
        - {card: Plateau, tapped: true}
        - {card: Plateau, tapped: true}
        - {card: Plateau, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Plains, tapped: true}
    p1:
      life: 17
notes: >
  X=3 is Phlage's mana value; {3}{2} is paid by five lands and the Quarry taps and sacrifices itself. The token copies
  Phlage's abilities (707.2a) but was never cast, so it did not escape (702.138b) and its first ability sacrifices it;
  the sacrificed token ceases to exist (it is not in the graveyard). With the sacrifice on top, the damage trigger
  resolves afterwards using last known information (113.7a): p1 17, p0 23. The card stays exiled. The bind adds
  token: true because under 108.4a the exiled card's controller reads as its owner p0. A wrong engine treats
  the token as escaped (a 4/4 that stays) or drops the damage trigger once the token is gone.
