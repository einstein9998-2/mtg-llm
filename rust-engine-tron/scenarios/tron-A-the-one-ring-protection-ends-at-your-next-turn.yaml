id: tron-a-the-one-ring-protection-ends-at-your-next-turn
title: "The One Ring's protection lasts through the opponent's whole turn and is gone by the controller's next upkeep, when Lightning Bolt can target them again"
area: card
cards: [The One Ring, Lightning Bolt, Island, Mountain]
tags: [the-one-ring, protection-from-everything, duration, until-your-next-turn, upkeep-trigger, targeting, tron]
derived_from: oracle
source:
  - {kind: oracle, card: The One Ring, text: "When The One Ring enters, if you cast it, you gain protection from everything until your next turn.", verified: true}
  - {kind: oracle, card: The One Ring, text: "At the beginning of your upkeep, you lose 1 life for each burden counter on The One Ring.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as “until end of turn”).", verified: true}
  - {kind: cr, ref: "702.16b", text: "A permanent or player with protection can’t be targeted by spells with the stated quality and can’t be targeted by abilities from a source with the stated quality.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["The One Ring @ring"]
    battlefield: ["Island @is1", "Island @is2", "Island @is3", "Island @is4"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @mt"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ring", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
  - advance: {to: upkeep, of: p1}
  - check:
      turn: 4
      pending: {actor: p1, kind: priority}
  - expect_illegal: {p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}}
  - advance: {to: upkeep, of: p0}
  - check:
      turn: 5
      stack: [{kind: triggered, source: "@ring", controller: p0, text_contains: "burden"}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - check:
      pending: {actor: p1, kind: priority}
      legal: {p1: {include: [{t: cast, card: "@bolt", targets: [{player: p0}]}]}}
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    turn: 5
    phase: upkeep
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 17
      battlefield_contains: [{card: The One Ring}]
    p1:
      graveyard: [Lightning Bolt]
notes: >
  Protection from everything holds in p1's turn 4 (Bolt at p0 not offered at p1's upkeep) and has ended when p0's turn 5
  begins, so at p0's upkeep p1's Bolt at p0 is legal and deals 3 (20 -> 17). The Ring's own upkeep trigger (no burden
  counters yet, so it makes p0 lose 0 life) is on the stack at that point and resolves after Bolt. The exact moment the
  "until your next turn" effect ends (start of the untap step) is not asserted; the upkeep is after it on any reading.
