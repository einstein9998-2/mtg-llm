  - {kind: oracle, card: "Boseiju, Who Endures", text: "This ability costs {1} less to activate for each legendary creature you control.", verified: true}
  - {kind: cr, ref: "118.7a", text: "Effects that reduce a cost by an amount of generic mana affect only the generic mana component of that cost. They can't affect the colored or colorless mana components of that cost.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Boseiju, Who Endures @bos"]
    battlefield: ["Island @isl", {card: Forest, as: fo, tapped: true}, "Atraxa, Grand Unifier @atx", "Acererak the Archlich @ac"]
    library_pad: 10
  p1:
    battlefield: ["Volcanic Island @volc"]
    library_pad: 10
