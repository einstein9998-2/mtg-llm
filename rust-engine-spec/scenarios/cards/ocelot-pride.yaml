id: ocelot-no-life-gained-no-end-step-trigger
title: Ocelot Pride does not trigger at the end step if its controller gained no life this turn
area: card
cards: [Ocelot Pride]
tags: [ocelot-pride, end-step-trigger, intervening-if, negative]
derived_from: cr
source:
  - {kind: oracle, card: Ocelot Pride, text: "At the beginning of your end step, if you gained life this turn, create a 1/1 white Cat creature token.", verified: true}
  - {kind: cr, ref: "603.4", text: "When the trigger event occurs, the ability checks whether the stated condition is true. The ability triggers only if it is; otherwise it does nothing.", verified: true}
  - {kind: cr, ref: "513.1", text: "The end step has no turn-based actions. Once it begins, the active player gets priority.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main2
  p0:
    battlefield: ["Ocelot Pride @oc"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - advance: {to: end, of: p0}
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      battlefield: [{card: Ocelot Pride}]
notes: >
  Starting in the second main phase avoids the attack declaration. No life was gained this turn, so the intervening-if
  fails and the ability does not trigger at all: the end step starts with an empty stack. Positive control: the
  scenario above.
