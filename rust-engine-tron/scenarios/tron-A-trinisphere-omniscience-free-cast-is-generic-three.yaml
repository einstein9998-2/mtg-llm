id: tron-a-trinisphere-omniscience-free-cast-is-generic-three
title: "Under Trinisphere, Omniscience's free Lightning Bolt costs three generic mana (no red needed), unlike a Bolt cast for its mana cost"
area: card
cards: [Trinisphere, Omniscience, Lightning Bolt, Plains]
tags: [trinisphere, omniscience, free-cast, cost-increase, colored-mana, mana-payment, tron, alurentell]
