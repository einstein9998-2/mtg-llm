id: surgical-extraction-pay-two-life-exiles-every-copy-from-three-zones
title: Surgical Extraction paid with 2 life exiles every copy of the targeted card from its owner's graveyard, hand and library, and then the owner shuffles
area: card
cards: [Surgical Extraction, Lightning Bolt, Island]
tags: [surgical-extraction, search, exile, phyrexian-mana, life-payment, hidden-zones, shuffle]
derived_from: oracle
source:
  - {kind: oracle, card: Surgical Extraction, text: "Search its owner's graveyard, hand, and library for any number of cards with the same name as that card and exile them. Then that player shuffles.", verified: true}
  - {kind: cr, ref: "107.4f", text: "A Phyrexian mana symbol represents a cost that can be paid either with one mana of its color or by paying 2 life.", verified: true}
  - {kind: cr, ref: "701.23a", text: "To search for a card in a zone, look at all cards in that zone (even if it’s a hidden zone) and find a card that matches the given description.", verified: true}
random:
  - {kind: shuffle, player: p0, result: [Island, Island]}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @hb", "Island @hi"]
    graveyard: ["Lightning Bolt @gb"]
    library: ["Lightning Bolt @lb", "Island", "Island"]
  p1:
    hand: ["Surgical Extraction @surg"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: cast, card: "@surg", phyrexian: [life], targets: ["@gb"]}
  - check:
      stack: [{kind: spell, card: "@surg", targets: ["@gb"]}]
      pending: {actor: p1, kind: priority}
      p1: {life: 18}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: search, purpose: surgical_extraction, found: ["@gb", "@hb", "@lb"], expect_options: {include: ["@gb", "@hb", "@lb"], exclude: ["@hi"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Island]
      graveyard: []
      exile: [Lightning Bolt, Lightning Bolt, Lightning Bolt]
      library_count: 2
    p1: {life: 18, graveyard: [Surgical Extraction]}
notes: >
  The caster (p1) pays 2 life for the {B/P} symbol (20 to 18, no mana). The search covers the owner's graveyard, hand and library, finding cards named Lightning
  Bolt only (the Island in hand is not offered). All three copies are exiled, and p0 shuffles the remaining library (two Islands). The random queue holds exactly one shuffle for p0, so an engine that skips
  the shuffle (or shuffles twice) fails; no library order is asserted. After resolution the active player p0 gets priority. A wrong engine exiles only the graveyard copy, or lets the owner (p0) decide the search.
---
