id: ur-a-stifle-the-level-2-trigger-level-stays-two-card-stays
title: "Stifle on the level 2 trigger: the Talent is level 2 for good, the targeted card stays in the graveyard, and Level 2 cannot be redone"
area: card
cards: ["Stormchaser's Talent", Island, Lightning Bolt, Stifle]
tags: [stormchasers-talent, class, becomes-level-2, stifle, counter-ability, level-is-not-the-trigger, ur-alternate]
derived_from: oracle
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: oracle, card: "Stormchaser's Talent", text: "When this Class becomes level 2, return target instant or sorcery card from your graveyard to your hand.", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: cr, ref: "716.2a", text: "This Class’s level becomes N. Activate only if this Class is level N-1 and only as a sorcery", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield:
      - {card: "Stormchaser's Talent", as: talent, counters: {level: 1}}
      - "Island @i1"
      - "Island @i2"
      - "Island @i3"
      - "Island @i4"
      - "Island @i5"
      - "Island @i6"
      - "Island @i7"
      - "Island @i8"
    graveyard: ["Lightning Bolt @bolt"]
    library_pad: 10
  p1:
    hand: ["Stifle @stifle"]
    battlefield: ["Island @j1"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@talent", ability: 0, pay: {tap: ["@i1", "@i2", "@i3", "@i4"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@bolt"}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stifle", targets: [{trigger_of: "@talent", nth: 0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - label: after-stifle
    check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0:
        hand: []
        graveyard: [Lightning Bolt]
        battlefield_contains: [{card: "Stormchaser's Talent", counters: {level: 2}}]
      legal: {p0: {exclude: [{t: activate, source: "@talent", ability: 0}]}}
  - expect_illegal: {p0: {t: activate, source: "@talent", ability: 0, pay: auto}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      graveyard: [Lightning Bolt]
      battlefield_contains: [{card: "Stormchaser's Talent", counters: {level: 2}}]
    p1:
      graveyard: [Stifle]
notes: >
  The level already changed when the activated ability resolved; Stifle counters only the "becomes level 2" trigger. Bolt
  stays in the graveyard, and the second level-up of the same level is not offered even with four untapped Islands left
  (the Class is level 2, not level 1). A wrong engine re-offers Level 2 because the trigger "did not happen".
