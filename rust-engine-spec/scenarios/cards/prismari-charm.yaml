id: prismari-charm-mode-two-hits-two-different-targets-for-one-damage-each
title: Prismari Charm mode 2 deals 1 damage to each of two different targets, a creature and a player
area: card
cards: [Prismari Charm, Dragon's Rage Channeler, Island, Mountain]
tags: [prismari-charm, damage, two-targets, modal]
derived_from: oracle
source:
  - {kind: oracle, card: Prismari Charm, text: "Prismari Charm deals 1 damage to each of one or two targets.", verified: true}
  - {kind: cr, ref: "704.5g", text: "If a creature has toughness greater than 0, it has damage marked on it, and the total damage marked on it is greater than or equal to its toughness, that creature has been dealt lethal damage and is destroyed.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Prismari Charm @charm"]
    battlefield: ["Island @i1", "Mountain @m1"]
    library_pad: 10
  p1:
    battlefield: ["Dragon's Rage Channeler @drc"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@charm", modes: [2], targets: ["@drc", {player: p1}], pay: auto}
  - check:
      stack: [{kind: spell, card: "@charm", modes: [2], targets: ["@drc", {player: p1}]}]
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Prismari Charm], life: 20}
    p1: {life: 19, graveyard: [Dragon's Rage Channeler], battlefield: []}
notes: >
  Each of the two targets is dealt 1 damage: the 1/1 channeler dies and p1 goes from 20 to 19. A wrong engine deals the damage to only the first target,
  or divides one damage between them.
