id: mu-veil-makes-show-and-tell-uncounterable-vs-force-of-will
title: Veil of Summer in response to Force of Will makes Show and Tell uncounterable; Force of Will resolves and does nothing
area: matchup
cards: [Veil of Summer, Force of Will, Brainstorm, "Mishra's Bauble", Show and Tell, Omniscience, Island, Tropical Island, Hedge Maze, Volcanic Island]
tags: [matchup, veil-of-summer, cant-be-countered, force-of-will, show-and-tell, can-t-beats-can]
derived_from: cr
source:
  - {kind: oracle, card: Veil of Summer, text: "Spells you control can't be countered this turn.", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can't happen, the \"can't\" effect takes precedence.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Force of Will @fow", "Brainstorm @bs", "Mishra's Bauble @bb"]
    battlefield: ["Volcanic Island"]
    library_pad: 10
  p1:
    hand: ["Show and Tell @st", "Omniscience @omni", "Veil of Summer @veil"]
    battlefield: ["Island @i", "Tropical Island @t1", "Hedge Maze @hm", "Tropical Island @t2"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@st", pay: {tap: ["@i", "@t1", "@hm"]}}
  - p1: {t: pass}
  - p0: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@st"]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@veil", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack:
        - {kind: spell, card: "@st", controller: p1}
        - {kind: spell, card: "@fow", controller: p0, targets: ["@st"]}
      pending: {actor: p1, kind: priority}
      p1: {hand_count: 2, graveyard: [Veil of Summer]}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@st", controller: p1}]
      pending: {actor: p1, kind: priority}
      p0: {graveyard: [Force of Will]}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: simultaneous_secret_choice, answer: "@omni"}
  - p0: {decision: simultaneous_secret_choice, answer: null}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p1: {hand: [Island], graveyard: [Veil of Summer, Show and Tell], battlefield_contains: [{card: Omniscience}]}
    p0: {life: 19, hand: ["Mishra's Bauble"], graveyard: [Force of Will], exile: [Brainstorm]}
notes: >
  Veil resolves first: p0 cast a blue spell (Force of Will) this turn, so p1 draws a padding Island; Show and Tell can't be
  countered. Force of Will's target is still legal (a spell that can't be countered is still a spell), so it resolves, but
  the counter is prevented by the "can't" effect (101.2) and Show and Tell stays. Then Show and Tell resolves; p0 keeps the
  Bauble in hand.
