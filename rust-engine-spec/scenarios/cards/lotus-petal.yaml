id: lotus-petal-cast-for-zero-and-use-same-turn
title: Lotus Petal is cast for {0}, resolves, and can be sacrificed for mana immediately (no summoning sickness for artifacts)
area: card
cards: [Lotus Petal]
tags: [lotus-petal, artifact, cast, mana-ability, summoning-sickness]
derived_from: cr
source:
  - {kind: oracle, card: Lotus Petal, text: "{T}, Sacrifice this artifact: Add one mana of any color.", verified: true}
  - {kind: cr, ref: "302.6", text: "A creature's activated ability with the tap symbol or the untap symbol in its activation cost can't be activated unless the creature has been under its controller's control continuously since their most recent turn began.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lotus Petal @lp"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@lp", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: activate, source: "@lp", ability: 0, choose_color: R}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      mana_pool: {R: 1}
      spells_cast_this_turn: 1
      hand: []
      battlefield: []
      graveyard: [Lotus Petal]
notes: >
  Summoning sickness (302.6) restricts creatures only; the artifact that entered this turn can use its {T} ability at once.
  Casting it counts as one spell cast, costs {0}, and needs both passes to resolve.
