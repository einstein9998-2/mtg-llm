id: boros-b-trap-two-traps-earlier-exile-leaves-one-target-illegal
title: "A second Mindbreak Trap exiles a spell first; the first Trap resolves with that target illegal and still exiles its other target"
area: card
cards: [Mindbreak Trap, Lightning Bolt, Brainstorm, Lotus Petal, Island, Mountain]
tags: [mindbreak-trap, illegal-target-on-resolution, partial-fizzle, exile-spell, multiple-targets, two-traps, alternative-cost, boros]
derived_from: cr
source:
  - {kind: oracle, card: Mindbreak Trap, text: "Exile any number of target spells.", verified: true, note: "entry in oracle-additions-B.json"}
  - {kind: oracle, card: Mindbreak Trap, text: "If an opponent cast three or more spells this turn, you may pay {0} rather than pay this spell's mana cost.", verified: true}
  - {kind: cr, ref: "608.2b", text: "A target that's no longer in the zone it was in when it was targeted is illegal.", verified: true}
  - {kind: cr, ref: "608.2b", text: "Illegal targets, if any, won’t be affected by parts of a resolving spell’s effect for which they’re illegal.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Mindbreak Trap @trapA", "Mindbreak Trap @trapB"]
    library_pad: 10
  p1:
    hand: ["Lotus Petal @petal", "Lightning Bolt @bolt", "Brainstorm @bs"]
    battlefield: ["Mountain @mt", "Island @pi"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@petal", pay: auto}
  - resolve_top: true
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - p1: {t: cast, card: "@bs", pay: auto}
  - p1: {t: pass}
  - p0: {t: cast, card: "@trapA", alt_cost: {three_spells: true}, targets: ["@bolt", "@bs"]}
  - p0: {t: cast, card: "@trapB", alt_cost: {three_spells: true}, targets: ["@bolt"]}
  - label: two-traps-on-stack
    check:
      stack:
        - {kind: spell, card: "@bolt", controller: p1}
        - {kind: spell, card: "@bs", controller: p1}
        - {kind: spell, card: "@trapA", controller: p0, targets: ["@bolt", "@bs"]}
        - {kind: spell, card: "@trapB", controller: p0, targets: ["@bolt"]}
      p0: {spells_cast_this_turn: 2}
  - resolve_top: true
  - label: trap-b-resolved
    check:
      priority: p1
      stack:
        - {kind: spell, card: "@bs", controller: p1}
        - {kind: spell, card: "@trapA", controller: p0}
      p1: {exile: [Lightning Bolt]}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 20
      graveyard: [Mindbreak Trap, Mindbreak Trap]
      exile: []
      spells_cast_this_turn: 2
    p1:
      life: 20
      hand: []
      graveyard: []
      exile: [Lightning Bolt, Brainstorm]
      spells_cast_this_turn: 3
notes: >
  Both Traps are free (p1 cast Petal, Bolt and Brainstorm). Trap A targets Bolt and Brainstorm; p0 then casts Trap B on
  the Bolt alone, so B resolves first and exiles the Bolt. When A resolves, one of its targets (the Bolt) is no longer
  on the stack, so that target is illegal, but the Brainstorm is still legal, so A resolves (608.2b) and exiles the
  Brainstorm: the spell is not countered on resolution because not ALL targets are illegal. Both end in exile and the
  stack is empty; A goes to the graveyard. The bolt never resolves (p0 stays at 20).
