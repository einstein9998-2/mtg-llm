id: mu-bdt-bombardment-fizzles-skyclave-etb-then-no-illusion
title: Boros sacrifices Skyclave's target to Goblin Bombardment; the enters trigger exiles nothing, and when Bombardment kills Skyclave no Illusion is created
area: matchup
cards: [Skyclave Apparition, Goblin Bombardment, Ocelot Pride, Guide of Souls, Plains]
tags: [matchup, boros-vs-dt, skyclave-apparition, goblin-bombardment, fizzle, leaves-battlefield-trigger, damage-accumulates]
derived_from: cr
source:
  - {kind: oracle, card: Skyclave Apparition, text: "When this creature enters, exile up to one target nonland, nontoken permanent you don't control with mana value 4 or less.", verified: true}
  - {kind: oracle, card: Skyclave Apparition, text: "When this creature leaves the battlefield, the exiled card's owner creates an X/X blue Illusion creature token, where X is the mana value of the exiled card.", verified: true}
  - {kind: oracle, card: Goblin Bombardment, text: "Sacrifice a creature: This enchantment deals 1 damage to any target.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word “target,” are now illegal, the spell or ability doesn’t resolve.", verified: true}
  - {kind: cr, ref: "704.5g", text: "If a creature has toughness greater than 0, it has damage marked on it, and the total damage marked on it is greater than or equal to its toughness, that creature has been dealt lethal damage and is destroyed.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Goblin Bombardment @bomb", "Ocelot Pride @oc", "Guide of Souls @guide"]
    library_pad: 10
  p1:
    hand: ["Skyclave Apparition @sky"]
    battlefield: ["Plains @w1", "Plains @w2", "Plains @w3"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@sky", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_target, slot: 0, answer: "@oc", expect_options: {include: ["@oc", "@guide", "@bomb"]}}
  - p1: {t: pass}
  - p0: {t: activate, source: "@bomb", ability: 0, sacrifice: ["@oc"], targets: ["@sky"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      p1: {battlefield_contains: [{card: Skyclave Apparition, damage: 1}]}
      stack: [{kind: triggered, source: "@sky", controller: p1, targets: ["@oc"]}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: []
      p0: {exile: [], graveyard: [Ocelot Pride]}
  - p1: {t: pass}
  - p0: {t: activate, source: "@bomb", ability: 0, sacrifice: ["@guide"], targets: ["@sky"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@sky", controller: p1}]
      pending: {actor: p1, kind: priority}
      p1: {graveyard: [Skyclave Apparition]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      exile: []
      graveyard: [Ocelot Pride, Guide of Souls]
      battlefield: [{card: Goblin Bombardment}]
    p1:
      graveyard: [Skyclave Apparition]
      battlefield:
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
notes: >
  The enters trigger targets Ocelot; p0 sacrifices Ocelot to Bombardment (1 damage to the 2/2 Skyclave). The trigger's
  only target is gone, so it does not resolve and nothing is exiled. Later, in the same main phase, a second ping
  (sacrificing Guide) brings Skyclave's marked damage to 2 and it is destroyed (704.5g). Its leaves trigger still
  triggers, but there is no exiled card, so nobody creates a token: neither battlefield gains an Illusion. A wrong
  engine creates a 0/0 or 1/1 Illusion from the fizzled target, or clears the first point of damage early.
