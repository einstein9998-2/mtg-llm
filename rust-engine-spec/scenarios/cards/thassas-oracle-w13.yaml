id: thassas-oracle-devotion-counted-on-resolution
title: If Thassa's Oracle is exiled in response to its trigger, devotion is counted on resolution and the player does not win
area: card
cards: ["Thassa's Oracle", Island, Ponder, Brainstorm, Swords to Plowshares, Plains]
tags: [thassas-oracle, devotion, resolution-time-information, win-the-game, negative-case]
derived_from: cr
source:
  - {kind: oracle, card: "Thassa's Oracle", text: "look at the top X cards of your library, where X is your devotion to blue.", verified: true}
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "608.2h", text: "If an effect requires information from the game (such as the number of creatures on the battlefield), the answer is determined only once, when the effect is applied.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Thassa's Oracle @to"]
    battlefield: ["Island @i1", "Island @i2"]
    library: ["Ponder @a", "Brainstorm @b"]
  p1:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Plains @pl"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@to", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stp", targets: ["@to"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@to", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0: {life: 21, exile: ["Thassa's Oracle"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    game: {over: false}
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 21
      library_count: 2
      library_top: [Ponder, Brainstorm]
      exile: ["Thassa's Oracle"]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}]
notes: >
  The trigger has no target, so it still resolves after its source is exiled, but X is computed when it resolves
  (608.2h): p0 controls no permanent with {U} in its cost, so X = 0, nothing is looked at (no decision), and 0 < 2: no
  win. Without Swords this setup wins (a sibling scenario). p0 gains 1 from Swords (Oracle is 1/3).
  A wrong engine locks X in when the ability triggers.
