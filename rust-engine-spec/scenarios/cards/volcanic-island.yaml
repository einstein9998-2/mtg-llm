id: volcanic-island-one-mana-of-one-color
title: Volcanic Island adds one mana, either U or R, not both; the single tap pays for Lightning Bolt and nothing else
area: card
cards: [Volcanic Island, Lightning Bolt, Brainstorm, Island, Mountain]
tags: [dual-land, mana-ability, land-types, nonbasic]
derived_from: oracle
source:
  - {kind: oracle, card: Volcanic Island, text: "({T}: Add {U} or {R}.)", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt", "Brainstorm @bs"]
    battlefield: ["Volcanic Island @volc"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@volc", ability: 0, choose_color: R}
  - check:
      p0: {mana_pool: {R: 1}}
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - expect_illegal: {p0: {t: cast, card: "@bs", pay: auto}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Brainstorm]
      mana_pool: {}
      graveyard: [Lightning Bolt]
      battlefield: [{card: Volcanic Island, tapped: true, types: [Land], subtypes: [Island, Mountain]}]
    p1: {life: 17}
notes: >
  The land makes ONE mana of the chosen color. After it is spent on Lightning Bolt the pool is empty and the land is tapped, so Brainstorm
  ({U}) cannot be cast (expect_illegal: nothing left to pay with). The derived subtypes Island and Mountain are asserted on the permanent.
