id: tron-c-wasteland-on-urzas-mine-drops-tower-and-power-plant-to-one
title: After Wasteland destroys Urza's Mine, the Tower and the Power Plant add one {C} each
area: card
cards: ["Urza's Tower", "Urza's Mine", "Urza's Power Plant", Wasteland]
tags: [urzas-tower, tron, wasteland, destroy-nonbasic-land, condition-checked-at-resolution, interaction]
derived_from: oracle
source:
  - {kind: oracle, card: "Urza's Tower", text: "If you control an Urza's Mine and an Urza's Power-Plant, add {C}{C}{C} instead.", verified: true}
  - {kind: oracle, card: Wasteland, text: "{T}, Sacrifice this land: Destroy target nonbasic land.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Urza's Tower @tw", "Urza's Mine @mine", "Urza's Power Plant @pp"]
    library_pad: 10
  p1:
    battlefield: ["Wasteland @wl"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: activate, source: "@wl", ability: 1, targets: ["@mine"]}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {graveyard: ["Urza's Mine"]}
      p1: {graveyard: [Wasteland]}
  - p0: {t: activate, source: "@tw", ability: 0}
  - p0: {t: activate, source: "@pp", ability: 0}
expect:
  - at: after_script
    stack: []
    p0:
      mana_pool: {C: 2}
      battlefield: [{card: "Urza's Tower", tapped: true}, {card: "Urza's Power Plant", tapped: true}]
      graveyard: ["Urza's Mine"]
    p1:
      graveyard: [Wasteland]
      battlefield: []
notes: >
  Wasteland's ability is index 1 (index 0 is its {T}: Add {C}). Urza's Mine is a nonbasic land, so it is a legal target.
  After it is gone neither Tower nor Power Plant sees the full set: {C} + {C} = 2 (not 5). The same dependency in the
  other direction: the Mine would have kept making {C}{C} only while the other two were out. A wrong engine caches
  the Tron bonus on the lands instead of checking at activation.
