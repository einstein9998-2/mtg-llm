id: lotus-petal-mana-empties-at-end-of-main-phase
title: Unused mana from Lotus Petal empties when the main phase ends
area: card
cards: [Lotus Petal]
tags: [lotus-petal, mana-pool, phase-end, mana-empties]
derived_from: cr
source:
  - {kind: oracle, card: Lotus Petal, text: "{T}, Sacrifice this artifact: Add one mana of any color.", verified: true}
  - {kind: cr, ref: "500.5", text: "As a step or phase ends, if there are effects that last until the end of that step or phase, those effects expire. Then any unspent mana left in a player's mana pool empties.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Lotus Petal @lp"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@lp", ability: 0, choose_color: U}
  - check:
      p0: {mana_pool: {U: 1}}
  - advance: {to: begin_combat, of: p0}
expect:
  - at: after_script
    phase: begin_combat
    active: p0
    p0:
      mana_pool: {}
      graveyard: [Lotus Petal]
notes: >
  The blue mana produced in main phase 1 is gone by the time the beginning of combat step starts. A wrong engine would
  keep the pool across phases.
