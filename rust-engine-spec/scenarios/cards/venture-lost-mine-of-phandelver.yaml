id: venture-from-bottom-room-completes-and-chooses-new-dungeon
title: Venturing while the marker is on the bottommost room (its ability still on the stack) completes that dungeon and starts a new one; the old room ability still resolves
area: card
cards: [Acererak the Archlich, Aluren, Ponder]
tags: [venture, bottommost-room, dungeon-completion, choose-dungeon, stack-independence, aluren, flash, lost-mine, mad-mage]
derived_from: cr
source:
  - {kind: cr, ref: "701.49c", text: "If a player is instructed to venture into the dungeon while their venture marker is in the bottommost room of a dungeon card, they remove that dungeon card from the game. Doing so causes the player to complete that dungeon (see rule 309.7). They then choose an appropriate dungeon card they own from outside the game, put it into the command zone, and put their venture marker on the topmost room of that dungeon.", verified: true}
  - {kind: cr, ref: "309.5b", text: "If a player ventures into the dungeon while they own a dungeon card in the command zone and their venture marker is on that dungeon card's bottommost room, they remove that dungeon card from the game. They then choose a dungeon card they own from outside the game and put it into the command zone.", verified: true}
  - {kind: cr, ref: "113.7a", text: "Once activated or triggered, an ability exists on the stack independently of its source. Destruction or removal of the source after that time won't affect the ability.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "Lost Mine of Phandelver: Dark Pool leads to Temple of Dumathoin (Draw a card.); Dungeon of the Mad Mage: Yawning Portal (You gain 1 life.)", verified: false, note: "dungeon room text from reference/oracle.json dungeons section"}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    command: [{dungeon: Lost Mine of Phandelver, room: Dark Pool}]
    library: ["Ponder @pd"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - resolve_top: true
  - resolve_top: true
  - check:
      stack: [{kind: triggered, controller: p0, text_contains: "Draw a card"}]
      p0: {command: [{dungeon: Lost Mine of Phandelver, room: Temple of Dumathoin}], hand: [Acererak the Archlich]}
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
    note: "in response to the Temple ability, with Aluren's flash"
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack:
        - {kind: triggered, controller: p0, text_contains: "Draw a card"}
        - {kind: triggered, source: "@acer", controller: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_dungeon, answer: Dungeon of the Mad Mage, expect_options: {include: [Dungeon of the Mad Mage, Tomb of Annihilation]}}
  - label: new-dungeon
    check:
      stack:
        - {kind: triggered, controller: p0, text_contains: "Draw a card"}
        - {kind: triggered, controller: p0, text_contains: "gain 1 life"}
      p0:
        command: [{dungeon: Dungeon of the Mad Mage, room: Yawning Portal}]
        completed_dungeons: [Lost Mine of Phandelver]
        hand: [Acererak the Archlich]
  - resolve_top: true
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 21
      hand: [Acererak the Archlich, Ponder]
      command: [{dungeon: Dungeon of the Mad Mage, room: Yawning Portal}]
      completed_dungeons: [Lost Mine of Phandelver]
notes: >
  The marker reaches Temple of Dumathoin and its ability is on the stack, so the state-based action does not remove the
  dungeon. p0 recasts Acererak above it (Aluren gives flash). The second ETB ventures while the marker is on the bottommost
  room: Lost Mine is removed and completed as part of the venture, and p0 chooses a new dungeon (the mask is checked only
  for the two dungeons not yet completed, see ambiguities) with the marker on Yawning Portal, whose ability goes on the
  stack above the Temple ability. Yawning Portal resolves first (+1 life), then the Temple ability still resolves although
  its dungeon has left the game (113.7a) and draws Ponder. Bugs caught: refusing to venture from the bottom room, moving
  the marker "past" the bottom, dropping the orphaned Temple ability, completing twice.
