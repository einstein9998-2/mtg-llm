notes: >
  X = 2 ({2}{C}{C}: the Tomb pays {C}{C}, two Mountains the generic part; the Tomb deals 2 damage, so p0 is at 18);
  Phelia ({1}{W}) has mana value 2, a legal target at X = 2. p1 exiles its own Phelia in response, so mode 3's only
  target is gone, but mode 1's target (a player) is still legal: the spell is not "all targets illegal" (608.2b), it
  resolves, the exile part does nothing and two Eldrazi Spawn are created for p0. A wrong engine fizzles the whole
  spell when any target is illegal. Swords gives p1 life equal to Phelia's power (2): 22.
