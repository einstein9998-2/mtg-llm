notes: >
  An Urza's Mine is a land with the land types Urza's and Mine; an Urza's Power-Plant has Urza's and Power-Plant. The Nexus
  has all of them, so it is both, and "an Urza's Mine and an Urza's Power-Plant" needs no two distinct permanents. The Tower
  alone yields {C}{C}{C}. A wrong engine matches the lands by card name, or insists on two different permanents.
