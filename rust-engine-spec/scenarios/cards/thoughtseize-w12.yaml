id: thoughtseize-takes-a-creature-and-costs-two-life
title: Thoughtseize may take a creature card (any nonland card) and its caster loses 2 life
area: card
cards: [Thoughtseize, Griselbrand, Island, Swamp]
tags: [thoughtseize, hand-disruption, life-loss]
derived_from: oracle
source:
  - {kind: oracle, card: Thoughtseize, text: "Target player reveals their hand. You choose a nonland card from it. That player discards that card. You lose 2 life.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 20
    hand: ["Thoughtseize @ts"]
    battlefield: ["Swamp @s"]
    library_pad: 10
  p1:
    life: 20
    hand: ["Griselbrand @g", "Island @i"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ts", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@g"], expect_options: {include: ["@g"], exclude: ["@i"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 18, graveyard: [Thoughtseize]}
    p1: {life: 20, hand: [Island], graveyard: [Griselbrand]}
notes: >
  Unlike Duress, creature cards are legal choices; lands are not. The caster, not the target, loses 2 life. Wrong
  engines: make the target lose the life, or exclude creatures.
