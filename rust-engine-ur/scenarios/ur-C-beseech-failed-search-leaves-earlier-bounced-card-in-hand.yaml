id: ur-c-beseech-failed-search-leaves-earlier-bounced-card-in-hand
title: "Beseech the Mirror that finds nothing after Boomerang Basics bounced my Lotus Petal: the hand is exactly Petal and the drawn card, with no extra or duplicate card"
area: card
cards: [Beseech the Mirror, Boomerang Basics, Lotus Petal, Ponder, Island, Swamp]
tags: [beseech-the-mirror, search-fails, empty-library, only-the-found-card, boomerang-basics, bounce, hand-contents, regression]
derived_from: oracle
source:
  - {kind: oracle, card: Boomerang Basics, text: "Return target nonland permanent to its owner's hand.", verified: true}
  - {kind: oracle, card: Boomerang Basics, text: "If you controlled that permanent, draw a card.", verified: true}
  - {kind: oracle, card: Beseech the Mirror, text: "Search your library for a card, exile it face down, then shuffle.", verified: true}
  - {kind: oracle, card: Beseech the Mirror, text: "Put the exiled card into your hand if it wasn't cast this way.", verified: true}
  - {kind: cr, ref: "701.23d", text: "If a player is searching a hidden zone simply for a quantity of cards, such as “a card” or “three cards,” that player must find that many cards (or as many as possible, if the zone doesn’t contain enough cards).", verified: true}
  - {kind: cr, ref: "400.7j", text: "If an effect causes an object to move to a public zone, other parts of that effect can find that object. If the cost of a spell or ability causes an object to move to a public zone, that spell or ability’s effects can find that object.", verified: true}
  - {kind: cr, ref: "101.3", text: "Any part of an instruction that's impossible to perform is ignored.", verified: true}
  - {kind: cr, ref: "704.5b", text: "If a player attempted to draw a card from a library with no cards in it since the last time state-based actions were checked, that player loses the game.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Boomerang Basics @bb", "Beseech the Mirror @bes"]
    battlefield: ["Island @isl", "Swamp @s1", "Swamp @s2", "Swamp @s3", "Swamp @s4", "Lotus Petal @petal"]
    library: ["Ponder @pon"]
  p1:
    library_pad: 10
random: any
script:
  - p0: {t: cast, card: "@bb", targets: ["@petal"], pay: {tap: ["@isl"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - label: petal-bounced
    check:
      stack: []
      p0:
        hand: [Lotus Petal, Beseech the Mirror, Ponder]
        library_count: 0
        graveyard: [Boomerang Basics]
        battlefield: [{card: Island, tapped: true}, {card: Swamp}, {card: Swamp}, {card: Swamp}, {card: Swamp}]
  - p0: {t: cast, card: "@bes", bargained: false, pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, found: null}
expect:
  - at: after_script
    game: {over: false}
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Lotus Petal, Ponder]
      library_count: 0
      exile: []
      graveyard: [Boomerang Basics, Beseech the Mirror]
      spells_cast_this_turn: 2
      battlefield:
        - {card: Island, tapped: true}
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: true}
    p1:
      hand: []
      exile: []
      graveyard: []
      battlefield: []
notes: >
  Regression scenario for the same once-seen bug as ur-c-beseech-failed-search-leaves-earlier-token, with the earlier
  effect being a bounce that put a card into p0's hand. Boomerang Basics returns p0's own Lotus Petal (it controlled it, so
  p0 draws: Ponder, the only card in the library). The hand mid-script is Petal, Beseech and Ponder (the mid-script check
  after the bounce lists Beseech because it is still in hand then). p0 then casts Beseech without bargaining (no
  artifact is sacrificed). The library is empty, so the search finds nothing (701.23d allows no other failure). Nothing is
  exiled, so no card can be "the exiled card": the hand afterwards is exactly Petal and Ponder (Beseech left it by being cast),
  with no second Petal, no second Ponder and no other card; the graveyard holds the two sorceries; the battlefield is only
  the five lands. A wrong engine re-moves the last object an earlier effect moved (the bounced Petal, the drawn Ponder) into
  hand, which shows up as a duplicate or as a card missing from its zone. Ponder is drawn, never cast. The library emptying
  by the Boomerang Basics draw is not a loss: the draw succeeded (704.5b needs a draw from an empty library).
