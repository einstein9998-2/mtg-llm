notes: >
  Bolt costs {2}{R} under Trinisphere. With only {C}{C}{C} floating (no red source) it cannot be cast. After a Mountain is
  played, the Mountain pays {R} and two of the three floating {C} pay the generic part, leaving {C} in the pool. The only
  legal payment is deterministic, so pay: auto is safe. A wrong engine lets colorless mana pay the colored symbol.
