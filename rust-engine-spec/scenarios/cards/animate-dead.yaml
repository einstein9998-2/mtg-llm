id: animate-dead-targets-only-creature-cards-in-graveyards
title: Animate Dead cannot target a creature on the battlefield or a noncreature card, and returns an opponent's creature card under its caster's control
area: card
cards: [Animate Dead, Street Wraith, "Thassa's Oracle", Doomsday, Swamp, Island]
tags: [animate-dead, targeting, control, pt-modification]
derived_from: oracle
source:
  - {kind: oracle, card: Animate Dead, text: "Enchant creature card in a graveyard", verified: true}
  - {kind: oracle, card: Animate Dead, text: "Return enchanted creature card to the battlefield under your control and attach this Aura to it.", verified: true}
  - {kind: oracle, card: Animate Dead, text: "Enchanted creature gets -1/-0.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Animate Dead @ad"]
    battlefield: ["Swamp @s1", "Swamp @s2"]
    library_pad: 10
  p1:
    battlefield: ["Thassa's Oracle @o"]
    graveyard: ["Street Wraith @w", "Doomsday @dd"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@ad", targets: ["@o"]}}
  - expect_illegal: {p0: {t: cast, card: "@ad", targets: ["@dd"]}}
  - p0: {t: cast, card: "@ad", targets: ["@w"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield:
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: true}
        - {card: Animate Dead, attached_to: "@w"}
        - {card: Street Wraith, controller: p0, sick: true, pt: [2, 4]}
    p1:
      graveyard: [Doomsday]
      battlefield: [{card: "Thassa's Oracle"}]
notes: >
  The Aura spell's target must match "creature card in a graveyard": Thassa's Oracle is a creature on the battlefield
  and Doomsday is a sorcery card, so both probes are illegal. Any graveyard is allowed: Street Wraith (3/4) comes from
  p1's graveyard under p0's control as a 2/4. Two pass pairs: the Aura spell resolves, then its enters trigger.
