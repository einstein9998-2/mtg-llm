id: order-triggers-active-player-drc-and-flurry
title: "Two different triggers for the active player (DRC surveil and Cutter flurry): the controller orders them, the first listed goes on the stack first"
area: core
cards: [Dragon's Rage Channeler, Cori-Steel Cutter, Lightning Bolt, Mountain, Ponder]
tags: [apnap, order-triggers, drc, cori-steel-cutter, flurry, simultaneous-triggers]
derived_from: cr
source:
  - {kind: cr, ref: "603.3b", text: "If multiple abilities have triggered since the last time a player received priority, the abilities are placed on the stack in a two-part process. First, each player, in APNAP order, puts each triggered ability they control with a trigger condition that isn't another ability triggering on the stack in any order they choose.", verified: true}
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Whenever you cast your second spell each turn", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Dragon's Rage Channeler @drc2", "Lightning Bolt @b1"]
    battlefield: ["Dragon's Rage Channeler @drc", "Cori-Steel Cutter @cutter", "Mountain @m1", "Mountain @m2"]
    library: ["Ponder @pond"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@drc2", pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@drc2", controller: p0}
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: auto}
  - p0: {decision: order_triggers, answer: ["@drc", "@cutter"], expect_options: {include: ["@drc", "@cutter"]}}
  - check:
      stack:
        - {kind: spell, card: "@drc2", controller: p0}
        - {kind: spell, card: "@b1", controller: p0}
        - {kind: triggered, source: "@drc", controller: p0}
        - {kind: triggered, source: "@cutter", controller: p0}
      pending: {actor: p0, kind: priority}
expect:
  - at: after_script
    stack:
      - {kind: spell, card: "@drc2", controller: p0}
      - {kind: spell, card: "@b1", controller: p0}
      - {kind: triggered, source: "@drc", controller: p0}
      - {kind: triggered, source: "@cutter", controller: p0}
    p0: {spells_cast_this_turn: 2}
notes: >
  The creature spell first (spell number one, no DRC trigger because it is a creature spell, no flurry because it is the
  first spell). Casting the noncreature Bolt as the second spell triggers both abilities at once. They are different
  abilities, so p0 (the only player with triggers) gets an order_triggers decision (doc 01 section 7.3). The answer lists
  the source put on the stack first; so the Cutter trigger ends on top and would resolve first. Catches an engine that
  never asks, orders by internal id, or lets the opponent order p0's triggers.
---
id: order-triggers-nonactive-player-chooses-own-order
title: "The non-active player with two different triggers makes the ordering decision, not the active player"
area: core
cards: [Dragon's Rage Channeler, Cori-Steel Cutter, Containment Priest, Lightning Bolt, Mountain, Plains, Ponder]
tags: [apnap, order-triggers, drc, cori-steel-cutter, nonactive-player, flash]
derived_from: cr
source:
  - {kind: cr, ref: "603.3b", text: "First, each player, in APNAP order, puts each triggered ability they control with a trigger condition that isn't another ability triggering on the stack in any order they choose.", verified: true}
  - {kind: oracle, card: Containment Priest, text: "Flash", verified: true}
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Whenever you cast your second spell each turn", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    library_pad: 10
  p1:
    hand: ["Containment Priest @priest", "Lightning Bolt @b1"]
    battlefield: ["Dragon's Rage Channeler @drc", "Cori-Steel Cutter @cutter", "Plains @pl", "Mountain @m1", "Mountain @m2"]
    library: ["Ponder @pond"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: cast, card: "@priest", pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@priest", controller: p1}
  - p1: {t: cast, card: "@b1", targets: [{player: p0}], pay: auto}
  - p1: {decision: order_triggers, answer: ["@cutter", "@drc"]}
  - check:
      stack:
        - {kind: spell, card: "@priest", controller: p1}
        - {kind: spell, card: "@b1", controller: p1}
        - {kind: triggered, source: "@cutter", controller: p1}
        - {kind: triggered, source: "@drc", controller: p1}
      pending: {actor: p1, kind: priority}
expect:
  - at: after_script
    active: p0
    stack:
      - {kind: spell, card: "@priest", controller: p1}
      - {kind: spell, card: "@b1", controller: p1}
      - {kind: triggered, source: "@cutter", controller: p1}
      - {kind: triggered, source: "@drc", controller: p1}
    p1: {spells_cast_this_turn: 2}
    p0: {spells_cast_this_turn: 0}
notes: >
  The ordering choice belongs to the controller of the triggers even when it is not their turn (CR 603.3b: each player
  orders the triggers they control). p0 is the active player but controls no trigger here and is never asked. Containment
  Priest (flash creature) is the first spell, so only the second spell (Bolt, noncreature) triggers both abilities. Here
  p1 puts the Cutter trigger on first and the DRC trigger on top, the opposite of the previous scenario, so DRC's surveil
  would resolve first. Mana: Priest {1}{W} needs the Plains plus one Mountain; the other Mountain pays for Bolt.
---
id: murktide-two-identical-triggers-no-ordering-decision
title: "Two identical Murktide Regent triggers for one player are interchangeable: no order_triggers decision is offered"
area: core
cards: [Murktide Regent, Faerie Macabre, Lightning Bolt, Ponder]
tags: [apnap, order-triggers, interchangeable-triggers, murktide-regent, faerie-macabre, leaves-graveyard, design-doc-decision-shape]
derived_from: cr
source:
  - {kind: cr, ref: "603.2c", text: "An ability triggers only once each time its trigger event occurs. However, it can trigger repeatedly if one event contains multiple occurrences.", verified: true}
  - {kind: cr, ref: "603.3b", text: "each player, in APNAP order, puts each triggered ability they control with a trigger condition that isn't another ability triggering on the stack in any order they choose.", verified: true}
  - {kind: oracle, card: Murktide Regent, text: "Whenever an instant or sorcery card leaves your graveyard, put a +1/+1 counter on this creature.", verified: true}
  - {kind: oracle, card: Faerie Macabre, text: "Discard this card: Exile up to two target cards from graveyards.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Faerie Macabre @fm"]
    battlefield: ["Murktide Regent @m0"]
    graveyard: ["Lightning Bolt @g1", "Ponder @g2"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate_from_hand, source: "@fm", ability: 0, targets: ["@g1", "@g2"]}
  - resolve_top: true
  - check:
      stack:
        - {kind: triggered, source: "@m0", controller: p0}
        - {kind: triggered, source: "@m0", controller: p0}
      pending: {actor: p0, kind: priority}
      p0: {exile: [Lightning Bolt, Ponder], graveyard: [Faerie Macabre]}
  - resolve_top: true
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {battlefield: [{card: Murktide Regent, counters: {"+1/+1": 2}, pt: [5, 5]}]}
notes: >
  Two instant/sorcery cards leave the graveyard in one event, so the ability triggers once per card (603.2c): two
  triggers from the same source with the same text and no differing parameters. Design doc 01 section 7.3 says such
  interchangeable triggers are placed on the stack in canonical order without asking, so the script has no order_triggers
  step and the next pending decision after the exile is plain priority. (The CR itself would let p0 order them; the
  outcome is identical either way, which is why the engine need not ask.) Catches an engine that asks a meaningless
  question, or that triggers only once for a two-card event. Reviewer note: the no-prompt half rests on doc 01
  section 7.3 ("interchangeable means identical source definition and identical captured parameters"), not on the CR;
  it holds only if the triggering card (Bolt vs Ponder) is not a captured parameter, which is right for this ability
  because its effect never refers to the card that left. If the engine design changes, relax this scenario, not the engine.
---
id: murktide-no-trigger-for-card-that-is-not-instant-or-sorcery
title: "Murktide Regent triggers only for the instant that left the graveyard, not for the Island exiled with it"
area: core
cards: [Murktide Regent, Faerie Macabre, Lightning Bolt, Island]
tags: [murktide-regent, faerie-macabre, leaves-graveyard, negative-case, triggers]
derived_from: oracle
source:
  - {kind: oracle, card: Murktide Regent, text: "Whenever an instant or sorcery card leaves your graveyard, put a +1/+1 counter on this creature.", verified: true}
  - {kind: oracle, card: Faerie Macabre, text: "Discard this card: Exile up to two target cards from graveyards.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Faerie Macabre @fm"]
    battlefield: ["Murktide Regent @m0"]
    graveyard: ["Island @gi", "Lightning Bolt @gb"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate_from_hand, source: "@fm", ability: 0, targets: ["@gi", "@gb"]}
  - resolve_top: true
  - check:
      stack:
        - {kind: triggered, source: "@m0", controller: p0}
      p0: {exile: [Island, Lightning Bolt]}
  - resolve_top: true
expect:
