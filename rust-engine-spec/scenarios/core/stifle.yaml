id: stifle-acererak-etb-trigger-acererak-stays
title: "Stifle on Acererak's enters trigger: Acererak stays on the battlefield and p0 does not venture"
area: core
cards: [Acererak the Archlich, Stifle, Swamp, Island]
tags: [stifle, acererak, triggers, counter-ability, etb, venture]
derived_from: cr
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @ace"]
    battlefield: ["Swamp @s1", "Swamp @s2", "Swamp @s3"]
    library_pad: 10
  p1:
    hand: ["Stifle @stifle"]
    battlefield: ["Island @j1"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ace", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack:
        - {kind: triggered, source: "@ace", controller: p0}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stifle", targets: [{trigger_of: "@ace", nth: 0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      battlefield_contains: [{card: Acererak the Archlich, controller: p0}]
      command: []
    p1: {graveyard: [Stifle]}
notes: >
  Acererak resolves and its enters trigger goes on the stack; the active player p0 receives priority after the spell
  resolves and passes, so p1 can cast Stifle on the trigger. With the trigger countered Acererak neither returns to hand
  nor ventures: no dungeon enters the command zone and no choose_dungeon decision appears. Catches an engine that
  implements the return and venture as part of the permanent entering instead of as a stack trigger.
