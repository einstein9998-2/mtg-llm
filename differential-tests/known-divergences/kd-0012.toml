notes = "Finding E5. If Animate Dead leaves before its enters trigger resolves, the engine puts a second, empty trigger on the stack; Forge does not. One extra stack object and priority window, no state change, no play made unavailable. Accepted as a documented limit; 3 lockstep lines (reanimator-02 l3, l6, reanimator-08 l3) are classed with this entry."
