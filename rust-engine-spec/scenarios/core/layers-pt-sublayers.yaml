  - {kind: oracle, card: "Kaito, Bane of Nightmares", text: "During your turn, as long as Kaito has one or more loyalty counters on him, he's a 3/4 Ninja creature and has hexproof.", verified: true}
  - {kind: oracle, card: Massacre, text: "All creatures get -2/-2 until end of turn.", verified: true}
  - {kind: cr, ref: "613.4", text: "Within layer 7, apply effects in a series of sublayers in the order described below. Within each sublayer, apply effects in timestamp order.", verified: true}
  - {kind: cr, ref: "613.4b", text: "Layer 7b: Effects that set power and/or toughness to a specific number or value are applied.", verified: true}
  - {kind: cr, ref: "613.4c", text: "Layer 7c: Effects and counters that modify power and/or toughness (but don’t set power and/or toughness to a specific number or value) are applied.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Massacre @mass"]
    battlefield:
      - {card: "Kaito, Bane of Nightmares", as: kaito, counters: {loyalty: 3}}
