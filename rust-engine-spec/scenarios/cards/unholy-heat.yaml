id: unholy-heat-deals-six-with-delirium
title: Unholy Heat deals exactly 6 damage with four card types in the graveyard
area: card
cards: [Unholy Heat, Murktide Regent, Island, Ponder, Mishra's Bauble, Lightning Bolt, Mountain]
tags: [unholy-heat, delirium, card-types, graveyard-count]
derived_from: oracle
source:
  - {kind: oracle, card: Unholy Heat, text: "Delirium — Unholy Heat deals 6 damage instead if there are four or more card types among cards in your graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Unholy Heat @heat"]
    battlefield: ["Mountain @m1"]
    graveyard: ["Island", "Ponder", "Mishra's Bauble", "Lightning Bolt"]
    library_pad: 10
  p1:
    battlefield:
      - {card: Murktide Regent, as: mur, counters: {"+1/+1": 4}}
    library_pad: 10
script:
  - p0: {t: cast, card: "@heat", targets: ["@mur"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Island, Ponder, Mishra's Bauble, Lightning Bolt, Unholy Heat]}
    p1: {battlefield: [{card: Murktide Regent, pt: [7, 7], damage: 6}]}
notes: >
  Land, sorcery, artifact and instant are four distinct card types (the Bolt is the instant), so delirium is on and Heat deals 6, not 2. The 7/7 Murktide
  survives with exactly 6 damage marked, which proves the amount (a 3/3 would not distinguish 6 from a larger number). A wrong engine that counts cards instead of types would also pass here; the four-cards-three-types scenario in dragons-rage-channeler.yaml is the one that catches it.
