id: null-rod-stops-bauble-petal-and-treasure-activations-but-not-casting
title: Null Rod stops activating Mishra's Bauble, Lotus Petal and a Treasure token, though the Bauble can still be cast and enters the battlefield
area: card
cards: [Null Rod, Mishra's Bauble, Lotus Petal, Treasure Token]
tags: [null-rod, mana-ability, activated-ability, artifact, treasure, lotus-petal, mishras-bauble, negative-case]
derived_from: oracle
source:
  - {kind: oracle, card: Null Rod, text: "Activated abilities of artifacts can't be activated.", verified: true}
  - {kind: cr, ref: "605.1a", text: "An activated ability is a mana ability if it meets all of the following criteria: it doesn’t require a target (see rule 115.6), it could add mana to a player’s mana pool when it resolves, and it’s not a loyalty ability.", verified: true}
  - {kind: cr, ref: "111.10a", text: "A Treasure token is a colorless Treasure artifact token with “{T}, Sacrifice this token: Add one mana of any color.”", verified: true, note: "the Treasure Token text in oracle.json is recalled; this CR rule is the verified source that it is an artifact with that ability"}
  - {kind: oracle, card: Lotus Petal, text: "{T}, Sacrifice this artifact: Add one mana of any color.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Mishra's Bauble @bb"]
    battlefield: ["Lotus Petal @petal", {token: Treasure Token, as: tr}]
    library_pad: 10
  p1:
    battlefield: ["Null Rod @rod"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bb", pay: auto}
  - resolve_top: true
  - check:
      stack: []
      p0: {battlefield_contains: [{card: Mishra's Bauble}]}
  - expect_illegal: {p0: {t: activate, source: "@bb", ability: 0, targets: [{player: p0}]}}
  - expect_illegal: {p0: {t: activate, source: "@petal", ability: 0, choose_color: R}}
  - expect_illegal: {p0: {t: activate, source: "@tr", ability: 0, choose_color: R}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      mana_pool: {}
      graveyard: []
      battlefield: [{card: Mishra's Bauble, tapped: false}, {card: Lotus Petal, tapped: false}, {token: Treasure Token, tapped: false}]
    p1: {battlefield: [{card: Null Rod}]}
notes: >
  Null Rod forbids activating any ability of any artifact (it affects both players), and mana abilities are activated abilities, so the Petal and the Treasure
  token cannot be sacrificed for mana. Casting is not activating: the Bauble can still be cast from hand and enters the battlefield, but it cannot then be
  used. Each probe changes no state (nothing tapped or sacrificed, the mana pool stays empty). A wrong engine exempts mana abilities.
