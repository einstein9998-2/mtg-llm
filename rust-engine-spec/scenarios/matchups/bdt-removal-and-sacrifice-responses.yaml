id: mu-bdt-bombardment-in-response-to-swords-no-life-gained
title: Boros sacrifices the Swords target to Goblin Bombardment in response; Swords does not resolve and Boros gains no life
area: matchup
cards: [Goblin Bombardment, Amped Raptor, Swords to Plowshares, Plains]
tags: [matchup, boros-vs-dt, goblin-bombardment, swords-to-plowshares, fizzle, sacrifice-cost, response]
derived_from: cr
source:
  - {kind: oracle, card: Goblin Bombardment, text: "Sacrifice a creature: This enchantment deals 1 damage to any target.", verified: true}
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word “target,” are now illegal, the spell or ability doesn’t resolve. It’s removed from the stack and, if it’s a spell, put into its owner’s graveyard.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If part of the effect requires information about an illegal target, it fails to determine any such information.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Goblin Bombardment @bomb", "Amped Raptor @raptor"]
    library_pad: 10
  p1:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Plains @w"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@stp", targets: ["@raptor"], pay: auto}
  - p1: {t: pass}
  - p0: {t: activate, source: "@bomb", ability: 0, sacrifice: ["@raptor"], targets: [{player: p1}]}
  - check:
      stack:
        - {kind: spell, card: "@stp", controller: p1, targets: ["@raptor"]}
        - {kind: activated, source: "@bomb", controller: p0, targets: [{player: p1}]}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 20
      battlefield: [{card: Goblin Bombardment}]
      graveyard: [Amped Raptor]
      exile: []
    p1:
      life: 19
      graveyard: [Swords to Plowshares]
      battlefield: [{card: Plains, tapped: true}]
notes: >
  The Raptor (power 2) is sacrificed as a cost, so it is in the graveyard before Swords resolves. Swords' only target is
  gone, so Swords does not resolve and goes to the graveyard; no life is gained (a wrong engine uses the Raptor's last
  known power and gives p0 2 life, or exiles the Raptor from the graveyard). Bombardment's ping resolves first (LIFO):
  p1 19. After it resolves the active player p1 gets priority; both pass and Swords is removed.
---
id: mu-bdt-impending-overlord-not-a-legal-target-for-boros-removal
title: An impending Overlord of the Balemurk is not a creature, so Swords, Erode and Goblin Bombardment cannot target it; Erode on Phelia works
area: matchup
cards: [Overlord of the Balemurk, "Phelia, Exuberant Shepherd", Swords to Plowshares, Erode, Goblin Bombardment, Ocelot Pride, Plains]
tags: [matchup, boros-vs-dt, impending, overlord-of-the-balemurk, targeting, mask-validity, erode, any-target]
derived_from: cr
source:
  - {kind: oracle, card: Overlord of the Balemurk, text: "Impending 5—{1}{B} (If you cast this spell for its impending cost, it enters with five time counters and isn't a creature until the last is removed.", verified: true}
  - {kind: oracle, card: Erode, text: "Destroy target creature or planeswalker. Its controller may search their library for a basic land card, put it onto the battlefield tapped, then shuffle.", verified: true}
  - {kind: oracle, card: Goblin Bombardment, text: "Sacrifice a creature: This enchantment deals 1 damage to any target.", verified: true}
  - {kind: cr, ref: "702.176a", text: "As long as this permanent’s impending cost was paid and it has a time counter on it, it’s not a creature", verified: true}
  - {kind: cr, ref: "115.4", text: "These targets may be creatures, players, planeswalkers, or battles. Other game objects, such as noncreature artifacts or spells, can’t be chosen.", verified: true}
setup:
  turn: 6
  active: p0
  phase: main1
  p0:
    hand: ["Swords to Plowshares @stp", "Erode @er"]
    battlefield: ["Plains @w1", "Plains @w2", "Goblin Bombardment @bomb", "Ocelot Pride @oc"]
    library_pad: 10
  p1:
    battlefield:
      - {card: Overlord of the Balemurk, as: ov, counters: {time: 4}, flags: {impending_paid: true}}
      - "Phelia, Exuberant Shepherd @phe"
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@stp", targets: ["@ov"], pay: auto}}
  - expect_illegal: {p0: {t: cast, card: "@er", targets: ["@ov"], pay: auto}}
  - expect_illegal: {p0: {t: activate, source: "@bomb", ability: 0, sacrifice: ["@oc"], targets: ["@ov"]}}
  - p0: {t: cast, card: "@er", targets: ["@phe"], pay: {tap: ["@w1"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: yes_no, purpose: may_search, answer: false}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Swords to Plowshares]
      graveyard: [Erode]
      battlefield:
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: false}
        - {card: Goblin Bombardment}
        - {card: Ocelot Pride}
    p1:
      graveyard: ["Phelia, Exuberant Shepherd"]
      library_count: 10
      battlefield:
        - {card: Overlord of the Balemurk, types: [Enchantment], counters: {time: 4}}
notes: >
  Setup: Overlord was cast for its impending cost earlier and has 4 time counters left (one removed at an end step), so
  it is an enchantment and not a creature (702.176a). Swords (target creature), Erode (target creature or planeswalker)
  and Bombardment ("any target": creatures, players, planeswalkers, battles, 115.4) cannot target it. Positive control
  in the same state: Erode destroys Phelia, and Phelia's controller p1 is the one who decides on the basic land search
  (declined here, so p1's library stays at 10). A wrong engine treats the Overlord as a 5/5 creature while time counters
  remain.
