id: voice-of-victory-opponent-cannot-cast-on-controllers-turn
title: During Voice of Victory's controller's turn the opponent is offered no spell, neither hard cast nor any alternative cost
area: card
cards: [Voice of Victory, Lightning Bolt, Mountain, Solitude, Swords to Plowshares, Force of Will, Brainstorm, Plains]
tags: [voice-of-victory, casting-restriction, legal-action-mask, alternative-cost, evoke, negative-case]
derived_from: oracle
source:
  - {kind: oracle, card: Voice of Victory, text: "Your opponents can't cast spells during your turn.", verified: true}
  - {kind: oracle, card: Solitude, text: "Evoke—Exile a white card from your hand.", verified: true}
  - {kind: oracle, card: Force of Will, text: "You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can’t happen, the “can’t” effect takes precedence.", verified: true}
  - {kind: cr, ref: "601.2e", text: "The game checks to see if the proposed spell can legally be cast. If the proposed spell is illegal, the game returns to the moment before the casting of that spell was proposed", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Voice of Victory @vov", "Mountain @m"]
    library_pad: 10
  p1:
    hand: ["Solitude @sol", "Swords to Plowshares @stp", "Force of Will @fow", "Brainstorm @bs"]
    battlefield: ["Plains @pl1", "Plains @pl2", "Plains @pl3", "Plains @pl4", "Plains @pl5"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0}]
      pending: {actor: p1, kind: priority}
      legal:
        p1:
          include: [{t: pass}]
          exclude:
            - {t: cast, card: "@sol"}
            - {t: cast, card: "@stp"}
            - {t: cast, card: "@fow"}
            - {t: cast, card: "@bs"}
  - expect_illegal: {p1: {t: cast, card: "@sol", alt_cost: null, pay: auto}}
  - expect_illegal: {p1: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@stp"}}}}
  - expect_illegal: {p1: {t: cast, card: "@stp", targets: ["@vov"], pay: auto}}
  - expect_illegal: {p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@bolt"]}}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Lightning Bolt]
      battlefield: [{card: Voice of Victory}, {card: Mountain, tapped: true}]
    p1:
      life: 17
      hand: [Solitude, Swords to Plowshares, Force of Will, Brainstorm]
      battlefield:
        - {card: Plains, tapped: false}
        - {card: Plains, tapped: false}
        - {card: Plains, tapped: false}
        - {card: Plains, tapped: false}
        - {card: Plains, tapped: false}
      exile: []
notes: >
  p1 has everything needed to hard cast Solitude (five Plains), to evoke it (Swords is a white card), to cast Swords,
  and to pitch Force of Will (Brainstorm is blue), but it is p0's turn and p0 controls Voice of Victory, so none of
  these casts may be offered (101.2: can't beats the permission each alternative cost gives). The legal action list
  itself must exclude them; refusing them only at play time is the bug the Forge enumerator had. p1 can only pass;
  Bolt resolves (p1 20 - 3 = 17). Paired with voice-of-victory-opponent-can-cast-on-own-turn (positive case).
---
id: voice-of-victory-opponent-can-cast-on-own-turn
title: On the opponent's own turn Voice of Victory does not restrict them; hard cast and evoke Solitude are both offered
area: card
cards: [Voice of Victory, Solitude, Swords to Plowshares, Plains]
tags: [voice-of-victory, casting-restriction, legal-action-mask, alternative-cost, evoke, control-case]
derived_from: oracle
source:
  - {kind: oracle, card: Voice of Victory, text: "Your opponents can't cast spells during your turn.", verified: true}
  - {kind: oracle, card: Solitude, text: "When this creature enters, exile up to one other target creature. That creature's controller gains life equal to its power.", verified: true}
  - {kind: oracle, card: Solitude, text: "Evoke—Exile a white card from your hand.", verified: true}
  - {kind: cr, ref: "702.74a", text: "“Evoke [cost]” means “You may cast this card by paying [cost] rather than paying its mana cost”", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    battlefield: ["Voice of Victory @vov"]
    library_pad: 10
  p1:
    hand: ["Solitude @sol", "Swords to Plowshares @stp"]
    battlefield: ["Plains @pl1", "Plains @pl2", "Plains @pl3", "Plains @pl4", "Plains @pl5"]
    library_pad: 10
script:
  - check:
      pending: {actor: p1, kind: priority}
      legal:
        p1:
          include:
            - {t: cast, card: "@sol", alt_cost: null}
            - {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@stp"}}}
            - {t: cast, card: "@stp"}
  - p1: {t: cast, card: "@sol", alt_cost: null, pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_target, slot: 0, answer: "@vov"}
  - check:
      stack: [{kind: triggered, source: "@sol", controller: p1}]
      pending: {actor: p1, kind: priority}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 21
      battlefield: []
      exile: [Voice of Victory]
    p1:
      hand: [Swords to Plowshares]
      battlefield_contains: [{card: Solitude, controller: p1}]
      exile: []
notes: >
  Voice of Victory says "during your turn": on p1's own turn it does not apply. Control case for
  voice-of-victory-opponent-cannot-cast-on-controllers-turn. Both the hard cast and the evoke cast are separate legal
  actions (the evoke one names the white card to exile). p1 hard casts with five Plains, Solitude enters, its trigger
  targets Voice (chosen as the trigger goes on the stack) and exiles it; Voice's controller p0 gains 1 (Voice is 1/3).
  No evoke, so no sacrifice trigger. A wrong engine applies the restriction on every turn or to the wrong player.
