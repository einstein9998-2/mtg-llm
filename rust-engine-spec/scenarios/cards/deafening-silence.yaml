id: silence-limit-is-per-player
title: Under Deafening Silence each player has their own one-noncreature-spell allowance; the opponent can respond once but not twice
area: card
cards: [Deafening Silence, Plateau, Lightning Bolt, Swords to Plowshares, Ocelot Pride]
tags: [deafening-silence, spell-count, per-player, priority, stack]
derived_from: oracle
source:
  - {kind: oracle, card: Deafening Silence, text: "Each player can't cast more than one noncreature spell each turn.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt0"]
    battlefield: ["Deafening Silence @ds", "Plateau @a1", "Ocelot Pride @oc"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt1", "Swords to Plowshares @stp1"]
    battlefield: ["Plateau @b1", "Plateau @b2"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt0", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@bolt1", targets: [{player: p0}], pay: {tap: ["@b1"]}}
  - expect_illegal: {p1: {t: cast, card: "@stp1", targets: ["@oc"]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 17
      graveyard: [Lightning Bolt]
      battlefield_contains: [{card: Ocelot Pride}]
    p1:
      life: 17
      hand: [Swords to Plowshares]
      graveyard: [Lightning Bolt]
notes: >
  p0's Bolt does not use up p1's allowance: p1 may cast one noncreature spell (Bolt) in response. After that p1 holds
  priority again (117.3c) and a second noncreature spell (Swords on p0's Ocelot Pride, payable with p1's untapped
  Plateau) is illegal. p1's Bolt resolves first (p0 17), then p0's (p1 17). A wrong engine shares one count between
  the players or counts only the active player's spells.
