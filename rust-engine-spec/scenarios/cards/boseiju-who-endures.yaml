id: boseiju-legend-rule-second-copy
title: A second Boseiju (legendary land) played while one is controlled triggers the legend rule
area: card
cards: ["Boseiju, Who Endures"]
tags: [boseiju, legend-rule, land-play, state-based-actions]
derived_from: cr
source:
  - {kind: oracle, card: "Boseiju, Who Endures", text: "{T}: Add {G}.", verified: true}
  - {kind: cr, ref: "704.5j", text: "If two or more legendary permanents with the same name are controlled by the same player, that player chooses one of them, and the rest are put into their owners' graveyards.", verified: true}
  - {kind: cr, ref: "305.1", text: "Playing a land is a special action", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Boseiju, Who Endures @b2"]
    battlefield: ["Boseiju, Who Endures @b1"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: play_land, card: "@b2"}
  - p0: {decision: legend_rule, keep: "@b1", expect_options: {include: ["@b1", "@b2"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      lands_played: 1
      battlefield: [{card: "Boseiju, Who Endures", alias: b1}]
      graveyard: ["Boseiju, Who Endures"]
notes: >
  Boseiju is a Legendary Land (the deck plays one main and one side), so the legend rule applies to lands. The land
  play is legal (no rule forbids it); the controller then chooses which to keep. Keeping the old copy (@b1) pins that
  the choice is really offered and honored.
