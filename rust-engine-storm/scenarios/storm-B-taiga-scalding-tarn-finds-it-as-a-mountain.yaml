id: storm-b-taiga-scalding-tarn-finds-it-as-a-mountain
title: Scalding Tarn (Island or Mountain card) can find Taiga because Taiga has the Mountain subtype; Savannah and Forest are not found
area: card
cards: [Scalding Tarn, Taiga, Forest, Island, Volcanic Island, Underground Sea, Savannah, Mountain]
tags: [taiga, scalding-tarn, fetchland, search, basic-land-types, life-payment]
derived_from: oracle
source:
  - {kind: oracle, card: Scalding Tarn, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for an Island or Mountain card, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: cr, ref: "305.6", text: "An object with the land card type and a basic land type has the intrinsic ability “{T}: Add [mana symbol],” even if the text box doesn’t actually contain that text or the object has no text box.", verified: true}
  - {kind: cr, ref: "701.23a", text: "To search for a card in a zone, look at all cards in that zone (even if it’s a hidden zone) and find a card that matches the given description.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    lands_played: 1
    battlefield: ["Scalding Tarn @tarn"]
    library: ["Taiga @taiga", "Forest @for", "Island @isl", "Volcanic Island @vi", "Underground Sea @us", "Savannah @sav", "Mountain @mtn"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@tarn", ability: 0}
  - check:
      stack: [{kind: activated, source: "@tarn", controller: p0}]
      p0: {life: 19, graveyard: [Scalding Tarn], battlefield: []}
  - resolve_top: true
  - p0:
      decision: search
      found: "@taiga"
      expect_options:
        include: ["@taiga", "@isl", "@vi", "@us", "@mtn"]
        exclude: ["@for", "@sav"]
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 19
      lands_played: 1
      graveyard: [Scalding Tarn]
      battlefield: [{card: Taiga, tapped: false, subtypes: [Mountain, Forest]}]
      library_count: 16
notes: >
  "Island or Mountain card" is a subtype test, so Taiga (Mountain Forest) qualifies, as do Volcanic Island (Island
  Mountain) and Underground Sea (Island Swamp); Forest and Savannah (Forest Plains) have neither type. Taiga enters
  untapped and the land is put onto the battlefield, not played (lands_played stays 1). Library: 17 - 1 = 16.
