  - expect_illegal: {p0: {t: cast, card: "@b0", targets: [{player: p1}], pay: {tap: ["@mtn"]}}}
  - check:
      legal: {p0: {include: [{t: pass}], exclude: [{t: cast, card: "@b0"}]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@b1", targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
