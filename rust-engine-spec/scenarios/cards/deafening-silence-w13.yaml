id: deafening-silence-counts-spell-cast-before-it-entered
title: Casting Deafening Silence uses up its caster's noncreature spell for that turn
area: card
cards: [Deafening Silence, Lightning Bolt, Mountain, Plains]
tags: [deafening-silence, casting-restriction, spells-cast-this-turn, ruling-dependent]
derived_from: ruling
source:
  - {kind: oracle, card: Deafening Silence, text: "Each player can't cast more than one noncreature spell each turn.", verified: true}
  - {kind: ruling, card: Deafening Silence, text: "Deafening Silence looks at spells cast earlier in the turn, including itself, so a player who already cast a noncreature spell this turn can't cast another one after it enters.", verified: false, note: "recalled, not retrieved; the expectation also follows from a literal reading of the Oracle text (a second noncreature spell this turn would be more than one)"}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Deafening Silence @ds", "Lightning Bolt @bolt"]
    battlefield: ["Plains @pl", "Mountain @m"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@ds", pay: {tap: ["@pl"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@m"]}}}
  - check:
      legal: {p0: {exclude: [{t: cast, card: "@bolt"}]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Lightning Bolt]
      battlefield_contains: [{card: Deafening Silence}, {card: Mountain, tapped: false}]
      spells_cast_this_turn: 1
    p1: {life: 20}
notes: >
  Deafening Silence is itself a noncreature spell that p0 cast this turn. Once it is on the battlefield, Bolt would be
  p0's second noncreature spell this turn, so it is excluded. A wrong engine starts counting only when the enchantment
  enters. Listed under needs-verification (recalled ruling).
