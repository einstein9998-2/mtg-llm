id: hi-atraxa-reveal-picks-public-rest-random-bottom
title: Atraxa's reveal is public, the picked cards are known to both players, and the rest go to the bottom in an order nobody knows
area: hidden-info
cards: ["Atraxa, Grand Unifier", Omniscience, Veil of Summer, Aluren, Show and Tell, Force of Will, Lotus Petal, Hedge Maze, Brainstorm, Island, Tropical Island, Lightning Bolt, Volcanic Island]
tags: [hidden-info, reveal, atraxa, random-bottom, omniscience, library-knowledge]
derived_from: cr
source:
  - {kind: oracle, card: "Atraxa, Grand Unifier", text: "When Atraxa enters, reveal the top ten cards of your library. For each card type, you may put a card of that type from among the revealed cards into your hand. Put the rest on the bottom of your library in a random order.", verified: true}
  - {kind: oracle, card: Omniscience, text: "You may cast spells from your hand without paying their mana costs.", verified: true}
  - {kind: cr, ref: "701.20a", text: "To reveal a card, show that card to all players for a brief time.", verified: true}
  - {kind: cr, ref: "205.2a", text: "The card types are artifact, battle, conspiracy, creature, dungeon, enchantment, instant, kindred, land, phenomenon, plane, planeswalker, scheme, sorcery, and vanguard.", verified: true}
  - {kind: cr, ref: "701.24a", text: "To shuffle a library or a face-down pile of cards, randomize the cards within it so that no player knows their order.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: [Lightning Bolt]
    battlefield: ["Volcanic Island"]
    library_pad: 10
  p1:
    hand: ["Atraxa, Grand Unifier @atx", "Veil of Summer @veil"]
    battlefield: ["Omniscience @omni", "Island", "Tropical Island"]
    library: ["Aluren @c1", "Show and Tell @c2", "Force of Will @c3", "Lotus Petal @c4", "Hedge Maze @c5", "Brainstorm @c6", "Island", "Island", "Island", "Island"]
    library_pad: 10
random: any
script:
  - p1: {t: cast, card: "@atx", alt_cost: {free: omniscience}}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@atx", controller: p1}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_cards, purpose: atraxa_to_hand, answer: ["@c1", "@c2", "@c3", "@c4", "@c5"]}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p1:
      hand: [Veil of Summer, Aluren, Show and Tell, Force of Will, Lotus Petal, Hedge Maze]
      battlefield_contains: [{card: "Atraxa, Grand Unifier", sick: true}]
      library_count: 15
      library_bottom_multiset: [Brainstorm, Island, Island, Island, Island]
  - at: after_script
    observer: p0
    obs:
      opp: {hand_count: 6, revealed_hand: [Aluren, Show and Tell, Force of Will, Lotus Petal, Hedge Maze], library_count: 15}
      option_labels_exclude_names: [Veil of Summer]
      events_text_exclude: [Veil of Summer]
  - at: after_script
    observer: p1
    obs:
      me: {library_known_top: [], library_known_bottom: []}
notes: >
  Atraxa (from Omniscience, no mana) resolves and its ETB trigger goes on the stack. On resolution the top ten are revealed to
  both players. One card per card type: Aluren (enchantment), Show and Tell (sorcery), Force of Will (instant), Lotus Petal
  (artifact), Hedge Maze (land); no creature was revealed, and Brainstorm cannot also be taken because Force of Will already
  used the instant slot. Brainstorm and the four Islands go to the bottom in a random order, so only the bottom multiset is
  asserted. The picks were revealed while they moved to hand, so p0 knows them (doc 02 section 6: revealed cards keep
  known_to = both); Veil of Summer was never revealed and must stay hidden. Hand 2 -> 1 -> 6, library 20 -> 15.
