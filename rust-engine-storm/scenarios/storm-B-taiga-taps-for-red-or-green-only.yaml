id: storm-b-taiga-taps-for-red-or-green-only
title: Taiga (Mountain Forest) taps for {R} or {G} chosen at activation, and for nothing else
area: card
cards: [Taiga, Mountain, Forest]
tags: [taiga, dual-land, basic-land-types, intrinsic-mana-ability, colour-choice, mana-ability]
derived_from: oracle
source:
  - {kind: oracle, card: Taiga, text: "{T}: Add {R} or {G}.", verified: true}
  - {kind: cr, ref: "305.6", text: "An object with the land card type and a basic land type has the intrinsic ability “{T}: Add [mana symbol],” even if the text box doesn’t actually contain that text or the object has no text box.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Taiga @t1", "Taiga @t2"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      p0:
        battlefield_contains: [{card: Taiga, types: [Land], subtypes: [Mountain, Forest]}]
      legal:
        p0:
          include:
            - {t: activate, source: "@t1", ability: 0, choose_color: R}
            - {t: activate, source: "@t1", ability: 0, choose_color: G}
          exclude:
            - {t: activate, source: "@t1", ability: 0, choose_color: U}
            - {t: activate, source: "@t1", ability: 0, choose_color: B}
            - {t: activate, source: "@t1", ability: 0, choose_color: W}
  - expect_illegal: {p0: {t: activate, source: "@t1", ability: 0, choose_color: U}}
  - p0: {t: activate, source: "@t1", ability: 0, choose_color: R}
  - check:
      p0: {mana_pool: {R: 1}}
  - p0: {t: activate, source: "@t2", ability: 0, choose_color: G}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      mana_pool: {R: 1, G: 1}
      battlefield: [{card: Taiga, tapped: true}, {card: Taiga, tapped: true}]
notes: >
  Taiga has the land types Mountain and Forest, hence the intrinsic abilities {T}: Add {R} and {T}: Add {G} (CR 305.6);
  it has no text of its own. Each tap makes exactly one mana of the colour chosen at activation; blue, black, white and
  colourless are not offered. Two Taigas give {R}{G} in the pool.
