id: shallow-grave-exiles-the-creature-at-the-next-end-step
title: The creature returned by Shallow Grave is exiled by a delayed trigger at the beginning of the next end step
area: card
cards: [Shallow Grave, Griselbrand, Swamp, Island]
tags: [shallow-grave, delayed-trigger, end-step, exile]
derived_from: oracle
source:
  - {kind: oracle, card: Shallow Grave, text: "Exile it at the beginning of the next end step.", verified: true}
  - {kind: cr, ref: "603.7c", text: "A delayed triggered ability that refers to a particular object still affects it even if the object changes characteristics.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main2
  p0:
    hand: ["Shallow Grave @sg"]
    battlefield: ["Swamp @s1", "Swamp @s2"]
    graveyard: ["Griselbrand @g"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@sg", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, controller: p0}]
      p0: {battlefield_contains: [{card: Griselbrand}]}
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: [Griselbrand]
      graveyard: [Shallow Grave]
      battlefield:
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: true}
notes: >
  Cast in main2 so no combat decision intervenes. At the beginning of p0's end step the delayed trigger goes on the
  stack before p0 receives priority (the advance stops there with the trigger on the stack). After it resolves,
  Griselbrand is in exile, not the graveyard. Wrong engines: exile immediately, at cleanup, or not at all; or move it
  to the graveyard.
