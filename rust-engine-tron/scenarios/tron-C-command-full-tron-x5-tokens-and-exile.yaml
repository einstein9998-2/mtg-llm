notes: >
  Cost {X}{C}{C} with X = 5 is seven colorless mana: exactly what the three Tron lands make (3 + 2 + 2). The engine
  must tap all three. Modes are listed in printed order (1 = tokens, 3 = exile) and targets in the order of the modes
  (a player, then the creature). Faerie Macabre has mana value 3, at most X = 5. A wrong engine charges X wrongly
  (X as 0 or 1), makes tokens for the wrong player or in the wrong number, or exiles to the graveyard.
