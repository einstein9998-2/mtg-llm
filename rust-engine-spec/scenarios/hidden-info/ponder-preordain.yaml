id: hi-preordain-bottomed-card-and-drawn-card-hidden-from-opponent
title: Preordain bottoming one card and drawing the other leaves no known top card and nothing visible to the opponent
area: hidden-info
cards: [Preordain, Daze, Lightning Bolt, Volcanic Island, Aluren, Tropical Island]
tags: [hidden-info, preordain, scry, bottom, redaction]
derived_from: cr
source:
  - {kind: oracle, card: Preordain, text: "Scry 2, then draw a card.", verified: true}
  - {kind: cr, ref: "701.22a", text: "To \"scry N\" means to look at the top N cards of your library, then put any number of them on the bottom of your library in any order and the rest on top of your library in any order.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Preordain @pre"]
    battlefield: ["Volcanic Island @v"]
    library: ["Daze @a", "Lightning Bolt @b"]
    library_pad: 10
  p1:
    hand: [Aluren]
    battlefield: ["Tropical Island"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@pre", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: scry, to_bottom: ["@a"], on_top_order: ["@b"]}
expect:
  - at: after_script
    stack: []
    p0: {hand: [Lightning Bolt], library_bottom: [Daze], library_count: 11}
  - at: after_script
    observer: p0
    obs:
      me: {library_known_top: [], library_known_bottom: [Daze]}
  - at: after_script
    observer: p1
    obs:
      opp: {hand_count: 1, library_count: 11}
      option_labels_exclude_names: [Daze, Lightning Bolt]
      events_text_exclude: [Daze, Lightning Bolt]
notes: >
  Daze goes under the ten padding Islands; Bolt is drawn. The caster knows Daze is the bottom card (library_known_bottom,
  SCHEMA addenda; added at review) but knows nothing about the new top.
  The opponent sees that p0 scried 2 and drew a card, never the identities of the two cards.
