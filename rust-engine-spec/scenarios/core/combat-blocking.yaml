  - expect_illegal: {p1: {decision: declare_blockers, blocks: [{blocker: "@priest", attacker: "@gob"}]}}
  - p1: {decision: declare_blockers, blocks: [], expect_options: {include: ["@skel"], exclude: ["@priest"]}}
  - p0: {t: pass}
