cards: [Daze, Volcanic Island, Stock Up, Island, Tropical Island, Hedge Maze]
tags: [matchup, daze, counter-unless-pay, yes-no]
derived_from: oracle
source:
  - {kind: oracle, card: Daze, text: "Counter target spell unless its controller pays {1}.", verified: true}
  - {kind: cr, ref: "701.6a", text: "A countered spell is put into its owner's graveyard.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Daze @daze"]
    battlefield: ["Volcanic Island @volc"]
    library_pad: 10
  p1:
    hand: ["Stock Up @su"]
    battlefield: ["Island @i", "Tropical Island @t", "Hedge Maze @hm", "Island @spare"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@su", pay: {tap: ["@i", "@t", "@hm"]}}
  - p1: {t: pass}
  - p0: {t: cast, card: "@daze", alt_cost: {return_island: "@volc"}, targets: ["@su"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: yes_no, purpose: pay_for_daze, answer: false, expect_options: {include: [true, false]}}
expect:
