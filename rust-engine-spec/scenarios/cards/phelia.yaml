id: phelia-flicker-opponents-creature-resets-counters-no-counter-for-phelia
title: Phelia's attack exiles an opponent's creature with counters; it returns at the end step as a new object without counters and Phelia gets no counter
area: card
cards: ["Phelia, Exuberant Shepherd", Ocelot Pride]
tags: [phelia, flicker, new-object, counters, delayed-trigger, attack-trigger, owner-control]
derived_from: cr
source:
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "Whenever Phelia attacks, exile up to one other target nonland permanent. At the beginning of the next end step, return that card to the battlefield under its owner's control. If it entered under your control, put a +1/+1 counter on Phelia.", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
  - {kind: cr, ref: "603.7a", text: "Delayed triggered abilities are created during the resolution of spells or abilities", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
  p1:
    battlefield: [{card: Ocelot Pride, as: op, counters: {"+1/+1": 2}}]
    library_pad: 10
script:
  - check:
      p1: {battlefield: [{card: Ocelot Pride, pt: [3, 3]}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@ph", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: "@op"}
  - check:
      stack: [{kind: triggered, source: "@ph", controller: p0}]
      pending: {actor: p0, kind: priority}
  - resolve_top: true
  - check:
      phase: declare_attackers
      p1: {battlefield: [], exile: [Ocelot Pride]}
  - advance: {to: end, of: p0}
  - check:
      p1: {life: 18}
      stack: [{kind: triggered, source: "@ph", controller: p0}]
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: "Phelia, Exuberant Shepherd", tapped: true, counters: {}, pt: [2, 2]}]
    p1:
      life: 18
      exile: []
      battlefield: [{card: Ocelot Pride, controller: p1, counters: {}, pt: [1, 1], tapped: false}]
notes: >
  The exiled Ocelot Pride returns as a new object (400.7): the two +1/+1 counters are gone, so it is a 1/1. It returns
  under its owner p1's control, so the "if it entered under your control" clause is false and Phelia gets no counter.
  With Ocelot exiled before blocks, p1 has no creature, so no declare_blockers decision is raised and Phelia deals 2
  (p1 18). The delayed trigger is put on the stack at the beginning of p0's end step, where the advance stops (Ocelot's
  own end-step ability is for its controller's end step, not this one). A wrong engine keeps the counters, returns the
  card under Phelia's controller, or gives Phelia the counter anyway.
---
id: phelia-flicker-own-permanent-resets-it-and-gives-phelia-a-counter
title: Phelia exiling her controller's own Aether Vial returns it with no charge counters and puts a +1/+1 counter on Phelia
area: card
cards: ["Phelia, Exuberant Shepherd", Aether Vial, Plains]
tags: [phelia, flicker, new-object, counters, delayed-trigger, attack-trigger, targeting]
derived_from: cr
source:
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "Whenever Phelia attacks, exile up to one other target nonland permanent. At the beginning of the next end step, return that card to the battlefield under its owner's control. If it entered under your control, put a +1/+1 counter on Phelia.", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phelia, Exuberant Shepherd @ph", {card: Aether Vial, as: vial, counters: {charge: 2}}, "Plains @pl"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@ph", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: "@vial", expect_options: {include: ["@vial"], exclude: ["@ph", "@pl"]}}
  - resolve_top: true
  - check:
      p0: {exile: [Aether Vial]}
  - advance: {to: end, of: p0}
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: []
      battlefield:
        - {card: "Phelia, Exuberant Shepherd", tapped: true, counters: {"+1/+1": 1}, pt: [3, 3]}
        - {card: Aether Vial, tapped: false, counters: {}}
        - {card: Plains, tapped: false}
    p1:
      life: 18
notes: >
  The target must be another nonland permanent: Phelia herself and the Plains are not offered. The Vial is owned by
  p0, so it returns under p0's control, the same player who controls Phelia: Phelia gets a +1/+1 counter (3/3). The
  returned Vial is a new object without its two charge counters. Combat damage happened before the counter, so p1
  took 2 (p1 18).
