id: massacre-free-when-opponent-has-plains-and-caster-has-swamp
title: Massacre is cast without paying its mana cost (opponent controls a Plains, caster a Swamp) and gives all creatures -2/-2
area: card
cards: [Massacre, Swamp, Orcish Bowmasters, Plains, "Phelia, Exuberant Shepherd", Quantum Riddler]
tags: [massacre, alternative-cost, free-cast, sweeper, until-end-of-turn, state-based-actions]
derived_from: oracle
source:
  - {kind: oracle, card: Massacre, text: "If an opponent controls a Plains and you control a Swamp, you may cast this spell without paying its mana cost.", verified: true}
  - {kind: oracle, card: Massacre, text: "All creatures get -2/-2 until end of turn.", verified: true}
  - {kind: cr, ref: "704.5f", text: "If a creature has toughness 0 or less, it's put into its owner's graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Massacre @ma"]
    battlefield: [{card: Swamp, as: s1, tapped: true}, "Orcish Bowmasters @ob"]
    library_pad: 10
  p1:
    battlefield: ["Plains @pl", "Phelia, Exuberant Shepherd @ph", "Quantum Riddler @qr"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ma", alt_cost: {free: true}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Massacre, Orcish Bowmasters]
      battlefield: [{card: Swamp, tapped: true}]
    p1:
      graveyard: ["Phelia, Exuberant Shepherd"]
      battlefield:
        - {card: Plains}
        - {card: Quantum Riddler, pt: [2, 4]}
notes: >
  No mana is spent (the only Swamp is already tapped). Every creature gets -2/-2, the caster's own included: Bowmasters
  (1/1) and Phelia (2/2) die to state-based actions, Quantum Riddler (4/6) is 2/4. The alt_cost key `free: true` is the
  SCHEMA addenda spelling for the card's own "without paying its mana cost" permission.
---
id: massacre-free-with-nonbasic-plains-and-swamp-types
title: Massacre's free cast counts land subtypes on nonbasic lands (Scrubland is a Plains, Underground Sea a Swamp)
area: card
cards: [Massacre, Underground Sea, Scrubland, "Phelia, Exuberant Shepherd"]
tags: [massacre, alternative-cost, land-subtypes, free-cast]
derived_from: oracle
source:
  - {kind: oracle, card: Massacre, text: "If an opponent controls a Plains and you control a Swamp, you may cast this spell without paying its mana cost.", verified: true}
  - {kind: oracle, card: Scrubland, text: "({T}: Add {W} or {B}.)", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Massacre @ma"]
    battlefield: [{card: Underground Sea, as: u1, tapped: true}]
    library_pad: 10
  p1:
    battlefield: ["Scrubland @sc", "Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ma", alt_cost: {free: true}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Massacre], battlefield: [{card: Underground Sea, tapped: true}]}
    p1: {graveyard: ["Phelia, Exuberant Shepherd"], battlefield: [{card: Scrubland}]}
notes: >
  Scrubland's type line is "Land — Plains Swamp" and Underground Sea's is "Land — Island Swamp" (reference/oracle.json),
  so both halves of the condition hold although neither land is basic. A wrong engine checks names or basic lands only.
