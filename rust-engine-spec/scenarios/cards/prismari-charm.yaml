id: prismari-charm-mode-two-resolves-for-the-remaining-target-when-one-target-is-gone
title: Prismari Charm mode 2 still hits its other target when one of its two targets was killed in response
area: card
cards: [Prismari Charm, Lightning Bolt, Dragon's Rage Channeler, Island, Mountain]
tags: [prismari-charm, lightning-bolt, partial-fizzle, target-legality, stack, response]
derived_from: cr
source:
  - {kind: oracle, card: Prismari Charm, text: "Prismari Charm deals 1 damage to each of one or two targets.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word \"target,\" are now illegal, the spell or ability doesn't resolve.", verified: true}
  - {kind: cr, ref: "608.2b", text: "Illegal targets, if any, won't be affected by parts of a resolving spell's effect for which they're illegal. Other parts of the effect for which those targets are not illegal may still affect them.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Prismari Charm @charm", "Lightning Bolt @bolt"]
    battlefield: ["Island @i1", "Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    battlefield: ["Dragon's Rage Channeler @drc"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@charm", modes: [2], targets: ["@drc", {player: p1}], pay: auto}
  - p0: {t: cast, card: "@bolt", targets: ["@drc"], pay: auto}
  - check:
      stack: [{kind: spell, card: "@charm"}, {kind: spell, card: "@bolt"}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: spell, card: "@charm"}]
      pending: {actor: p0, kind: priority}
      p1: {graveyard: [Dragon's Rage Channeler], life: 20}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Lightning Bolt, Prismari Charm]}
    p1: {life: 19, graveyard: [Dragon's Rage Channeler]}
notes: >
  Bolt (cast last) resolves first and kills the channeler. When the Charm then resolves, one of its two targets is illegal but the player target is still
  legal, so the Charm resolves normally for the remaining target (608.2b: it only fizzles if all targets are illegal): p1 goes to 19. A wrong engine counters
  the whole Charm because one target is gone.
