script:
  - check:
      p1: {battlefield: [{card: Murktide Regent, pt: [5, 5]}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {command: [{dungeon: Lost Mine of Phandelver, room: Fungi Cavern}], completed_dungeons: []}
      p1: {battlefield: [{card: Murktide Regent, pt: [1, 5], counters: {"+1/+1": 2}}]}
  - advance: {to: main1, of: p1}
  - check:
      turn: 5
      p1: {battlefield: [{card: Murktide Regent, pt: [1, 5]}]}
  - advance: {to: begin_combat, of: p1}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: declare_attackers, attacks: [{creature: "@murk", target: {player: p0}}]}
