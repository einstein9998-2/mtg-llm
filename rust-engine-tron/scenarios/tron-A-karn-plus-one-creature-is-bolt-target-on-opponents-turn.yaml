id: tron-a-karn-plus-one-creature-is-bolt-target-on-opponents-turn
title: "The artifact Karn animated is still a creature during the opponent's turn, so Lightning Bolt kills Voltaic Key (1/1) there"
area: card
cards: ["Karn, the Great Creator", Voltaic Key, Lightning Bolt, Mountain]
tags: [karn-the-great-creator, loyalty-ability, becomes-creature, duration, until-your-next-turn, lightning-bolt, damage, tron]
derived_from: oracle
source:
  - {kind: oracle, card: "Karn, the Great Creator", text: "Until your next turn, up to one target noncreature artifact becomes an artifact creature with power and toughness each equal to its mana value.", verified: true}
  - {kind: cr, ref: "704.5g", text: "If a creature has toughness greater than 0, it has damage marked on it, and the total damage marked on it is greater than or equal to its toughness, that creature has been dealt lethal damage and is destroyed.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as “until end of turn”).", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: [{card: "Karn, the Great Creator", as: karn, counters: {loyalty: 4}}, "Voltaic Key @key"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @mt"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@karn", ability: 0, targets: ["@key"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - advance: {to: begin_combat, of: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: []}
  - advance: {to: main1, of: p1}
  - check:
      turn: 4
      p0: {battlefield_contains: [{card: Voltaic Key, types: [Artifact, Creature], pt: [1, 1]}]}
  - p1: {t: cast, card: "@bolt", targets: ["@key"], pay: {tap: ["@mt"]}}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    turn: 4
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      graveyard: [Voltaic Key]
      battlefield: [{card: "Karn, the Great Creator", counters: {loyalty: 5}}]
    p1:
      graveyard: [Lightning Bolt]
notes: >
  "Until your next turn" means the effect lasts through p1's whole turn 4: the Key is a 1/1 artifact creature there and
  Bolt (3 damage) is lethal. The Key is a legal Bolt target only because it is a creature. p0 declares no attackers
  (the Key could attack). A wrong engine ends the effect at end of turn, as for "until end of turn".
