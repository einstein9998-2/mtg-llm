id: mu-charm-bounces-omniscience-in-upkeep
title: Bouncing Omniscience in the Alurentell upkeep leaves Atraxa uncastable that main phase
area: matchup
cards: [Prismari Charm, Omniscience, "Atraxa, Grand Unifier", Volcanic Island, Island, Tropical Island, Hedge Maze]
tags: [matchup, prismari-charm, bounce, omniscience, legal-actions, upkeep]
derived_from: oracle
source:
  - {kind: oracle, card: Prismari Charm, text: "Return target nonland permanent to its owner's hand.", verified: true}
  - {kind: oracle, card: Omniscience, text: "You may cast spells from your hand without paying their mana costs.", verified: true}
  - {kind: cr, ref: "601.2h", text: "Partial payments are not allowed. Unpayable costs can't be paid.", verified: true}
setup:
  turn: 4
  active: p1
  phase: upkeep
  p0:
    hand: ["Prismari Charm @charm"]
    battlefield: ["Volcanic Island", "Volcanic Island"]
    library_pad: 10
  p1:
    hand: ["Atraxa, Grand Unifier @atx"]
    battlefield: ["Omniscience @omni", "Island", "Tropical Island", "Hedge Maze"]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: cast, card: "@charm", modes: [3], targets: ["@omni"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - advance: {to: main1, of: p1}
expect:
  - at: after_script
    phase: main1
    pending: {actor: p1, kind: priority}
    p1: {hand: ["Atraxa, Grand Unifier", Omniscience, Island], battlefield: [{card: Island}, {card: Tropical Island}, {card: Hedge Maze}]}
    p0: {graveyard: [Prismari Charm]}
    legal:
      p1:
        include: [{t: pass}]
        exclude: [{t: cast, card: "@atx"}, {t: cast, card: "@omni"}]
notes: >
  p1 passes in its upkeep; p0 casts the Charm (mode 3) on Omniscience, which returns to hand. p1 draws a padding Island.
  In main1 p1 has three lands (four after a land drop): Atraxa ({3}{G}{W}{U}{B}) and Omniscience (ten mana) are
  unpayable, so neither cast is offered.
