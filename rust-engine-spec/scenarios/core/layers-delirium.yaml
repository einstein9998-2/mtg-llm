id: delirium-drc-turns-on-when-instant-reaches-graveyard
title: Dragon's Rage Channeler becomes a 3/3 flyer as soon as a resolving Lightning Bolt becomes the fourth card type in the graveyard
area: core
cards: ["Dragon's Rage Channeler", Lightning Bolt, Island, Ponder, "Mishra's Bauble", Containment Priest, Mountain]
tags: [layers, layer-6, layer-7c, delirium, static-ability, surveil]
derived_from: cr
source:
  - {kind: oracle, card: "Dragon's Rage Channeler", text: "Delirium — As long as there are four or more card types among cards in your graveyard, this creature gets +2/+2, has flying, and attacks each combat if able.", verified: true}
  - {kind: oracle, card: "Dragon's Rage Channeler", text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: cr, ref: "611.3a", text: "A continuous effect generated by a static ability isn't \"locked in\"; it applies at any given moment to whatever its text indicates.", verified: true}
  - {kind: cr, ref: "205.2a", text: "The card types are artifact, battle, conspiracy, creature, dungeon, enchantment, instant, kindred, land, phenomenon, plane, planeswalker, scheme, sorcery, and vanguard.", verified: true}
  - {kind: cr, ref: "207.2c", text: "Ability words are similar to keywords in that they tie together cards that have similar functionality, but they have no special rules meaning", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Dragon's Rage Channeler @drc", "Mountain @m"]
    graveyard: ["Island", "Ponder", "Mishra's Bauble"]
    library: ["Containment Priest @cp"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: [], on_top_order: ["@cp"]}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0}]
      p0: {battlefield_contains: [{card: "Dragon's Rage Channeler", pt: [1, 1], keywords_exclude: [flying]}]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains: [{card: "Dragon's Rage Channeler", pt: [3, 3], keywords: [flying]}]
      graveyard: [Island, Ponder, "Mishra's Bauble", Lightning Bolt]
      library_top: [Containment Priest]
    p1: {life: 17}
notes: >
  Land, sorcery and artifact are three types; Bolt on the stack is not in the graveyard, so DRC stays 1/1 until Bolt
  resolves and is put into the graveyard (instant = fourth type). Delirium is an ability word with no rules meaning of
  its own; the condition is in the text. Its effects are a layer 7c +2/+2 and a layer 6 flying grant, both applying
  only while the condition holds. A wrong engine counts the spell on the stack, or counts cards rather than types.
---
id: delirium-lost-when-murktide-delves-the-graveyard
title: Exiling graveyard cards to delve for Murktide Regent turns off Dragon's Rage Channeler's delirium at once
area: core
cards: ["Dragon's Rage Channeler", Murktide Regent, Lightning Bolt, Ponder, Island, "Mishra's Bauble"]
tags: [layers, delirium, delve, enters-with-counters]
derived_from: cr
source:
  - {kind: oracle, card: "Dragon's Rage Channeler", text: "Delirium — As long as there are four or more card types among cards in your graveyard, this creature gets +2/+2, has flying, and attacks each combat if able.", verified: true}
  - {kind: oracle, card: "Dragon's Rage Channeler", text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: oracle, card: Murktide Regent, text: "This creature enters with a +1/+1 counter on it for each instant and sorcery card exiled with it.", verified: true}
  - {kind: cr, ref: "702.66a", text: "\"Delve\" means \"For each generic mana in this spell's total cost, you may exile a card from your graveyard rather than pay that mana.\"", verified: true}
  - {kind: cr, ref: "611.3a", text: "A continuous effect generated by a static ability isn't \"locked in\"; it applies at any given moment to whatever its text indicates.", verified: true}
setup:
  turn: 6
  active: p0
  phase: main1
  p0:
    hand: ["Murktide Regent @mk"]
    battlefield: ["Dragon's Rage Channeler @drc", "Island @i1", "Island @i2", "Island @i3"]
    graveyard: ["Lightning Bolt @g1", "Ponder @g2", "Island @g3", "Mishra's Bauble @g4"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      p0: {battlefield_contains: [{card: "Dragon's Rage Channeler", pt: [3, 3], keywords: [flying]}]}
  - p0: {t: cast, card: "@mk", delve: ["@g1", "@g2", "@g3", "@g4"], pay: auto}
  - check:
      stack: [{kind: spell, card: "@mk", controller: p0}]
      p0:
        graveyard: []
        battlefield_contains: [{card: "Dragon's Rage Channeler", pt: [1, 1], keywords_exclude: [flying]}]
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains:
        - {card: "Dragon's Rage Channeler", pt: [1, 1], keywords_exclude: [flying]}
        - {card: Murktide Regent, counters: {"+1/+1": 2}, pt: [5, 5]}
      exile: [Lightning Bolt, Ponder, Island, "Mishra's Bauble"]
notes: >
  Delve exiles the cards as a cost while casting, so the graveyard is empty when p0 next gets priority and DRC is a
  1/1 without flying. Murktide is a creature spell, so DRC's surveil does not trigger (only one object on the stack).
  Murktide gets 2 counters (Bolt and Ponder). A wrong engine caches delirium until something resolves, or triggers DRC
  on a creature spell.
---
id: delirium-drc-must-attack-when-able
title: With delirium, Dragon's Rage Channeler must be declared as an attacker
area: core
cards: ["Dragon's Rage Channeler", Lightning Bolt, Ponder, Island, "Mishra's Bauble"]
tags: [layers, delirium, attack-requirement, combat, rule-modification]
derived_from: cr
source:
  - {kind: oracle, card: "Dragon's Rage Channeler", text: "Delirium — As long as there are four or more card types among cards in your graveyard, this creature gets +2/+2, has flying, and attacks each combat if able.", verified: true}
  - {kind: cr, ref: "508.1d", text: "If the number of requirements that are being obeyed is fewer than the maximum possible number of requirements that could be obeyed without disobeying any restrictions, the declaration of attackers is illegal.", verified: true}
  - {kind: cr, ref: "613.11", text: "Some continuous effects affect game rules rather than objects. For example, effects may modify a player's maximum hand size, or say that a creature must attack this turn if able.", verified: true}
setup:
  turn: 6
  active: p0
  phase: begin_combat
  priority: p0
  p0:
    battlefield: ["Dragon's Rage Channeler @drc"]
    graveyard: ["Lightning Bolt", "Ponder", "Island", "Mishra's Bauble"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: declare_attackers, attacks: []}}
  - p0: {decision: declare_attackers, attacks: [{creature: "@drc", target: {player: p1}}]}
expect:
  - at: after_script
    phase: declare_attackers
    pending: {actor: p0, kind: priority}
    p0: {battlefield: [{card: "Dragon's Rage Channeler", tapped: true, pt: [3, 3], keywords: [flying]}]}
notes: >
  Four card types in the graveyard: DRC has the requirement "attacks each combat if able"; it is untapped and not
  summoning sick, so declaring no attackers obeys fewer requirements than possible and is illegal (508.1d). A wrong
  engine treats the requirement as advice.
---
