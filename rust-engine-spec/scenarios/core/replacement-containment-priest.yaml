id: containment-priest-and-spider-woman-same-creature-is-exiled
title: When Containment Priest and Spider-Woman both apply to a creature entering from Show and Tell, it ends up exiled either way
area: core
cards: [Containment Priest, "Spider-Woman, Stunning Savior", Show and Tell, "Atraxa, Grand Unifier", Island]
tags: [replacement-effect, replacement-ordering, containment-priest, spider-woman, show-and-tell]
derived_from: cr
source:
  - {kind: cr, ref: "616.1", text: "If two or more replacement and/or prevention effects are attempting to modify the way an event affects an object or player, the affected object's controller (or its owner if it has no controller) or the affected player chooses one to apply", verified: true}
  - {kind: cr, ref: "616.1e", text: "Any of the applicable replacement and/or prevention effects may be chosen.", verified: true}
  - {kind: cr, ref: "616.1f", text: "Once the chosen effect has been applied, this process is repeated (taking into account only replacement or prevention effects that would now be applicable) until there are no more left to apply.", verified: true}
  - {kind: oracle, card: Containment Priest, text: "If a nontoken creature would enter and it wasn't cast, exile it instead.", verified: true}
  - {kind: oracle, card: "Spider-Woman, Stunning Savior", text: "Venom Blast — Artifacts and creatures your opponents control enter tapped.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Show and Tell @snt", "Atraxa, Grand Unifier @atx"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library_pad: 15
  p1:
    hand: ["Island @pi"]
    battlefield: ["Containment Priest @cp", "Spider-Woman, Stunning Savior @sw"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@snt", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: simultaneous_secret_choice, answer: "@atx"}
  - p1: {decision: simultaneous_secret_choice, answer: null}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: ["Atraxa, Grand Unifier"]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}, {card: Island, tapped: true}]
notes: >
  Both effects want to modify Atraxa's entry. Per 616.1 the affected object's controller, or its owner if it has no
  controller (Atraxa is a card in hand, so its owner p0), chooses which applies first. If Spider-Woman's applies first (enter tapped), the Priest's still applies to the
  modified event and exiles Atraxa; if the Priest's applies first, the event becomes an exile and Spider-Woman's no
  longer applies (616.1f). Both orders give the same result, so per the SCHEMA addenda (trivial order_replacements is
  not raised when every order gives the same final state) the script has no ordering step and asserts only the final
  state.
---
