id: hi-preordain-both-on-top-knows-remaining-card
title: Preordain keeping both cards on top leaves the caster knowing the card under the one drawn
area: hidden-info
cards: [Preordain, Daze, Lightning Bolt, Volcanic Island, Aluren, Tropical Island]
tags: [hidden-info, preordain, scry, library-knowledge]
derived_from: cr
source:
  - {kind: oracle, card: Preordain, text: "Scry 2, then draw a card.", verified: true}
  - {kind: cr, ref: "701.22a", text: "To \"scry N\" means to look at the top N cards of your library, then put any number of them on the bottom of your library in any order and the rest on top of your library in any order.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Preordain @pre"]
    battlefield: ["Volcanic Island @v"]
    library: ["Daze @a", "Lightning Bolt @b"]
    library_pad: 10
  p1:
    hand: [Aluren]
    battlefield: ["Tropical Island"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@pre", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: scry, to_bottom: [], on_top_order: ["@b", "@a"]}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {hand: [Lightning Bolt], graveyard: [Preordain], library_top: [Daze], library_count: 11}
  - at: after_script
    observer: p0
    obs:
      me: {library_known_top: [Daze]}
  - at: after_script
    observer: p1
    obs:
      opp: {hand_count: 1, library_count: 11}
      events_text_exclude: [Daze, Lightning Bolt]
notes: >
  p0 scries Bolt over Daze, then draws Bolt; Daze is now the known top card. p1 learns only that p0 scried 2 and drew.
