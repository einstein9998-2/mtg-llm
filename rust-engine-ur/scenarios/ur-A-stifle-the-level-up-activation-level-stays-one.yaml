id: ur-a-stifle-the-level-up-activation-level-stays-one
title: "Stifle on the Level 2 activation: the mana is spent, the level stays 1, and Level 2 can be activated again"
area: card
cards: ["Stormchaser's Talent", Island, Lightning Bolt, Stifle]
tags: [stormchasers-talent, class, level-up, stifle, counter-ability, no-refund, ur-alternate]
derived_from: oracle
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: oracle, card: "Stormchaser's Talent", text: "{3}{U}: Level 2", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: cr, ref: "701.6b", text: "The player who cast a countered spell or activated a countered ability doesn’t get a “refund” of any costs that were paid.", verified: true}
  - {kind: cr, ref: "716.2a", text: "This Class’s level becomes N. Activate only if this Class is level N-1 and only as a sorcery", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield:
      - {card: "Stormchaser's Talent", as: talent, counters: {level: 1}}
      - "Island @i1"
      - "Island @i2"
      - "Island @i3"
      - "Island @i4"
      - "Island @i5"
      - "Island @i6"
      - "Island @i7"
      - "Island @i8"
    graveyard: ["Lightning Bolt @bolt"]
    library_pad: 10
  p1:
    hand: ["Stifle @stifle"]
    battlefield: ["Island @j1"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@talent", ability: 0, pay: {tap: ["@i1", "@i2", "@i3", "@i4"]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stifle", targets: [{ability_of: "@talent", nth: 0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - label: after-stifle
    check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0:
        battlefield_contains: [{card: "Stormchaser's Talent", counters: {level: 1}}]
        graveyard: [Lightning Bolt]
      legal: {p0: {include: [{t: activate, source: "@talent", ability: 0}], exclude: [{t: activate, source: "@talent", ability: 1}]}}
  - p0: {t: activate, source: "@talent", ability: 0, pay: {tap: ["@i5", "@i6", "@i7", "@i8"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@bolt"}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Lightning Bolt]
      graveyard: []
      battlefield_contains: [{card: "Stormchaser's Talent", counters: {level: 2}}]
    p1:
      graveyard: [Stifle]
notes: >
  The level change belongs to the activated ability's effect, so Stifling the ability leaves the Class at level 1 and the
  four Islands tapped (701.6b); with four more Islands the Talent can be levelled again, this time unopposed. A wrong
  engine raises the level at activation (so the countered ability still levels) or refuses a second try.
