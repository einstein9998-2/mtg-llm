id: hi-mask-show-and-tell-options-chooser-eligible-cards-only
title: The Show and Tell choice offers each of the chooser's artifact, creature, enchantment and land cards plus nothing
area: hidden-info
cards: [Show and Tell, Omniscience, Force of Will, Murktide Regent, "Mishra's Bauble", Cori-Steel Cutter, Volcanic Island, Lightning Bolt, Island, Tropical Island, Hedge Maze]
tags: [hidden-info, show-and-tell, mask-validity, simultaneous-secret-choice]
derived_from: oracle
source:
  - {kind: oracle, card: Show and Tell, text: "Each player may put an artifact, creature, enchantment, or land card from their hand onto the battlefield.", verified: true}
  - {kind: cr, ref: "101.4a", text: "If an effect has each player choose a card in a hidden zone, such as their hand or library, those cards may remain face down as they're chosen.", verified: true}
  - {kind: cr, ref: "301.5b", text: "Equipment spells are cast like other artifact spells. Equipment enter the battlefield like other artifacts. They don't enter the battlefield attached to a creature.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Murktide Regent @mk", "Mishra's Bauble @bb", "Cori-Steel Cutter @cut", "Volcanic Island @hv", "Lightning Bolt @bolt"]
    library_pad: 10
  p1:
    hand: ["Show and Tell @st", "Omniscience @omni", "Force of Will @fow"]
    battlefield: ["Island", "Tropical Island", "Hedge Maze"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@st", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - label: p1-picked
    p1: {decision: simultaneous_secret_choice, answer: "@omni"}
  - p0:
      decision: simultaneous_secret_choice
      answer: "@cut"
      expect_options: {include: ["@mk", "@bb", "@cut", "@hv", null], exclude: ["@bolt"], count: 5}
expect:
  - at: p1-picked
    observer: p0
    obs:
      option_labels_exclude_names: [Omniscience, Force of Will]
      events_text_exclude: [Omniscience, Force of Will]
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      hand: [Murktide Regent, "Mishra's Bauble", Volcanic Island, Lightning Bolt]
      battlefield: [{card: Cori-Steel Cutter, controller: p0}]
      lands_played: 0
    p1: {battlefield_contains: [{card: Omniscience}], hand: [Force of Will]}
notes: >
  p0's mask: Murktide (creature), Bauble and Cutter (artifacts), Volcanic Island (land) and "nothing"; Bolt is an instant.
  Nothing of p1's appears in p0's options or events before the cards enter. Cutter enters unattached (301.5b); its Flurry
  trigger needs a cast, so nothing triggers.
---
id: hi-mask-force-of-negation-free-only-on-opponents-turn
title: Force of Negation's alternative cost is not offered on its controller's own turn
area: hidden-info
cards: [Force of Negation, Stock Up, Lightning Bolt, Volcanic Island, Island]
tags: [hidden-info, mask-validity, alternative-cost, not-your-turn, legal-actions]
derived_from: oracle
source:
  - {kind: oracle, card: Force of Negation, text: "If it's not your turn, you may exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
  - {kind: cr, ref: "601.2h", text: "Partial payments are not allowed. Unpayable costs can't be paid.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Volcanic Island"]
    library_pad: 10
  p1:
    hand: ["Force of Negation @fon", "Stock Up @su"]
    battlefield: ["Island", "Island"]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@bolt", controller: p0}]
    pending: {actor: p1, kind: priority}
    phase: main1
    legal:
      p1:
        include: [{t: pass}]
        exclude:
          - {t: cast, card: "@fon"}
          - {t: cast, card: "@su"}
notes: >
  It is p1's own turn, so the exile alternative is unavailable, and two Islands cannot pay {1}{U}{U}; no Force of Negation
  cast is offered (Bolt is a noncreature spell, so a target exists; the cost is the only obstacle). Stock Up is a sorcery
  and the stack is not empty. p1 passing with an empty stack in main1 gives p0 priority, where p0 casts Bolt (117.3d).
