id: show-and-tell-second-chooser-learns-nothing-about-first-pick
title: p1's observation while choosing for Show and Tell carries no trace of p0's pick or hand change
area: hidden-info
cards: [Show and Tell, Omniscience, Aluren, Island, Lotus Petal]
tags: [show-and-tell, simultaneous-secret-choice, hidden-info, non-interference]
derived_from: cr
source:
  - {kind: oracle, card: Show and Tell, text: "Each player may put an artifact, creature, enchantment, or land card from their hand onto the battlefield.", verified: true}
  - {kind: cr, ref: "101.4", text: "If multiple players would make choices and/or take actions at the same time, the active player ... makes any choices required, then the next player in turn order ... makes any choices required, followed by the remaining nonactive players in turn order. Then the actions happen simultaneously.", verified: true}
  - {kind: cr, ref: "101.4a", text: "If an effect has each player choose a card in a hidden zone, such as their hand or library, those cards may remain face down as they're chosen. However, each player must clearly indicate which face-down card they are choosing.", verified: true}
  - {kind: cr, ref: "101.4b", text: "A player knows the choices made by the previous players when making their choice, except as specified in 101.4a.", verified: true}
observer: p1
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Show and Tell @snt", "Omniscience @omni", "Aluren @al"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library_pad: 10
  p1:
    hand: ["Island @ph", "Lotus Petal @lp"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@snt", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: simultaneous_secret_choice, answer: "@omni"}
  - check:
      observer: p1
      pending: {actor: p1, kind: simultaneous_secret_choice}
      obs:
        opp: {hand_count: 2}
        option_labels_exclude_names: [Omniscience, Aluren]
        events_text_exclude: [Omniscience, Aluren]
  - p1: {decision: simultaneous_secret_choice, answer: null}
expect:
  - at: after_script
    observer: p1
    obs:
      opp: {hand_count: 1}
      option_labels_exclude_names: [Aluren]
      events_text_exclude: [Aluren]
notes: >
  CR 101.4: p0 chooses first, then p1, then the chosen cards are put onto the battlefield simultaneously. CR 101.4a/b:
  the card is chosen from a hidden zone and may stay face down, so p1 learns THAT p0 indicated a card (101.4b) but
  not WHICH card. Design doc 02 section 9.1 keeps it face down. While p1 decides, p0's chosen card is still in p0's
  hand (nothing moves until both have chosen), so p0's hand size is still 2; and neither Omniscience (the pick) nor
  Aluren (the card kept in hand) may appear in p1's observation, option labels or event text. (Reviewer note: p1 is
  entitled to know that p0 chose a card rather than nothing; this scenario does not assert either way about that.) After both answers, Omniscience is public (it is on the battlefield) but Aluren must still not appear
  anywhere: p0's remaining hand has size 1. The mid-script check uses the same seat-view vocabulary as the final expectation.
---
id: show-and-tell-countered-no-choices-made
title: A countered Show and Tell makes nobody choose and puts nothing onto the battlefield
area: card
cards: [Show and Tell, "Atraxa, Grand Unifier", Island, Force of Will, Brainstorm]
tags: [show-and-tell, force-of-will, counter, alternative-cost, priority]
derived_from: oracle
source:
  - {kind: oracle, card: Force of Will, text: "You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur. A countered spell is put into its owner's graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Show and Tell @snt", "Atraxa, Grand Unifier @atx"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library_pad: 10
  p1:
    hand: ["Force of Will @fow", "Brainstorm @pbs"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@snt", pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@pbs", pay_life: 1}, targets: ["@snt"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: ["Atraxa, Grand Unifier"]
      graveyard: [Show and Tell]
      battlefield: [{card: Island}, {card: Island}, {card: Island}]
    p1:
      life: 19
      hand: []
      exile: [Brainstorm]
      graveyard: [Force of Will]
notes: >
  Force of Will's alternative cost: 1 life and exiling Brainstorm from hand (Brainstorm is blue). Show and Tell is
  countered and never resolves, so there is no secret-choice decision at all and Atraxa stays in hand. Baseline for the
  other Show and Tell scenarios.
