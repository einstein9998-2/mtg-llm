id: hedge-maze-surveil-keep-on-top
title: Surveil 1 from Hedge Maze may leave the card on top of the library
area: card
cards: [Hedge Maze, Lightning Bolt]
tags: [hedge-maze, surveil, library-order]
derived_from: cr
source:
  - {kind: oracle, card: Hedge Maze, text: "When this land enters, surveil 1.", verified: true}
  - {kind: cr, ref: "701.25a", text: "To \"surveil N\" means to look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Hedge Maze @hm"]
    library: ["Lightning Bolt @bolt"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: play_land, card: "@hm"}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: [], on_top_order: ["@bolt"]}
expect:
  - at: after_script
    stack: []
    p0:
      graveyard: []
      library_top: [Lightning Bolt]
      library_count: 11
notes: >
  Counterpart of the previous scenario, "any number" includes zero, so the card stays on top and the graveyard stays empty.
