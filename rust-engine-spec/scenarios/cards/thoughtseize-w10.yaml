id: thoughtseize-fizzles-against-veil-hexproof-and-caster-loses-no-life
title: Veil of Summer in response makes Thoughtseize's only target illegal, so it does nothing and its caster keeps their life
area: card
cards: [Thoughtseize, Swamp, Veil of Summer, Forest, Brainstorm, Ponder]
tags: [thoughtseize, veil-of-summer, hexproof-from, fizzle, targets]
derived_from: cr
source:
  - {kind: oracle, card: Veil of Summer, text: "Draw a card if an opponent has cast a blue or black spell this turn. Spells you control can't be countered this turn. You and permanents you control gain hexproof from blue and from black until end of turn.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word \"target,\" are now illegal, the spell or ability doesn't resolve. It's removed from the stack and, if it's a spell, put into its owner's graveyard.", verified: true}
  - {kind: oracle, card: Thoughtseize, text: "Target player reveals their hand.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Thoughtseize @ts"]
    battlefield: ["Swamp @s1"]
    library_pad: 10
  p1:
    hand: ["Veil of Summer @veil", "Brainstorm @bs"]
    battlefield: ["Forest @f1"]
    library: ["Ponder @lp"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ts", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@veil", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check: {stack: [{kind: spell, card: "@ts", controller: p0}], pending: {actor: p0, kind: priority}, p1: {hand: [Brainstorm, Ponder]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      graveyard: [Thoughtseize]
    p1:
      hand: [Brainstorm, Ponder]
      graveyard: [Veil of Summer]
      battlefield: [{card: Forest, tapped: true}]
notes: >
  Thoughtseize is black and was cast by p1's opponent this turn, so Veil draws p1 a card (Ponder). p1 then has hexproof
  from black, so Thoughtseize's only target is illegal on resolution and the whole spell does not resolve (608.2b): no
  reveal, no discard, and p0 does not lose 2 life. A wrong engine still applies the "You lose 2 life" part.
