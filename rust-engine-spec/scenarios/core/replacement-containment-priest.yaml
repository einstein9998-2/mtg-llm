id: containment-priest-affects-its-controllers-own-creatures
title: Containment Priest also exiles its own controller's creature put onto the battlefield by Show and Tell
area: core
cards: [Containment Priest, Show and Tell, Acererak the Archlich, "Atraxa, Grand Unifier", Island]
tags: [replacement-effect, containment-priest, show-and-tell, symmetric-effect]
derived_from: oracle
source:
  - {kind: oracle, card: Containment Priest, text: "If a nontoken creature would enter and it wasn't cast, exile it instead.", verified: true}
  - {kind: oracle, card: Show and Tell, text: "Each player may put an artifact, creature, enchantment, or land card from their hand onto the battlefield.", verified: true}
  - {kind: cr, ref: "603.2g", text: "An ability triggers only if its trigger event actually occurs. An event that's prevented or replaced won't trigger anything.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Show and Tell @snt", "Acererak the Archlich @ac"]
    battlefield: ["Containment Priest @cp", "Island @i1", "Island @i2", "Island @i3"]
    library_pad: 10
  p1:
    hand: ["Atraxa, Grand Unifier @atx"]
    library_pad: 15
script:
  - p0: {t: cast, card: "@snt", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: simultaneous_secret_choice, answer: "@ac"}
  - p1: {decision: simultaneous_secret_choice, answer: "@atx"}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: [Acererak the Archlich]
      battlefield_contains: [{card: Containment Priest}]
      command: []
    p1:
      exile: ["Atraxa, Grand Unifier"]
      battlefield: []
notes: >
  The Priest's text says "a nontoken creature", not "a creature an opponent controls": it is symmetric. Both creatures
  are exiled to their owners' exile zones, neither enters, no trigger (Acererak's venture does not happen, so p0's
  command zone stays empty). A wrong engine protects the Priest's controller.
---
id: containment-priest-cast-creature-enters-normally
title: A creature that was cast enters normally under Containment Priest and its enters ability triggers
area: core
cards: [Containment Priest, Acererak the Archlich, Swamp, Island]
tags: [replacement-effect, containment-priest, negative-case, etb-trigger]
derived_from: oracle
source:
  - {kind: oracle, card: Containment Priest, text: "If a nontoken creature would enter and it wasn't cast, exile it instead.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: cr, ref: "400.7d", text: "An ability of a permanent can reference information about the spell that became that permanent as it resolved, including what costs were paid to cast that spell", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @ac"]
    battlefield: ["Swamp @s", "Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    battlefield: ["Containment Priest @cp"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ac", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: [{kind: triggered, source: "@ac", controller: p0, text_contains: "venture"}]
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains: [{card: Acererak the Archlich, alias: ac}]
      exile: []
notes: >
  Negative case: the spell resolving into a permanent is "cast", so the Priest does not apply. Acererak enters and its
  ability triggers (p0 has completed no dungeon). The scenario stops with the trigger on the stack. A wrong engine
  exiles every nontoken creature entering, or forgets the cast record when the spell becomes a permanent.
