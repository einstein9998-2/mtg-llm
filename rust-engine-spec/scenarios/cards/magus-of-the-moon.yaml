id: magus-fetchland-taps-for-red-and-does-not-fetch
title: Under Magus of the Moon, Scalding Tarn has no fetch ability but taps for {R}; paying Lightning Bolt with it costs no life and searches nothing
area: card
cards: [Magus of the Moon, Scalding Tarn, Lightning Bolt, Mountain]
tags: [magus-of-the-moon, layers, ability-removing, fetchland, intrinsic-mana-ability]
derived_from: cr
source:
  - {kind: oracle, card: Magus of the Moon, text: "Nonbasic lands are Mountains.", verified: true}
  - {kind: oracle, card: Scalding Tarn, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for an Island or Mountain card, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: cr, ref: "305.7", text: "It loses all abilities generated from its rules text, its old land types, and any copiable effects affecting that land, and it gains the appropriate mana ability for each new basic land type.", verified: true}
  - {kind: cr, ref: "305.6", text: "For Plains, [mana symbol] is {W}; for Islands, {U}; for Swamps, {B}; for Mountains, {R}; and for Forests, {G}.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Scalding Tarn @tarn"]
    library_pad: 10
  p1:
    battlefield: ["Magus of the Moon @magus"]
    library_pad: 10
script:
  - check:
      p0: {battlefield: [{card: Scalding Tarn, subtypes: [Mountain]}]}
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@tarn"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      library_count: 10
      graveyard: [Lightning Bolt]
      battlefield: [{card: Scalding Tarn, tapped: true}]
    p1: {life: 17}
notes: >
  Scalding Tarn printed has no mana ability at all; under Magus it is a Mountain whose only ability is the intrinsic
  {T}: Add {R} (305.7 removes the fetch ability, which is generated from its rules text). So the Tarn alone pays for
  Bolt: it stays on the battlefield tapped, p0 pays no life (20) and the library is untouched (10). An engine that does
  not apply Magus cannot cast Bolt at all here. The probe that the fetch ability itself is gone is not written (an
  ability index for a printed ability the permanent no longer has is ambiguous in the scenario format; see report),
  but magus-wasteland-* and magus-karakas-* probe the same rule on a second printed ability.
---
