id: preordain-with-a-one-card-library-bottoming-it-still-draws-it
title: Preordain with a one-card library, even after scrying that card to the bottom, draws it and does not lose the game
area: card
cards: [Preordain, Island]
tags: [preordain, scry, small-library, draw, boundary]
derived_from: oracle
source:
  - {kind: oracle, card: Preordain, text: "Scry 2, then draw a card.", verified: true}
  - {kind: cr, ref: "701.22a", text: "To \"scry N\" means to look at the top N cards of your library, then put any number of them on the bottom of your library in any order and the rest on top of your library in any order.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Preordain @pre"]
    battlefield: ["Island @i1"]
    library: ["Island @a"]
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@pre", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: scry, to_bottom: ["@a"], on_top_order: [], expect_options: {count: 1}}
expect:
  - at: after_script
    game: {over: false}
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {hand: [Island], graveyard: [Preordain], library_count: 0}
notes: >
  Scry 2 of a one-card library looks at that one card. Putting a one-card library's card on the bottom leaves it the only card, so the draw takes it.
  The library is empty afterwards but the player attempted no draw from an empty library, so there is no state-based loss (that happens only at their
  next draw). A wrong engine skips the draw or loses the game.
