id: force-of-will-can-pitch-atraxa-a-multicolor-card-with-blue
title: Force of Will may exile Atraxa from hand as its blue card because Atraxa's mana cost includes {U}
area: card
cards: [Force of Will, "Atraxa, Grand Unifier", Brainstorm, Island]
tags: [force-of-will, alternative-cost, card-color, multicolor, atraxa, life-payment]
derived_from: cr
source:
  - {kind: oracle, card: Force of Will, text: "You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: "Atraxa, Grand Unifier", text: "Flying, vigilance, deathtouch, lifelink", verified: true}
  - {kind: cr, ref: "202.2c", text: "An object with two or more different colored mana symbols in its mana cost is each of the colors of those mana symbols.", verified: true}
  - {kind: cr, ref: "118.9", text: "An alternative cost is a cost listed in a spell's text ... that its controller may pay rather than paying the spell's mana cost.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Force of Will @fow", "Atraxa, Grand Unifier @atx"]
    library_pad: 10
  p1:
    hand: ["Brainstorm @pbs"]
    battlefield: ["Island @pi"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@pbs", pay: auto}
  - p1: {t: pass}
  - p0: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@atx", pay_life: 1}, targets: ["@pbs"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 19
      hand: []
      exile: ["Atraxa, Grand Unifier"]
      graveyard: [Force of Will]
    p1:
      graveyard: [Brainstorm]
notes: >
  Atraxa ({3}{G}{W}{U}{B}) is green, white, blue and black, so it is a blue card and a legal pitch. p0 has no lands: the
  alternative cost costs only 1 life and the exiled card. A wrong engine could treat only mono-blue cards as blue.
