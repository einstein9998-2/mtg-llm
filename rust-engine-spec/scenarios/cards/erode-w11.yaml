id: erode-own-creature-caster-searches
title: Erode on the caster's own creature lets the caster, as that creature's controller, search for a basic land
area: card
cards: [Erode, Plains, Island, "Phelia, Exuberant Shepherd"]
tags: [erode, own-creature, may-search, basic-land, enters-tapped]
derived_from: oracle
source:
  - {kind: oracle, card: Erode, text: "Destroy target creature or planeswalker. Its controller may search their library for a basic land card, put it onto the battlefield tapped, then shuffle.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Erode @erode"]
    battlefield: ["Plains @pl", "Phelia, Exuberant Shepherd @phelia"]
    library: ["Island @li"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@erode", targets: ["@phelia"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: yes_no, purpose: may_search, answer: true}
  - p0: {decision: search, found: "@li"}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Erode, "Phelia, Exuberant Shepherd"]
      battlefield: [{card: Plains, tapped: true}, {card: Island, tapped: true}]
      library_count: 10
      lands_played: 0
notes: >
  "Its controller" is the destroyed creature's controller, here the caster. The basic Island enters tapped and is not a
  land play. Pair of the opponent-side scenario: a wrong engine that always asks the target's opponent or always the
  caster fails one of the two.
