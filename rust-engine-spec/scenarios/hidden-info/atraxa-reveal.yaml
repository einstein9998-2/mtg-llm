id: hi-atraxa-reveal-ends-brainstorm-position-knowledge
title: Atraxa revealing cards the owner put back with Brainstorm makes them public and ends the owner's top knowledge
area: hidden-info
cards: ["Atraxa, Grand Unifier", Omniscience, Brainstorm, Stifle, Aluren, Lotus Petal, Show and Tell, Force of Will, Hedge Maze, Island, Tropical Island, Lightning Bolt, Volcanic Island]
tags: [hidden-info, reveal, atraxa, brainstorm, library-knowledge, random-bottom]
derived_from: cr
source:
  - {kind: oracle, card: Brainstorm, text: "Draw three cards, then put two cards from your hand on top of your library in any order.", verified: true}
  - {kind: oracle, card: "Atraxa, Grand Unifier", text: "Put the rest on the bottom of your library in a random order.", verified: true}
  - {kind: cr, ref: "701.20a", text: "To reveal a card, show that card to all players for a brief time.", verified: true}
  - {kind: cr, ref: "701.24a", text: "To shuffle a library or a face-down pile of cards, randomize the cards within it so that no player knows their order.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: [Lightning Bolt]
    battlefield: ["Volcanic Island"]
    library_pad: 10
  p1:
    hand: ["Brainstorm @bs", "Atraxa, Grand Unifier @atx", "Stifle @st"]
    battlefield: ["Omniscience @omni", "Island", "Tropical Island"]
    library: ["Aluren @l1", "Lotus Petal @l2", "Island @l3", "Show and Tell @l4", "Force of Will @l5", "Hedge Maze @l6"]
    library_pad: 14
random: any
script:
  - p1: {t: cast, card: "@bs", alt_cost: {free: omniscience}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_cards, purpose: put_back, answer: ["@st", "@l2"]}
  - p1: {decision: order_cards, purpose: put_back, answer: ["@st", "@l2"]}
  - label: after-brainstorm
    check:
      stack: []
      p1: {library_top: [Stifle, Lotus Petal], library_count: 19, hand: ["Atraxa, Grand Unifier", Aluren, Island]}
  - p1: {t: cast, card: "@atx", alt_cost: {free: omniscience}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_cards, purpose: atraxa_to_hand, answer: ["@l2", "@l4", "@l5", "@l6"]}
expect:
  - at: after-brainstorm
    observer: p1
    obs:
      me: {library_known_top: [Stifle, Lotus Petal]}
  - at: after-brainstorm
    observer: p0
    obs:
      opp: {hand_count: 3, revealed_hand: [], library_count: 19}
      events_text_exclude: [Stifle, Lotus Petal, Aluren]
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p1:
      hand: [Aluren, Island, Lotus Petal, Show and Tell, Force of Will, Hedge Maze]
      library_count: 15
      library_bottom_multiset: [Stifle, Island, Island, Island, Island, Island]
  - at: after_script
    observer: p1
    obs:
      me: {library_known_top: [], library_known_bottom: []}
  - at: after_script
    observer: p0
    obs:
      opp: {hand_count: 6, revealed_hand: [Lotus Petal, Show and Tell, Force of Will, Hedge Maze], library_count: 15}
      events_text_exclude: [Aluren]
notes: >
  Brainstorm (free) draws Aluren, Lotus Petal, Island; p1 puts back Stifle then Lotus Petal (top first), so p1 knows the top
  two and p0 knows nothing (library 20 -> 17 -> 19). Atraxa (free) then reveals the top ten: Stifle, Lotus Petal, Show and
  Tell, Force of Will, Hedge Maze and five padding Islands. p1 takes Lotus Petal (artifact), Show and Tell (sorcery), Force of
  Will (instant), Hedge Maze (land); Stifle loses the instant slot and goes to the bottom with the five Islands in random
  order (library 19 -> 15). The new top card is a padding Island nobody has seen in that position, so p1's top knowledge is
  empty. Aluren and the drawn Island were never revealed. p0 now knows Stifle is among the bottom six, which the obs
  vocabulary cannot express (schema request).
