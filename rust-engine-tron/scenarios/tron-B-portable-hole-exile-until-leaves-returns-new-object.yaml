id: tron-b-portable-hole-exile-until-leaves-returns-new-object
title: Portable Hole exiles an opponent's mana-value-1 creature until it leaves; when Abrade destroys the Hole the creature returns as a new object (counter gone, summoning sick)
area: card
cards: [Portable Hole, Ocelot Pride, Abrade, Plains, Mountain]
tags: [portable-hole, etb-trigger, exile-until, leaves-battlefield, new-object, counters-lost, summoning-sickness, targeting]
derived_from: oracle
source:
  - {kind: oracle, card: Portable Hole, text: "When this artifact enters, exile target nonland permanent an opponent controls with mana value 2 or less until this artifact leaves the battlefield.", verified: true}
  - {kind: oracle, card: Abrade, text: "Destroy target artifact.", verified: true}
  - {kind: cr, ref: "610.3", text: "A second one-shot effect is created immediately after the specified event. This second one-shot effect returns the object to its previous zone.", verified: true}
  - {kind: cr, ref: "610.3c", text: "An object returned to the battlefield this way returns under its owner’s control unless otherwise specified.", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Portable Hole @hole"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    hand: ["Abrade @ab"]
    battlefield:
      - "Mountain @m1"
      - "Mountain @m2"
      - {card: Ocelot Pride, as: op, counters: {"+1/+1": 1}}
    library_pad: 10
script:
  - p0: {t: cast, card: "@hole", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@op", expect_options: {include: ["@op"], exclude: ["@hole"]}}
  - label: trigger-on-stack
    check:
      stack: [{kind: triggered, source: "@hole", controller: p0, text_contains: "exile target nonland permanent"}]
      pending: {actor: p0, kind: priority}
      p1:
        battlefield_contains: [{card: Ocelot Pride, pt: [2, 2]}]
  - p0: {t: pass}
  - p1: {t: pass}
  - label: ocelot-exiled
    check:
      stack: []
      pending: {actor: p0, kind: priority}
      p1:
        exile: [Ocelot Pride]
        battlefield: [{card: Mountain, tapped: false}, {card: Mountain, tapped: false}]
      p0:
        battlefield_contains: [{card: Portable Hole}]
  - p0: {t: pass}
  - p1: {t: cast, card: "@ab", modes: [2], targets: ["@hole"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Portable Hole]
      battlefield: [{card: Plains, tapped: true}]
    p1:
      exile: []
      graveyard: [Abrade]
      battlefield:
        - {card: Ocelot Pride, pt: [1, 1], sick: true, tapped: false, controller: p1}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
notes: >
  The Hole ({W}) enters and its enters trigger targets Ocelot Pride (mana value 1, a 2/2 with a +1/+1 counter). When the
  trigger resolves the creature is exiled. p1 then destroys the Hole with Abrade's second mode ({1}{R}); the moment the Hole
  leaves the battlefield the "until" one-shot effect returns the card (610.3) under its owner's control. It is a new object
  (400.7): the +1/+1 counter is gone (pt 1/1) and it is summoning sick (it came under p1's control this turn). A wrong engine
  returns the permanent with its counters, untapped-and-ready, or never returns it. Priority: p0 passes in the empty stack so
  p1 may cast; after Abrade resolves the active player p0 has priority.
