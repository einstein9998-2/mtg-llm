id: lotus-petal-sacrifice-for-one-mana-of-chosen-color
title: Lotus Petal taps and sacrifices itself as a mana ability for one mana of the chosen color
area: card
cards: [Lotus Petal]
tags: [lotus-petal, mana-ability, sacrifice-cost, choose-color, artifact]
derived_from: oracle
source:
  - {kind: oracle, card: Lotus Petal, text: "{T}, Sacrifice this artifact: Add one mana of any color.", verified: true}
  - {kind: cr, ref: "605.1a", text: "An activated ability is a mana ability if it meets all of the following criteria: it doesn't require a target (see rule 115.6), it could add mana to a player's mana pool when it resolves, and it's not a loyalty ability.", verified: true}
  - {kind: cr, ref: "605.3b", text: "An activated mana ability doesn't go on the stack, so it can't be targeted, countered, or otherwise responded to.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Lotus Petal @lp"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@lp", ability: 0, choose_color: G}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      mana_pool: {G: 1}
      battlefield: []
      graveyard: [Lotus Petal]
notes: >
  The color is chosen on activation (choose_color). The sacrifice is a cost, the ability is a mana ability, so nothing
  uses the stack and p0 keeps priority. Pool: exactly one G.
