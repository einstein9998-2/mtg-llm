area: card
cards: ["Stormchaser's Talent", Boomerang Basics, Island, "Otter Token"]
tags: [stormchasers-talent, class, boomerang-basics, bounce, level-reset, new-object, level-3, sorcery-cast-trigger, prowess, ur-alternate]
