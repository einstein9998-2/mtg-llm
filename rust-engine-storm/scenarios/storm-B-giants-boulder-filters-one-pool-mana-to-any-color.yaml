notes: >
  The Boulder is a filter: it spends {1} from the pool (one of the two identical {C}) and adds one mana of any colour,
  here {U}. Pool {C:2} -> {C:1, U:1}. It resolves at once (mana ability), is not a creature so the entering turn does
  not matter (sick: true), and once tapped it cannot be activated again. Per the brief the engine spends floating mana
  only from the pool and chooses which; both floating mana here are {C}, so that choice cannot matter.
