id: thoughtseize-hand-of-lands-discards-nothing-but-life-is-lost
title: Against a hand of only lands Thoughtseize discards nothing, and its caster still loses 2 life
area: card
cards: [Thoughtseize, Swamp, Island]
tags: [thoughtseize, discard, no-legal-choice, life-loss]
derived_from: cr
source:
  - {kind: oracle, card: Thoughtseize, text: "You choose a nonland card from it. That player discards that card. You lose 2 life.", verified: true}
  - {kind: cr, ref: "608.2d", text: "The player can't choose an option that's illegal or impossible, with the exception that having a library with no cards in it doesn't make drawing a card an impossible action (see rule 121.3).", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Thoughtseize @ts"]
    battlefield: ["Swamp @s1"]
    library_pad: 10
  p1:
    hand: ["Island @i1", "Swamp @s2"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ts", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 18
      graveyard: [Thoughtseize]
    p1:
      hand: [Island, Swamp]
      graveyard: []
notes: >
  There is no nonland card to choose, so no choice is raised (SCHEMA addenda: no decision when the rules give no choice)
  and nothing is discarded; the life loss is a separate instruction and still happens. A wrong engine skips the life loss
  when nothing was discarded, or makes p1 discard a land.
