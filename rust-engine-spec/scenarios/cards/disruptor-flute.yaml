id: disruptor-flute-naming-atraxa-does-not-stop-show-and-tell
title: Naming Atraxa taxes casting her but a Show and Tell put-in is not a cast, so her enters trigger still goes on the stack
area: card
cards: [Disruptor Flute, Show and Tell, "Atraxa, Grand Unifier", Island]
tags: [disruptor-flute, show-and-tell, not-cast, choose-name, etb-trigger, alurentell-specific]
derived_from: oracle
source:
  - {kind: oracle, card: Disruptor Flute, text: "Spells with the chosen name cost {3} more to cast.", verified: true}
  - {kind: oracle, card: Show and Tell, text: "Each player may put an artifact, creature, enchantment, or land card from their hand onto the battlefield.", verified: true}
  - {kind: cr, ref: "601.2a", text: "To propose the casting of a spell, a player first moves that card (or that copy of a card) from where it is to the stack.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Disruptor Flute @fl", "Show and Tell @snt", "Atraxa, Grand Unifier @atx"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3", "Island @i4", "Island @i5"]
    library_pad: 10
  p1:
    hand: ["Island @ph"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@fl", pay: {tap: ["@i1", "@i2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_name, answer: "Atraxa, Grand Unifier"}
  - p0: {t: cast, card: "@snt", pay: {tap: ["@i3", "@i4", "@i5"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: simultaneous_secret_choice, answer: "@atx"}
  - p1: {decision: simultaneous_secret_choice, answer: null}
expect:
  - at: after_script
    stack: [{kind: triggered, source: "@atx", controller: p0}]
    pending: {actor: p0, kind: priority}
    p0:
      spells_cast_this_turn: 2
      hand: []
      battlefield_contains: [{card: "Atraxa, Grand Unifier", types: [Creature]}, {card: Disruptor Flute}]
      graveyard: [Show and Tell]
notes: >
  Atraxa would cost {3}{G}{W}{U}{B} + {3} to cast, but Show and Tell puts her onto the battlefield (not a cast), so the
  Flute's cost increase never applies and her enters trigger goes on the stack (left unresolved here). Two spells were cast
  this turn: Flute and Show and Tell. The Flute's activated-ability clause only matters for sources named Atraxa (she has
  none).
