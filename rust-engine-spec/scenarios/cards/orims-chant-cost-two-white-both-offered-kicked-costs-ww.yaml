id: orims-chant-with-two-white-sources-both-casts-are-offered-and-kicked-costs-ww
title: "With two Plains both the unkicked and the kicked Orim's Chant are offered; the kicked cast costs {W}{W} and cannot be paid with one Plains"
area: card
cards: ["Orim's Chant", Plains]
tags: [orims-chant, kicker, mana-payment, legal-action-mask, additional-cost]
derived_from: oracle
source:
  - {kind: oracle, card: "Orim's Chant", text: "Kicker {W} (You may pay an additional {W} as you cast this spell.)", verified: true, note: "Orim's Chant Oracle text supplied by the engine owner from Scryfall data; the card is not yet in reference/oracle.json (an entry is provided in NOTES.md)"}
  - {kind: cr, ref: "702.33a", text: "“Kicker [cost]” means “You may pay an additional [cost] as you cast this spell.”", verified: true}
  - {kind: cr, ref: "702.33d", text: "If a spell’s controller declares the intention to pay any of that spell’s kicker costs, that spell has been “kicked.”", verified: true}
  - {kind: cr, ref: "601.2b", text: "If the spell has alternative or additional costs that will be paid as it’s being cast such as buyback or kicker costs (see rules 118.8 and 118.9), the player announces their intentions to pay any or all of those costs (see rule 601.2f).", verified: true}
  - {kind: cr, ref: "601.2f", text: "The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Orim's Chant @chant"]
    battlefield: ["Plains @pl1", "Plains @pl2"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      legal:
        p0:
          include:
            - {t: cast, card: "@chant", kicked: false, targets: [{player: p1}]}
            - {t: cast, card: "@chant", kicked: true, targets: [{player: p1}]}
  - p0: {t: cast, card: "@chant", kicked: true, targets: [{player: p1}], pay: {tap: ["@pl1", "@pl2"]}}
  - check:
      stack: [{kind: spell, card: "@chant", controller: p0, targets: [{player: p1}]}]
      p0: {battlefield: [{card: Plains, tapped: true}, {card: Plains, tapped: true}], mana_pool: {}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: ["Orim's Chant"]
      spells_cast_this_turn: 1
      mana_pool: {}
      battlefield: [{card: Plains, tapped: true}, {card: Plains, tapped: true}]
    p1: {life: 20}
notes: >
  Both ways of casting are separate legal actions, like the hard cast and the pitch cast of Force of Will
  (alt-cost-force-of-will-hard-cast-and-pitch-are-separate-actions). The kicker is an additional cost, not an
  alternative cost, so there is no exclusivity issue; the kicked cast needs both Plains (see the one-white-source scenario for the case where only one {W} source exists). Kicked
  Chant counts as one spell cast this turn (spells_cast_this_turn 1), not two.
