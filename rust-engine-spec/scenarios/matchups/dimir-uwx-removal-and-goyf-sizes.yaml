      library_count: 10
    p1: {graveyard: [Erode], battlefield: [{card: Tundra, tapped: true}]}
notes: >
  The destroyed creature's controller (p0, not Erode's caster) makes the may-search decision and the search; the Swamp
  enters tapped. Library 11 -> 10. Bugs caught: asking the caster, the land entering untapped.
