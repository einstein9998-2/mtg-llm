id: sba-equipment-stays-unattached-when-creature-dies
title: Cori-Steel Cutter stays on the battlefield unattached when the equipped creature dies
area: core
cards: [Cori-Steel Cutter, "Dragon's Rage Channeler", Lightning Bolt, Mountain]
tags: [state-based-actions, equipment, layers]
derived_from: cr
source:
  - {kind: cr, ref: "704.5n", text: "If an Equipment or Fortification is attached to an illegal permanent or to a player, it becomes unattached from that permanent or player. It remains on the battlefield.", verified: true}
  - {kind: cr, ref: "301.5c", text: "An Equipment that equips an illegal or nonexistent permanent becomes unattached from that permanent but remains on the battlefield. (This is a state-based action. See rule 704.)", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equipped creature gets +1/+1 and has trample and haste.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m"]
    library_pad: 10
  p1:
    battlefield:
      - "Dragon's Rage Channeler @drc"
      - {card: Cori-Steel Cutter, as: cut, attached_to: "@drc"}
    library_pad: 10
script:
  - check:
      p1: {battlefield_contains: [{card: "Dragon's Rage Channeler", pt: [2, 2], keywords: [trample, haste]}]}
  - p0: {t: cast, card: "@bolt", targets: ["@drc"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p1:
      battlefield: [{card: Cori-Steel Cutter, attached_to: null}]
      graveyard: ["Dragon's Rage Channeler"]
notes: >
  DRC with the Cutter is 2/2; Bolt kills it. The Equipment does not follow the creature to the graveyard (unlike an
  Aura, 704.5m); it becomes unattached and stays (704.5n). A wrong engine puts the Equipment into the graveyard or
  leaves it "attached" to a nonexistent object. `attached_to: null` means unattached.
