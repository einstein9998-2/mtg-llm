id: consign-replicate-copy-retargeted-counters-two-triggers
title: "Consign to Memory with one replicate: the copy retargets, so one Consign counters Cutter's flurry and the copy counters DRC's surveil"
area: core
cards: [Consign to Memory, Dragon's Rage Channeler, Cori-Steel Cutter, Lightning Bolt, Mountain, Island, Ponder]
tags: [consign-to-memory, replicate, copy-spell, retargeting, triggers, counter-ability, order-triggers, drc, cori-steel-cutter]
derived_from: cr
source:
  - {kind: cr, ref: "702.56a", text: "\"Replicate [cost]\" means \"As an additional cost to cast this spell, you may pay [cost] any number of times\" and \"When you cast this spell, if a replicate cost was paid for it, copy it for each time its replicate cost was paid. If the spell has any targets, you may choose new targets for any of the copies.\"", verified: true}
  - {kind: cr, ref: "707.10c", text: "The player may leave any number of the targets unchanged, even if those targets would be illegal. If the player chooses to change some or all of the targets, the new targets must be legal.", verified: true}
  - {kind: cr, ref: "707.10", text: "A copy of a spell or ability is controlled by the player under whose control it was put on the stack.", verified: true}
  - {kind: oracle, card: Consign to Memory, text: "Replicate {1}", verified: true}
  - {kind: oracle, card: Consign to Memory, text: "Counter target triggered ability or colorless spell.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Dragon's Rage Channeler @drc2", "Lightning Bolt @b1"]
    battlefield: ["Dragon's Rage Channeler @drc", "Cori-Steel Cutter @cutter", "Mountain @m1", "Mountain @m2"]
    library: ["Ponder @pond"]
    library_pad: 10
  p1:
    hand: ["Consign to Memory @consign"]
    battlefield: ["Island @j1", "Island @j2"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@drc2", pay: auto}
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: auto}
  - p0: {decision: order_triggers, answer: ["@drc", "@cutter"]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@consign", replicate: 1, targets: [{trigger_of: "@cutter", nth: 0}], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@drc2", controller: p0}
        - {kind: spell, card: "@b1", controller: p0}
        - {kind: triggered, source: "@drc", controller: p0}
        - {kind: triggered, source: "@cutter", controller: p0}
        - {kind: spell, card: "@consign", controller: p1}
        - {kind: triggered, source: "@consign", controller: p1}
      pending: {actor: p1, kind: priority}
      p1: {battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}]}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_target, slot: 0, answer: {trigger_of: "@drc", nth: 0}}
  - check:
      stack:
        - {kind: spell, card: "@drc2", controller: p0}
        - {kind: spell, card: "@b1", controller: p0}
        - {kind: triggered, source: "@drc", controller: p0}
        - {kind: triggered, source: "@cutter", controller: p0}
        - {kind: spell, card: "@consign", controller: p1}
        - {kind: spell, copy: true, controller: p1}
      pending: {actor: p0, kind: priority}
  - resolve_top: true
  - check:
      stack:
        - {kind: spell, card: "@drc2", controller: p0}
        - {kind: spell, card: "@b1", controller: p0}
        - {kind: triggered, source: "@cutter", controller: p0}
        - {kind: spell, card: "@consign", controller: p1}
  - resolve_top: true
expect:
  - at: after_script
    stack:
      - {kind: spell, card: "@drc2", controller: p0}
      - {kind: spell, card: "@b1", controller: p0}
    pending: {actor: p0, kind: priority}
    p0:
      library_top: [Ponder]
      graveyard: []
      battlefield: [{card: Dragon's Rage Channeler}, {card: Cori-Steel Cutter}, {card: Mountain, tapped: true}, {card: Mountain, tapped: true}]
    p1:
      graveyard: [Consign to Memory]
notes: >
  Setup of the two targets: the creature spell is p0's first spell (no triggers), Bolt is the second (DRC surveil and
  Cutter flurry both trigger; p0 orders them, flurry on top). p1 casts Consign with replicate paid once ({U}{1}, both
  Islands), originally targeting the flurry trigger. Replicate's own triggered ability (702.56a) goes on the stack above
  Consign; when it resolves it puts a copy on the stack, controlled by p1, and p1 may choose a new target (707.10c): the
  copy is retargeted to the DRC surveil trigger. The copy resolves first (counters DRC's trigger), then the original
  Consign counters flurry, so neither a surveil nor a Monk happens, and the two spells stay on the stack. The copy
  ceases to exist after resolving; only the original card goes to the graveyard. The script assumes the engine presents
  only a choose_target decision for the copy's new target slot (see REPORT schema-requests about an optional preceding
  yes/no). Catches an engine that ignores replicate, makes the copy keep the original's target, makes the copy a card in
  the graveyard, or lets the opponent pick the copy's target.
