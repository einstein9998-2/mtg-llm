    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@gob", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@priest", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check: {stack: [], priority: p0, p1: {battlefield_contains: [{card: Containment Priest, tapped: true}]}}
  - p0: {t: pass}
