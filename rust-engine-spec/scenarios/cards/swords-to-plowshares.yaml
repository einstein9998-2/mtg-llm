id: stp-exiles-creature-controller-gains-power-with-counters
title: Swords to Plowshares exiles a Murktide Regent with two +1/+1 counters and its controller gains 5, its current power
area: card
cards: [Swords to Plowshares, Plains, Murktide Regent]
tags: [swords-to-plowshares, exile, life-gain, derived-power, counters]
derived_from: oracle
source:
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "608.2h", text: "If the effect requires information from a specific object, including the source of the ability itself, the effect uses the current information of that object if it's in the public zone it was expected to be in; if it's no longer in that zone, or if the effect has moved it from a public zone to a hidden zone, the effect uses the object's last known information.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    battlefield: [{card: Murktide Regent, as: murk, counters: {"+1/+1": 2}}]
    library_pad: 10
script:
  - check:
      p1: {battlefield: [{card: Murktide Regent, pt: [5, 5]}]}
  - p0: {t: cast, card: "@stp", targets: ["@murk"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      graveyard: [Swords to Plowshares]
      battlefield: [{card: Plains, tapped: true}]
    p1:
      life: 25
      battlefield: []
      exile: [Murktide Regent]
      graveyard: []
notes: >
  The life gain goes to the creature's controller (p1), not to the caster, and equals the creature's power as it last
  existed on the battlefield: printed 3 plus two +1/+1 counters = 5 (608.2h, last known information, because the effect
  moved it to exile). A wrong engine uses the printed power (gain 3), reads the power after the counters fell off in
  exile, gives the life to the caster, or puts the creature into the graveyard instead of exile.
