id: tron2-a-confluence-blink-trinisphere-returns-tapped-so-lightning-bolt-costs-one-mana
title: "Eldrazi Confluence blinks p0's own Trinisphere: it returns tapped, the tax switches off, and a one-Mountain Lightning Bolt becomes castable"
area: card
cards: [Eldrazi Confluence, Ancient Tomb, Island, Mountain, Trinisphere, Lightning Bolt, Eldrazi Scion Token]
tags: [eldrazi-confluence, modal, blink, enters-tapped, trinisphere, cost-increase, untapped-condition, eldrazi-scion]
derived_from: oracle
source:
  - {kind: oracle, card: Eldrazi Confluence, text: "Exile target nonland permanent, then return it to the battlefield tapped under its owner's control.", verified: true}
  - {kind: oracle, card: Trinisphere, text: "As long as this artifact is untapped, each spell that would cost less than three mana to cast costs three mana to cast.", verified: true}
  - {kind: cr, ref: "601.2f", text: "The player determines the total cost of the spell. Usually this is just the mana cost. Some spells have additional or alternative costs. Some effects may increase or reduce the cost to pay, or may provide other alternative costs. Costs may include paying mana, tapping permanents, sacrificing permanents, discarding cards, and so on. The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions. If multiple cost reductions apply, the player may apply them in any order. If the mana component of the total cost is reduced to nothing by cost reduction effects, it is considered to be {0}. It can’t be reduced to less than {0}. Once the total cost is determined, any effects that directly affect the total cost are applied. Then the resulting total cost becomes “locked in.” If effects would change the total cost after this time, they have no effect.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Eldrazi Confluence @conf", "Lightning Bolt @bolt"]
    battlefield: ["Ancient Tomb @tomb", "Island @i1", "Island @i2", "Mountain @mt", "Trinisphere @tri"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@conf", modes: [9], targets: ["@tri"], pay: {tap: ["@tomb", "@i1", "@i2"]}}
  - check:
      stack: [{kind: spell, card: "@conf", controller: p0}]
      p0: {battlefield_contains: [{card: Trinisphere, tapped: false}]}
  - expect_illegal: {p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@mt"]}}}
  - resolve_top: true
  - check:
      stack: []
      p0: {battlefield_contains: [{card: Trinisphere, tapped: true}]}
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@mt"]}}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 18
      graveyard: [Eldrazi Confluence, Lightning Bolt]
      battlefield_contains: [{card: Mountain, tapped: true}, {card: Trinisphere, tapped: true}]
    p1:
      life: 17
notes: >
  While Confluence is on the stack Trinisphere is untapped, so Lightning Bolt costs {3} and one Mountain cannot pay it
  (expect_illegal). Confluence (multiset 8, `modes: [9]`) exiles Trinisphere and returns it tapped, so the "as long as this
  artifact is untapped" condition is false and Bolt costs {R} again: the same Mountain now pays for it and p1 goes to 17.
  Confluence itself costs {2}{C}{C} = 4 mana, which Trinisphere does not change. A wrong engine returns Trinisphere untapped
  and keeps taxing, or never re-evaluates the tax.
