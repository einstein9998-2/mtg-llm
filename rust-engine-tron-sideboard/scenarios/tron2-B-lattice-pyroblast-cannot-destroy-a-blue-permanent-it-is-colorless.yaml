notes: >
  Thassa's Oracle ({U}{U}) is blue as a card, but the permanent is colorless under Lattice, so "destroy target permanent if
  it's blue" does nothing: the Oracle stays (and is a Creature + Artifact). The Lattice is controlled by the opponent: it
  affects every permanent of both players. A wrong engine evaluates the printed color of the permanent.
