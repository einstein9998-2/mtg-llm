id: tomb-veils-of-fear-apnap-discard-or-lose-two
title: From Trapped Entry the venture offers Veils of Fear and Oubliette; in Veils of Fear p0 chooses first (discards), then p1 (declines and loses 2)
area: card
cards: [Acererak the Archlich, Aluren, Island, Force of Will]
tags: [venture, choose-room, room-ability, apnap, opponent-choice, discard, life-loss, tomb]
derived_from: cr
source:
  - {kind: cr, ref: "101.4", text: "If multiple players would make choices and/or take actions at the same time, the active player ... makes any choices required, then the next player in turn order ... Then the actions happen simultaneously.", verified: true}
  - {kind: cr, ref: "701.9b", text: "By default, effects that cause a player to discard a card allow the affected player to choose which card to discard.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "Tomb of Annihilation: Trapped Entry leads to Veils of Fear and Oubliette; Veils of Fear: Each player loses 2 life unless they discard a card.", verified: false, note: "dungeon room text and arrows from reference/oracle.json dungeons section"}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    life: 19
    hand: ["Acererak the Archlich @acer", "Island @isl0"]
    battlefield: ["Aluren @alu"]
    command: [{dungeon: Tomb of Annihilation, room: Trapped Entry}]
    library_pad: 10
  p1:
    life: 19
    hand: ["Force of Will @fow"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - resolve_top: true
  - resolve_top: true
  - p0: {decision: choose_room, answer: Veils of Fear, expect_options: {exact: [Veils of Fear, Oubliette]}}
  - resolve_top: true
  - p0: {decision: yes_no, purpose: discard_instead, answer: true}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@isl0"], expect_options: {include: ["@isl0", "@acer"], exclude: ["@fow"]}}
  - p1: {decision: yes_no, purpose: discard_instead, answer: false}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 19, hand: [Acererak the Archlich], graveyard: [Island], command: [{dungeon: Tomb of Annihilation, room: Veils of Fear}]}
    p1: {life: 17, hand: [Force of Will], graveyard: []}
notes: >
  Each player decides for themselves, in APNAP order (p0 is active, so p0's choice and card come first), then everything
  happens at once. p0 may discard any card in hand, including the just-returned Acererak; p0 picks the Island. p1 keeps
  Force of Will and loses 2. Bugs caught (one observed in an earlier engine): the dungeon owner choosing the opponent's
  discard, the engine choosing a discard for p0, Veils hurting only opponents, and wrong choice order.
---
