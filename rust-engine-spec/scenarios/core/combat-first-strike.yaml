id: mana-empties-between-the-two-combat-damage-steps
title: Mana added during the first-strike damage step is lost when that step ends and cannot pay for Lightning Bolt in the regular damage step
area: core
cards: [Ocelot Pride, Mountain, Lightning Bolt]
tags: [mana-pool, mana-empties, combat-damage-steps, first-strike, turn-structure]
derived_from: cr
source:
  - {kind: cr, ref: "106.4", text: "Each player’s mana pool empties at the end of each step and phase, and the player is said to lose this mana.", verified: true}
  - {kind: cr, ref: "405.6c", text: "If a player had priority before a mana ability was activated, that player gets priority after it resolves.", verified: true}
  - {kind: cr, ref: "510.4", text: "After that step, instead of proceeding to the end of combat step, the phase gets a second combat damage step.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Ocelot Pride @oc", "Mountain @m1"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@oc", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: activate, source: "@m1", ability: 0}
  - check:
      phase: first_strike_damage
      pending: {actor: p0, kind: priority}
      p0: {mana_pool: {R: 1}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      phase: combat_damage
      pending: {actor: p0, kind: priority}
      p0: {mana_pool: {}}
  - expect_illegal: {p0: {t: cast, card: "@bolt", targets: [{player: p1}]}}
expect:
  - at: after_script
    phase: combat_damage
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {hand: [Lightning Bolt], mana_pool: {}, battlefield_contains: [{card: Mountain, tapped: true}]}
    p1: {life: 19}
notes: >
  The first-strike damage step and the regular combat damage step are separate steps, so the {R} p0 floated in the
  first one empties when it ends (106.4). In the regular step p0 has no mana and no untapped land, so Bolt is not
  castable. The mana ability does not use the stack and p0 keeps priority (405.6c). Wrong engine: the pool survives
  across combat damage steps (one "combat damage" phase).
