id: tron-a-karn-plus-one-effect-ends-at-karns-next-turn
title: "Karn's +1 keeps Voltaic Key a 1/1 creature through the opponent's turn and it is a plain artifact again by p0's next upkeep"
area: card
cards: ["Karn, the Great Creator", Voltaic Key]
tags: [karn-the-great-creator, loyalty-ability, becomes-creature, duration, until-your-next-turn, tron]
derived_from: oracle
source:
  - {kind: oracle, card: "Karn, the Great Creator", text: "Until your next turn, up to one target noncreature artifact becomes an artifact creature with power and toughness each equal to its mana value.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as “until end of turn”).", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: [{card: "Karn, the Great Creator", as: karn, counters: {loyalty: 4}}, "Voltaic Key @key"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@karn", ability: 0, targets: ["@key"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - advance: {to: begin_combat, of: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: []}
  - advance: {to: main1, of: p1}
  - check:
      turn: 4
      p0: {battlefield_contains: [{card: Voltaic Key, types: [Artifact, Creature], pt: [1, 1]}]}
  - advance: {to: upkeep, of: p0}
expect:
  - at: after_script
    turn: 5
    phase: upkeep
    p0:
      battlefield: [{card: "Karn, the Great Creator", counters: {loyalty: 5}}, {card: Voltaic Key, types: [Artifact]}]
notes: >
  The animation survives p0's end of turn and all of p1's turn 4 (checked at p1's main phase) and has ended by p0's turn 5
  upkeep: the Key's types are exactly Artifact again. The exact instant it ends (the start of the turn) is not asserted.
