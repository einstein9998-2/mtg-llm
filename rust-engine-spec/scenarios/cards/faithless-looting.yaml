id: faithless-looting-draw-two-then-discard-two
title: Faithless Looting draws two cards, then its caster discards two cards of their choice from the whole hand
area: card
cards: [Faithless Looting, Griselbrand, Archon of Cruelty, Swamp, Badlands, Island]
tags: [faithless-looting, draw, discard, sequencing]
derived_from: oracle
source:
  - {kind: oracle, card: Faithless Looting, text: "Draw two cards, then discard two cards.", verified: true}
  - {kind: cr, ref: "608.2c", text: "The controller of the spell or ability follows its instructions in the order written.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Faithless Looting @fl", "Griselbrand @g"]
    battlefield: ["Badlands @b"]
    library: ["Archon of Cruelty @a", "Swamp @s"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@fl", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@g", "@a"], expect_options: {include: ["@g", "@a", "@s"], count: 3}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Swamp]
      library_count: 10
      graveyard: [Faithless Looting, Griselbrand, Archon of Cruelty]
      battlefield: [{card: Badlands, tapped: true}]
notes: >
  The draws happen first, so the discard choice covers the two drawn cards and the card already in hand (three
  options). p0 discards both creatures, a typical Reanimator setup. Wrong engines: discard before drawing, discard at
  random, or let the opponent choose.
