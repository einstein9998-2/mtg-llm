area: card
cards: ["Kozilek's Command", "Urza's Tower", "Urza's Mine", "Urza's Power Plant", Faerie Macabre, Eldrazi Spawn Token]
tags: [kozileks-command, x-spell, tron, spawn-tokens, exile, modal, mana-payment]
