notes: >
  On p1's turn every p0 spell costs {3} more, including Aluren's free casts (118.9d). Priority detail: after each
  resolution the active player p1 receives priority first (117.3b), so the passes alternate p1 then p0, and after the room
  ability resolves p1 passes once more to hand p0 priority in the same end step. Six Swamps pay for two iterations; the
  third cast is not offered. The loop is bounded by mana, not by any loop counter. The same casts on p0's own turn would
  be free (see aluren-defense-grid-no-tax-on-own-turn).
