id: ur-b-pyrokinesis-three-plus-one-damage-stays-marked
title: "Pyrokinesis 3 on a 3/4 (survives, 3 marked) and 1 on my own 1/1 (dies); a later Lightning Bolt finishes the damaged creature"
area: card
cards: [Pyrokinesis, Lightning Bolt, Mountain, Ocelot Pride, Street Wraith]
tags: [pyrokinesis, divided-damage, three-plus-one, own-creature-target, nonlethal-damage, damage-accumulates, lightning-bolt]
derived_from: oracle
source:
  - {kind: oracle, card: Pyrokinesis, text: "Pyrokinesis deals 4 damage divided as you choose among any number of target creatures.", verified: true}
  - {kind: cr, ref: "120.3e", text: "Damage dealt to a creature by a source with neither wither nor infect causes that much damage to be marked on that creature.", verified: true}
  - {kind: cr, ref: "704.5g", text: "If a creature has toughness greater than 0, it has damage marked on it, and the total damage marked on it is greater than or equal to its toughness, that creature has been dealt lethal damage and is destroyed. Regeneration can replace this event.", verified: true}
  - {kind: cr, ref: "601.2d", text: "If the spell requires the player to divide or distribute an effect (such as damage or counters) among one or more targets, the player announces the division. Each of these targets must receive at least one of whatever is being divided.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Pyrokinesis @pyro", "Lightning Bolt @bolt1", "Lightning Bolt @bolt2"]
    battlefield: ["Mountain @m", "Ocelot Pride @pride"]
    library_pad: 10
  p1:
    battlefield: ["Street Wraith @salv"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@pyro", alt_cost: {exile_red_card: "@bolt1"}, divide: {"@salv": 3, "@pride": 1}}
  - p0: {t: pass}
  - p1: {t: pass}
  - label: after-pyrokinesis
    check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0:
        battlefield: [{card: Mountain, tapped: false}]
        graveyard: [Pyrokinesis, Ocelot Pride]
        exile: [Lightning Bolt]
      p1: {battlefield: [{card: Street Wraith, damage: 3, pt: [3, 4]}]}
  - p0: {t: cast, card: "@bolt2", targets: ["@salv"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      battlefield: [{card: Mountain, tapped: true}]
      graveyard: [Pyrokinesis, Ocelot Pride, Lightning Bolt]
      exile: [Lightning Bolt]
    p1:
      battlefield: []
      graveyard: [Street Wraith]
notes: >
  Pyrokinesis may target any creatures, including the caster's own: 3 damage marks on Street Wraith (3/4, survives
  with 3 marked) and 1 kills the caster's Ocelot Pride (1/1). Damage stays marked for the rest of the turn (120.3e), so
  the Lightning Bolt cast afterwards (3 more, 6 in total) destroys the Street Wraith (704.5g). A wrong engine heals the
  creature between spells, or rounds the 3 share up to lethal.
