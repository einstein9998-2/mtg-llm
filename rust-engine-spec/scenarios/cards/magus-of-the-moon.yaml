id: magus-hedge-maze-enters-untapped-without-surveil
title: Under Magus of the Moon, a played Hedge Maze enters untapped and its surveil ability does not trigger
area: card
cards: [Magus of the Moon, Hedge Maze, Lightning Bolt, Ponder, Mountain]
tags: [magus-of-the-moon, layers, enters-tapped, replacement-lookahead, triggers, surveil-land]
derived_from: cr
source:
  - {kind: oracle, card: Magus of the Moon, text: "Nonbasic lands are Mountains.", verified: true}
  - {kind: oracle, card: Hedge Maze, text: "This land enters tapped.", verified: true}
  - {kind: oracle, card: Hedge Maze, text: "When this land enters, surveil 1.", verified: true}
  - {kind: cr, ref: "614.12", text: "To determine which replacement effects apply and how they apply, check the characteristics of the permanent as it would exist on the battlefield, taking into account replacement effects that have already modified how it enters the battlefield (see rule 616.1), continuous effects from the permanent’s own static abilities that would apply to it once it’s on the battlefield, and continuous effects that already exist and would apply to the permanent.", verified: true}
  - {kind: cr, ref: "603.10", text: "Normally, objects that exist immediately after an event are checked to see if the event matched any trigger conditions, and continuous effects that exist at that time are used to determine what the trigger conditions are and what the objects involved in the event look like.", verified: true}
  - {kind: cr, ref: "305.7", text: "It loses all abilities generated from its rules text, its old land types, and any copiable effects affecting that land, and it gains the appropriate mana ability for each new basic land type.", verified: true}
  - {kind: cr, ref: "603.6d", text: "Some permanents have text that reads “[This permanent] enters with . . . ,” “As [this permanent] enters . . . ,” “[This permanent] enters as . . . ,” or “[This permanent] enters tapped.” Such text is a static ability—not a triggered ability—whose effect occurs as part of the event that puts the permanent onto the battlefield.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Hedge Maze @hm", "Lightning Bolt @bolt"]
    library: ["Ponder @pd"]
    library_pad: 10
  p1:
    battlefield: ["Magus of the Moon @magus"]
    library_pad: 10
script:
  - p0: {t: play_land, card: "@hm"}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {battlefield: [{card: Hedge Maze, tapped: false, subtypes: [Mountain]}], lands_played: 1}
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@hm"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      library_top: [Ponder]
      library_count: 11
      graveyard: [Lightning Bolt]
      battlefield: [{card: Hedge Maze, tapped: true}]
    p1: {life: 17}
notes: >
  "This land enters tapped" is a replacement effect of Hedge Maze's own rules text. 614.12 says to look at the land as
  it would exist on the battlefield with existing continuous effects applied: under Magus it would be a Mountain with
  no such ability, so it enters untapped. Its enters trigger is checked after the event (603.10, ETB is not a
  look-back trigger) when the Maze has no such ability, so nothing triggers: no surveil decision, the stack is empty,
  Ponder stays on top. The untapped Maze makes {R} for Bolt. A wrong engine enters it tapped (Bolt uncastable) or
  raises a surveil decision.
---
