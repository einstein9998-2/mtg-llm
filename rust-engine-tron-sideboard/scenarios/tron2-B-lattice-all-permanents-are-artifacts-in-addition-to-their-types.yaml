notes: >
  The type set is exact: Lattice adds Artifact without removing anything, to both players' permanents. The opponent's
  Mountain and the controller's Island are Land + Artifact, a creature and a creature token are Creature + Artifact, and a
  planeswalker is Planeswalker + Artifact. Existing artifacts (Lattice itself, Null Rod) are unchanged. Karn's static
  ability does not matter here (no abilities are activated). Karn is chosen to show the planeswalker case; the scenarios
  that follow use the artifact-ness of lands.
