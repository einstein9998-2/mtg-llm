id: tron-b-portable-hole-legal-targets-mana-value-two-or-less-nonland
title: Portable Hole may target only an opponent's nonland permanent with mana value 2 or less, tokens (mana value 0) and Lotus Petal included
area: card
cards: [Portable Hole, Carpet of Flowers, Ocelot Pride, Lotus Petal, Flickerwisp, Aluren, Island, Plains, Cat Token (Ocelot Pride)]
tags: [portable-hole, etb-trigger, targeting, mana-value, token, nonland, opponent-only, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Portable Hole, text: "exile target nonland permanent an opponent controls with mana value 2 or less", verified: true}
  - {kind: cr, ref: "202.3a", text: "The mana value of an object with no mana cost is 0", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Portable Hole @hole"]
    battlefield: ["Plains @pl", "Carpet of Flowers @carpet"]
    library_pad: 10
  p1:
    battlefield:
      - "Ocelot Pride @op"
      - "Lotus Petal @petal"
      - "Flickerwisp @wisp"
      - "Aluren @alu"
      - "Island @isl"
      - {token: Cat Token (Ocelot Pride), as: cat}
    library_pad: 10
script:
  - p0: {t: cast, card: "@hole", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: choose_target
      slot: 0
      answer: "@petal"
      expect_options:
        include: ["@op", "@petal", "@cat"]
        exclude: ["@wisp", "@alu", "@isl", "@carpet", "@hole"]
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield:
        - {card: Portable Hole}
        - {card: Plains, tapped: true}
        - {card: Carpet of Flowers}
    p1:
      exile: [Lotus Petal]
      battlefield:
        - {card: Ocelot Pride}
        - {card: Flickerwisp}
        - {card: Aluren}
        - {card: Island}
        - {token: Cat Token (Ocelot Pride)}
notes: >
  Legal: Ocelot Pride (mana value 1), Lotus Petal (mana value 0, an artifact is a nonland permanent) and the Cat token (a
  token has no mana cost, mana value 0). Illegal: Flickerwisp (3), Aluren (4), the Island (a land), p0's own Carpet of Flowers
  (mana value 1 but not an opponent's permanent) and the Hole itself. The mask is asserted with expect_options; Lotus Petal is
  chosen and exiled. A wrong engine forgets the opponent restriction, treats tokens as ineligible, or lets lands through.
