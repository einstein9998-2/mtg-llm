id: storm-a-beseech-bargained-mana-value-five-goes-to-hand
title: "Bargained Beseech finding Force of Will (mana value 5) cannot cast it free: the card goes to hand with no choice"
area: card
cards: [Beseech the Mirror, Force of Will, Lotus Petal, Swamp, Island]
tags: [beseech-the-mirror, bargain, mana-value, boundary, free-cast-not-allowed]
derived_from: oracle
source:
  - {kind: oracle, card: Beseech the Mirror, text: "If this spell was bargained, you may cast the exiled card without paying its mana cost if that spell's mana value is 4 or less.", verified: true}
  - {kind: oracle, card: Beseech the Mirror, text: "Put the exiled card into your hand if it wasn't cast this way.", verified: true}
  - {kind: cr, ref: "702.166c", text: "Objects with bargain have additional abilities that specify what happens if they were bargained.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Beseech the Mirror @bes"]
    battlefield: ["Swamp @s1", "Swamp @s2", "Swamp @s3", "Swamp @s4", "Lotus Petal @petal"]
    library: ["Force of Will @fow", "Island"]
    library_pad: 4
  p1:
    library_pad: 10
random: any
script:
  - p0: {t: cast, card: "@bes", bargained: true, sacrifice: ["@petal"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, found: "@fow"}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Force of Will]
      exile: []
      graveyard: [Beseech the Mirror, Lotus Petal]
      library_count: 5
      spells_cast_this_turn: 1
    p1: {life: 20}
notes: >
  Force of Will ({3}{U}{U}) has mana value 5, one above the limit, so the free cast is not allowed even though Beseech
  was bargained. The player has no choice (no yes_no is raised; the script has no step after the search) and the card goes to
  hand. The bargain cost was still paid (Lotus Petal in the graveyard). A wrong engine offers the cast for any
  mana value, or compares with the wrong boundary.
