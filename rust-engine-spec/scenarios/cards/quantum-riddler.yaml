  - check:
      turn: 5
      p0: {hand_count: 4, exile: [Quantum Riddler]}
  - expect_illegal: {p0: {t: cast, card: "@qr", alt_cost: {warp: true}}}
  - p0: {t: cast, card: "@qr", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - resolve_top: true
  - advance: {to: end, of: p0}
expect:
  - at: after_script
    turn: 5
    phase: end
