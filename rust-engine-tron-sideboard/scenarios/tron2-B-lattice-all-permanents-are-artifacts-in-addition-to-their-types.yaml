expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield:
        - {card: Mycosynth Lattice, types: [Artifact]}
        - {card: Island, types: [Land, Artifact]}
        - {card: Containment Priest, types: [Creature, Artifact], pt: [2, 2]}
        - {token: Goblin Token, types: [Creature, Artifact]}
