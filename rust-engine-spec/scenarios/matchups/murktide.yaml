cards: [Murktide Regent, Force of Will, Brainstorm, Daze, Lightning Bolt, "Mishra's Bauble", Scalding Tarn, Volcanic Island, Island, Tropical Island]
tags: [matchup, murktide, delve, counterspell, no-refund]
derived_from: cr
source:
  - {kind: cr, ref: "701.6b", text: "The player who cast a countered spell or activated a countered ability doesn't get a \"refund\" of any costs that were paid.", verified: true}
  - {kind: cr, ref: "702.66a", text: "For each generic mana in this spell's total cost, you may exile a card from your graveyard rather than pay that mana.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
setup:
