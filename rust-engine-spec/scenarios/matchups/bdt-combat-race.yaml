id: mu-bdt-cloak-and-dagger-blocks-ocelot-lifelink-in-two-steps
title: Cloak and Dagger blocks Ocelot Pride; Ocelot's first-strike lifelink gains Boros 1, then Cloak's deathtouch lifelink damage kills Ocelot and gains D&T 2
area: matchup
cards: [Ocelot Pride, "Cloak and Dagger, Entwined"]
tags: [matchup, boros-vs-dt, combat, first-strike, lifelink, deathtouch, combat-damage-steps]
derived_from: cr
source:
  - {kind: oracle, card: Ocelot Pride, text: "First strike, lifelink", verified: true}
  - {kind: oracle, card: "Cloak and Dagger, Entwined", text: "Deathtouch, lifelink", verified: true}
  - {kind: cr, ref: "702.7b", text: "The only creatures that assign combat damage in that step are the remaining attackers and blockers that had neither first strike nor double strike as the first combat damage step began", verified: true}
  - {kind: cr, ref: "702.15b", text: "Damage dealt by a source with lifelink causes that source’s controller, or its owner if it has no controller, to gain that much life", verified: true}
  - {kind: cr, ref: "702.2b", text: "A creature with toughness greater than 0 that’s been dealt damage by a source with deathtouch since the last time state-based actions were checked is destroyed as a state-based action.", verified: true}
setup:
  turn: 7
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Ocelot Pride @oc"]
    library_pad: 10
  p1:
    battlefield: ["Cloak and Dagger, Entwined @cd"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@oc", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: [{blocker: "@cd", attacker: "@oc"}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - label: first-strike-step
    check:
      phase: first_strike_damage
      pending: {actor: p0, kind: priority}
      p0: {life: 21, battlefield: [{card: Ocelot Pride, damage: 0}]}
      p1: {life: 20, battlefield: [{card: "Cloak and Dagger, Entwined", damage: 1}]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    phase: combat_damage
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 21
      graveyard: [Ocelot Pride]
      battlefield: []
    p1:
      life: 22
      battlefield: [{card: "Cloak and Dagger, Entwined", damage: 1}]
notes: >
  Ocelot deals its 1 first-strike damage in the first step (p0 21); the 2/2 Cloak survives with 1 damage and deals its
  2 in the second step (only creatures without first strike deal damage there, 702.7b): p1 gains 2 (22) and Ocelot is
  destroyed (lethal and deathtouch). A wrong engine resolves all combat damage in one step, or applies Cloak's
  lifelink in the first-strike step.
---
id: mu-bdt-raptor-first-strike-kills-cloak-before-deathtouch-lifelink
