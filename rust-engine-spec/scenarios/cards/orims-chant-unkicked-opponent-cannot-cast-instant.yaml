id: orims-chant-unkicked-opponent-cannot-cast-instant
title: "Unkicked Orim's Chant on the opponent: once it resolves the opponent is not offered Lightning Bolt for the rest of the turn"
area: card
cards: ["Orim's Chant", Plains, Lightning Bolt, Mountain]
tags: [orims-chant, casting-restriction, legal-action-mask, negative-case, cant-beats-can]
derived_from: oracle
source:
  - {kind: oracle, card: "Orim's Chant", text: "Target player can't cast spells this turn.", verified: true, note: "Orim's Chant Oracle text supplied by the engine owner from Scryfall data; the card is not yet in reference/oracle.json (an entry is provided in NOTES.md)"}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can’t happen, the “can’t” effect takes precedence.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as “until end of turn”).", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Orim's Chant @chant"]
    battlefield: ["Plains @pl1", "Plains @pl2"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
script:
  - check:
      legal: {p0: {include: [{t: cast, card: "@chant", kicked: false, targets: [{player: p1}]}]}}
  - p0: {t: cast, card: "@chant", kicked: false, targets: [{player: p1}], pay: {tap: ["@pl1"]}}
  - check:
      stack: [{kind: spell, card: "@chant", controller: p0, targets: [{player: p1}]}]
      pending: {actor: p0, kind: priority}
      p0: {battlefield: [{card: Plains, tapped: true}, {card: Plains, tapped: false}]}
  - p0: {t: pass}
  - label: chant-still-on-stack
    check:
      pending: {actor: p1, kind: priority}
      legal: {p1: {include: [{t: cast, card: "@bolt", targets: [{player: p0}]}]}}
  - p1: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {graveyard: ["Orim's Chant"]}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: {tap: ["@m1"]}}}
  - expect_illegal: {p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}}
  - check:
      legal: {p1: {include: [{t: pass}], exclude: [{t: cast, card: "@bolt"}]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 20
      graveyard: ["Orim's Chant"]
      spells_cast_this_turn: 1
      battlefield: [{card: Plains, tapped: true}, {card: Plains, tapped: false}]
    p1:
      life: 20
      hand: [Lightning Bolt]
      spells_cast_this_turn: 0
      battlefield: [{card: Mountain, tapped: false}, {card: Mountain, tapped: false}]
notes: >
  Baseline scenario. While Chant is still on the stack p1 can cast Bolt (the effect does not exist yet; control check
  labelled chant-still-on-stack), but after Chant resolves p1 has priority in the same main phase with two untapped
  Mountains and no legal cast. The kicker is declined (kicked: false), so only one Plains is tapped and the second stays
  untapped (601.2f: total cost is {W} only). Wrong engines: apply the restriction to the next turn only, restrict only
  sorcery-speed spells, restrict by mana availability, or let the restriction apply while Chant is still on the stack.
