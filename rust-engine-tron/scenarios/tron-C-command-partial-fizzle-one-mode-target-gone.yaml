id: tron-c-kozileks-command-resolves-when-only-one-modes-target-is-illegal
title: "If the creature targeted by Kozilek's Command mode 3 is exiled in response, the spell still resolves for its other mode (the Spawn tokens are made)"
area: card
cards: ["Kozilek's Command", Ancient Tomb, Mountain, "Phelia, Exuberant Shepherd", Swords to Plowshares, Plains, Eldrazi Spawn Token]
tags: [kozileks-command, partial-fizzle, target-legality, resolution, swords-to-plowshares, modal]
derived_from: cr
source:
