id: mu-swords-nethergoyf-life-equals-own-graveyard-types
title: UWx's Swords to Plowshares exiles a 3/4 Nethergoyf and Dimir gains 3; the creature card in UWx's graveyard does not count
area: matchup
cards: [Swords to Plowshares, Nethergoyf, Polluted Delta, Brainstorm, Thoughtseize, "Phelia, Exuberant Shepherd", Tundra, Underground Sea]
tags: [matchup, dimir-vs-uwx, swords-to-plowshares, nethergoyf, characteristic-defining, life-gain, last-known-information]
derived_from: cr
source:
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: oracle, card: Nethergoyf, text: "Nethergoyf's power is equal to the number of card types among cards in your graveyard and its toughness is equal to that number plus 1.", verified: true}
  - {kind: cr, ref: "608.2h", text: "If the effect requires information from a specific object, including the source of the ability itself, the effect uses the current information of that object if it’s in the public zone it was expected to be in; if it’s no longer in that zone, or if the effect has moved it from a public zone to a hidden zone, the effect uses the object’s last known information.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Nethergoyf @ng", "Underground Sea @us1"]
    graveyard: ["Polluted Delta @g1", "Brainstorm @g2", "Thoughtseize @g3"]
    library_pad: 10
  p1:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Tundra @t1"]
    graveyard: ["Phelia, Exuberant Shepherd @g4"]
    library_pad: 10
script:
  - check: {p0: {battlefield_contains: [{card: Nethergoyf, pt: [3, 4]}]}}
  - p1: {t: cast, card: "@stp", targets: ["@ng"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 23
      exile: [Nethergoyf]
      battlefield: [{card: Underground Sea}]
      graveyard: [Polluted Delta, Brainstorm, Thoughtseize]
    p1:
      life: 20
      graveyard: ["Phelia, Exuberant Shepherd", Swords to Plowshares]
notes: >
  Nethergoyf counts land, instant and sorcery in p0's graveyard: 3/4 (Phelia, a creature card, is in p1's graveyard and
  does not count). Swords exiles it and its controller p0 gains life equal to its power, using last known information
  (3). Bugs caught: counting both graveyards (4 life), using the exiled card's printed */1+* (0 life), giving the life
  to the caster.
