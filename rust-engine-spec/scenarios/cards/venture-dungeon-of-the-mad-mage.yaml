id: mad-mage-mad-wizards-lair-free-cast-and-completion
title: Mad Wizard's Lair draws three, lets p0 cast one of them free during resolution, and the dungeon is completed with that spell still on the stack
area: card
cards: [Acererak the Archlich, Aluren, Lightning Bolt, Island, Ponder]
tags: [venture, room-ability, cast-during-resolution, alternative-cost, dungeon-completion, state-based-actions, mad-mage]
derived_from: cr
source:
  - {kind: cr, ref: "608.2g", text: "If an effect specifically instructs or allows a player to cast a spell during resolution, they do so by following the steps in rules 601.2a-i, except no player receives priority after it's cast. That spell becomes the topmost object on the stack, and the currently resolving spell or ability continues to resolve", verified: true}
  - {kind: cr, ref: "704.5t", text: "If a player's venture marker is on the bottommost room of a dungeon card, and that dungeon card isn't the source of a room ability that has triggered but not yet left the stack, the dungeon card's owner removes it from the game.", verified: true}
  - {kind: cr, ref: "118.9", text: "Alternative costs are usually phrased, \"You may [action] rather than pay [this object's] mana cost,\" or \"You may cast [this object] without paying its mana cost.\"", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Lightning Bolt, text: "Lightning Bolt deals 3 damage to any target.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "Dungeon of the Mad Mage: Deep Mines leads to Mad Wizard's Lair (bottom); Mad Wizard's Lair: Draw three cards and reveal them. You may cast one of them without paying its mana cost.", verified: false, note: "dungeon room text and arrows from reference/oracle.json dungeons section"}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    command: [{dungeon: Dungeon of the Mad Mage, room: Deep Mines}]
    library: ["Lightning Bolt @bolt", "Island @i1", "Ponder @pd"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - resolve_top: true
  - resolve_top: true
  - resolve_top: true
  - p0: {decision: choose_cards, purpose: cast_without_paying, answer: ["@bolt"], expect_options: {include: ["@bolt"], exclude: ["@i1", "@acer"]}}
  - p0: {decision: choose_target, slot: 0, answer: {player: p1}}
  - label: bolt-on-stack
    check:
      stack: [{kind: spell, card: "@bolt", controller: p0, targets: [{player: p1}]}]
      pending: {actor: p0, kind: priority}
      p0:
        hand: [Acererak the Archlich, Island, Ponder]
        command: []
        completed_dungeons: [Dungeon of the Mad Mage]
        battlefield: [{card: Aluren}]
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    p1: {life: 17}
    p0: {graveyard: [Lightning Bolt], spells_cast_this_turn: 2, completed_dungeons: [Dungeon of the Mad Mage]}
notes: >
  The three drawn cards are revealed; the cast option covers only those three and not the Island (a land is not cast) or
  Acererak (not one of them). Bolt is cast during the resolution, goes on the stack, and nobody gets priority until the Lair
  ability finishes. Then the Lair ability has left the stack, so the state-based action completes the dungeon before p0
  gets priority, with Bolt still on the stack. Bolt counts as a spell cast (2 this turn). Whether a drawn sorcery (Ponder)
  could also be chosen is not asserted (REPORT ambiguities). Decision modelling (choose_cards with one card, empty answer =
  decline) is a format assumption flagged in REPORT.
