    p0: {hand: [], battlefield: [{card: Plains, tapped: true}]}
notes: >
  "Target creature" admits only creatures on the battlefield. The three probes must be absent from the legal set; the
  final cast on a creature is the positive control in the same scenario, so an engine that offers nothing also fails.
  After casting, p0 holds priority again (117.3c).
