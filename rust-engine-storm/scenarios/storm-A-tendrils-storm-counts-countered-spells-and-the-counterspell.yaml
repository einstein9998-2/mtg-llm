notes: >
  Countering a spell does not un-cast it. Spells cast before Tendrils: p0's countered Dark Ritual and p1's Force of Will = 2, so two
  copies. p1 pays 1 life for the pitch (19) and loses 6 more (13); p0 gains 6 (26). The Ritual gave no mana: Tendrils is paid
  with four of the other Swamps.
