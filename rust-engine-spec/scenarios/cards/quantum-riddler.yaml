id: quantum-riddler-etb-with-empty-hand-draws-two
title: Quantum Riddler's enters trigger draws two cards when its controller has no other cards in hand
area: card
cards: [Quantum Riddler, Island, Ponder, Brainstorm, Lightning Bolt]
tags: [quantum-riddler, etb-trigger, replacement-effect, draw]
derived_from: oracle
source:
  - {kind: oracle, card: Quantum Riddler, text: "When this creature enters, draw a card.", verified: true}
  - {kind: oracle, card: Quantum Riddler, text: "As long as you have one or fewer cards in hand, if you would draw one or more cards, you draw that many cards plus one instead.", verified: true}
  - {kind: cr, ref: "614.1a", text: "Effects that use the word “instead” are replacement effects.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Quantum Riddler @qr"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3", "Island @i4", "Island @i5"]
    library: ["Ponder @c1", "Brainstorm @c2", "Lightning Bolt @c3"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@qr", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@qr", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0: {hand_count: 0}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Ponder, Brainstorm]
      library_top: [Lightning Bolt]
      library_count: 11
      battlefield_contains: [{card: Quantum Riddler, pt: [4, 6], keywords: [flying]}]
notes: >
  Riddler is on the battlefield when its own trigger resolves, so its replacement applies. p0 has zero cards in hand
  (one or fewer), so "draw a card" becomes "draw two". Library 13 -> 11. Bugs caught: the replacement ignored for the
  Riddler's own trigger, the replacement only active from the next turn, drawing three.
---
