id: null-rod-does-not-affect-lands-or-nonartifact-abilities
title: Null Rod leaves a Mountain's mana ability and Scalding Tarn's fetch ability working
area: card
cards: [Null Rod, Scalding Tarn, Mountain, Island]
tags: [null-rod, land, mana-ability, fetchland, non-artifact, search]
derived_from: oracle
source:
  - {kind: oracle, card: Null Rod, text: "Activated abilities of artifacts can't be activated.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Mountain @m", "Scalding Tarn @tarn"]
    library: ["Island @isl", "Mountain @m2"]
    library_pad: 10
  p1:
    battlefield: ["Null Rod @rod"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@m", ability: 0}
  - check:
      p0: {mana_pool: {R: 1}, battlefield_contains: [{card: Mountain, tapped: true}]}
  - p0: {t: activate, source: "@tarn", ability: 0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, purpose: fetch, found: "@isl"}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 19
      mana_pool: {R: 1}
      graveyard: [Scalding Tarn]
      battlefield: [{card: Mountain, tapped: true}, {card: Island}]
    p1: {battlefield: [{card: Null Rod}]}
notes: >
  Null Rod only restricts artifacts. A Mountain still taps for mana, and the (nonartifact) Scalding Tarn can still be paid for with 1 life and sacrificed,
  fetching the Island (the shuffle is not asserted; the library order is not asserted either). Life 20 to 19. A wrong engine applies the restriction to all permanents.
