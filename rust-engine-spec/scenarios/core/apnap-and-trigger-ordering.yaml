id: apnap-bauble-delayed-triggers-two-players-upkeep
title: "Delayed Bauble draws from both players fire in the same upkeep: the active player's goes on first, the opponent's resolves first"
area: core
cards: [Mishra's Bauble, Island]
tags: [apnap, delayed-triggers, mishras-bauble, upkeep, simultaneous-triggers]
derived_from: cr
source:
  - {kind: cr, ref: "603.7e", text: "If an activated or triggered ability creates a delayed triggered ability, the source of that delayed triggered ability is the same as the source of that other ability. The controller of that delayed triggered ability is the player who controlled that other ability as it resolved.", verified: true}
  - {kind: cr, ref: "603.2b", text: "When a phase or step begins, all abilities that trigger \"at the beginning of\" that phase or step trigger.", verified: true}
  - {kind: cr, ref: "603.3b", text: "each player, in APNAP order, puts each triggered ability they control with a trigger condition that isn't another ability triggering on the stack in any order they choose.", verified: true}
  - {kind: oracle, card: Mishra's Bauble, text: "Draw a card at the beginning of the next turn's upkeep.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Mishra's Bauble @a"]
    library_pad: 10
  p1:
    battlefield: ["Mishra's Bauble @b"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@a", ability: 0, targets: [{player: p0}]}
  - p0: {t: pass}
  - p1: {t: activate, source: "@b", ability: 0, targets: [{player: p1}]}
  - check:
      stack:
        - {kind: activated, source: "@a", controller: p0}
        - {kind: activated, source: "@b", controller: p1}
  - p1: {t: pass}
  - p0: {t: pass}
  - resolve_top: true
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {hand_count: 0, graveyard: [Mishra's Bauble]}
      p1: {hand_count: 0, graveyard: [Mishra's Bauble]}
  - advance: {to: upkeep, of: p1}
  - check:
      stack:
        - {kind: triggered, controller: p1}
        - {kind: triggered, controller: p0}
      turn: 4
      active: p1
      pending: {actor: p1, kind: priority}
  - resolve_top: true
  - check:
      stack:
        - {kind: triggered, controller: p1}
      p0: {hand_count: 1}
      p1: {hand_count: 0}
  - resolve_top: true
expect:
  - at: after_script
    turn: 4
    stack: []
    pending: {actor: p1, kind: priority}
    p0: {hand_count: 1}
    p1: {hand_count: 1}
notes: >
  Two Bauble abilities resolve in turn 3 (top first: p1's, then p0's); each creates a delayed trigger controlled by
  whoever controlled the ability (603.7e). Both trigger at the beginning of turn 4's upkeep, simultaneously. APNAP:
  p1 (active in turn 4) puts its draw on first and p0's goes on top, so p0's resolves first (the intermediate check shows
  p0 has drawn while p1 has not). p1's draw-step draw has not happened yet. Catches an engine that puts the non-active
  player's trigger first, or that keys "next turn" to the Bauble controller's own next turn. (Reviewer edit: the original
  gave p1 two Baubles and relied on no order_triggers prompt for p1's two delayed triggers, a design-doc 01 section 7.3
  behavior whose "interchangeable" test is unclear for triggers from two different source objects; an order_triggers
  prompt would have failed the advance step. One Bauble per player keeps the APNAP point without that dependency.)
---
id: show-and-tell-nonactive-players-surveil-resolves-first
title: "Show and Tell cast by p1 on p1's own turn: p1's land trigger goes on first and p0's non-active surveil resolves first"
area: core
cards: [Show and Tell, Thundering Falls, Hedge Maze, Island, Lightning Bolt, Ponder]
tags: [apnap, show-and-tell, simultaneous-secret-choice, surveil, etb, enters-tapped, nonactive-player]
derived_from: cr
source:
  - {kind: cr, ref: "603.3b", text: "each player, in APNAP order, puts each triggered ability they control with a trigger condition that isn't another ability triggering on the stack in any order they choose.", verified: true}
  - {kind: cr, ref: "101.4", text: "the active player ... makes any choices required, then the next player in turn order", verified: true}
  - {kind: oracle, card: Show and Tell, text: "Each player may put an artifact, creature, enchantment, or land card from their hand onto the battlefield.", verified: true}
  - {kind: oracle, card: Thundering Falls, text: "When this land enters, surveil 1.", verified: true}
  - {kind: oracle, card: Hedge Maze, text: "When this land enters, surveil 1.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Hedge Maze @hm"]
    library: ["Lightning Bolt @pb"]
    library_pad: 10
  p1:
    hand: ["Show and Tell @snt", "Thundering Falls @tf"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library: ["Ponder @pp"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@snt", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: simultaneous_secret_choice, answer: "@tf"}
  - p0: {decision: simultaneous_secret_choice, answer: "@hm"}
  - check:
      stack:
        - {kind: triggered, source: "@tf", controller: p1}
        - {kind: triggered, source: "@hm", controller: p0}
      pending: {actor: p1, kind: priority}
  - resolve_top: true
  - p0: {decision: surveil, to_graveyard: ["@pb"], on_top_order: []}
  - check:
      stack:
        - {kind: triggered, source: "@tf", controller: p1}
      p0: {graveyard: [Lightning Bolt]}
      p1: {library_top: [Ponder]}
  - resolve_top: true
  - p1: {decision: surveil, to_graveyard: [], on_top_order: ["@pp"]}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0: {graveyard: [Lightning Bolt], battlefield: [{card: Hedge Maze, tapped: true}]}
    p1: {graveyard: [Show and Tell], library_top: [Ponder], battlefield_contains: [{card: Thundering Falls, tapped: true}]}
notes: >
  Mirror of the show-and-tell exemplar with p1 as the active player. Both lands enter simultaneously; p1 (active) puts its
  trigger on first, p0's goes on top and resolves first, so the first surveil decision belongs to p0 (non-active).
  The secret choices are given active player first (APNAP, CR 101.4), as in the exemplar. After each resolution the active
  player (p1) holds priority.
