id: tropical-island-is-nonbasic-wasteland-target
title: Wasteland can destroy Tropical Island although it has basic land types; a basic Forest is not a legal target
area: card
cards: [Tropical Island, Wasteland, Forest]
tags: [tropical-island, wasteland, nonbasic-land, targeting]
derived_from: oracle
source:
  - {kind: oracle, card: Wasteland, text: "{T}, Sacrifice this land: Destroy target nonbasic land.", verified: true}
  - {kind: oracle, card: Tropical Island, text: "({T}: Add {G} or {U}.)", verified: true}
  - {kind: cr, ref: "205.4c", text: "Any land with the supertype \"basic\" is a basic land. Any land that doesn't have this supertype is a nonbasic land, even if it has a basic land type.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Wasteland @w"]
    library_pad: 10
  p1:
    battlefield: ["Tropical Island @ti", "Forest @fo"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate, source: "@w", ability: 1, targets: ["@fo"]}}
  - p0: {t: activate, source: "@w", ability: 1, targets: ["@ti"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Wasteland], battlefield: []}
    p1: {graveyard: [Tropical Island], battlefield: [{card: Forest}]}
notes: >
  "Nonbasic" is about the supertype Basic, not about land types: Tropical Island lacks the Basic supertype and is a
  legal Wasteland target, while the basic Forest is not. A wrong engine could treat any land with basic land types as basic.
