notes: >
  "Target player" is any player, including the caster. After Chant resolves on p0, p0's Bolt is not offered although an
  untapped Mountain is available, while p1's Bolt is (p1 Bolts p0 to 17). Wrong engines: restrict the opponent
  regardless of the target, restrict both players, or forbid the self-target.
