id: unholy-heat-deals-two-without-delirium-and-does-not-count-itself
title: Unholy Heat deals 2 damage with three card types in the graveyard, because the resolving Heat is not in the graveyard yet
area: card
cards: [Unholy Heat, Murktide Regent, Island, Ponder, Mishra's Bauble, Mountain]
tags: [unholy-heat, delirium, card-types, graveyard-count, resolution-order]
derived_from: cr
source:
  - {kind: oracle, card: Unholy Heat, text: "Unholy Heat deals 2 damage to target creature or planeswalker.", verified: true}
  - {kind: oracle, card: Unholy Heat, text: "Delirium — Unholy Heat deals 6 damage instead if there are four or more card types among cards in your graveyard.", verified: true}
  - {kind: cr, ref: "608.2n", text: "As the final part of an instant or sorcery spell’s resolution, the spell is put into its owner’s graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Unholy Heat @heat"]
    battlefield: ["Mountain @m1"]
    graveyard: ["Island", "Ponder", "Mishra's Bauble"]
    library_pad: 10
  p1:
    battlefield:
      - {card: Murktide Regent, as: mur, counters: {"+1/+1": 4}}
    library_pad: 10
script:
  - p0: {t: cast, card: "@heat", targets: ["@mur"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Island, Ponder, Mishra's Bauble, Unholy Heat]}
    p1: {battlefield: [{card: Murktide Regent, pt: [7, 7], damage: 2}]}
notes: >
  The graveyard holds a land, a sorcery and an artifact (three types). Unholy Heat is an instant, which would make a fourth type if it counted, but it is
  on the stack while it resolves and only reaches the graveyard at the end of its resolution (608.2n), so there is no delirium: 2 damage, not 6. The 7/7
  Murktide (four +1/+1 counters) survives with 2 marked damage. A wrong engine counts the resolving spell and deals 6.
