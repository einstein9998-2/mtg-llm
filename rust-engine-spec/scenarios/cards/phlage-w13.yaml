id: phlage-escape-needs-five-other-cards
title: Phlage cannot escape with only four other cards in the graveyard
area: card
cards: ["Phlage, Titan of Fire's Fury", Mountain, Plains, Lightning Bolt, Ponder, Island, Brainstorm]
tags: [phlage, escape, legal-action-mask, negative-case]
derived_from: oracle
source:
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Escape—{R}{R}{W}{W}, Exile five other cards from your graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Mountain @m1", "Mountain @m2", "Plains @pl1", "Plains @pl2"]
    graveyard: ["Phlage, Titan of Fire's Fury @ph", "Lightning Bolt @g1", "Ponder @g2", "Island @g3", "Brainstorm @g4"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@ph", alt_cost: {escape: {exile: ["@g1", "@g2", "@g3", "@g4"]}}, pay: auto}}
  - check:
      legal: {p0: {include: [{t: pass}], exclude: [{t: cast, card: "@ph"}]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: ["Phlage, Titan of Fire's Fury", Lightning Bolt, Ponder, Island, Brainstorm]
      exile: []
notes: >
  Four other cards cannot pay "Exile five other cards", and Phlage itself does not count. Paired with
  a sibling scenario.
