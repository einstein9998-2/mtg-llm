notes: >
  Cast for its mana cost Bolt would be {2}{R}, and three Plains cannot pay it (the first expect_illegal). Cast through
  Omniscience its total cost is {0}, raised to three mana with no colored symbol left (the reminder text: only the
  symbols already in the cost stay colored), so three Plains pay it. Bolt resolves, p1 at 17. A wrong engine either keeps
  the free cast free, or invents a colored requirement from the card's mana cost.
