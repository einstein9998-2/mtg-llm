id: paytest-aluren-named-two-lands-and-floating-pool
title: Aluren with two named green lands and two floating blue pays the rest from the pool, not Ancient Tomb
area: card
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Aluren @al"]
    battlefield: ["Savannah @sv", "Tropical Island @tr", "Ancient Tomb @tomb", "Island @is"]
    mana_pool: {U: 2}
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@al", pay: {tap: ["@sv", "@tr"]}}
expect:
  - at: after_script
    p0:
      life: 20
      mana_pool: {}
      battlefield_contains: [{card: Savannah, tapped: true}, {card: Tropical Island, tapped: true}, {card: Ancient Tomb, tapped: false}, {card: Island, tapped: false}]
