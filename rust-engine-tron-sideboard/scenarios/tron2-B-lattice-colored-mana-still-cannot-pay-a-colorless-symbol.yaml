id: tron2-b-lattice-colored-mana-still-cannot-pay-a-colorless-symbol
title: "Under Mycosynth Lattice colored mana still cannot pay {C}: Warping Wail ({1}{C}) is not castable with Islands, even with {U} floating"
area: card
cards: [Mycosynth Lattice, Warping Wail, Island]
tags: [mycosynth-lattice, mana-as-any-color, colorless-symbol, warping-wail, tron-sideboard]
