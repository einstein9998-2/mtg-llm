id: silence-second-noncreature-spell-not-castable-creature-still-is
title: Under Deafening Silence, after one noncreature spell a player cannot cast a second one that turn, but can still cast a creature
area: card
cards: [Deafening Silence, Plateau, Lightning Bolt, Swords to Plowshares, Ocelot Pride, Containment Priest]
tags: [deafening-silence, casting-restriction, spell-count, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Deafening Silence, text: "Each player can't cast more than one noncreature spell each turn.", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt", "Swords to Plowshares @stp", "Ocelot Pride @oc"]
    battlefield: ["Deafening Silence @ds", "Plateau @l1", "Plateau @l2", "Plateau @l3"]
    library_pad: 10
  p1:
    battlefield: ["Containment Priest @cp"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@l1"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@stp", targets: ["@cp"]}}
  - p0: {t: cast, card: "@oc", pay: {tap: ["@l2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Swords to Plowshares]
      graveyard: [Lightning Bolt]
      battlefield_contains: [{card: Ocelot Pride, sick: true}, {card: Plateau, tapped: false}]
    p1:
      life: 17
      battlefield: [{card: Containment Priest}]
notes: >
  Bolt is p0's one noncreature spell this turn. Swords is then illegal even though p0 has an untapped Plateau; Ocelot
  Pride is a creature spell and is unaffected. Deafening Silence restricts its own controller too ("each player").
