tags: [replacement-effect, enters-tapped, flash, spider-woman]
derived_from: cr
source:
  - {kind: oracle, card: "Spider-Woman, Stunning Savior", text: "Venom Blast — Artifacts and creatures your opponents control enter tapped.", verified: true}
  - {kind: oracle, card: Containment Priest, text: "Flash", verified: true}
  - {kind: cr, ref: "614.1d", text: "Continuous effects that read \"[This permanent] enters . . .\" or \"[Objects] enter [the battlefield] . . .\" are replacement effects.", verified: true}
  - {kind: cr, ref: "614.12", text: "To determine which replacement effects apply and how they apply, check the characteristics of the permanent as it would exist on the battlefield", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    battlefield: ["Spider-Woman, Stunning Savior @sw"]
    library_pad: 10
  p1:
    hand: ["Containment Priest @cp"]
    battlefield: ["Plains @pl", "Island @pi"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: cast, card: "@cp", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p1:
      battlefield:
        - {card: Containment Priest, tapped: true, controller: p1}
