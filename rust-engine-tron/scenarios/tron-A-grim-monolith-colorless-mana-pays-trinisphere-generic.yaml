id: tron-a-grim-monolith-colorless-mana-pays-trinisphere-generic
title: "Grim Monolith's {C}{C}{C} can pay the two extra generic mana of a Trinisphere-taxed Lightning Bolt, but cannot pay the {R}"
area: card
cards: [Grim Monolith, Trinisphere, Lightning Bolt, Mountain]
tags: [grim-monolith, trinisphere, colorless-mana, colored-mana, mana-payment, floating-mana, tron]
