id: mu-bdt-bombardment-saves-nothing-but-fizzles-solitude-exile
title: Sacrificing Solitude's target to Goblin Bombardment makes the exile trigger fizzle (no life gained), and the evoked Solitude is still sacrificed
area: matchup
cards: [Solitude, Path to Exile, Goblin Bombardment, Guide of Souls, Plains]
tags: [matchup, boros-vs-dt, solitude, evoke, goblin-bombardment, sacrifice-cost, fizzle, trigger-independence]
derived_from: cr
source:
  - {kind: oracle, card: Solitude, text: "When this creature enters, exile up to one other target creature. That creature's controller gains life equal to its power.", verified: true}
  - {kind: oracle, card: Goblin Bombardment, text: "Sacrifice a creature: This enchantment deals 1 damage to any target.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word “target,” are now illegal, the spell or ability doesn’t resolve. It’s removed from the stack", verified: true}
  - {kind: cr, ref: "702.74a", text: "When this permanent enters, if its evoke cost was paid, its controller sacrifices it.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Goblin Bombardment @bomb", "Guide of Souls @guide"]
    library_pad: 10
  p1:
    hand: ["Solitude @sol", "Path to Exile @path"]
    battlefield: ["Plains @w"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@path"}}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1:
      decision: order_triggers
      answer:
        - {source: "@sol", text_contains: "sacrifices"}
        - {source: "@sol", text_contains: "exile up to one"}
  - p1: {decision: choose_target, slot: 0, answer: "@guide"}
  - p1: {t: pass}
  - p0: {t: activate, source: "@bomb", ability: 0, sacrifice: ["@guide"], targets: [{player: p1}]}
  - check:
      stack:
        - {kind: triggered, source: "@sol", controller: p1, text_contains: "sacrifices"}
        - {kind: triggered, source: "@sol", controller: p1, text_contains: "exile", targets: ["@guide"]}
        - {kind: activated, source: "@bomb", controller: p0, targets: [{player: p1}]}
      p0: {graveyard: [Guide of Souls]}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      p0: {life: 20}
      p1: {life: 19, battlefield_contains: [{card: Solitude}]}
      stack: [{kind: triggered, source: "@sol", controller: p1, text_contains: "sacrifices"}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 20
      graveyard: [Guide of Souls]
      exile: []
      battlefield: [{card: Goblin Bombardment}]
    p1:
      life: 19
      graveyard: [Solitude]
      exile: [Path to Exile]
      battlefield: [{card: Plains, tapped: false}]
notes: >
  Solitude's exile trigger targets Guide of Souls. p0 sacrifices Guide as Bombardment's cost (no stack, no priority
  window), pinging p1 to 19. When the exile trigger resolves its only target is gone, so it does not resolve at all and
  nobody gains life (608.2b; "that creature's controller" is never determined). The evoke sacrifice has no target and
  resolves normally. After each resolution the active player p1 gets priority (117.3b). A wrong engine gives p0 1 life
  from last known information, or cancels the sacrifice trigger together with the exile trigger.
---
id: mu-bdt-vial-solitude-under-voice-no-evoke-sacrifice
title: Under Voice of Victory D&T cannot cast Solitude on Boros' turn, but Aether Vial puts it in; it was not evoked, so it stays, and its exile trigger works
area: matchup
cards: [Solitude, Swords to Plowshares, Aether Vial, Voice of Victory, Ocelot Pride, Plains]
tags: [matchup, boros-vs-dt, solitude, aether-vial, voice-of-victory, put-onto-battlefield, evoke, intervening-if, casting-restriction]
derived_from: cr
source:
  - {kind: oracle, card: Voice of Victory, text: "Your opponents can't cast spells during your turn.", verified: true}
  - {kind: oracle, card: Aether Vial, text: "{T}: You may put a creature card with mana value equal to the number of charge counters on this artifact from your hand onto the battlefield.", verified: true}
  - {kind: oracle, card: Solitude, text: "When this creature enters, exile up to one other target creature. That creature's controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "702.74a", text: "When this permanent enters, if its evoke cost was paid, its controller sacrifices it.", verified: true}
  - {kind: cr, ref: "603.4", text: "When the trigger event occurs, the ability checks whether the stated condition is true. The ability triggers only if it is; otherwise it does nothing.", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can't happen, the \"can't\" effect takes precedence.", verified: true}
setup:
  turn: 7
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Voice of Victory @vov", "Ocelot Pride @oc"]
    library_pad: 10
  p1:
    hand: ["Solitude @sol", "Swords to Plowshares @stp"]
    battlefield: [{card: Aether Vial, as: vial, counters: {charge: 5}}, "Plains @w"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@oc", target: {player: p1}}]}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@stp"}}}}
  - expect_illegal: {p1: {t: cast, card: "@stp", targets: ["@oc"], pay: auto}}
  - p1: {t: activate, source: "@vial", ability: 0}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_cards, purpose: put_onto_battlefield, answer: ["@sol"], expect_options: {include: ["@sol"], exclude: ["@stp"]}}
  - p1: {decision: choose_target, slot: 0, answer: "@oc", expect_options: {include: ["@oc", "@vov"], exclude: ["@sol"]}}
  - check:
      stack: [{kind: triggered, source: "@sol", controller: p1, targets: ["@oc"]}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    phase: declare_attackers
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 21
      exile: [Ocelot Pride]
      battlefield: [{card: Voice of Victory, tapped: false}]
    p1:
      hand: [Swords to Plowshares]
      exile: []
      graveyard: []
      battlefield:
        - {card: Solitude, sick: true, pt: [3, 2]}
        - {card: Aether Vial, tapped: true, counters: {charge: 5}}
        - {card: Plains, tapped: false}
notes: >
  Voice of Victory forbids p1's spells on p0's turn, including evoke and Swords (101.2), but the Vial's ability is not a
  spell. Solitude (mana value 5) is put onto the battlefield, not cast, so no evoke cost was paid: the evoke sacrifice
  has an intervening "if" (702.74a, 603.4) and does not trigger at all, so there is only one trigger and no
  order_triggers decision. The exile trigger removes the attacking Ocelot (p0 gains 1) and Solitude stays. A wrong
  engine offers the casts under Voice, sacrifices the Vialed Solitude, or skips its enters trigger because it was not cast.
