id: polluted-delta-fetch-tropical-island-untapped
title: Polluted Delta can find Tropical Island, which enters untapped and has both basic land types
area: card
cards: [Polluted Delta, Tropical Island, Forest, Island]
tags: [polluted-delta, tropical-island, fetchland, search, enters-untapped]
derived_from: oracle
source:
  - {kind: oracle, card: Polluted Delta, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for an Island or Swamp card, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: oracle, card: Tropical Island, text: "({T}: Add {G} or {U}.)", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Polluted Delta @delta"]
    library: ["Tropical Island @ti"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@delta", ability: 0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, found: "@ti"}
expect:
  - at: after_script
    stack: []
    p0:
      life: 19
      battlefield: [{card: Tropical Island, tapped: false, subtypes: [Forest, Island]}]
      graveyard: [Polluted Delta]
notes: The Alurentell deck uses Polluted Delta to find Tropical Island; no enters-tapped effect applies, so it can tap right away.
