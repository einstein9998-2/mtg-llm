id: faerie-macabre-cannot-target-itself-targets-chosen-before-discard
title: Faerie Macabre cannot target itself because targets are chosen before the discard cost is paid
area: card
cards: [Faerie Macabre, Lightning Bolt]
tags: [faerie-macabre, targeting, cost-payment-order, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: Faerie Macabre, text: "Discard this card: Exile up to two target cards from graveyards.", verified: true}
  - {kind: cr, ref: "602.2b", text: "The remainder of the process for activating an ability is identical to the process for casting a spell listed in rules 601.2b–i.", verified: true}
  - {kind: cr, ref: "601.2c", text: "The player announces their choice of an appropriate object or player for each target the spell requires.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Faerie Macabre @fm"]
    library_pad: 10
  p1:
    graveyard: ["Lightning Bolt @bolt"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate_from_hand, source: "@fm", ability: 0, targets: ["@fm"]}}
  - p0: {t: activate_from_hand, source: "@fm", ability: 0, targets: ["@bolt"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Faerie Macabre]
      exile: []
    p1:
      graveyard: []
      exile: [Lightning Bolt]
notes: >
  Targets are announced (601.2c) before costs are paid (602.2b refers to the casting sequence), and while it is being
  activated Faerie Macabre is in the hand, not a graveyard card, so it is not a legal target for "target cards from
  graveyards". Only after the discard is it in the graveyard. The legal activation targeting the Bolt resolves and exiles it.
