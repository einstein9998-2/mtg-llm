id: meltdown-destroying-equipment-leaves-the-creature-and-drops-the-bonus
title: Meltdown destroys an attached Cori-Steel Cutter, so the equipped creature survives as a plain 1/1
area: card
cards: [Meltdown, Cori-Steel Cutter, Dragon's Rage Channeler, Mountain, Island]
tags: [meltdown, equipment, destroy, derived-stats, state-based-actions, cori-steel-cutter, drc, surveil]
derived_from: cr
source:
  - {kind: oracle, card: Meltdown, text: "Destroy each artifact with mana value X or less.", verified: true}
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equipped creature gets +1/+1 and has trample and haste.", verified: true}
  - {kind: cr, ref: "701.3d", text: "If an Aura, Equipment, or Fortification that was attached to an object or player ceases to be attached to it, that counts as “becoming unattached [from that object or player]”; this includes if that Aura, Equipment, or Fortification leaves the battlefield, the object leaves the zone it was in, or that player leaves the game.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Meltdown @melt"]
    battlefield:
      - "Mountain @m1"
      - "Mountain @m2"
      - "Mountain @m3"
      - {card: Dragon's Rage Channeler, as: drc}
      - {card: Cori-Steel Cutter, as: cut, attached_to: "@drc"}
    library: ["Island @top"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      p0: {battlefield_contains: [{card: Dragon's Rage Channeler, alias: drc, pt: [2, 2], keywords: [trample, haste]}]}
  - p0: {t: cast, card: "@melt", x: 2, pay: auto}
  - check:
      stack: [{kind: spell, card: "@melt"}, {kind: triggered, source: "@drc"}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: [], on_top_order: ["@top"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Meltdown, Cori-Steel Cutter]
      battlefield_contains: [{card: Dragon's Rage Channeler, alias: drc, pt: [1, 1], keywords_exclude: [trample, haste]}]
notes: >
  Before the spell the channeler is a 2/2 with trample and haste thanks to the attached Cutter. Meltdown (X=2) destroys the Cutter (mana value 2), which stops
  granting its bonus; the creature is untouched and returns to its printed 1/1. A wrong engine keeps the stale bonus after the equipment leaves, or destroys the creature too.
  Reviewer fix: Meltdown is a noncreature spell cast by the channeler's controller, so DRC's surveil 1 triggers above Meltdown and resolves first
  (Island kept on top, so the graveyard ends with only sorcery + artifact, no delirium).
