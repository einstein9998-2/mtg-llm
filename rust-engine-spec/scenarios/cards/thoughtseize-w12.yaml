setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 20
    hand: ["Thoughtseize @ts", "Griselbrand @g", "Island @i"]
    battlefield: ["Swamp @s"]
    library_pad: 10
  p1:
    life: 20
    library_pad: 10
script:
  - p0: {t: cast, card: "@ts", targets: [{player: p0}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@g"], expect_options: {include: ["@g"], exclude: ["@i", "@ts"]}}
expect:
