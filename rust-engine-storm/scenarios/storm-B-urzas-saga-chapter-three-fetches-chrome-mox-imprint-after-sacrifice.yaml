      spells_cast_this_turn: 0
notes: >
  Chapter III resolves (Chrome Mox put onto the battlefield: its imprint trigger is waiting), then state-based actions
  sacrifice the Saga (714.4: the chapter ability has left the stack), then the imprint trigger is put on the stack
  (603.3): at the check the Saga is already in the graveyard while the Mox trigger is on the stack. Brainstorm is imprinted
  and the Mox taps for {U}. The two Islands in the library are the turn-5 and turn-7 draws, so Brainstorm is the only
  nonland nonartifact card in hand.
