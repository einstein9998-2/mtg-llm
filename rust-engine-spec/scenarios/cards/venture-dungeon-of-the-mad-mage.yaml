id: mad-mage-first-venture-yawning-portal-gain-one
title: Choosing Dungeon of the Mad Mage on the first venture puts the marker on Yawning Portal and p0 gains 1 life
area: card
cards: [Acererak the Archlich, Aluren]
tags: [venture, choose-dungeon, room-ability, topmost-room, life-gain, mad-mage]
derived_from: cr
source:
  - {kind: cr, ref: "701.49a", text: "they choose a dungeon card they own from outside the game and put it into the command zone. They put their venture marker on the topmost room.", verified: true}
  - {kind: cr, ref: "309.4a", text: "As a player puts a dungeon they own into the command zone, they put their venture marker on the topmost room.", verified: true}
  - {kind: cr, ref: "309.4c", text: "The full text of each room ability is \"When you move your venture marker into this room, [effect.]\"", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "Dungeon of the Mad Mage, Yawning Portal (topmost): You gain 1 life.", verified: false, note: "dungeon room text from reference/oracle.json dungeons section"}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    life: 15
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - resolve_top: true
  - resolve_top: true
  - p0: {decision: choose_dungeon, answer: Dungeon of the Mad Mage, expect_options: {count: 3, include: [Lost Mine of Phandelver, Dungeon of the Mad Mage, Tomb of Annihilation]}}
  - check:
      stack: [{kind: triggered, controller: p0, text_contains: "gain 1 life"}]
      p0: {command: [{dungeon: Dungeon of the Mad Mage, room: Yawning Portal}]}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 16, hand: [Acererak the Archlich], command: [{dungeon: Dungeon of the Mad Mage, room: Yawning Portal}]}
    p1: {life: 20}
notes: >
  The topmost room's ability triggers when the marker is put on it (putting the marker into the room is moving it there;
  see REPORT for the reading). A wrong engine skips the first room's ability or starts on the second room.
