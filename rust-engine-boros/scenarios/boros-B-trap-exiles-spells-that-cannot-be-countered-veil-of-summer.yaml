  the three spells p1 cast this turn, so the Trap is free. Veil makes p1's spells uncounterable, but the Trap does not
  counter: it exiles (701.13a vs 701.6a), so both Brainstorm and the Bolt are exiled anyway. Veil's hexproof from
  blue is irrelevant: the Trap targets spells, not p1 or p1's permanents. p0 has cast no blue or black spell, so the
