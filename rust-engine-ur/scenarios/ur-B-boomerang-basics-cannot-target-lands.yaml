id: ur-b-boomerang-basics-cannot-target-lands
title: "Boomerang Basics cannot target any land (a basic Island, Volcanic Island); it can target the opponent's creature, and I draw nothing"
area: card
cards: [Boomerang Basics, Island, Volcanic Island, Ocelot Pride, Ponder]
tags: [boomerang-basics, targeting, nonland-permanent, mask-validity, opponent-permanent, no-draw]
derived_from: oracle
source:
  - {kind: oracle, card: Boomerang Basics, text: "Return target nonland permanent to its owner's hand.", verified: true}
  - {kind: oracle, card: Boomerang Basics, text: "If you controlled that permanent, draw a card.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Boomerang Basics @bb"]
    battlefield: ["Island @isl"]
    library: ["Ponder"]
    library_pad: 10
  p1:
    battlefield: ["Volcanic Island @volc", "Ocelot Pride @pride"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@bb", targets: ["@isl"]}}
  - expect_illegal: {p0: {t: cast, card: "@bb", targets: ["@volc"]}}
  - check:
      legal: {p0: {include: [{t: cast, card: "@bb", targets: ["@pride"]}]}}
  - p0: {t: cast, card: "@bb", targets: ["@pride"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      library_count: 11
      graveyard: [Boomerang Basics]
      battlefield: [{card: Island, tapped: true}]
    p1:
      hand: [Ocelot Pride]
      battlefield: [{card: Volcanic Island}]
notes: >
  "Nonland permanent" excludes every land, including the dual land with basic types. The two land probes are not legal; the
  Ocelot Pride is. The Pride belongs to and is controlled by p1, so it returns to p1's hand and p0 draws nothing. A wrong
  engine lets a land be targeted, or draws a card for a permanent the caster did not control.
