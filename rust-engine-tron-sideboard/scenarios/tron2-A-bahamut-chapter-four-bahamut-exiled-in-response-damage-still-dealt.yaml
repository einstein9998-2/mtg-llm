notes: >
  Once triggered, the chapter IV ability exists on the stack independently of its source (113.7a). Swords exiles Bahamut
  (a 9/9 creature, so its controller p0 gains 9: 29). The ability resolves using the source's last known information
  (608.2h) and still deals damage equal to the total mana value of the OTHER permanents p0 controls: Grim Monolith 2 + Karn 4
  = 6, so p1 goes 20 -> 14. A wrong engine drops the ability when the source leaves the battlefield.
