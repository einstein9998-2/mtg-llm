id: consign-to-memory-cannot-target-colored-spell-or-activated-ability
title: Consign to Memory cannot target a blue spell or an activated ability, only triggered abilities and colorless spells
area: card
cards: [Consign to Memory, Brainstorm, Misty Rainforest, Island]
tags: [consign-to-memory, targeting, mask-validity, activated-ability, spell-color]
derived_from: oracle
source:
  - {kind: oracle, card: Consign to Memory, text: "Counter target triggered ability or colorless spell.", verified: true}
  - {kind: cr, ref: "202.2", text: "An object is the color or colors of the mana symbols in its mana cost, regardless of the color of its frame.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Brainstorm @bs"]
    battlefield: ["Island @isl", "Misty Rainforest @misty"]
    library_pad: 10
  p1:
    hand: ["Consign to Memory @cm"]
    battlefield: ["Island @pi"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bs", pay: {tap: ["@isl"]}}
  - p0: {t: activate, source: "@misty", ability: 0}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@cm", targets: ["@bs"]}}
  - expect_illegal: {p1: {t: cast, card: "@cm", targets: [{ability_of: "@misty", nth: 0}]}}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@bs", controller: p0}, {kind: activated, source: "@misty"}]
    pending: {actor: p1, kind: priority}
    p0:
      life: 19
    p1:
      hand: [Consign to Memory]
      battlefield: [{card: Island, tapped: false}]
notes: >
  Brainstorm ({U}) is blue, not colorless; Misty Rainforest's fetch is an activated ability, not a triggered one. Neither
  is a legal target for Consign, so with only those two objects on the stack the cast is not offered. The probes must not
  tap p1's Island.
