id: storm-c-gaeas-will-effects-end-with-the-turn-graveyard-cast-and-exile-replacement
title: "Gaea's Will lasts until end of turn: next turn a graveyard Lightning Bolt cannot be cast, and a Bolt cast from hand goes to the graveyard again"
area: card
cards: ["Gaea's Will", Omniscience, Lightning Bolt, Mountain]
tags: [gaeas-will, until-end-of-turn, duration, graveyard-cast, exile-instead, cleanup, opponents-turn, legal-action-mask]
derived_from: cr
source:
  - {kind: oracle, card: "Gaea's Will", text: "Until end of turn, you may play lands and cast spells from your graveyard.", verified: true}
  - {kind: oracle, card: "Gaea's Will", text: "If a card would be put into your graveyard from anywhere this turn, exile that card instead.", verified: true}
  - {kind: cr, ref: "514.2", text: "all “until end of turn” and “this turn” effects end", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as “until end of turn”).", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Gaea's Will @will", "Lightning Bolt @hb"]
    battlefield: ["Omniscience @omni", "Mountain @m"]
    graveyard: ["Lightning Bolt @gb"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@will", alt_cost: {free: omniscience}}
  - resolve_top: true
  - check:
      stack: []
      legal: {p0: {include: [{t: cast, card: "@gb"}]}}
      p0: {graveyard: [Lightning Bolt], exile: ["Gaea's Will"]}
  - advance: {to: main1, of: p1}
  - p1: {t: pass}
  - check:
      turn: 4
      active: p1
      pending: {actor: p0, kind: priority}
      stack: []
      legal: {p0: {exclude: [{t: cast, card: "@gb"}], include: [{t: cast, card: "@hb"}]}}
  - expect_illegal: {p0: {t: cast, card: "@gb", targets: [{player: p1}], pay: {tap: ["@m"]}}}
  - p0: {t: cast, card: "@hb", targets: [{player: p1}], pay: {tap: ["@m"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    turn: 4
    pending: {actor: p1, kind: priority}
    p0:
      hand: []
      graveyard: [Lightning Bolt, Lightning Bolt]
      exile: ["Gaea's Will"]
    p1:
      life: 17
notes: >
  Both halves of the Will end at the cleanup step (514.2; they were generated by a resolved spell with a stated
  duration, 611.2a). In p1's turn 4 main phase p0 (after p1 passes priority) is no longer allowed to cast the Bolt from
  its graveyard (the only legal Bolt is the one in hand) and the Bolt cast from hand goes to the graveyard again, next
  to the one that was already there. The Will stays in exile (it exiled itself on turn 3 and does not come back).
  The Mountain was not used in turn 3, so mana is not the reason the graveyard cast is refused. A wrong engine keeps the
  permission or the exile replacement past the end of turn.
