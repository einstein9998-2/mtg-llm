id: stifle-acererak-etb-acererak-stays-no-venture
title: The opponent Stifles Acererak's ETB trigger; Acererak stays on the battlefield and no venture happens
area: matchup
cards: [Acererak the Archlich, Aluren, Stifle, Island]
tags: [aluren-acererak-loop, stifle, counter-ability, etb-trigger, priority]
derived_from: cr
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    hand: ["Stifle @st"]
    battlefield: ["Island @j1"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: cast, card: "@st", targets: [{trigger_of: "@acer", nth: 0}], pay: auto}
  - check:
      stack:
        - {kind: triggered, source: "@acer", controller: p0}
        - {kind: spell, card: "@st", controller: p1}
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      battlefield: [{card: Aluren}, {card: Acererak the Archlich, pt: [5, 5], sick: true}]
      command: []
      completed_dungeons: []
    p1:
      graveyard: [Stifle]
      battlefield: [{card: Island, tapped: true}]
notes: >
  Stifle targets the ability on the stack, not Acererak. Countering it cancels both the return and the venture: no dungeon
  is chosen (no choose_dungeon decision) and Acererak remains a 5/5 that cannot be recast this way. p0 passed with the
  trigger on the stack, giving p1 the window; p1 casts Stifle and keeps priority, then both pass.
---
id: opponent-casts-drc-free-in-response-to-acererak-etb
title: Aluren works for the opponent too; p1 casts Dragon's Rage Channeler for free in response to Acererak's ETB trigger
area: matchup
cards: [Acererak the Archlich, Aluren, Dragon's Rage Channeler]
tags: [aluren, any-player, flash, free-cast, priority, aluren-acererak-loop]
derived_from: oracle
source:
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    hand: ["Dragon's Rage Channeler @drc"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: cast, card: "@drc", alt_cost: {free: aluren}}
  - check:
      stack:
        - {kind: triggered, source: "@acer", controller: p0}
        - {kind: spell, card: "@drc", controller: p1}
  - p1: {t: pass}
  - p0: {t: pass}
  - label: drc-resolved
    check:
      stack: [{kind: triggered, source: "@acer", controller: p0}]
      pending: {actor: p0, kind: priority}
      p1: {battlefield: [{card: Dragon's Rage Channeler, sick: true}], hand: []}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_dungeon, answer: Lost Mine of Phandelver}
expect:
  - at: after_script
    stack: [{kind: triggered, controller: p0, text_contains: "Scry 1"}]
    pending: {actor: p0, kind: priority}
    p0: {hand: [Acererak the Archlich], command: [{dungeon: Lost Mine of Phandelver, room: Cave Entrance}]}
    p1: {battlefield: [{card: Dragon's Rage Channeler}]}
notes: >
  p1 has no lands: the cast is legal only through p0's Aluren ("any player"), at instant speed on p0's turn. After DRC
  resolves, p0 (active) gets priority with the ETB trigger still waiting; the loop then continues normally.
---
id: force-of-will-counters-aluren-cast-acererak
