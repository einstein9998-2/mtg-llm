id: phlage-sacrificed-first-damage-trigger-still-resolves
title: If Phlage's sacrifice trigger resolves first, its damage trigger still deals 3 and gains 3 using last known information
area: card
cards: ["Phlage, Titan of Fire's Fury", Mountain, Plains, Plateau]
tags: [phlage, last-known-information, trigger-ordering, etb-trigger, ability-independent-of-source]
derived_from: cr
source:
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Whenever Phlage enters or attacks, it deals 3 damage to any target and you gain 3 life.", verified: true}
  - {kind: cr, ref: "113.7a", text: "Once activated or triggered, an ability exists on the stack independently of its source. Destruction or removal of the source after that time won't affect the ability.", verified: true}
  - {kind: cr, ref: "113.7a", text: "In both instances, if the source is no longer in the zone it's expected to be in at that time, its last known information is used. The source can still perform the action even though it no longer exists.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Phlage, Titan of Fire's Fury @ph"]
    battlefield: ["Mountain @mtn", "Plains @pl", "Plateau @plat"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@ph", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: order_triggers
      answer:
        - {source: "@ph", text_contains: "deals 3 damage"}
        - {source: "@ph", text_contains: "sacrifice it unless it escaped"}
      note: "the damage trigger goes on the stack first (resolves last)"
  - p0: {decision: choose_target, slot: 0, answer: {player: p1}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      p0: {graveyard: ["Phlage, Titan of Fire's Fury"], life: 20}
      p1: {life: 20}
      stack: [{kind: triggered, source: "@ph", text_contains: "3 damage"}]
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 23
      graveyard: ["Phlage, Titan of Fire's Fury"]
    p1:
      life: 17
notes: >
  Phlage is already in the graveyard when the damage trigger resolves; the ability does not depend on its source and
  Phlage, as it last existed, deals the damage (113.7a, 608.2h). The target was chosen as the trigger went on the stack
  (after ordering). A wrong engine fizzles the trigger because its source left, or skips the life gain.
