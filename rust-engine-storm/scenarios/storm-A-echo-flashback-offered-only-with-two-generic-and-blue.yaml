id: storm-a-echo-flashback-offered-only-with-two-generic-and-blue
title: "Echo of Eons flashback needs {2}{U}: not offered with only two lands; the hand copy cannot be cast with three lands"
area: card
cards: [Echo of Eons, Island]
tags: [echo-of-eons, flashback, cost, legal-action-mask, negative, alternative-cost]
derived_from: oracle
source:
  - {kind: oracle, card: Echo of Eons, text: "Flashback {2}{U}", verified: true}
  - {kind: cr, ref: "702.34a", text: "“Flashback [cost]” means “You may cast this card from your graveyard if the resulting spell is an instant or sorcery spell by paying [cost] rather than paying its mana cost” and “If the flashback cost was paid, exile this card instead of putting it anywhere else any time it would leave the stack.”", verified: true}
  - {kind: cr, ref: "118.9", text: "An alternative cost is a cost listed in a spell’s text, or applied to it from another effect, that its controller may pay rather than paying the spell’s mana cost.", verified: true}
setup:
