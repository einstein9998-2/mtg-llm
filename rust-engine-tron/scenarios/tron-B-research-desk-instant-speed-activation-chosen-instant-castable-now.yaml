id: tron-b-research-desk-instant-speed-activation-chosen-instant-castable-now
title: Mishra's Research Desk can be activated in the opponent's end step and the chosen Brainstorm (an instant) is castable from exile at once
area: card
cards: [Mishra's Research Desk, Brainstorm, Ponder, Island]
tags: [mishras-research-desk, instant-speed, play-from-exile, instant, opponents-turn, priority]
derived_from: oracle
source:
  - {kind: oracle, card: Mishra's Research Desk, text: "{1}, {T}, Sacrifice this artifact: Exile the top two cards of your library. Choose one of them. Until the end of your next turn, you may play that card.", verified: true}
  - {kind: cr, ref: "117.1a", text: "A player may cast an instant spell any time they have priority.", verified: true}
setup:
  turn: 4
  active: p1
  phase: end
  priority: p0
  p0:
    battlefield: ["Mishra's Research Desk @desk", "Island @i1", "Island @i2"]
    library: ["Brainstorm @bs", "Ponder @pd"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@desk", ability: 0, pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_cards, purpose: choose_one_to_play, answer: ["@bs"], expect_options: {include: ["@bs", "@pd"], count: 2}}
  - label: after-resolution
    check:
      stack: []
      pending: {actor: p1, kind: priority}
      p0:
        exile: [Brainstorm, Ponder]
  - p1: {t: pass}
  - p0: {t: cast, card: "@bs", pay: auto}
expect:
  - at: after_script
    turn: 4
    phase: end
    active: p1
    stack: [{kind: spell, card: "@bs", controller: p0}]
    pending: {actor: p0, kind: priority}
    p0:
      exile: [Ponder]
      graveyard: ["Mishra's Research Desk"]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}]
      spells_cast_this_turn: 1
notes: >
  It is p1's turn 4, end step, and p0 holds priority. The Desk's ability has no timing restriction, so p0 activates it. After
  the ability resolves the active player (p1) gets priority; p1 passes with an empty stack and p0 gets priority again, so p0 may
  cast the chosen instant right away (117.1a). Brainstorm is cast from exile with the second Island; Ponder stays exiled. The
  scenario does not assert how long the permission lasts. A wrong engine only allows activation in the owner's own turn or
  refuses to cast the exiled instant outside the owner's main phase.
