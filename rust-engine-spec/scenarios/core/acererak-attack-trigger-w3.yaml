    priority: p0
    p0:
      life: 20
      battlefield:
        - {card: Acererak the Archlich, tapped: true}
        - {token: Zombie Token, tapped: false, damage: 0}
    p1: {life: 15, battlefield: [{token: Goblin Token}, {token: Skeleton Token}]}
notes: >
  p1 declines the sacrifice, so p0 creates a 2/2 black Zombie token. The token enters after attackers were declared, so it is
  not an attacking creature (508.1k: only creatures chosen in the declaration become attackers) and is untapped. In the combat
  damage step only Acererak (5) deals damage: p1 goes from 20 to 15, not to 13. p1 keeps both creatures, which are the only
  possible blockers (the Zombie belongs to p0).
  NORMATIVE PARTS (reviewer): the decliner is p1 and the outcomes; the yes_no shape is the author's assumption. If the
  runner's canonical shape is a single choose_cards in which choosing nothing declines, replace the yes_no step with
  {decision: choose_cards, answer: []} and keep everything else unchanged.
