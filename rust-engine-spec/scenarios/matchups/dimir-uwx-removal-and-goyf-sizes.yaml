  - {kind: oracle, card: Tundra, text: "({T}: Add {W} or {U}.)", verified: true}
  - {kind: cr, ref: "202.3", text: "The mana value of an object is a number equal to the total amount of mana in its mana cost, regardless of color.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Barrowgoyf @bg", "Underground Sea @us1"]
    library_pad: 10
  p1:
    hand: ["Prismatic Ending @pe"]
    battlefield: ["Tundra @t1", "Tundra @t2", "Tundra @t3"]
    library_pad: 10
script:
  - p1: {t: activate, source: "@t1", ability: 0, choose_color: W}
  - p1: {t: activate, source: "@t2", ability: 0, choose_color: U}
  - p1: {t: activate, source: "@t3", ability: 0, choose_color: W}
  - p1: {t: cast, card: "@pe", x: 2, targets: ["@bg"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0: {exile: [], battlefield_contains: [{card: Barrowgoyf, pt: [1, 2]}]}
    p1: {graveyard: [Prismatic Ending], mana_pool: {}}
notes: >
  Barrowgoyf's mana cost {2}{B} gives mana value 3; two colors spent, so the condition fails and nothing is exiled
  (Barrowgoyf is a legal target, so the spell resolves and does nothing). After Ending hits p1's graveyard Barrowgoyf
  counts a sorcery: 1/2. Pair: the next scenario spends three colors. Bug caught: counting the three mana instead of
  the two colors.
