notes: >
  The {1} of the activation cost is paid by tapping the Mountain (its {R} is consumed by the cost, so it is not left in the
  pool); the Nexus taps as the other part of the cost and adds {U}. Net effect: two lands become one colored mana. A wrong
  engine leaves the Mountain's {R} floating, or does not tap the Mountain, or lets the ability work without paying {1}.
  Ability index 1 is the {1},{T} ability (index 0 is {T}: Add {C}). A mana ability nested inside the cost payment of a mana ability: the schema runner
  must accept `pay:` on an activation.
