id: ponder-is-a-sorcery-opponents-turn
title: Ponder is not castable on the opponent's turn even with priority and an empty stack, while Brainstorm is
area: card
cards: [Ponder, Brainstorm, Island]
tags: [ponder, sorcery-timing, priority, mask-validity, negative-case]
derived_from: oracle
source:
  - {kind: oracle, card: Ponder, text: "Draw a card.", verified: true}
  - {kind: oracle, card: Brainstorm, text: "Draw three cards, then put two cards from your hand on top of your library in any order.", verified: true}
  - {kind: cr, ref: "307.1", text: "A player who has priority may cast a sorcery card from their hand during a main phase of their turn when the stack is empty.", verified: true}
  - {kind: cr, ref: "117.1a", text: "A player may cast an instant spell any time they have priority.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  priority: p1
  p0:
    hand: ["Ponder @ponder", "Brainstorm @bs"]
    battlefield: ["Island @i1"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@ponder", pay: auto}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    legal:
      p0:
        include: [{t: pass}, {t: cast, card: "@bs"}]
        exclude: [{t: cast, card: "@ponder"}]
    p0: {hand: [Ponder, Brainstorm]}
notes: >
  Sorceries may be cast only by the active player in their own main phase with an empty stack. p0 holds priority in p1's main phase with an empty stack
  but is not the active player, so Ponder (a sorcery) is not offered; the instant Brainstorm is.
