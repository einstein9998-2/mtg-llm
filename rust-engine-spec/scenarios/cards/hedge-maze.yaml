id: hedge-maze-taps-for-green-or-blue-only
title: Hedge Maze (Forest Island) taps for {G} or {U} but never red
area: card
cards: [Hedge Maze, Forest, Island]
tags: [hedge-maze, mana-ability, basic-land-types, choose-color]
derived_from: cr
source:
  - {kind: oracle, card: Hedge Maze, text: "({T}: Add {G} or {U}.)", verified: true}
  - {kind: cr, ref: "305.6", text: "An object with the land card type and a basic land type has the intrinsic ability \"{T}: Add [mana symbol],\" ... For Plains, [mana symbol] is {W}; for Islands, {U}; for Swamps, {B}; for Mountains, {R}; and for Forests, {G}.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Hedge Maze @hm"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate, source: "@hm", ability: 0, choose_color: R}}
  - p0: {t: activate, source: "@hm", ability: 0, choose_color: U}
expect:
  - at: after_script
    stack: []
    p0:
      mana_pool: {U: 1}
      battlefield: [{card: Hedge Maze, tapped: true, subtypes: [Forest, Island]}]
notes: >
  The reminder-text mana ability is index 0. It offers exactly G or U. The red probe must not tap the land.
