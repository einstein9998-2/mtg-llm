id: drc-surveil-on-own-noncreature-cast-resolves-before-the-spell
title: Dragon's Rage Channeler surveils 1 when its controller casts a noncreature spell; the trigger goes above the spell and resolves first
area: card
cards: [Dragon's Rage Channeler, Mountain, Lightning Bolt, Island, Ponder]
tags: [drc, surveil, cast-trigger, stack-order, noncreature-spell]
derived_from: oracle
source:
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: cr, ref: "601.2i", text: "Once the steps described in 601.2a–h are completed, effects that modify the characteristics of the spell as it's cast are applied, then the spell becomes cast. Any abilities that trigger when a spell is cast or put onto the stack trigger at this time.", verified: true}
  - {kind: cr, ref: "701.25a", text: "To \"surveil N\" means to look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Dragon's Rage Channeler @drc", "Mountain @mtn"]
    library: ["Island @top", "Ponder @pond"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0}, {kind: triggered, source: "@drc", controller: p0}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: ["@top"], on_top_order: []}
  - check:
      stack: [{kind: spell, card: "@bolt"}]
      pending: {actor: p0, kind: priority}
      p0: {graveyard: [Island], library_top: [Ponder]}
      p1: {life: 20}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Island, Lightning Bolt]
      library_count: 11
      battlefield_contains: [{card: Dragon's Rage Channeler, pt: [1, 1], keywords_exclude: [flying]}]
    p1: {life: 17}
notes: >
  Casting Bolt triggers DRC, so the trigger is put on the stack above Bolt and resolves first; p0 may put the Island into the graveyard. Bolt then
  resolves. Graveyard types at the end are land and instant only (two), so DRC stays a 1/1 without flying. A wrong engine surveils after Bolt
  resolves or does not give the controller the surveil choice.
---
id: drc-ignores-opponents-noncreature-spells
title: Dragon's Rage Channeler does not trigger when the opponent casts a noncreature spell
area: card
cards: [Dragon's Rage Channeler, Lightning Bolt, Mountain]
tags: [drc, cast-trigger, you-vs-opponent, negative-case]
derived_from: oracle
source:
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  priority: p1
  p0:
    battlefield: ["Dragon's Rage Channeler @drc"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @mtn"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p1}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0: {life: 17, library_count: 10, battlefield: [{card: Dragon's Rage Channeler}]}
notes: >
  "Whenever you cast" refers to the DRC's controller only. p1's Bolt creates no trigger and p0 gets no surveil decision. After Bolt resolves the active
  player (p1) receives priority.
