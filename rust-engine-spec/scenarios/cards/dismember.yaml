id: dismember-life-payment-limits-at-three-life
title: With 3 life Dismember cannot pay 4 life but can pay 2 life for one symbol, leaving 1
area: card
cards: [Dismember, Acererak the Archlich, Swamp]
tags: [dismember, phyrexian-mana, life-payment, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: Dismember, text: "({B/P} can be paid with either {B} or 2 life.)", verified: true}
  - {kind: cr, ref: "119.4", text: "If a cost or effect allows a player to pay an amount of life greater than 0, the player may do so only if their life total is greater than or equal to the amount of the payment.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 3
    hand: ["Dismember @dm"]
    battlefield: ["Swamp @s1", "Swamp @s2"]
    library_pad: 10
  p1:
    battlefield: ["Acererak the Archlich @ac"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@dm", phyrexian: [life, life], targets: ["@ac"], pay: auto}}
  - p0: {t: cast, card: "@dm", phyrexian: [life, mana], targets: ["@ac"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    game: {over: false}
    pending: {actor: p0, kind: priority}
    p0:
      life: 1
      graveyard: [Dismember]
    p1:
      battlefield: []
      graveyard: [Acererak the Archlich]
notes: >
  Paying 4 life with 3 life total is not allowed (119.4), so [life, life] is illegal and must change nothing. [life, mana]
  pays 2 life (3 to 1), one Swamp for {B} and one for the generic {1}. The game continues; Acererak dies.
