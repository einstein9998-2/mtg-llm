id: consign-to-memory-counters-colorless-spell-not-colored-spell
title: "Consign to Memory counters a colorless spell (Mishra's Bauble) lower on the stack but cannot target a colored spell (Brainstorm)"
area: core
cards: [Consign to Memory, Island, Mishra's Bauble, Brainstorm]
tags: [consign-to-memory, counterspell, colorless, targeting, mask-validity, stack, not-top-of-stack]
derived_from: oracle
source:
  - {kind: oracle, card: Consign to Memory, text: "Counter target triggered ability or colorless spell.", verified: true}
  - {kind: cr, ref: "202.2b", text: "Objects with no colored mana symbols in their mana costs are colorless.", verified: true}
  - {kind: cr, ref: "405.5", text: "When all players pass in succession, the top (last-added) spell or ability on the stack resolves.", verified: true}
  - {kind: cr, ref: "701.6a", text: "A countered spell is put into its owner’s graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Mishra's Bauble @bauble", "Brainstorm @bs"]
    battlefield: ["Island @i"]
    library_pad: 10
  p1:
    hand: ["Consign to Memory @consign"]
    battlefield: ["Island @j"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bauble", pay: auto}
  - p0: {t: cast, card: "@bs", pay: auto}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@consign", targets: ["@bs"], pay: auto}}
  - p1: {t: cast, card: "@consign", targets: ["@bauble"], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@bauble", controller: p0}
        - {kind: spell, card: "@bs", controller: p0}
        - {kind: spell, card: "@consign", controller: p1, targets: ["@bauble"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack:
      - {kind: spell, card: "@bs", controller: p0}
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Mishra's Bauble], hand: []}
    p1: {graveyard: [Consign to Memory]}
notes: >
  p0 casts the artifact first (sorcery timing, empty stack) and the instant on top of it. Mishra's Bauble is colorless
  (no colored mana symbol in {0}) so Consign to Memory may target it even though it is not the top object; Brainstorm is
  blue, so targeting it is illegal. Consign resolves and counters the Bauble to the graveyard; Brainstorm remains on the
  stack, untouched.
