id: layers-cutter-reequip-moves-bonus-and-abilities
title: Moving Cori-Steel Cutter with equip moves its +1/+1, trample and haste from the old creature to the new one
area: core
cards: [Cori-Steel Cutter, "Dragon's Rage Channeler", Containment Priest, Mountain]
tags: [layers, layer-6, layer-7c, equipment, equip, timestamps]
derived_from: cr
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equipped creature gets +1/+1 and has trample and haste.", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equip {1}{R}", verified: true}
  - {kind: cr, ref: "702.6a", text: "\"Equip [cost]\" means \"[Cost]: Attach this permanent to target creature you control. Activate only as a sorcery.\"", verified: true}
  - {kind: cr, ref: "301.5f", text: "An ability of a permanent that refers to the \"equipped creature\" refers to whatever creature that permanent is attached to", verified: true}
  - {kind: cr, ref: "611.3a", text: "A continuous effect generated by a static ability isn't \"locked in\"; it applies at any given moment to whatever its text indicates.", verified: true}
  - {kind: cr, ref: "613.1f", text: "Layer 6: Ability-adding effects, keyword counters, ability-removing effects, and effects that say an object can't have an ability are applied.", verified: true}
  - {kind: cr, ref: "613.4c", text: "Layer 7c: Effects and counters that modify power and/or toughness (but don't set power and/or toughness to a specific number or value) are applied.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    battlefield:
      - "Dragon's Rage Channeler @drc"
      - "Containment Priest @cp"
      - {card: Cori-Steel Cutter, as: cut, attached_to: "@drc"}
      - "Mountain @m1"
      - "Mountain @m2"
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      p0:
        battlefield_contains:
          - {card: "Dragon's Rage Channeler", pt: [2, 2], keywords: [trample, haste]}
          - {card: Containment Priest, pt: [2, 2], keywords_exclude: [trample, haste]}
  - p0: {t: activate, source: "@cut", ability: 0, targets: ["@cp"], pay: auto}
  - check:
      stack: [{kind: activated, source: "@cut"}]
      p0: {battlefield_contains: [{card: Cori-Steel Cutter, attached_to: "@drc"}]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains:
        - {card: "Dragon's Rage Channeler", pt: [1, 1], keywords_exclude: [trample, haste]}
        - {card: Containment Priest, pt: [3, 3], keywords: [flash, trample, haste]}
        - {card: Cori-Steel Cutter, attached_to: "@cp"}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
notes: >
  The Cutter's static ability applies to whichever creature it is attached to at the moment (611.3a, 301.5f): the
  bonus and keywords leave DRC and go to the Priest when equip resolves, not when it is activated. Equip is an
  activated ability, not a spell, so DRC's surveil does not trigger. Ability index 0 is the only activated ability
  (Equip). A wrong engine copies the bonus at attach time and never removes it from DRC, or moves it at activation.
---
id: layers-cutter-haste-lets-summoning-sick-creature-attack
title: A summoning-sick creature equipped with Cori-Steel Cutter can attack, while an unequipped summoning-sick creature can't
area: core
cards: [Cori-Steel Cutter, "Dragon's Rage Channeler", Containment Priest]
tags: [layers, layer-6, haste, summoning-sickness, equipment, combat]
derived_from: cr
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equipped creature gets +1/+1 and has trample and haste.", verified: true}
  - {kind: cr, ref: "302.6", text: "A creature can't attack unless it has been under its controller's control continuously since their most recent turn began.", verified: true}
  - {kind: cr, ref: "702.10b", text: "If a creature has haste, it can attack even if it hasn't been controlled by its controller continuously since their most recent turn began.", verified: true}
setup:
  turn: 4
  active: p0
  phase: begin_combat
  priority: p0
  p0:
    battlefield:
      - {card: "Dragon's Rage Channeler", as: drc, sick: true}
      - {card: Containment Priest, as: cp, sick: true}
      - {card: Cori-Steel Cutter, as: cut, attached_to: "@drc"}
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: declare_attackers, attacks: [{creature: "@cp", target: {player: p1}}]}}
  - expect_illegal: {p0: {t: declare_attackers, attacks: [{creature: "@drc", target: {player: p1}}, {creature: "@cp", target: {player: p1}}]}}
  - p0: {decision: declare_attackers, attacks: [{creature: "@drc", target: {player: p1}}]}
expect:
  - at: after_script
    phase: declare_attackers
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains:
        - {card: "Dragon's Rage Channeler", tapped: true, pt: [2, 2]}
        - {card: Containment Priest, tapped: false}
notes: >
  Both creatures came under p0's control this turn. The Cutter grants haste to DRC only, so only DRC may attack. A wrong
  engine checks haste on the card's printed text, or lets every creature on a battlefield with an Equipment attack. The
  scenario stops at p0's priority in the declare attackers step.
