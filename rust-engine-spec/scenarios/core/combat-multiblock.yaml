id: multiblock-illegal-damage-assignments-are-rejected
title: An attacker's combat damage must be assigned in full among its blockers; assigning less, more, or to the player without trample is illegal
area: core
cards: [Murktide Regent, Faerie Macabre, "Spider-Woman, Stunning Savior"]
tags: [combat, multiple-blockers, combat-damage-assignment, mask-validity, assign-combat-damage-decision, kd-0001]
derived_from: cr
source:
  - {kind: cr, ref: "510.1a", text: "Each attacking creature and each blocking creature assigns combat damage equal to its power.", verified: true}
  - {kind: cr, ref: "510.1c", text: "A blocked creature assigns its combat damage to the creatures blocking it. If no creatures are currently blocking it (if, for example, they were destroyed or removed from combat), it assigns no combat damage. If exactly one creature is blocking it, it assigns all its combat damage to that creature. If two or more creatures are blocking it, it assigns its combat damage to those creatures divided as its controller chooses among them.", verified: true}
  - {kind: cr, ref: "510.1e", text: "Once a player has assigned combat damage from each attacking or blocking creature they control, the total damage assignment (not solely the damage assignment of any individual attacking or blocking creature) is checked to see if it complies with the above rules. If it doesn’t, the combat damage assignment is illegal", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Murktide Regent @murk"]
    library_pad: 10
  p1:
    battlefield: ["Faerie Macabre @fm", "Spider-Woman, Stunning Savior @sw"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@murk", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: [{blocker: "@fm", attacker: "@murk"}, {blocker: "@sw", attacker: "@murk"}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {decision: assign_combat_damage, assignment: {"@fm": 1, "@sw": 1}}}
  - expect_illegal: {p0: {decision: assign_combat_damage, assignment: {"@fm": 2, "@sw": 2}}}
  - expect_illegal: {p0: {decision: assign_combat_damage, assignment: {"@fm": 1, "@sw": 1, player: 1}}}
  - p0:
      decision: assign_combat_damage
      assignment: {"@fm": 1, "@sw": 2}
expect:
  - at: after_script
    p0: {battlefield: [], graveyard: [Murktide Regent]}
    p1:
      life: 20
      battlefield: [{card: Faerie Macabre, damage: 1, tapped: false}]
      graveyard: ["Spider-Woman, Stunning Savior"]
notes: >
  The 3/3 Regent assigns damage equal to its power (510.1a): 1 + 1 = 2 is too little, 2 + 2 = 4 is too much, and sending 1 to
  the defending player is not allowed because it has no trample (a blocked creature assigns only to its blockers, 510.1c).
  Any total of 3 divided among the two blockers is legal; here 1 to Faerie Macabre (survives with 1 damage) and 2 to
  Spider-Woman (dies). The whole assignment is checked together (510.1e).
