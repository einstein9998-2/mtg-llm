id: storm-a-echo-flashback-exiles-and-does-not-shuffle-itself
title: "Echo of Eons cast with flashback from the graveyard: it is exiled afterwards and is not shuffled into the library"
area: card
cards: [Echo of Eons, Brainstorm, Lightning Bolt, Dark Ritual, Island]
tags: [echo-of-eons, flashback, exile, alternative-cost, wheel, cast-from-graveyard]
derived_from: oracle
source:
  - {kind: oracle, card: Echo of Eons, text: "Each player shuffles their hand and graveyard into their library, then draws seven cards.", verified: true}
  - {kind: oracle, card: Echo of Eons, text: "Flashback {2}{U}", verified: true}
  - {kind: cr, ref: "702.34a", text: "“Flashback [cost]” means “You may cast this card from your graveyard if the resulting spell is an instant or sorcery spell by paying [cost] rather than paying its mana cost” and “If the flashback cost was paid, exile this card instead of putting it anywhere else any time it would leave the stack.”", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Brainstorm"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    graveyard: ["Echo of Eons @echo", "Lightning Bolt"]
    library_pad: 10
  p1:
    hand: ["Dark Ritual"]
    library_pad: 10
random: any
script:
  - p0: {t: cast, card: "@echo", alt_cost: {flashback: true}, pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand_count: 7
      graveyard: []
      exile: [Echo of Eons]
      library_count: 5
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}, {card: Island, tapped: true}]
    p1:
      hand_count: 7
      graveyard: []
      library_count: 4
notes: >
  Flashback costs {2}{U} (three Islands tapped). The Echo on the stack is not in the graveyard when "shuffle your graveyard into your library" happens, so only
  the Lightning Bolt is shuffled in (10 + 1 hand + 1 graveyard = 12, draw 7, 5 left); afterwards Echo is exiled (702.34a), not put into the graveyard.
  p1 shuffles one card from hand into 10 (11, draw 7, 4 left).
