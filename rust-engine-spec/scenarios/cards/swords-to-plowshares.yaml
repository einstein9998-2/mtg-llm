  - {kind: cr, ref: "601.2c", text: "The player announces their choice of an appropriate object or player for each target the spell requires.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    battlefield: ["Plateau @plat", "Mishra's Bauble @bauble", "Dragon's Rage Channeler @drc"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@stp", targets: [{player: p1}]}}
  - expect_illegal: {p0: {t: cast, card: "@stp", targets: ["@plat"]}}
  - expect_illegal: {p0: {t: cast, card: "@stp", targets: ["@bauble"]}}
  - p0: {t: cast, card: "@stp", targets: ["@drc"], pay: auto}
expect:
