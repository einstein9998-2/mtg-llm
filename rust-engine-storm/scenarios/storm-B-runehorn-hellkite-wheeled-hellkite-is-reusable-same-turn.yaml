id: storm-b-runehorn-hellkite-wheeled-hellkite-is-reusable-same-turn
title: A second Hellkite discarded from hand by the first activation can be activated from the graveyard the same turn
area: card
cards: [Runehorn Hellkite, Mountain, Island, Brainstorm, Daze]
tags: [runehorn-hellkite, graveyard-ability, discard-hand, chain, wheel, exile-cost, storm-engine]
derived_from: oracle
source:
  - {kind: oracle, card: Runehorn Hellkite, text: "{5}{R}, Exile this card from your graveyard: Each player discards their hand, then draws seven cards.", verified: true}
  - {kind: cr, ref: "701.9a", text: "To discard a card, move it from its owner’s hand to that player’s graveyard.", verified: true}
  - {kind: cr, ref: "602.2", text: "To activate an ability is to put it onto the stack and pay its costs, so that it will eventually resolve and have its effect.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Runehorn Hellkite @hk2", "Brainstorm @bs"]
    graveyard: ["Runehorn Hellkite @hk1"]
    battlefield: ["Mountain @m1", "Mountain @m2", "Island @i1", "Island @i2", "Island @i3", "Island @i4", "Island @i5", "Island @i6", "Island @i7", "Island @i8", "Island @i9", "Island @i10"]
    library_pad: 30
  p1:
    hand: ["Daze @daze"]
    library_pad: 30
script:
  - p0: {t: activate, source: "@hk1", ability: 0, pay: {tap: ["@m1", "@i1", "@i2", "@i3", "@i4", "@i5"]}}
  - resolve_top: true
  - check:
      stack: []
      p0:
        hand: [Island, Island, Island, Island, Island, Island, Island]
        graveyard: [Brainstorm, Runehorn Hellkite]
        exile: [{card: Runehorn Hellkite, face_up: true}]
      legal: {p0: {include: [{t: activate, source: "@hk2", ability: 0}]}}
  - p0: {t: activate, source: "@hk2", ability: 0, pay: {tap: ["@m2", "@i6", "@i7", "@i8", "@i9", "@i10"]}}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Island, Island, Island, Island, Island, Island, Island]
      graveyard: [Brainstorm, Island, Island, Island, Island, Island, Island, Island]
      exile: [{card: Runehorn Hellkite, face_up: true}, {card: Runehorn Hellkite, face_up: true}]
      library_count: 16
    p1:
      hand: [Island, Island, Island, Island, Island, Island, Island]
      graveyard: [Daze, Island, Island, Island, Island, Island, Island, Island]
      library_count: 16
notes: >
  The first activation discards the second Hellkite from p0's hand into the graveyard (a normal discard), where it is
  immediately activatable with the six remaining lands (one Mountain for {R}). The lands are tapped explicitly (Mountain
  plus five Islands each time) so the second {R} is not tapped away by the first payment. The second wheel discards the
  seven Islands drawn by the first, so p0's final graveyard is Brainstorm and seven Islands, and p1's is Daze and seven
  Islands; both libraries lose 14 cards (30 -> 16).
