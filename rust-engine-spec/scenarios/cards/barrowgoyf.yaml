id: barrowgoyf-counts-all-graveyards-while-nethergoyf-counts-own
title: Barrowgoyf counts card types in all graveyards; Nethergoyf on the same board counts only its controller's
area: card
cards: [Barrowgoyf, Nethergoyf, Island, Lightning Bolt, Ponder]
tags: [barrowgoyf, nethergoyf, characteristic-defining-ability, card-types, graveyard]
derived_from: oracle
source:
  - {kind: oracle, card: Barrowgoyf, text: "Barrowgoyf's power is equal to the number of card types among cards in all graveyards and its toughness is equal to that number plus 1.", verified: true}
  - {kind: oracle, card: Nethergoyf, text: "Nethergoyf's power is equal to the number of card types among cards in your graveyard and its toughness is equal to that number plus 1.", verified: true}
  - {kind: cr, ref: "604.3", text: "Characteristic-defining abilities function in all zones.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Barrowgoyf @bg", "Nethergoyf @ng"]
    graveyard: [Island]
    library_pad: 10
  p1:
    graveyard: [Lightning Bolt, Ponder]
    library_pad: 10
script: []
expect:
  - at: after_script
    p0:
      battlefield:
        - {card: Barrowgoyf, pt: [3, 4], keywords: [deathtouch, lifelink]}
        - {card: Nethergoyf, pt: [1, 2]}
notes: >
  All graveyards hold a land, an instant and a sorcery: Barrowgoyf is 3/4. p0's graveyard holds only a land: Nethergoyf is
  1/2. An engine that shares one "goyf" count between the two cards gets one of them wrong.
