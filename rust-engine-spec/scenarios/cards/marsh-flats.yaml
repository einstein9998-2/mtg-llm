id: marsh-flats-fetches-plains-or-swamp-types
title: Marsh Flats finds a Plains or Swamp card, including nonbasic lands with those types, and nothing else
area: card
cards: [Marsh Flats, Badlands, Forest, Island, Mountain, Plains, Plateau, Scrubland, Swamp, Volcanic Island]
tags: [marsh-flats, fetchland, search, basic-land-types, life-payment, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Marsh Flats, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for a Plains or Swamp card, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: cr, ref: "305.6", text: "The basic land types are Plains, Island, Swamp, Mountain, and Forest.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    lands_played: 1
    battlefield: ["Marsh Flats @fetch"]
    library: ["Scrubland @scrub", "Badlands @bad", "Plateau @plat", "Plains @pl", "Swamp @sw", "Mountain @mtn", "Volcanic Island @volc", "Forest @for"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@fetch", ability: 0}
  - check:
      stack: [{kind: activated, source: "@fetch", controller: p0}]
      p0: {life: 19, graveyard: [Marsh Flats], battlefield: []}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: search
      found: "@scrub"
      expect_options:
        include: ["@scrub", "@bad", "@plat", "@pl", "@sw"]
        exclude: ["@mtn", "@volc", "@for"]
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 19
      lands_played: 1
      graveyard: [Marsh Flats]
      battlefield: [{card: Scrubland, tapped: false}]
      library_count: 17
notes: >
  Scrubland (Plains Swamp), Badlands (Swamp Mountain), Plateau (Mountain Plains) and the basics Plains and Swamp qualify; Mountain, Volcanic Island (Island Mountain) and Forest do not. Library 18 -> 17; life 19; lands_played stays 1.
