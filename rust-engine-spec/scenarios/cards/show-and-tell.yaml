id: show-and-tell-creature-and-land-both-players
title: Show and Tell lets each player put a card from hand onto the battlefield; a creature and a land enter together with no land drop used
area: card
cards: [Show and Tell, Faerie Macabre, Brainstorm, Island, Lightning Bolt]
tags: [show-and-tell, simultaneous-secret-choice, put-onto-battlefield, not-a-land-drop, summoning-sickness]
derived_from: oracle
source:
  - {kind: oracle, card: Show and Tell, text: "Each player may put an artifact, creature, enchantment, or land card from their hand onto the battlefield.", verified: true}
  - {kind: cr, ref: "305.4", text: "Effects may also allow players to \"put\" lands onto the battlefield. This isn't the same as \"playing a land\" and doesn't count as a land played during the current turn.", verified: true}
  - {kind: cr, ref: "101.4", text: "the active player ... makes any choices required, then the next player in turn order", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Show and Tell @snt", "Faerie Macabre @fm", "Brainstorm @bs"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library_pad: 10
  p1:
    hand: ["Island @pi", "Lightning Bolt @pb"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@snt", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: simultaneous_secret_choice, answer: "@fm"}
  - p1: {decision: simultaneous_secret_choice, answer: "@pi"}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      lands_played: 0
      spells_cast_this_turn: 1
      hand: [Brainstorm]
      graveyard: [Show and Tell]
      battlefield:
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Faerie Macabre, tapped: false, sick: true, pt: [2, 2]}
    p1:
      lands_played: 0
      hand: [Lightning Bolt]
      battlefield: [{card: Island, tapped: false}]
notes: >
  The Brainstorm and Lightning Bolt stay in hand (instants are not among the four legal types). Both permanents enter
  at the same time; neither land play nor spell count changes except Show and Tell itself (1 spell cast). The creature
  entered this turn, so it is summoning sick. p1's Island enters untapped. Neither entrance triggers anything.
---
