id: mu-cutter-flurry-on-opponents-turn-bolt-and-daze
title: Bolt and Daze cast on the opponent's turn are the UR player's second spell that turn and trigger Flurry
area: matchup
cards: [Cori-Steel Cutter, Lightning Bolt, Daze, Volcanic Island, Stock Up, Island, Tropical Island, Hedge Maze]
tags: [matchup, cori-steel-cutter, flurry, opponents-turn, daze, token, spell-count]
derived_from: oracle
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Flurry — Whenever you cast your second spell each turn, create a 1/1 white Monk creature token with prowess. You may attach this Equipment to it.", verified: true}
  - {kind: oracle, card: Daze, text: "You may return an Island you control to its owner's hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Daze, text: "Counter target spell unless its controller pays {1}.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt", "Daze @daze"]
    battlefield: ["Cori-Steel Cutter @cut", "Volcanic Island @v"]
    library_pad: 10
  p1:
    hand: ["Stock Up @su"]
    battlefield: ["Island", "Tropical Island", "Hedge Maze"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@su", pay: auto}
  - p1: {t: pass}
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: cast, card: "@daze", alt_cost: {return_island: "@v"}, targets: ["@su"]}
  - check:
      stack:
        - {kind: spell, card: "@su", controller: p1}
        - {kind: spell, card: "@bolt", controller: p0}
        - {kind: spell, card: "@daze", controller: p0, targets: ["@su"]}
        - {kind: triggered, source: "@cut", controller: p0}
      p0: {hand: [Volcanic Island], spells_cast_this_turn: 2}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: yes_no, purpose: attach_equipment, answer: true}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0}]
      p1: {graveyard: [Stock Up]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p1: {life: 17, graveyard: [Stock Up], hand: []}
    p0:
      hand: [Volcanic Island]
      graveyard: [Lightning Bolt, Daze]
      battlefield: [{card: Cori-Steel Cutter}, {token: Monk Token, pt: [2, 2], keywords: [prowess, trample, haste], sick: true}]
notes: >
  "Each turn" counts p0's spells in p1's turn too. Bolt (tapping Volcanic Island) is p0's first spell; p0 keeps priority
  and casts Daze by returning the tapped Volcanic Island: second spell, Flurry triggers on top. The Monk is created and
  equipped; then Daze resolves and p1, tapped out, cannot pay (no prompt), so Stock Up is countered; then Bolt hits p1.
  After each resolution the active player p1 gets priority first.
