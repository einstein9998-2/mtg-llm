id: orims-chant-spells-already-on-the-stack-still-resolve
title: "A spell the opponent cast before Orim's Chant resolved stays on the stack and resolves; a second spell cast after Chant is not offered"
area: card
cards: ["Orim's Chant", Plains, Lightning Bolt, Mountain]
tags: [orims-chant, casting-restriction, stack, response, resolution, legal-action-mask]
derived_from: oracle
source:
  - {kind: oracle, card: "Orim's Chant", text: "Target player can't cast spells this turn.", verified: true, note: "Orim's Chant Oracle text supplied by the engine owner from Scryfall data; the card is not yet in reference/oracle.json (an entry is provided in NOTES.md)"}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
  - {kind: cr, ref: "611.2c", text: "A continuous effect generated by the resolution of a spell or ability that doesn’t modify the characteristics or change the controller of any objects modifies the rules of the game, so it can affect objects that weren’t affected when that continuous effect began.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Orim's Chant @chant"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @b1", "Lightning Bolt @b2"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: cast, card: "@b1", targets: [{player: p0}], pay: {tap: ["@m1"]}}
  - p1: {t: pass}
  - p0: {t: cast, card: "@chant", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@b1", controller: p1}, {kind: spell, card: "@chant", controller: p0}]
      pending: {actor: p1, kind: priority}
      legal: {p1: {include: [{t: cast, card: "@b2", targets: [{player: p0}]}]}}
  - p1: {t: pass}
  - check:
      stack: [{kind: spell, card: "@b1", controller: p1}]
      pending: {actor: p0, kind: priority}
      p0: {life: 20, graveyard: ["Orim's Chant"]}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@b2", targets: [{player: p0}], pay: {tap: ["@m2"]}}}
  - check:
      pending: {actor: p1, kind: priority}
      legal: {p1: {include: [{t: pass}], exclude: [{t: cast, card: "@b2"}]}}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 17
      graveyard: ["Orim's Chant"]
    p1:
      hand: [Lightning Bolt]
      graveyard: [Lightning Bolt]
      spells_cast_this_turn: 1
      battlefield: [{card: Mountain, tapped: true}, {card: Mountain, tapped: false}]
notes: >
  Stack bottom to top: Bolt (p1), Chant (p0). While Chant is unresolved p1 may cast the second Bolt (control, in the
  legal check). Chant resolves, the first Bolt is untouched and resolves afterwards (p0 20 - 3 = 17); the restriction
  prevents only casting, not resolution of spells already cast (it is a rules-modifying effect, 611.2c, that governs
  casting from now on). While Bolt #1 is still on the stack p1 is not offered Bolt #2 despite the untapped Mountain.
  Wrong engines: counter or skip the earlier spell, or let a second spell be cast while another is on the stack.
