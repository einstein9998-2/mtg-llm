id: polluted-delta-finds-island-or-swamp-types-not-mountain
title: Polluted Delta finds an Island or Swamp card (a basic Swamp is legal even for a blue-red deck), not a Mountain or Plains
area: card
cards: [Polluted Delta, Swamp, Island, Mountain, Volcanic Island, Plains]
tags: [fetchland, search, land-types, thinning]
derived_from: oracle
source:
  - {kind: oracle, card: Polluted Delta, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for an Island or Swamp card, put it onto the battlefield, then shuffle.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Polluted Delta @delta"]
    library: ["Mountain @mtn", "Swamp @sw", "Island @isl", "Volcanic Island @volc", "Plains @pl"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@delta", ability: 0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, purpose: fetch, found: "@sw", expect_options: {include: ["@sw", "@isl", "@volc"], exclude: ["@mtn", "@pl"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 19
      graveyard: [Polluted Delta]
      battlefield: [{card: Swamp, tapped: false}]
      library_count: 14
notes: >
  Nothing restricts the choice to lands the deck can use: a Swamp is a legal find, and so are Island and Volcanic Island (it has the Island subtype).
  Mountain and Plains must not be offered. Library 5 listed + 10 pad = 15, minus one = 14.
