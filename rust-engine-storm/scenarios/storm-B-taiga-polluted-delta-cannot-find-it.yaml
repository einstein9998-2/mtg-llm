id: storm-b-taiga-polluted-delta-cannot-find-it
title: Polluted Delta (Island or Swamp card) cannot find Taiga, only cards with Island or Swamp types
area: card
cards: [Polluted Delta, Taiga, Underground Sea, Island, Swamp, Mountain, Forest, Volcanic Island]
tags: [taiga, polluted-delta, fetchland, search, basic-land-types, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Polluted Delta, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for an Island or Swamp card, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: cr, ref: "305.6", text: "An object with the land card type and a basic land type has the intrinsic ability “{T}: Add [mana symbol],” even if the text box doesn’t actually contain that text or the object has no text box.", verified: true}
  - {kind: cr, ref: "701.23a", text: "To search for a card in a zone, look at all cards in that zone (even if it’s a hidden zone) and find a card that matches the given description.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    lands_played: 1
    battlefield: ["Polluted Delta @delta"]
    library: ["Taiga @taiga", "Underground Sea @us", "Island @isl", "Swamp @sw", "Mountain @mtn", "Forest @for", "Volcanic Island @vi"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@delta", ability: 0}
  - resolve_top: true
  - p0:
      decision: search
      found: "@us"
      expect_options:
        include: ["@us", "@isl", "@sw", "@vi"]
        exclude: ["@taiga", "@mtn", "@for"]
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 19
      graveyard: [Polluted Delta]
      battlefield: [{card: Underground Sea}]
      library_count: 16
notes: >
  Negative control for the two Taiga fetch scenarios: Taiga has neither Island nor Swamp, so Polluted Delta does not
  offer it, even though the other duals qualify. The found Underground Sea leaves Taiga in the library.
