notes: >
  -7 costs all seven loyalty, so Tezzeret dies (704.5i) but the ability still resolves: the emblem. Beginning of combat
  (a step of p0's own turn) triggers the emblem: target artifact YOU control (Petal or Vial, not the opponent's Bauble).
  Petal is not a creature, so it becomes a 0/0 Robot artifact creature and has three counters: 3/3. The Vial is untouched. A wrong engine targets
  opposing artifacts, forgets the creature clause, or puts the counters on a 0/0 that then dies (0/0 with counters = 3/3 survives).
