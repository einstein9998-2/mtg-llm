id: tron2-a-confluence-three-scions-sacrificed-for-colorless-pay-for-trinisphere
title: "After Eldrazi Confluence makes three Eldrazi Scions, sacrificing them is the only way to pay {3} for Trinisphere with every land tapped"
area: card
cards: [Eldrazi Confluence, Ancient Tomb, Island, Trinisphere, Eldrazi Scion Token]
tags: [eldrazi-confluence, modal, eldrazi-scion, token, mana-ability, sacrifice-cost, summoning-sickness, mana-payment]
derived_from: oracle
source:
  - {kind: oracle, card: Eldrazi Confluence, text: 'Create a 1/1 colorless Eldrazi Scion creature token with "Sacrifice this token: Add {C}."', verified: true}
  - {kind: cr, ref: "700.2d", text: "If a player is allowed to choose more than one mode for a modal spell or ability, that player normally can’t choose the same mode more than once. However, some modal spells include the instruction “You may choose the same mode more than once.” If a particular mode is chosen multiple times, the spell is treated as if that mode appeared that many times in sequence. If that mode requires a target, the same player or object may be chosen as the target for each of those modes, or different targets may be chosen.", verified: true}
  - {kind: cr, ref: "605.1a", text: "An activated ability is a mana ability if it meets all of the following criteria: it doesn’t require a target (see rule 115.6), it could add mana to a player’s mana pool when it resolves, and it’s not a loyalty ability. (See rule 606, “Loyalty Abilities.”)", verified: true}
  - {kind: cr, ref: "605.3b", text: "An activated mana ability doesn’t go on the stack, so it can’t be targeted, countered, or otherwise responded to. Rather, it resolves immediately after it is activated. (See rule 405.6c.)", verified: true}
  - {kind: cr, ref: "302.6", text: ". A creature’s activated ability with the tap symbol or the untap symbol in its activation cost can’t be activated unless the creature has been under its controller’s control continuously since their most recent turn began. A creature can’t attack unless it has been under its controller’s control continuously since their most recent turn began. This rule is informally called the “summoning sickness” rule.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Eldrazi Confluence @conf", "Trinisphere @tri"]
    battlefield: ["Ancient Tomb @tomb", "Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@conf", modes: [10], targets: [], pay: {tap: ["@tomb", "@i1", "@i2"]}}
  - resolve_top: true
  - check:
      stack: []
      p0:
        battlefield_contains:
          - {token: Eldrazi Scion Token, pt: [1, 1], types: [Creature], subtypes: [Eldrazi, Scion], colors: [], sick: true, tapped: false}
          - {token: Eldrazi Scion Token, pt: [1, 1], types: [Creature], subtypes: [Eldrazi, Scion], colors: [], sick: true, tapped: false}
          - {token: Eldrazi Scion Token, pt: [1, 1], types: [Creature], subtypes: [Eldrazi, Scion], colors: [], sick: true, tapped: false}
  - p0: {t: cast, card: "@tri", pay: auto}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 18
      mana_pool: {}
      graveyard: [Eldrazi Confluence]
      battlefield:
        - {card: Ancient Tomb, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Trinisphere, tapped: false}
notes: >
  Every land is tapped after Confluence (modes 10, Scion x3) resolves, so Trinisphere ({3}) can only be paid by sacrificing the
  three tokens for {C} each: sacrificing has no {T} in its cost, so summoning sickness is irrelevant (302.6), it is a mana
  ability (605.1a) that does not use the stack (605.3b), and mana abilities may be activated while paying costs (601.2g). The
  script lets the engine choose the payment (`pay: auto`); equivalent payments are the same state. All three Scions are gone
  afterwards (the battlefield list is exact). KNOWN ADAPTER GAP: the explicit form (activate each Scion, then cast) cannot be
  written because created tokens that are identical cannot be named: `bind` needs exactly one match and the doc 04 handle
  `p0:Eldrazi Scion Token#k` is rejected ("unknown alias") for objects that were not in the setup. A wrong engine makes fewer
  tokens or applies summoning sickness to the sacrifice cost.
