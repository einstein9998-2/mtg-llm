id: orims-chant-kicked-attack-restriction-ends-with-the-turn
title: "Kicked Orim's Chant cast in the caster's main phase does not stop the opponent's creature from attacking on the opponent's next turn"
area: card
cards: ["Orim's Chant", Plains, Ocelot Pride, Lightning Bolt, Mountain]
tags: [orims-chant, kicker, kicked, duration, this-turn, declare-attackers, turn-structure, control-case]
derived_from: oracle
source:
  - {kind: oracle, card: "Orim's Chant", text: "If this spell was kicked, creatures can't attack this turn.", verified: true, note: "Orim's Chant Oracle text supplied by the engine owner from Scryfall data; the card is not yet in reference/oracle.json (an entry is provided in NOTES.md)"}
  - {kind: cr, ref: "514.2", text: "all “until end of turn” and “this turn” effects end.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as “until end of turn”).", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Orim's Chant @chant"]
    battlefield: ["Plains @pl1", "Plains @pl2"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m", "Ocelot Pride @op"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@chant", kicked: true, targets: [{player: p1}], pay: {tap: ["@pl1", "@pl2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - advance: {to: begin_combat, of: p1}
  - check:
      turn: 4
      phase: begin_combat
      active: p1
      pending: {actor: p1, kind: priority}
      legal: {p1: {include: [{t: cast, card: "@bolt", targets: [{player: p0}]}]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: declare_attackers, attacks: [{creature: "@op", target: {player: p0}}], expect_options: {include: ["@op"]}}
expect:
  - at: after_script
    turn: 4
    phase: declare_attackers
    active: p1
    pending: {actor: p1, kind: priority}
    p1:
      battlefield_contains: [{card: Ocelot Pride, tapped: true, attacking: true}]
    p0: {life: 20}
notes: >
  Chant resolves in p0's turn 3 and ends with it (514.2). Ocelot Pride on p1's side was not able to attack on turn 3
  (not p1's turn anyway) and is a legal attacker on turn 4; Bolt is also castable again in p1's beginning of combat step.
  p0 has no creatures, so p0's own declare attackers step raises no decision and `advance` passes through to p1's
  beginning of combat. Wrong engines make the restriction last through the next turn or until p1's next attack.
