id: mu-veil-counters-charm-via-hexproof-from-blue
title: Veil of Summer in response to Prismari Charm on Atraxa gives hexproof from blue and draws; the Charm does not resolve
area: matchup
cards: [Veil of Summer, Prismari Charm, "Atraxa, Grand Unifier", Volcanic Island, Tropical Island]
tags: [matchup, veil-of-summer, hexproof-from-blue, target-illegal, prismari-charm, draw]
derived_from: cr
source:
  - {kind: oracle, card: Veil of Summer, text: "Draw a card if an opponent has cast a blue or black spell this turn. Spells you control can't be countered this turn. You and permanents you control gain hexproof from blue and from black until end of turn.", verified: true}
  - {kind: cr, ref: "702.11d", text: "\"Hexproof from [quality]\" on a permanent means \"This permanent can't be the target of [quality] spells your opponents control or abilities your opponents control from [quality] sources.\"", verified: true}
  - {kind: cr, ref: "608.2b", text: "If the spell or ability specifies targets, it checks whether the targets are still legal.", verified: true}
  - {kind: cr, ref: "202.2c", text: "An object with two or more different colored mana symbols in its mana cost is each of the colors of those mana symbols.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Prismari Charm @charm"]
    battlefield: ["Volcanic Island", "Volcanic Island"]
    library_pad: 10
  p1:
    hand: ["Veil of Summer @veil"]
    battlefield: ["Atraxa, Grand Unifier @atx", "Tropical Island"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@charm", modes: [3], targets: ["@atx"], pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@veil", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@charm", controller: p0, targets: ["@atx"]}]
      pending: {actor: p0, kind: priority}
      p1: {hand_count: 1, graveyard: [Veil of Summer], library_count: 9}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p1: {battlefield_contains: [{card: "Atraxa, Grand Unifier"}], hand_count: 1, graveyard: [Veil of Summer]}
    p0: {graveyard: [Prismari Charm], hand: []}
notes: >
  Prismari Charm ({U}{R}) is blue and red (202.2c), so p0 has cast a blue spell this turn and Veil draws. Atraxa gains
  hexproof from blue; when the Charm tries to resolve its only target is illegal (702.11d, 608.2b), so it does nothing and
  goes to the graveyard. Atraxa stays.
