id: faithless-looting-flashback-countered-is-exiled
title: A flashed-back Faithless Looting countered by Daze is exiled rather than put into the graveyard
area: card
cards: [Faithless Looting, Daze, Island, Badlands, Swamp]
tags: [faithless-looting, flashback, daze, counterspell, exile]
derived_from: cr
source:
  - {kind: cr, ref: "702.34a", text: "“If the flashback cost was paid, exile this card instead of putting it anywhere else any time it would leave the stack.”", verified: true}
  - {kind: oracle, card: Daze, text: "Counter target spell unless its controller pays {1}.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Badlands @b", "Swamp @s1", "Swamp @s2"]
    graveyard: ["Faithless Looting @fl"]
    library_pad: 10
  p1:
    hand: ["Daze @dz"]
    battlefield: ["Island @j"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@fl", alt_cost: {flashback: true}, pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@dz", alt_cost: {return_island: "@j"}, targets: ["@fl"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand_count: 0
      graveyard: []
      exile: [Faithless Looting]
    p1:
      hand: [Island]
      graveyard: [Daze]
      battlefield: []
notes: >
  All three of p0's lands paid the flashback cost, so p0 cannot pay Daze's {1} and no pay prompt is raised (exemplar
  convention). Looting is countered, and because its flashback cost was paid it is exiled on leaving the stack, not put
  into the graveyard. Wrong engine: graveyard on counter, letting p0 flash it back again.
