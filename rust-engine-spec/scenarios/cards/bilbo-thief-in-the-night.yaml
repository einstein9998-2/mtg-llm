id: bilbo-reduces-nethergoyf-escape-cost-by-one
title: With Bilbo, Nethergoyf's escape costs {1}{B} and is castable with two lands
area: card
cards: ["Bilbo, Thief in the Night", Nethergoyf, Swamp, Island, Brainstorm, Ponder, "Mishra's Bauble"]
tags: [bilbo, cost-reduction, escape, cast-from-graveyard, alternative-cost]
derived_from: cr
source:
  - {kind: oracle, card: "Bilbo, Thief in the Night", text: "Spells you cast from anywhere other than your hand cost {1} less to cast.", verified: true}
  - {kind: oracle, card: Nethergoyf, text: "Escape—{2}{B}, Exile any number of other cards from your graveyard with four or more card types among them.", verified: true}
  - {kind: cr, ref: "118.9d", text: "If an alternative cost is being paid to cast a spell, any additional costs, cost increases, and cost reductions that affect that spell are applied to that alternative cost.", verified: true}
  - {kind: cr, ref: "118.7a", text: "Effects that reduce a cost by an amount of generic mana affect only the generic mana component of that cost.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Bilbo, Thief in the Night @bilbo", "Swamp @s1", "Island @i1"]
    graveyard: ["Nethergoyf @goyf", "Island @gi", "Brainstorm @gb", "Ponder @gp", "Mishra's Bauble @gm"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@goyf", alt_cost: {escape: {exile: ["@gi", "@gb", "@gp", "@gm"]}}, pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: []
      exile: [Island, Brainstorm, Ponder, "Mishra's Bauble"]
      battlefield:
        - {card: "Bilbo, Thief in the Night"}
        - {card: Nethergoyf, pt: [0, 1]}
        - {card: Swamp, tapped: true}
        - {card: Island, tapped: true}
notes: >
  Escape casts Nethergoyf from the graveyard, so Bilbo's reduction applies to the escape cost (118.9d): {2}{B} becomes
  {1}{B}, which the two lands pay. Afterwards p0's graveyard is empty and Nethergoyf is 0/1. Without the reduction the cast
  would be impossible with two lands.
