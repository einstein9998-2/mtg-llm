id: nethergoyf-pt-counts-card-types-in-own-graveyard-only
title: Nethergoyf counts the card types in its controller's graveyard and ignores the opponent's graveyard
area: card
cards: [Nethergoyf, Island, Brainstorm, Ponder, "Mishra's Bauble", Overlord of the Balemurk, Lightning Bolt]
tags: [nethergoyf, characteristic-defining-ability, layer-7a, card-types, graveyard]
derived_from: oracle
source:
  - {kind: oracle, card: Nethergoyf, text: "Nethergoyf's power is equal to the number of card types among cards in your graveyard and its toughness is equal to that number plus 1.", verified: true}
  - {kind: cr, ref: "205.2a", text: "The card types are artifact, battle, conspiracy, creature, dungeon, enchantment, instant, kindred, land, phenomenon, plane, planeswalker, scheme, sorcery, and vanguard.", verified: true}
  - {kind: cr, ref: "613.4a", text: "Layer 7a: Effects from characteristic-defining abilities that define power and/or toughness are applied.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Nethergoyf @goyf"]
    graveyard: [Island, Brainstorm, Ponder, "Mishra's Bauble"]
    library_pad: 10
  p1:
    graveyard: [Overlord of the Balemurk, Lightning Bolt]
    library_pad: 10
script: []
expect:
  - at: after_script
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: Nethergoyf, pt: [4, 5]}]
notes: >
  p0's graveyard has a land, an instant, a sorcery and an artifact: four card types, so Nethergoyf is 4/5. p1's graveyard
  (an enchantment creature and an instant) is not "your graveyard" for p0's Nethergoyf. An engine that reuses a
  Tarmogoyf/Barrowgoyf all-graveyards count gets 6/7.
---
id: nethergoyf-multitype-card-counts-each-type-and-duplicates-count-once
title: An enchantment creature card counts as two types and three lands count as one type
area: card
cards: [Nethergoyf, Overlord of the Balemurk, Island, Swamp, Underground Sea]
tags: [nethergoyf, characteristic-defining-ability, card-types, multi-type-card]
derived_from: oracle
source:
  - {kind: oracle, card: Nethergoyf, text: "Nethergoyf's power is equal to the number of card types among cards in your graveyard and its toughness is equal to that number plus 1.", verified: true}
  - {kind: cr, ref: "205.2a", text: "The card types are artifact, battle, conspiracy, creature, dungeon, enchantment, instant, kindred, land, phenomenon, plane, planeswalker, scheme, sorcery, and vanguard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Nethergoyf @goyf"]
    graveyard: [Overlord of the Balemurk, Island, Swamp, Underground Sea]
    library_pad: 10
  p1:
    library_pad: 10
script: []
expect:
  - at: after_script
    p0:
      battlefield: [{card: Nethergoyf, pt: [3, 4]}]
