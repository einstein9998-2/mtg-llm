area: card
cards: ["Tezzeret, Cruel Captain", Lotus Petal, Aether Vial, "Mishra's Bauble"]
tags: [tezzeret, planeswalker, loyalty-ability, emblem, beginning-of-combat, type-changing, counters, mask-validity]
