id: phelia-exiles-own-permanent-returns-under-your-control-counter
title: When Phelia exiles her controller's own permanent, it returns under that player's control and Phelia gets a +1/+1 counter
area: card
cards: ["Phelia, Exuberant Shepherd", Aether Vial, Plains]
tags: [phelia, attack-trigger, flicker, delayed-trigger, counters, new-object]
derived_from: oracle
source:
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "At the beginning of the next end step, return that card to the battlefield under its owner's control. If it entered under your control, put a +1/+1 counter on Phelia.", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phelia, Exuberant Shepherd @ph", {card: Aether Vial, as: mv, counters: {charge: 3}}]
    library_pad: 10
  p1:
    battlefield: ["Plains @pw"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@ph", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: "@mv"}
  - resolve_top: true
  - advance: {to: end, of: p0}
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: []
      battlefield:
        - {card: "Phelia, Exuberant Shepherd", counters: {"+1/+1": 1}, pt: [3, 3]}
        - {card: Aether Vial, controller: p0, counters: {}}
    p1:
      life: 18
notes: >
  Phelia's controller owns the Vial, so it returns under p0's control and Phelia gets the counter (3/3). The Vial comes
  back with no charge counters. Positive pair of the opponent's-permanent scenario. The advance from the declare
  attackers step crosses blockers (p1 has no creature) and damage (2 to p1) with no decision.
