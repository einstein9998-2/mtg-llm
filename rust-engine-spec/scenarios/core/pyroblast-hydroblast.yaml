id: pyroblast-mode-legality-counter-needs-spell-destroy-needs-permanent
title: "Pyroblast's counter mode needs a spell and its destroy mode needs a permanent; a colorless land is a legal but harmless target"
area: core
cards: [Pyroblast, Mountain, Island]
tags: [pyroblast, modes, mask-validity, targeting, mode-availability, expect-illegal]
derived_from: cr
source:
  - {kind: cr, ref: "700.2a", text: "If one of the modes would be illegal (due to an inability to choose legal targets, for example), that mode can’t be chosen.", verified: true}
  - {kind: cr, ref: "115.2", text: "Only permanents are legal targets for spells and abilities, unless a spell or ability (a) specifies that it can target an object in another zone or a player, or (b) targets an object that can’t exist on the battlefield, such as a spell or ability.", verified: true}
  - {kind: oracle, card: Pyroblast, text: "• Destroy target permanent if it's blue.", verified: true}
  - {kind: oracle, card: Pyroblast, text: "Choose one", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Pyroblast @pyro"]
    battlefield: ["Mountain @m"]
    library_pad: 10
  p1:
    battlefield: ["Island @isl"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@pyro", modes: [1], targets: ["@isl"], pay: auto}}
  - expect_illegal: {p0: {t: cast, card: "@pyro", modes: [1], targets: [], pay: auto}}
  - expect_illegal: {p0: {t: cast, card: "@pyro", modes: [2], targets: [{player: p1}], pay: auto}}
  - expect_illegal: {p0: {t: cast, card: "@pyro", modes: [1, 2], targets: ["@isl"], pay: auto}}
  - p0: {t: cast, card: "@pyro", modes: [2], targets: ["@isl"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Pyroblast]}
    p1: {battlefield: [{card: Island}], graveyard: []}
notes: >
  With an empty stack the counter mode has no legal target and cannot be chosen; a land is not a spell. The destroy
  mode cannot target a player (not a permanent) and exactly one mode must be chosen. The Island is a legal target
  for "destroy target permanent if it's blue" (any permanent); basic lands are colorless, so the Island survives and
  Pyroblast resolves and is put into the graveyard.
