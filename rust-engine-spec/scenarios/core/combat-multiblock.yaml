id: multiblock-assign-all-damage-to-second-blocker-no-order
title: An attacker blocked by two creatures divides its damage as its controller chooses, including all of it to either blocker (no damage assignment order)
area: core
cards: [Murktide Regent, Faerie Macabre, "Spider-Woman, Stunning Savior"]
tags: [combat, multiple-blockers, combat-damage-assignment, no-damage-assignment-order, kd-0001, assign-combat-damage-decision]
derived_from: cr
source:
  - {kind: cr, ref: "510.1c", text: "A blocked creature assigns its combat damage to the creatures blocking it. If no creatures are currently blocking it (if, for example, they were destroyed or removed from combat), it assigns no combat damage. If exactly one creature is blocking it, it assigns all its combat damage to that creature. If two or more creatures are blocking it, it assigns its combat damage to those creatures divided as its controller chooses among them.", verified: true}
  - {kind: cr, ref: "510.1a", text: "Each attacking creature and each blocking creature assigns combat damage equal to its power.", verified: true}
  - {kind: cr, ref: "510.1d", text: "A blocking creature assigns combat damage to the creatures it’s blocking. If it isn’t currently blocking any creatures (if, for example, they were destroyed or removed from combat), it assigns no combat damage.", verified: true}
  - {kind: cr, ref: "704.5g", text: "If a creature has toughness greater than 0, it has damage marked on it, and the total damage marked on it is greater than or equal to its toughness, that creature has been dealt lethal damage and is destroyed.", verified: true}
  - {kind: cr, ref: "702.9b", text: "A creature with flying can’t be blocked except by creatures with flying and/or reach. A creature with flying can block a creature with or without flying.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Murktide Regent @murk"]
    library_pad: 10
  p1:
    battlefield: ["Faerie Macabre @fm", "Spider-Woman, Stunning Savior @sw"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@murk", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1:
      decision: declare_blockers
      blocks: [{blocker: "@fm", attacker: "@murk"}, {blocker: "@sw", attacker: "@murk"}]
      expect_options: {include: ["@fm", "@sw"]}
  - check: {phase: declare_blockers, priority: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: assign_combat_damage
      assignment: {"@fm": 0, "@sw": 3}
      expect_options: {include: ["@fm", "@sw"], exclude: [{player: p1}]}
expect:
  - at: after_script
    p0: {life: 20, battlefield: [], graveyard: [Murktide Regent]}
    p1:
      life: 20
      battlefield: [{card: Faerie Macabre, damage: 0, tapped: false}]
      graveyard: ["Spider-Woman, Stunning Savior"]
notes: >
  Known divergence kd-0001. Under the pinned CR (effective 2025-11-14) there is NO damage assignment order: with two or
  more blockers the attacker's controller divides the damage as they choose among them (510.1c). Here p0 assigns all 3
  damage to the second blocker and none to the first. Under the old ordering rules (which Forge still implements) this
  is illegal if Faerie Macabre came first in the order. Spider-Woman (toughness 2) dies; Faerie Macabre takes nothing and
  survives undamaged. The two 2-power blockers each assign 2 to Murktide (a single-attacker, single-blocker assignment is
  automatic), 4 total >= 3 toughness, so the Regent dies too. The assignment recipients offered are the two blockers
  only: the defending player is not a legal recipient without trample. No damage reaches p1.
---
