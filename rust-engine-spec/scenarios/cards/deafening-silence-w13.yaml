id: deafening-silence-countered-spell-still-counts
title: Under Deafening Silence a noncreature spell that was countered still counts as the one spell cast this turn
area: card
symmetric: true
cards: [Deafening Silence, Lightning Bolt, Mountain, Force of Will, Brainstorm]
tags: [deafening-silence, casting-restriction, counterspell, legal-action-mask]
derived_from: oracle
source:
  - {kind: oracle, card: Deafening Silence, text: "Each player can't cast more than one noncreature spell each turn.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn’t resolve and none of its effects occur. A countered spell is put into its owner’s graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @b1", "Lightning Bolt @b2"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    hand: ["Force of Will @fow", "Brainstorm @bs"]
    battlefield: ["Deafening Silence @ds"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: {tap: ["@m1"]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@b1"]}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {graveyard: [Lightning Bolt]}
  - expect_illegal: {p0: {t: cast, card: "@b2", targets: [{player: p1}], pay: {tap: ["@m2"]}}}
  - check:
      legal: {p0: {exclude: [{t: cast, card: "@b2"}]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Lightning Bolt]
      graveyard: [Lightning Bolt]
      spells_cast_this_turn: 1
    p1:
      life: 19
      graveyard: [Force of Will]
      exile: [Brainstorm]
notes: >
  The restriction is about casting. p0's first Bolt was cast (then countered), so a second noncreature spell would be
  the second cast this turn and is excluded even with an untapped Mountain. p1 paid 1 life and exiled Brainstorm for
  Force of Will (its own first noncreature spell). A wrong engine counts only spells that resolved.
