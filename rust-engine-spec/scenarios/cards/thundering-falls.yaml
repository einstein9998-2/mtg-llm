id: thundering-falls-is-an-island-so-daze-may-return-it
title: Daze may return a tapped Thundering Falls because it has the Island subtype
area: card
cards: [Thundering Falls, Daze, Lightning Bolt, Mountain]
tags: [daze, alternative-cost, land-types, dual-land]
derived_from: oracle
source:
  - {kind: oracle, card: Daze, text: "You may return an Island you control to its owner's hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Thundering Falls, text: "({T}: Add {U} or {R}.)", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @mtn"]
    library_pad: 10
  p1:
    hand: ["Daze @daze"]
    battlefield:
      - {card: Thundering Falls, as: falls, tapped: true}
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@daze", alt_cost: {return_island: "@falls"}, targets: ["@bolt"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Lightning Bolt], life: 20}
    p1: {hand: [Thundering Falls], graveyard: [Daze], battlefield: [], life: 20}
notes: >
  Thundering Falls is a Land - Island Mountain, so it is "an Island you control". Tapped lands may be returned (nothing requires untapped). p0's
  only Mountain was tapped for Lightning Bolt, so p0 cannot pay Daze's {1}: Bolt is countered with no prompt. p1 ends with the land in hand,
  not on the battlefield, and Daze in the graveyard.
