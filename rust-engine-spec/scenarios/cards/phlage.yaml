id: phlage-escape-not-offered-with-four-other-cards
title: Phlage cannot be cast with escape when only four other cards are in its owner's graveyard
area: card
cards: ["Phlage, Titan of Fire's Fury", Mountain, Plains, Lightning Bolt, Brainstorm, Ponder, Island]
tags: [phlage, escape, mask-validity, cast-from-graveyard]
derived_from: oracle
source:
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Escape—{R}{R}{W}{W}, Exile five other cards from your graveyard.", verified: true}
  - {kind: cr, ref: "118.3", text: "A player can't pay a cost without having the necessary resources to pay it fully.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    graveyard: ["Phlage, Titan of Fire's Fury @ph", "Lightning Bolt @g1", "Brainstorm @g2", "Ponder @g3", "Island @g4"]
    battlefield: ["Mountain @m1", "Mountain @m2", "Plains @w1", "Plains @w2"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@ph", alt_cost: {escape: {exile: ["@g1", "@g2", "@g3", "@g4"]}}}}
expect:
  - at: after_script
    pending: {actor: p0, kind: priority}
    legal: {p0: {include: [{t: pass}], exclude: [{t: cast, card: "@ph"}]}}
    p0:
      graveyard: ["Phlage, Titan of Fire's Fury", Lightning Bolt, Brainstorm, Ponder, Island]
notes: >
  Four other cards cannot pay "exile five other cards", and nothing else lets Phlage be cast from the graveyard, so no
  cast of Phlage is offered. Positive control: the escape scenario above with five other cards. A wrong engine counts
  Phlage itself toward the five.
