id: edge-of-autumn-cycling-by-sacrificing-a-land-at-instant-speed
title: Edge of Autumn's cycling (sacrifice a land, discard it) is activated from hand in the opponent's end step and draws a card
area: card
cards: [Edge of Autumn, Swamp, Island, Ponder]
tags: [edge-of-autumn, cycling, sacrifice-cost, activated-from-hand, instant-speed]
derived_from: cr
source:
  - {kind: oracle, card: Edge of Autumn, text: "Cycling—Sacrifice a land.", verified: true}
  - {kind: cr, ref: "702.29a", text: "Cycling is an activated ability that functions only while the card with cycling is in a player’s hand. “Cycling [cost]” means “[Cost], Discard this card: Draw a card.”", verified: true}
  - {kind: cr, ref: "117.3c", text: "If a player has priority when they cast a spell, activate an ability, or take a special action, that player receives priority afterward.", verified: true}
setup:
  turn: 4
  active: p1
  phase: end
  priority: p0
  p0:
    hand: ["Edge of Autumn @e"]
    battlefield: ["Swamp @s", "Island @i"]
    library: ["Ponder @pd"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate_from_hand, source: "@e", ability: 0, sacrifice: ["@s"]}
  - check:
      stack: [{kind: activated, source: "@e", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0: {hand: [], graveyard: [Edge of Autumn, Swamp], battlefield: [{card: Island, tapped: false}]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    phase: end
    p0:
      hand: [Ponder]
      library_count: 10
      graveyard: [Edge of Autumn, Swamp]
      battlefield: [{card: Island, tapped: false}]
notes: >
  Cycling is an activated ability usable whenever p0 has priority, here in p1's end step (setup gives p0 priority after
  p1 passed). Both costs (sacrificing the chosen Swamp, discarding Edge) are paid on activation, so they are in the
  graveyard while the ability is on the stack. After it resolves the active player p1 gets priority. The cost choice is
  written as `sacrifice: [...]` on the action (see REPORT schema-requests). Wrong engines: treat cycling as sorcery-speed,
  tap instead of sacrifice, or draw before paying.
