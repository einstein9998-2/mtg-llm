id: flurry-second-spell-makes-monk-and-attach-yes
title: "Cori-Steel Cutter flurry: the second spell this turn creates a Monk token, and attaching the Equipment gives it +1/+1, trample and haste"
area: core
cards: [Cori-Steel Cutter, Lightning Bolt, Mountain, Monk Token]
tags: [cori-steel-cutter, flurry, triggers, cast-trigger, token, equipment, prowess, optional-choice]
derived_from: oracle
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Flurry — Whenever you cast your second spell each turn, create a 1/1 white Monk creature token with prowess. You may attach this Equipment to it.", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equipped creature gets +1/+1 and has trample and haste.", verified: true}
  - {kind: cr, ref: "603.3", text: "Once an ability has triggered, its controller puts it on the stack as an object that's not a card the next time a player would receive priority.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @b1", "Lightning Bolt @b2"]
    battlefield: ["Cori-Steel Cutter @cutter", "Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@b1", controller: p0}
      p0: {spells_cast_this_turn: 1}
  - p0: {t: cast, card: "@b2", targets: [{player: p1}], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@b1", controller: p0}
        - {kind: spell, card: "@b2", controller: p0}
        - {kind: triggered, source: "@cutter", controller: p0}
      p0: {spells_cast_this_turn: 2}
      pending: {actor: p0, kind: priority}
  - resolve_top: true
  - p0: {decision: yes_no, purpose: attach_equipment, answer: true}
  - bind: {as: monk, find: {name: "Monk Token", controller: p0}}
expect:
  - at: after_script
    stack:
      - {kind: spell, card: "@b1", controller: p0}
      - {kind: spell, card: "@b2", controller: p0}
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains:
        - {token: Monk Token, controller: p0, types: [Creature], pt: [2, 2], keywords: [prowess, trample, haste]}
        - {card: Cori-Steel Cutter, attached_to: "@monk"}
notes: >
  The first Bolt is the first spell this turn and does not trigger flurry; the second is the second spell and puts one
  triggered ability on the stack above both spells. The token appears after the second spell was cast, so its prowess
  does not fire for that spell. Attaching is a "may": answering yes attaches the Cutter, giving the 1/1 token +1/+1,
  trample and haste (2/2). A wrong engine would trigger on the first spell, skip the choice, or attach automatically.
---
