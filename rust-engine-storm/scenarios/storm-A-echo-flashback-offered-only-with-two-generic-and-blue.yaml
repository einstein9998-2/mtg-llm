notes: >
  Only two Islands: the flashback cost {2}{U} (3 mana) cannot be paid, the full cost {4}{U}{U} cannot be paid, and a graveyard card cannot be cast
  for its normal mana cost at all (no permission). Companion scenario storm-a-echo-flashback-needs-blue-mana covers three lands without blue.
