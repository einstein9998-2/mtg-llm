id: pyroclasm-kills-an-equipped-monk-and-leaves-the-equipment
title: Pyroclasm kills an equipped 2/2 Monk token, and Cori-Steel Cutter stays on the battlefield unattached
area: card
cards: [Pyroclasm, Cori-Steel Cutter, Monk Token, Mountain]
tags: [pyroclasm, equipment, token, state-based-actions, unattach, cori-steel-cutter]
derived_from: cr
source:
  - {kind: oracle, card: Pyroclasm, text: "Pyroclasm deals 2 damage to each creature.", verified: true}
  - {kind: cr, ref: "701.3d", text: "If an Aura, Equipment, or Fortification that was attached to an object or player ceases to be attached to it, that counts as “becoming unattached [from that object or player]”; this includes if that Aura, Equipment, or Fortification leaves the battlefield, the object leaves the zone it was in, or that player leaves the game.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Pyroclasm @pyro"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    battlefield: [{token: Monk Token, as: monk}, {card: Cori-Steel Cutter, as: cut, attached_to: "@monk"}]
    library_pad: 10
script:
  - check:
      p1: {battlefield_contains: [{token: Monk Token, alias: monk, pt: [2, 2]}]}
  - p0: {t: cast, card: "@pyro", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Pyroclasm]}
    p1: {graveyard: [], battlefield: [{card: Cori-Steel Cutter, attached_to: null}]}
notes: >
  The equipped Monk is a 2/2 (+1/+1 from the Cutter), so 2 damage kills it. The token vanishes; the Cutter stays on the battlefield, no longer attached.
  p1 casts no spell, so no prowess trigger helps the Monk. A wrong engine sends the equipment to the graveyard with the creature.
