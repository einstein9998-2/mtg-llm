id: tron-b-ensnaring-bridge-atraxa-six-cards-cannot-attack
title: "Ensnaring Bridge: with six cards in hand Atraxa (power 7) cannot attack but Ocelot Pride can"
area: card
cards: [Ensnaring Bridge, "Atraxa, Grand Unifier", Ocelot Pride, Island]
tags: [ensnaring-bridge, atraxa, declare-attackers, hand-size, attack-restriction, mask-validity, negative, alurentell-specific]
derived_from: oracle
source:
  - {kind: oracle, card: Ensnaring Bridge, text: "Creatures with power greater than the number of cards in your hand can't attack.", verified: true}
  - {kind: cr, ref: "508.1c", text: "If any restrictions are being disobeyed, the declaration of attackers is illegal.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    hand: [Island, Island, Island, Island, Island, Island]
    battlefield: ["Ensnaring Bridge @br", "Atraxa, Grand Unifier @atx", "Ocelot Pride @op"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {decision: declare_attackers, attacks: [{creature: "@atx", target: {player: p1}}]}}
  - p0: {decision: declare_attackers, attacks: [{creature: "@op", target: {player: p1}}], expect_options: {include: ["@op"], exclude: ["@atx"]}}
expect:
  - at: after_script
    phase: declare_attackers
    p0:
      battlefield:
        - {card: Ensnaring Bridge}
        - {card: "Atraxa, Grand Unifier", attacking: false}
        - {card: Ocelot Pride, attacking: true}
notes: >
  Six cards in hand: power 7 > 6 so Atraxa cannot attack (even though she has vigilance, flying and so on); power 1 is fine.
  Contrast with the seven-card scenario: the boundary is exactly power > hand size.
