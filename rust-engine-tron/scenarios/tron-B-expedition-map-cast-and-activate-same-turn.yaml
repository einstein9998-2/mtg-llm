id: tron-b-expedition-map-cast-and-activate-same-turn
title: "Expedition Map can be cast ({1}) and activated ({2}) in the same turn, fetching Ancient Tomb without using the land drop"
area: card
cards: [Expedition Map, Ancient Tomb, Island]
tags: [expedition-map, search, nonbasic, to-hand, no-summoning-sickness, land-drop-unaffected, mana-payment]
derived_from: oracle
source:
  - {kind: oracle, card: Expedition Map, text: "{2}, {T}, Sacrifice this artifact: Search your library for a land card, reveal it, put it into your hand, then shuffle.", verified: true}
  - {kind: cr, ref: "302.6", text: "A creature’s activated ability with the tap symbol or the untap symbol in its activation cost can’t be activated unless the creature has been under its controller’s control continuously since their most recent turn began.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    lands_played: 0
    hand: ["Expedition Map @map"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library: ["Ancient Tomb @tomb", "Island @isl"]
    library_pad: 10
  p1:
    library_pad: 10
random:
  - {kind: shuffle, player: p0, result: [Island, Island, Island, Island, Island, Island, Island, Island, Island, Island, Island]}
script:
  - p0: {t: cast, card: "@map", pay: {tap: ["@i1"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: activate, source: "@map", ability: 0, pay: {tap: ["@i2", "@i3"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, found: "@tomb", expect_options: {include: ["@tomb", "@isl"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Ancient Tomb]
      lands_played: 0
      spells_cast_this_turn: 1
      graveyard: [Expedition Map]
      library_count: 11
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}, {card: Island, tapped: true}]
notes: >
  Cast for {1}, then activated at once for {2}: the summoning-sickness rule (302.6) covers creatures only. The found Ancient Tomb
  goes to the hand and the land drop is not used (lands_played stays 0). The shuffle is scripted (11 Islands remain).
