id: cavern-of-souls-mana-only-for-creature-of-chosen-type
title: Cavern of Souls' colored mana can pay for a creature spell of the chosen type but not for a noncreature spell
area: card
cards: [Cavern of Souls, Ocelot Pride, Swords to Plowshares, "Phelia, Exuberant Shepherd"]
tags: [cavern-of-souls, mana-restriction, legal-action-mask, negative-case]
derived_from: cr
source:
  - {kind: oracle, card: Cavern of Souls, text: "Spend this mana only to cast a creature spell of the chosen type", verified: true}
  - {kind: cr, ref: "106.6", text: "Some spells or abilities that produce mana restrict how that mana can be spent", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Ocelot Pride @op", "Swords to Plowshares @stp"]
    battlefield: [{card: Cavern of Souls, as: cav, flags: {chosen_type: Cat}}]
    library_pad: 10
  p1:
    battlefield: ["Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@cav", ability: 1, choose_color: W}
  - expect_illegal: {p0: {t: cast, card: "@stp", targets: ["@ph"], pay: auto}}
  - check:
      legal:
        p0:
          include: [{t: cast, card: "@op"}]
          exclude: [{t: cast, card: "@stp"}]
  - p0: {t: cast, card: "@op", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      mana_pool: {}
      hand: [Swords to Plowshares]
      battlefield: [{card: Cavern of Souls, tapped: true}, {card: Ocelot Pride, controller: p0}]
    p1: {battlefield: [{card: "Phelia, Exuberant Shepherd"}]}
notes: >
  The only mana p0 has is one restricted {W} from Cavern (chosen type Cat). Ocelot Pride is a Cat creature spell and
  may use it; Swords to Plowshares is an instant and may not, so it is not offered. A wrong engine treats the
  restricted mana as ordinary {W}.
