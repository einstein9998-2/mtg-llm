id: boros-a-static-prison-etb-exiles-target-and-gives-two-energy
title: "Static Prison's enters trigger exiles the chosen nonland permanent an opponent controls and gives its controller two energy"
area: card
cards: [Static Prison, "Phelia, Exuberant Shepherd", Plains]
tags: [static-prison, energy, exile-until-leaves, etb-trigger, targeting, boros]
derived_from: oracle
source:
  - {kind: oracle, card: Static Prison, text: "When this enchantment enters, exile target nonland permanent an opponent controls until this enchantment leaves the battlefield.", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: oracle, card: Static Prison, text: "You get {E}{E} (two energy counters).", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: cr, ref: "107.14", text: "The energy symbol is {E}. It represents one energy counter.", verified: true}
  - {kind: cr, ref: "603.6a", text: "Enters-the-battlefield abilities trigger when a permanent enters the battlefield.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    energy: 0
    hand: ["Static Prison @sp"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    battlefield: ["Phelia, Exuberant Shepherd @ph", "Plains @pw"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@sp", pay: auto}
  - check:
      stack: [{kind: spell, card: "@sp", controller: p0}]
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@ph", expect_options: {include: ["@ph"], exclude: ["@pw", "@pl"], count: 1}}
  - label: trigger-on-stack
    check:
      stack: [{kind: triggered, source: "@sp", controller: p0, targets: ["@ph"], text_contains: "exile"}]
      pending: {actor: p0, kind: priority}
      p0:
        energy: 0
        battlefield:
          - {card: Static Prison, types: [Enchantment]}
          - {card: Plains, tapped: true}
      p1:
        battlefield: [{card: "Phelia, Exuberant Shepherd"}, {card: Plains}]
        exile: []
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      energy: 2
      battlefield:
        - {card: Static Prison, types: [Enchantment]}
        - {card: Plains, tapped: true}
    p1:
      battlefield: [{card: Plains}]
      exile: ["Phelia, Exuberant Shepherd"]
      graveyard: []
notes: >
  The exile and the two energy both happen when the trigger resolves (energy is still 0 while the trigger is on the stack).
  The target is chosen as the trigger goes on the stack (one candidate is still presented; only p1's nonland permanents
  qualify, so p1's Plains and p0's own Plains are excluded). A wrong engine exiles on cast, gives energy on cast, exiles a
  land, or puts Phelia into the graveyard.
