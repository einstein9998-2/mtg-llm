derived_from: oracle
source:
  - {kind: oracle, card: "Spider-Woman, Stunning Savior", text: "Venom Blast — Artifacts and creatures your opponents control enter tapped.", verified: true}
  - {kind: oracle, card: Lotus Petal, text: "{T}, Sacrifice this artifact: Add one mana of any color.", verified: true}
  - {kind: cr, ref: "614.1d", text: "Continuous effects that read \"[This permanent] enters . . .\" or \"[Objects] enter [the battlefield] . . .\" are replacement effects.", verified: true}
setup:
  turn: 5
  active: p1
  phase: main1
  p0:
    battlefield: ["Spider-Woman, Stunning Savior @sw"]
    library_pad: 10
  p1:
    hand: ["Island @pi", "Lotus Petal @lp"]
    library_pad: 10
script:
  - p1: {t: play_land, card: "@pi"}
  - check:
      p1: {battlefield: [{card: Island, tapped: false}]}
  - p1: {t: cast, card: "@lp", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: activate, source: "@lp", ability: 0, choose_color: R}}
