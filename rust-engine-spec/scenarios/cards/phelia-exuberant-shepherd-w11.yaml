id: phelia-return-exiled-by-containment-priest-no-counter
title: Under the opponent's Containment Priest, the creature Phelia returns was not cast, so it is exiled instead and Phelia gets no counter
area: card
cards: ["Phelia, Exuberant Shepherd", "Dragon's Rage Channeler", Containment Priest, Island]
tags: [phelia, containment-priest, replacement-effect, flicker, delayed-trigger, did-not-enter]
derived_from: oracle
source:
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "At the beginning of the next end step, return that card to the battlefield under its owner's control. If it entered under your control, put a +1/+1 counter on Phelia.", verified: true}
  - {kind: oracle, card: Containment Priest, text: "If a nontoken creature would enter and it wasn't cast, exile it instead.", verified: true}
  - {kind: cr, ref: "614.1a", text: "Effects that use the word “instead” are replacement effects.", verified: true}
setup:
  turn: 5
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phelia, Exuberant Shepherd @phelia", "Dragon's Rage Channeler @drc"]
    library_pad: 10
  p1:
    battlefield: ["Containment Priest @cp", "Island @isl"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@phelia", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: "@drc"}
  - resolve_top: true
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: []}
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, source: "@phelia", controller: p0, text_contains: "return"}]
      p1: {life: 18}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: ["Dragon's Rage Channeler"]
      battlefield: [{card: "Phelia, Exuberant Shepherd", tapped: true, pt: [2, 2]}]
    p1:
      battlefield: [{card: Containment Priest}, {card: Island}]
notes: >
  Phelia exiles p0's own (non-attacking) DRC. At the end step the return would put DRC onto the battlefield
  without casting it, so Containment Priest's replacement exiles it instead: it never enters, so "if it entered under
  your control" is false and Phelia gets no counter. p1 may block with the Priest (a decision is raised) but declares no
  block; Phelia deals 2. Bugs caught: the return bypassing the Priest, a counter on Phelia for a creature that did not
  enter.
