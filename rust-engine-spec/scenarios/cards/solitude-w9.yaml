id: solitude-flash-hardcast-exiles-creature-controller-gains-life
title: Solitude cast with flash on the opponent's turn exiles their creature and that creature's controller gains life equal to its power
area: card
cards: [Solitude, Flickerwisp, Plains]
tags: [solitude, flash, etb-trigger, exile, life-gain, priority]
derived_from: oracle
source:
  - {kind: oracle, card: Solitude, text: "Flash", verified: true}
  - {kind: oracle, card: Solitude, text: "When this creature enters, exile up to one other target creature. That creature's controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "702.8a", text: "“Flash” means “You may play this card any time you could cast an instant.”", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
  - {kind: cr, ref: "603.3", text: "Once an ability has triggered, its controller puts it on the stack as an object that's not a card the next time a player would receive priority.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  priority: p1
  p0:
    hand: ["Solitude @sol"]
    battlefield: ["Plains @w1", "Plains @w2", "Plains @w3", "Plains @w4", "Plains @w5"]
    library_pad: 10
  p1:
    battlefield: ["Flickerwisp @wisp"]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: cast, card: "@sol", pay: auto}
  - check:
      stack: [{kind: spell, card: "@sol", controller: p0}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@wisp", expect_options: {include: ["@wisp"], exclude: ["@sol"]}}
  - check:
      stack: [{kind: triggered, source: "@sol", controller: p0, targets: ["@wisp"]}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    turn: 4
    phase: main1
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 20
      hand: []
      battlefield:
        - {card: Solitude, pt: [3, 2], keywords: [lifelink]}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
    p1:
      life: 23
      battlefield: []
      exile: [Flickerwisp]
      graveyard: []
notes: >
  Flash lets p0 cast Solitude on p1's turn after p1 passes. When Solitude resolves the active player p1 would receive
  priority, so the ETB trigger goes on the stack first and its controller p0 chooses the target then (603.3, 601.2c).
  "Other" excludes Solitude itself from the target mask. Flickerwisp's printed power is 3, so p1 (its controller) gains 3.
  The five Plains pay {3}{W}{W}. A wrong engine would deny the flash cast, let Solitude target itself, give the life to
  Solitude's controller, or hand priority to p0 after the resolution.
---
id: solitude-evoke-sacrifice-resolves-first-etb-still-exiles
title: Evoked Solitude is sacrificed by its evoke trigger, and its ETB exile trigger below still resolves afterwards
area: card
cards: [Solitude, Swords to Plowshares, Griselbrand]
tags: [solitude, evoke, alternative-cost, etb-trigger, order-triggers, intervening-if, source-left-battlefield]
derived_from: cr
source:
  - {kind: oracle, card: Solitude, text: "Evoke—Exile a white card from your hand.", verified: true}
  - {kind: oracle, card: Solitude, text: "When this creature enters, exile up to one other target creature. That creature's controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "702.74a", text: "“Evoke [cost]” means “You may cast this card by paying [cost] rather than paying its mana cost” and “When this permanent enters, if its evoke cost was paid, its controller sacrifices it.”", verified: true}
  - {kind: cr, ref: "603.3b", text: "each player, in APNAP order, puts each triggered ability they control", verified: true}
  - {kind: cr, ref: "603.4", text: "If the ability triggers, it checks the stated condition again as it resolves.", verified: true}
  - {kind: cr, ref: "113.7a", text: "Once activated or triggered, an ability exists on the stack independently of its source.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Solitude @sol", "Swords to Plowshares @stp"]
    library_pad: 10
  p1:
    battlefield: ["Griselbrand @gris"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@stp"}}}
  - check:
      stack: [{kind: spell, card: "@sol", controller: p0}]
      p0: {hand: [], exile: [Swords to Plowshares]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: order_triggers
      answer: [{source: "@sol", text_contains: "exile up to one"}, {source: "@sol", text_contains: "sacrifice"}]
      note: "first listed goes on the stack first: the exile trigger at the bottom, the evoke sacrifice trigger on top"
  - p0: {decision: choose_target, slot: 0, answer: "@gris", expect_options: {include: ["@gris"], exclude: ["@sol"]}}
  - check:
      stack:
        - {kind: triggered, source: "@sol", controller: p0, text_contains: "exile", targets: ["@gris"]}
        - {kind: triggered, source: "@sol", controller: p0, text_contains: "sacrifice"}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@sol", controller: p0, text_contains: "exile"}]
      p0: {graveyard: [Solitude], battlefield: []}
      p1: {battlefield: [{card: Griselbrand}]}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      hand: []
      battlefield: []
      graveyard: [Solitude]
      exile: [Swords to Plowshares]
    p1:
      life: 27
      battlefield: []
      exile: [Griselbrand]
notes: >
  Evoke is an alternative cost (no mana; Swords to Plowshares is the white card exiled from hand). On entering, Solitude
  has two triggers controlled by p0: its printed ETB and the evoke sacrifice trigger (702.74a). p0 orders them; here the
  sacrifice trigger is on top, so Solitude goes to the graveyard first. The ETB trigger does not depend on its source
  staying on the battlefield and still exiles Griselbrand (power 7), whose controller p1 gains 7 (20 -> 27). A wrong
  engine might sacrifice Solitude immediately (no trigger), not offer the ordering, or fizzle the exile trigger because
  its source left. FORMAT: the order_triggers answer uses the SCHEMA-addenda form for two triggers of one source
  ([{source, text_contains}, ...], first listed goes on the stack first), and the target is chosen after the ordering,
  as the exile trigger is put on the stack (addenda: "order_triggers first, then choose_target").
---
id: solitude-evoke-needs-another-white-card
title: Solitude's evoke cost cannot be paid with a nonwhite card or with Solitude itself
area: card
cards: [Solitude, Thoughtseize, Griselbrand]
tags: [solitude, evoke, alternative-cost, mask-validity, cost-payment]
derived_from: cr
source:
  - {kind: oracle, card: Solitude, text: "Evoke—Exile a white card from your hand.", verified: true}
  - {kind: cr, ref: "601.2a", text: "To propose the casting of a spell, a player first moves that card (or that copy of a card) from where it is to the stack.", verified: true}
  - {kind: cr, ref: "601.2h", text: "The player pays the total cost.", verified: true}
  - {kind: cr, ref: "601.2h", text: "Unpayable costs can’t be paid.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Solitude @sol", "Thoughtseize @ts"]
    library_pad: 10
  p1:
    battlefield: ["Griselbrand @gris"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@ts"}}}}
  - expect_illegal: {p0: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@sol"}}}}
  - expect_illegal: {p0: {t: cast, card: "@sol"}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    legal: {p0: {exclude: [{t: cast, card: "@sol"}]}}
    p0:
      hand: [Solitude, Thoughtseize]
      exile: []
      battlefield: []
    p1:
      battlefield: [{card: Griselbrand}]
notes: >
  Thoughtseize is black, not white. Solitude itself is on the stack by the time costs are paid (601.2a moves it there
  first, 601.2h pays later), so it is not "a white card from your hand". p0 has no lands, so the {3}{W}{W} mana cost is
  unpayable too: no way to cast Solitude is offered. The positive case is
  solitude-evoke-sacrifice-resolves-first-etb-still-exiles (white Swords to Plowshares pays the evoke cost).
---
id: solitude-evoke-under-disruptor-flute-unaffordable-with-two-lands
title: Disruptor Flute naming Solitude adds {3} to its evoke cost, so two lands cannot evoke it
area: card
cards: [Solitude, Swords to Plowshares, Disruptor Flute, Plains]
tags: [solitude, evoke, disruptor-flute, cost-increase, alternative-cost, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: Disruptor Flute, text: "Spells with the chosen name cost {3} more to cast.", verified: true}
  - {kind: oracle, card: Solitude, text: "Evoke—Exile a white card from your hand.", verified: true}
  - {kind: cr, ref: "118.9d", text: "If an alternative cost is being paid to cast a spell, any additional costs, cost increases, and cost reductions that affect that spell are applied to that alternative cost.", verified: true}
  - {kind: cr, ref: "702.74a", text: "Casting a spell for its evoke cost follows the rules for paying alternative costs in rules 601.2b and 601.2f–h.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Solitude @sol", "Swords to Plowshares @stp"]
    battlefield: ["Plains @w1", "Plains @w2"]
    library_pad: 10
  p1:
    battlefield: [{card: Disruptor Flute, as: flute, flags: {chosen_name: Solitude}}]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@stp"}}}}
  - expect_illegal: {p0: {t: cast, card: "@sol"}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Solitude, Swords to Plowshares]
      exile: []
      battlefield: [{card: Plains, tapped: false}, {card: Plains, tapped: false}]
notes: >
  Under the Flute the evoke total cost is {3} plus exiling a white card (118.9d, 601.2f); two Plains cannot pay {3}.
  The normal cost becomes {6}{W}{W}, also unpayable. A wrong engine that skips cost increases for alternative costs would
  offer the free evoke. The failed probes must not exile Swords or tap the Plains. Positive pair:
  a sibling scenario.
