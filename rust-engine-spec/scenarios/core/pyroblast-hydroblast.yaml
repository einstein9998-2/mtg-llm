id: pyroblast-counter-mode-counters-blue-spell
title: "Pyroblast's first mode counters a blue spell (Brainstorm)"
area: core
cards: [Brainstorm, Island, Pyroblast, Mountain]
tags: [pyroblast, modes, counterspell, conditional-counter, color]
derived_from: oracle
source:
  - {kind: oracle, card: Pyroblast, text: "• Counter target spell if it's blue.", verified: true}
  - {kind: cr, ref: "700.2a", text: "The controller of a modal spell or ability chooses the mode(s) as part of casting that spell or activating that ability.", verified: true}
  - {kind: cr, ref: "701.6a", text: "A countered spell is put into its owner’s graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Brainstorm @bs"]
    battlefield: ["Island @i"]
    library_pad: 10
  p1:
    hand: ["Pyroblast @pyro"]
    battlefield: ["Mountain @m"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bs", pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@pyro", modes: [1], targets: ["@bs"], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@bs", controller: p0}
        - {kind: spell, card: "@pyro", controller: p1, modes: [1], targets: ["@bs"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Brainstorm], hand: []}
    p1: {graveyard: [Pyroblast], battlefield: [{card: Mountain, tapped: true}]}
notes: >
  Brainstorm is a blue spell, so Pyroblast's counter mode counters it. The mode is announced on cast and stays on the
  stack entry. p0 draws nothing (Brainstorm never resolved).
