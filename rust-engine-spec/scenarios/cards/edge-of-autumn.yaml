id: edge-of-autumn-with-five-lands-does-nothing
title: Edge of Autumn resolving while its caster controls five lands searches nothing and does not shuffle
area: card
cards: [Edge of Autumn, Forest, Swamp, Island]
tags: [edge-of-autumn, condition, no-shuffle, negative]
derived_from: oracle
source:
  - {kind: oracle, card: Edge of Autumn, text: "If you control four or fewer lands, search your library for a basic land card, put it onto the battlefield tapped, then shuffle.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Edge of Autumn @e"]
    battlefield: ["Forest @f", "Swamp @s1", "Swamp @s2", "Swamp @s3", "Swamp @s4"]
    library_pad: 10
  p1:
    library_pad: 10
random: []
script:
  - p0: {t: cast, card: "@e", pay: {tap: ["@f", "@s1"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      library_count: 10
      graveyard: [Edge of Autumn]
      battlefield:
        - {card: Forest, tapped: true}
        - {card: Swamp, tapped: true}
        - {card: Swamp, tapped: false}
        - {card: Swamp, tapped: false}
        - {card: Swamp, tapped: false}
notes: >
  Tapped lands still count as lands p0 controls: five lands fail the "four or fewer" condition when Edge resolves, so no
  search decision is raised and nothing is shuffled (random: [] fails an engine that shuffles anyway). Pairs with the
  positive fetch above.
