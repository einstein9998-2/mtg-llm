id: thundering-falls-surveil-keep-card-on-top
title: Surveil 1 from Thundering Falls may leave the card on top of the library
area: card
cards: [Thundering Falls, Lightning Bolt, Ponder]
tags: [surveil, enters-tapped, etb-trigger]
derived_from: cr
source:
  - {kind: cr, ref: "701.25a", text: "To \"surveil N\" means to look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.", verified: true}
  - {kind: oracle, card: Thundering Falls, text: "When this land enters, surveil 1.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Thundering Falls @falls"]
    library: ["Lightning Bolt @bolt", "Ponder @pond"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: play_land, card: "@falls"}
  - resolve_top: true
  - p0: {decision: surveil, to_graveyard: [], on_top_order: ["@bolt"]}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: []
      library_top: [Lightning Bolt, Ponder]
      library_count: 12
notes: >
  "Put any number of them into your graveyard" includes zero. The card stays on top; nothing is drawn or moved to the bottom.
