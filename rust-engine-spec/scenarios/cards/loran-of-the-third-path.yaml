id: loran-summoning-sick-cannot-use-tap-ability
title: Loran of the Third Path cannot use its tap ability the turn it enters
area: card
cards: [Loran of the Third Path, Plains]
tags: [loran, summoning-sickness, activated-ability, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: Loran of the Third Path, text: "{T}: You and target opponent each draw a card.", verified: true}
  - {kind: cr, ref: "302.6", text: "A creature’s activated ability with the tap symbol or the untap symbol in its activation cost can’t be activated unless the creature has been under its controller’s control continuously since their most recent turn began.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Loran of the Third Path @lor"]
    battlefield: ["Plains @w1", "Plains @w2", "Plains @w3"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@lor", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@lor", controller: p0, targets: []}]
  - resolve_top: true
  - expect_illegal: {p0: {t: activate, source: "@lor", ability: 0, targets: [{player: p1}]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand_count: 0
      library_count: 10
      battlefield:
        - {card: Loran of the Third Path, tapped: false, sick: true, keywords: [vigilance]}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
    p1:
      hand_count: 0
notes: >
  With no artifact or enchantment anywhere, the "up to one" ETB has no legal target and goes on the stack with none
  (no decision). Vigilance does not let a summoning-sick creature use {T} abilities. Positive pair:
  a sibling scenario.
