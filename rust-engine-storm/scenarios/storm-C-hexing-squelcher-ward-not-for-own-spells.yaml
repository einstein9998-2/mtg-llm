id: storm-c-hexing-squelcher-ward-ignores-own-spell-and-own-ability
title: "Ward only triggers for spells and abilities an opponent controls: p0's own Lightning Bolt on the Ocelot Pride and Goblin Bombardment on the Squelcher raise no prompt"
area: card
cards: [Hexing Squelcher, Ocelot Pride, Lightning Bolt, Goblin Bombardment, "Cat Token (Ocelot Pride)", Mountain]
tags: [hexing-squelcher, ward, other-creatures, own-spell, own-ability, negative, no-decision-raised]
derived_from: cr
source:
  - {kind: oracle, card: Hexing Squelcher, text: "Ward—Pay 2 life.", verified: true}
  - {kind: oracle, card: Hexing Squelcher, text: 'Other creatures you control have "Ward—Pay 2 life."', verified: true}
  - {kind: cr, ref: "702.21a", text: "Whenever this permanent becomes the target of a spell or ability an opponent controls, counter that spell or ability unless that player pays [cost].", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 20
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Hexing Squelcher @sq", "Ocelot Pride @op", "Mountain @m", "Goblin Bombardment @bomb", {token: "Cat Token (Ocelot Pride)", as: cat}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: ["@op"], pay: auto}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0, targets: ["@op"]}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      p0: {life: 20, graveyard: [Ocelot Pride, Lightning Bolt]}
  - p0: {t: activate, source: "@bomb", ability: 0, sacrifice: ["@cat"], targets: ["@sq"]}
  - check:
      stack: [{kind: activated, source: "@bomb", controller: p0, targets: ["@sq"]}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      graveyard: [Ocelot Pride, Lightning Bolt]
      battlefield:
        - {card: Hexing Squelcher, damage: 1}
        - {card: Mountain, tapped: true}
        - {card: Goblin Bombardment}
    p1:
      life: 20
notes: >
  Ward says "an opponent controls" (702.21a). p0's own Bolt on its own Ocelot Pride and p0's own Bombardment ability on
  its own Squelcher put nothing on the stack except the spell and the ability themselves, and p0 pays no life (life
  stays 20). The Squelcher takes 1 damage (2/2, survives). A wrong engine wards any targeting, including by the
  controller (it would charge p0 2 life or counter p0's own spell).
