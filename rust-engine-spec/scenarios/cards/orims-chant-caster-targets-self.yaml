id: orims-chant-caster-can-target-itself-and-then-cannot-cast
title: "Orim's Chant may target its own caster: afterwards the caster cannot cast Lightning Bolt while the opponent still can"
area: card
cards: ["Orim's Chant", Plains, Mountain, Lightning Bolt]
