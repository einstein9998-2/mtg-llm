id: tron2-a-confluence-pump-then-blink-same-creature-survives-zero-toughness-mid-resolution
title: "Eldrazi Confluence +3/-3 then blink on the same 1/3 creature: state-based actions are not checked in between, so it survives as a fresh tapped 1/3"
area: card
cards: [Eldrazi Confluence, Ancient Tomb, Island, Voice of Victory, Eldrazi Scion Token]
tags: [eldrazi-confluence, modal, pump, blink, mode-order, state-based-action, new-object, eldrazi-scion]
derived_from: oracle
source:
  - {kind: oracle, card: Eldrazi Confluence, text: "Target creature gets +3/-3 until end of turn.", verified: true}
  - {kind: oracle, card: Eldrazi Confluence, text: "Exile target nonland permanent, then return it to the battlefield tapped under its owner's control.", verified: true}
  - {kind: cr, ref: "704.4", text: ". Unlike triggered abilities, state-based actions pay no attention to what happens during the resolution of a spell or ability.", verified: true}
  - {kind: cr, ref: "400.7", text: ". An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence. This rule has the following exceptions.", verified: true}
  - {kind: cr, ref: "700.2d", text: "If a player is allowed to choose more than one mode for a modal spell or ability, that player normally can’t choose the same mode more than once. However, some modal spells include the instruction “You may choose the same mode more than once.” If a particular mode is chosen multiple times, the spell is treated as if that mode appeared that many times in sequence. If that mode requires a target, the same player or object may be chosen as the target for each of those modes, or different targets may be chosen.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Eldrazi Confluence @conf"]
    battlefield: ["Ancient Tomb @tomb", "Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    battlefield: ["Voice of Victory @vov"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@conf", modes: [5], targets: ["@vov", "@vov"], pay: {tap: ["@tomb", "@i1", "@i2"]}}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Eldrazi Confluence]
      battlefield_contains: [{token: Eldrazi Scion Token, pt: [1, 1]}]
    p1:
      graveyard: []
      exile: []
      battlefield: [{card: Voice of Victory, pt: [1, 3], tapped: true, sick: true, damage: 0}]
notes: >
  Multiset 4 (pump x1, blink x1, Scion x1) is `modes: [5]`; the target slots are the pump's, then the blink's, both Voice of
  Victory (1/3). The modes are performed in printed order: pump (it becomes 4/0), blink (exiled and returned as a new object).
  State-based actions do not look at the middle of a resolution (704.4), so the 4/0 never gets put into a graveyard; the
  returned Voice of Victory is a new object (400.7) without the pump, tapped and summoning sick, a 1/3. If the blink had
  come first the pump would fail on an illegal target and the result would be the same; either way the creature survives.
  A wrong engine checks state-based actions between instances and kills it.
