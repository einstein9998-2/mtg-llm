id: thoughtseize-no-nonland-card-no-choice-still-lose-two
title: Thoughtseize on a hand with only lands discards nothing, raises no choice, and its caster still loses 2 life
area: card
cards: [Thoughtseize, Island, Plains, Swamp]
tags: [thoughtseize, discard, no-legal-choice, life-loss]
derived_from: cr
source:
  - {kind: oracle, card: Thoughtseize, text: "Target player reveals their hand. You choose a nonland card from it. That player discards that card. You lose 2 life.", verified: true}
  - {kind: cr, ref: "609.3", text: "If an effect attempts to do something impossible, it does only as much as possible.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Thoughtseize @ts"]
    battlefield: ["Swamp @b1"]
    library_pad: 10
  p1:
    hand: ["Island @isl", "Plains @pl"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ts", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 18
      graveyard: [Thoughtseize]
    p1:
      hand: [Island, Plains]
      graveyard: []
notes: >
  With no nonland card the choice cannot be made, so no decision is raised (the rules give no choice); the rest of the
  spell still happens, including the caster's life loss. A wrong engine skips the life loss or raises an empty choice.
