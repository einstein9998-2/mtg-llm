id: quantum-riddler-brainstorm-draws-four-not-six
title: With Quantum Riddler and an empty hand, Brainstorm draws four cards (three plus one, applied once), then puts two back
area: card
cards: [Quantum Riddler, Brainstorm, Island, Ponder, Lightning Bolt, Daze, Force of Will, Stifle]
tags: [quantum-riddler, brainstorm, replacement-effect, multiple-draws]
derived_from: cr
source:
  - {kind: oracle, card: Quantum Riddler, text: "As long as you have one or fewer cards in hand, if you would draw one or more cards, you draw that many cards plus one instead.", verified: true}
  - {kind: oracle, card: Brainstorm, text: "Draw three cards, then put two cards from your hand on top of your library in any order.", verified: true}
  - {kind: cr, ref: "121.2a", text: "An instruction to draw multiple cards can be modified by replacement effects that refer to the number of cards drawn. This modification occurs before considering any of the individual card draws.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Brainstorm @bs"]
    battlefield: ["Quantum Riddler @qr", "Island @i1"]
    library: ["Ponder @c1", "Lightning Bolt @c2", "Daze @c3", "Force of Will @c4", "Stifle @c5"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@bs", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: choose_cards
      purpose: put_back
      answer: ["@c1", "@c2"]
      expect_options: {include: ["@c1", "@c2", "@c3", "@c4"], exclude: ["@c5"], count: 4}
  - p0: {decision: order_cards, purpose: put_back, answer: ["@c2", "@c1"]}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Daze, Force of Will]
      library_top: [Lightning Bolt, Ponder, Stifle]
      library_count: 13
      graveyard: [Brainstorm]
notes: >
  While Brainstorm is on the stack p0's hand is empty, so the instruction "draw three cards" becomes "draw four" before
  any individual draw happens (121.2a): four cards are drawn, not three, and not six (an engine that applied the +1 to
  each individual draw while the hand was small would draw more). Two go back, leaving two in hand. Library 15 - 4 + 2
  = 13. The put-back choice is over exactly the four drawn cards.
---
