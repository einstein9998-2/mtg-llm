id: kaito-plus-one-emblem-makes-kaito-a-four-five
title: Kaito's +1 emblem ("Ninjas you control get +1/+1") pumps Kaito himself, a Ninja creature on his controller's turn, to 4/5
area: card
cards: ["Kaito, Bane of Nightmares"]
tags: [kaito, loyalty-ability, emblem, layer-7b, layer-7c, command-zone]
derived_from: cr
source:
  - {kind: oracle, card: "Kaito, Bane of Nightmares", text: "+1: You get an emblem with \"Ninjas you control get +1/+1.\"", verified: true}
  - {kind: cr, ref: "114.1", text: "Some effects put emblems into the command zone. An emblem is a marker used to represent an object that has one or more abilities, but usually no other characteristics.", verified: true}
  - {kind: cr, ref: "613.4b", text: "Layer 7b: Effects that set power and/or toughness to a specific number or value are applied.", verified: true}
  - {kind: cr, ref: "613.4c", text: "Layer 7c: Effects and counters that modify power and/or toughness (but don't set power and/or toughness to a specific number or value) are applied.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: [{card: "Kaito, Bane of Nightmares", as: kaito, counters: {loyalty: 3}}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@kaito", ability: 1}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: "Kaito, Bane of Nightmares", counters: {loyalty: 4}, pt: [4, 5], subtypes: [Ninja]}]
      command: [{emblem: "Ninjas you control get +1/+1"}]
notes: >
  Kaito's own static sets him to a 3/4 Ninja on p0's turn (layer 4 type, layer 7b P/T); the emblem's +1/+1 applies in
  layer 7c on top, so he is 4/5. The +1 cost raises loyalty 3 to 4. The emblem lives in p0's command zone (114.1), asserted
  with the SCHEMA addenda spelling command: [{emblem: <text fragment>}]. A wrong engine applies the 3/4 after the +1/+1
  (3/4) or does not treat Kaito as a Ninja.
