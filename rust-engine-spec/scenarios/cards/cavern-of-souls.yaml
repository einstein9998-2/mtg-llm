id: cavern-of-souls-creature-cannot-be-countered-by-force-of-will
title: A creature spell of the chosen type cast with Cavern of Souls' colored mana survives a Force of Will
area: card
cards: [Cavern of Souls, Plains, "Phelia, Exuberant Shepherd", Force of Will, Brainstorm]
tags: [cavern-of-souls, uncounterable, mana-restriction, force-of-will, alternative-cost]
derived_from: cr
source:
  - {kind: oracle, card: Cavern of Souls, text: "{T}: Add one mana of any color. Spend this mana only to cast a creature spell of the chosen type, and that spell can't be countered.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can’t happen, the “can’t” effect takes precedence.", verified: true}
  - {kind: cr, ref: "701.6b", text: "The player who cast a countered spell or activated a countered ability doesn’t get a “refund” of any costs that were paid.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Phelia, Exuberant Shepherd @ph"]
    battlefield: [{card: Cavern of Souls, as: cav, flags: {chosen_type: Dog}}, "Plains @pl"]
    library_pad: 10
  p1:
    hand: ["Force of Will @fow", "Brainstorm @bs"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@cav", ability: 1, choose_color: W}
  - check:
      pending: {actor: p0, kind: priority}
  - p0: {t: cast, card: "@ph", pay: auto}
  - p0: {t: pass}
  - check:
      legal: {p1: {include: [{t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@ph"]}]}}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@ph"]}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@ph", controller: p0}]
      pending: {actor: p0, kind: priority}
      p1: {graveyard: [Force of Will], life: 19}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      mana_pool: {}
      graveyard: []
      battlefield:
        - {card: Cavern of Souls, tapped: true}
        - {card: Plains, tapped: true}
        - {card: "Phelia, Exuberant Shepherd", controller: p0}
    p1:
      life: 19
      hand: []
      exile: [Brainstorm]
      graveyard: [Force of Will]
notes: >
  Cavern's chosen type (Dog) is fixed as it entered (setup flag). Its colored mana (ability index 1; index 0 is the
  {C} ability) pays Phelia's {W}; Plains pays {1}. Force of Will may still target Phelia (any spell is a legal target)
  and resolves, but the "can't be countered" effect wins (101.2), so Phelia stays on the stack and then resolves.
  p1 still paid 1 life and exiled Brainstorm (no refund). A wrong engine counters the spell, forbids targeting it, or
  refunds the cost. Paired with cavern-of-souls-colorless-mana-gives-no-protection.
---
