id: mu-bdt-swords-on-attacking-phlage-attack-trigger-still-resolves
title: Swords to Plowshares exiles an attacking Phlage (Boros gains 6), and Phlage's attack trigger still deals 3 and gains 3
area: matchup
cards: ["Phlage, Titan of Fire's Fury", Swords to Plowshares, Plains]
tags: [matchup, boros-vs-dt, swords-to-plowshares, phlage, last-known-information, attack-trigger, life-gain]
derived_from: cr
source:
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Whenever Phlage enters or attacks, it deals 3 damage to any target and you gain 3 life.", verified: true}
  - {kind: cr, ref: "113.7a", text: "Once activated or triggered, an ability exists on the stack independently of its source. Destruction or removal of the source after that time won’t affect the ability.", verified: true}
  - {kind: cr, ref: "608.2h", text: "If an ability states that an object does something, it’s the object as it exists—or as it most recently existed—that does it, not the ability.", verified: true}
setup:
  turn: 7
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phlage, Titan of Fire's Fury @ph"]
    library_pad: 10
  p1:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Plains @w"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@ph", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: {player: p1}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stp", targets: ["@ph"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@ph", controller: p0, targets: [{player: p1}]}]
      pending: {actor: p0, kind: priority}
      p0: {life: 26, exile: ["Phlage, Titan of Fire's Fury"], battlefield: []}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    phase: declare_attackers
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 29
      battlefield: []
      exile: ["Phlage, Titan of Fire's Fury"]
      graveyard: []
    p1:
      life: 17
      graveyard: [Swords to Plowshares]
      battlefield: [{card: Plains, tapped: true}]
notes: >
  Setup: Phlage is on the battlefield (it escaped earlier; a hard-cast Phlage would have been sacrificed). Swords
  resolves first: Phlage (a 6/6) is exiled and its controller p0 gains 6 (26). The attack trigger is already on the stack
  and is independent of its source (113.7a): Phlage as it last existed deals 3 to p1 and p0 gains 3 (29). Phlage is in
  exile, not in the graveyard, so it cannot escape again. A wrong engine cancels the trigger when Phlage leaves, or
  gives the Swords life to p1.
