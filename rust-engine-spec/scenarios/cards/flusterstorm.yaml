id: flusterstorm-cannot-target-creature-spell
title: Flusterstorm cannot target a creature spell, only an instant or sorcery spell
area: card
cards: [Flusterstorm, "Phelia, Exuberant Shepherd", Plains, Island]
tags: [flusterstorm, targeting, creature-spell, negative]
derived_from: oracle
source:
  - {kind: oracle, card: Flusterstorm, text: "Counter target instant or sorcery spell unless its controller pays {1}.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Phelia, Exuberant Shepherd @phelia"]
    battlefield: ["Plains @p1", "Plains @p2"]
    library_pad: 10
  p1:
    hand: ["Flusterstorm @flu"]
    battlefield: ["Island @j1"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@phelia", pay: auto}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@flu", targets: ["@phelia"]}}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {battlefield_contains: [{card: "Phelia, Exuberant Shepherd"}]}
    p1: {hand: [Flusterstorm]}
notes: >
  Phelia is a creature spell; Flusterstorm has no legal target and is not castable. Positive targeting is covered by the
  two scenarios above.
