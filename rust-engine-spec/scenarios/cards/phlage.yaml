id: phlage-attack-trigger-deals-3-gains-3
title: Phlage attacking triggers its damage ability (3 to any target, gain 3), then deals 6 combat damage unblocked
area: card
cards: ["Phlage, Titan of Fire's Fury"]
tags: [phlage, attack-trigger, combat, any-target, life-gain]
derived_from: cr
source:
  - {kind: oracle, card: "Phlage, Titan of Fire's Fury", text: "Whenever Phlage enters or attacks, it deals 3 damage to any target and you gain 3 life.", verified: true}
  - {kind: cr, ref: "508.3a", text: "An ability that reads \"Whenever [a creature] attacks, . . .\" triggers if that creature is declared as an attacker.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phlage, Titan of Fire's Fury @ph"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@ph", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: {player: p1}}
  - check:
      stack: [{kind: triggered, source: "@ph", controller: p0, targets: [{player: p1}]}]
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      p0: {life: 23}
      p1: {life: 17}
  - advance: {to: combat_damage, of: p0}
expect:
  - at: after_script
    phase: combat_damage
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 23
      battlefield: [{card: "Phlage, Titan of Fire's Fury", tapped: true}]
    p1:
      life: 11
notes: >
  Setup state: Phlage is on the battlefield (for example after an earlier escape); whether it escaped does not matter
  for the attack trigger. The trigger's target is chosen when it goes on the stack, right after the declaration. p1 has
  no creatures, so no blocker declaration is raised and `advance` reaches the combat damage step: 17 - 6 = 11.
