id: storm-a-tendrils-storm-counts-countered-spells-and-the-counterspell
title: "A countered Dark Ritual and the Force of Will that countered it both count for storm"
area: card
cards: [Tendrils of Agony, Dark Ritual, Force of Will, Brainstorm, Swamp]
tags: [tendrils-of-agony, storm, storm-count, force-of-will, countered-spell, opponent-spells]
derived_from: oracle
source:
  - {kind: oracle, card: Tendrils of Agony, text: "Storm (When you cast this spell, copy it for each spell cast before it this turn. You may choose new targets for the copies.)", verified: true}
  - {kind: cr, ref: "702.40a", text: "\"Storm\" means \"When you cast this spell, copy it for each other spell that was cast before it this turn.", verified: true}
  - {kind: cr, ref: "601.2i", text: "then the spell becomes cast.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Dark Ritual @rit", "Tendrils of Agony @tend"]
    battlefield: ["Swamp @s1", "Swamp @s2", "Swamp @s3", "Swamp @s4", "Swamp @s5"]
    library_pad: 10
  p1:
