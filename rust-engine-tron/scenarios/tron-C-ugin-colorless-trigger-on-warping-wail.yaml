id: tron-c-ugin-triggers-on-warping-wail-colorless-instant
title: "Warping Wail ({1}{C}) is a colorless spell: casting it with Ugin in play exiles a colored permanent, then Wail makes its Scion"
area: card
cards: ["Ugin, Eye of the Storms", Warping Wail, "Urza's Tower", Island, "Phelia, Exuberant Shepherd", Eldrazi Scion Token]
tags: [ugin, planeswalker, colorless-spell-trigger, warping-wail, colorless-instant, stack-order]
derived_from: oracle
source:
  - {kind: oracle, card: "Ugin, Eye of the Storms", text: "Whenever you cast a colorless spell, exile up to one target permanent that's one or more colors.", verified: true}
  - {kind: cr, ref: "202.2b", text: "Objects with no colored mana symbols in their mana costs are colorless.", verified: true}
  - {kind: cr, ref: "107.4c", text: "The colorless mana symbol {C} is used to represent one colorless mana, and also to represent a cost that can be paid only with one colorless mana.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: [Warping Wail @ww]
    battlefield: [{card: "Ugin, Eye of the Storms", as: ugin, counters: {loyalty: 7}}, "Urza's Tower @tw", Island @isl]
    library_pad: 10
  p1:
    battlefield: ["Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ww", modes: [3], pay: {tap: ["@tw", "@isl"]}}
  - p0: {decision: choose_target, slot: 0, answer: "@ph"}
  - check:
      stack:
        - {kind: spell, card: "@ww", controller: p0}
        - {kind: triggered, source: "@ugin", controller: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    p0:
      graveyard: [Warping Wail]
      battlefield_contains: [{token: Eldrazi Scion Token, pt: [1, 1]}, {card: "Ugin, Eye of the Storms"}]
    p1:
      exile: ["Phelia, Exuberant Shepherd"]
      battlefield: []
notes: >
  {C} is a colorless mana symbol, not a color (107.4c), so Warping Wail has no color (202.2b). A wrong engine treats {C}
  as a colored symbol or only counts costless artifacts as colorless.
