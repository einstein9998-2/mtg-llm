id: defense-grid-taxes-spells-cast-on-opponents-turn
title: Defense Grid makes an instant cast during the opponent's turn cost {3} more, so Veil of Summer is not castable with three lands
area: card
cards: [Defense Grid, Veil of Summer, Forest, Island]
tags: [defense-grid, cost-increase, instant-speed, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Defense Grid, text: "Each spell costs {3} more to cast except during its controller's turn.", verified: true}
  - {kind: cr, ref: "601.2f", text: "The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  priority: p0
  p0:
    hand: ["Veil of Summer @vs"]
    battlefield: ["Forest @fo", "Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    battlefield: ["Defense Grid @grid"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@vs", pay: auto}}
expect:
  - at: after_script
    stack: []
    p0:
      hand: [Veil of Summer]
      battlefield: [{card: Forest, tapped: false}, {card: Island, tapped: false}, {card: Island, tapped: false}]
notes: >
  It is p1's turn (p0 has priority), so p0's spell is not cast "during its controller's turn": Veil costs {G} + {3} = 4
  mana. p0 has only three untapped lands, so the cast must not be offered and nothing may be tapped.
---
id: defense-grid-no-tax-during-casters-own-turn
title: Defense Grid does not tax a spell during its caster's own turn, even the opponent's Grid
area: card
cards: [Defense Grid, Brainstorm, Island]
tags: [defense-grid, cost-increase, own-turn]
derived_from: oracle
source:
  - {kind: oracle, card: Defense Grid, text: "Each spell costs {3} more to cast except during its controller's turn.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Brainstorm @bs"]
    battlefield: ["Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    battlefield: ["Defense Grid @grid"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bs", pay: auto}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@bs", controller: p0}]
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: false}]
notes: >
  "Its controller's turn" refers to the spell's controller. It is p0's turn, so Brainstorm costs just {U}: exactly one
  Island is tapped. A wrong engine would tax the opponent's spells on their own turn too.
---
id: defense-grid-force-of-will-alternative-cost-still-pays-tax-insufficient
title: Force of Will's free alternative cost still pays Defense Grid's {3}; two Islands are not enough on the opponent's turn
area: card
cards: [Defense Grid, Force of Will, Brainstorm, Island]
tags: [defense-grid, force-of-will, alternative-cost, cost-increase, mask-validity]
derived_from: cr
source:
  - {kind: cr, ref: "118.9d", text: "If an alternative cost is being paid to cast a spell, any additional costs, cost increases, and cost reductions that affect that spell are applied to that alternative cost.", verified: true}
  - {kind: cr, ref: "601.2f", text: "The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions.", verified: true}
  - {kind: oracle, card: Defense Grid, text: "Each spell costs {3} more to cast except during its controller's turn.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Force of Will @fow", "Brainstorm @bs"]
    battlefield: ["Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    hand: ["Brainstorm @pbs"]
    battlefield: ["Defense Grid @grid", "Island @pi"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@pbs", pay: auto}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@pbs"]}}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@pbs", controller: p1}]
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      hand: [Force of Will, Brainstorm]
      battlefield: [{card: Island, tapped: false}, {card: Island, tapped: false}]
notes: >
  p1's Brainstorm is cast on p1's own turn, so it is not taxed. p0's Force of Will on p1's turn costs the alternative
  cost (1 life + a blue card) plus {3} generic. With only two Islands the total cost cannot be paid, so the free cast is
  not offered, and the failed probe pays no life and exiles nothing.
---
id: defense-grid-force-of-will-alternative-cost-pays-the-tax-sufficient
title: With three Islands Force of Will can pay its alternative cost plus Defense Grid's {3} and counters the spell
area: card
cards: [Defense Grid, Force of Will, Brainstorm, Island]
tags: [defense-grid, force-of-will, alternative-cost, cost-increase, mana-payment]
derived_from: cr
source:
  - {kind: cr, ref: "118.9d", text: "If an alternative cost is being paid to cast a spell, any additional costs, cost increases, and cost reductions that affect that spell are applied to that alternative cost.", verified: true}
  - {kind: oracle, card: Force of Will, text: "You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Defense Grid, text: "Each spell costs {3} more to cast except during its controller's turn.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Force of Will @fow", "Brainstorm @bs"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library_pad: 10
  p1:
    hand: ["Brainstorm @pbs"]
    battlefield: ["Defense Grid @grid", "Island @pi"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@pbs", pay: auto}
  - p1: {t: pass}
  - p0: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@pbs"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 19
      hand: []
      exile: [Brainstorm]
      graveyard: [Force of Will]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}, {card: Island, tapped: true}]
    p1:
      graveyard: [Brainstorm]
notes: >
  Same setup as the previous scenario with a third Island: the alternative cost (1 life, exile Brainstorm) plus {3} is
  payable, all three Islands are tapped, and p1's Brainstorm is countered. Total outlay: 1 life, 1 card, 3 mana.
