  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: [{blocker: "@cd", attacker: "@raptor"}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      phase: first_strike_damage
      p1: {graveyard: ["Cloak and Dagger, Entwined"], battlefield: [], life: 20}
