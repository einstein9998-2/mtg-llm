id: tron2-b-masticore-discard-x-spell-counts-x-as-zero
title: "Discarding Meltdown ({X}{R}) to Argentum Masticore: X is 0 in hand, so the mana value is 1 and a mana value 2 permanent is not a legal target"
area: card
cards: [Argentum Masticore, Meltdown, Voltaic Key, Null Rod]
tags: [argentum-masticore, upkeep-trigger, reflexive-trigger, mana-value-bound, x-spell, discard, tron-sideboard]
derived_from: oracle
source:
  - {kind: oracle, card: Argentum Masticore, text: "destroy target nonland permanent an opponent controls with mana value less than or equal to the mana value of the discarded card.", verified: true, note: "entry in oracle-additions-B.json"}
  - {kind: cr, ref: "202.3e", text: "When calculating the mana value of an object with an {X} in its mana cost, X is treated as 0 while the object is not on the stack", verified: true}
setup:
  turn: 2
  active: p1
  phase: end
  p0:
    hand: ["Meltdown @melt"]
    battlefield: ["Argentum Masticore @mast"]
    library_pad: 10
  p1:
    battlefield: ["Voltaic Key @key", "Null Rod @rod"]
    library_pad: 10
script:
  - advance: {to: upkeep, of: p0}
  - resolve_top: true
  - p0: {decision: yes_no, purpose: discard_to_keep_masticore, answer: true}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@melt"]}
  - p0:
      decision: choose_target
      slot: 0
      expect_options: {include: ["@key"], exclude: ["@rod"], count: 1}
      answer: "@key"
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      graveyard: [Meltdown]
      battlefield: [{card: Argentum Masticore}]
    p1:
      battlefield: [{card: Null Rod}]
      graveyard: [Voltaic Key]
notes: >
  Meltdown {X}{R} in hand: X is treated as 0 outside the stack (202.3e), so its mana value is 1 and only Voltaic Key
  (1) qualifies; Null Rod (2) does not. A wrong engine uses the printed symbols' count (2) or a large X and offers Null Rod.
