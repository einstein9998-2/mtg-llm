id: griselbrand-pay-seven-draw-seven-while-summoning-sick
title: A summoning-sick Griselbrand can activate "Pay 7 life, Draw seven cards"; the life is paid on activation and the draws happen on resolution
area: card
cards: [Griselbrand, Island]
tags: [griselbrand, activated-ability, pay-life, summoning-sickness, draw]
derived_from: cr
source:
  - {kind: oracle, card: Griselbrand, text: "Pay 7 life: Draw seven cards.", verified: true}
  - {kind: cr, ref: "302.6", text: "A creature’s activated ability with the tap symbol or the untap symbol in its activation cost can’t be activated unless the creature has been under its controller’s control continuously since their most recent turn began.", verified: true}
  - {kind: cr, ref: "119.4", text: "If a player pays life, the payment is subtracted from their life total; in other words, the player loses that much life.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 20
    battlefield: [{card: Griselbrand, as: gris, sick: true}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@gris", ability: 0}
  - check:
      stack: [{kind: activated, source: "@gris", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0: {life: 13, hand_count: 0, library_count: 10}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 13
      hand_count: 7
      library_count: 3
      battlefield: [{card: Griselbrand, sick: true}]
notes: >
  The ability has no {T} in its cost, so summoning sickness does not stop it (302.6 restricts only tap/untap-symbol
  abilities). The 7 life is a cost, paid when the ability is activated (13 while it is on the stack); the seven draws
  happen only when it resolves. Ability index 0: flying and lifelink are keywords, the life-payment ability is the only
  activated ability. Wrong engines: block the activation for summoning sickness, or pay the life on resolution.
---
