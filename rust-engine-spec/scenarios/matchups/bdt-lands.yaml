id: mu-bdt-wasteland-on-boros-land-triggers-sand-scout-dt-fetch-does-not
title: D&T cracking its own Marsh Flats does not trigger Boros' Sand Scout; D&T's Wasteland destroying Boros' Plateau does, and Boros gets a Sand Warrior
area: matchup
cards: [Sand Scout, "Sand Warrior Token", Plateau, Mountain, Marsh Flats, Wasteland, Plains]
tags: [matchup, boros-vs-dt, sand-scout, wasteland, fetchland, your-graveyard, triggered-ability, token]
derived_from: cr
source:
  - {kind: oracle, card: Sand Scout, text: "Whenever one or more land cards are put into your graveyard from anywhere, create a 1/1 red, green, and white Sand Warrior creature token. This ability triggers only once each turn.", verified: true}
  - {kind: oracle, card: Wasteland, text: "{T}, Sacrifice this land: Destroy target nonbasic land.", verified: true}
  - {kind: oracle, card: Marsh Flats, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for a Plains or Swamp card, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: cr, ref: "603.2", text: "Whenever a game event or game state matches a triggered ability's trigger event, that ability automatically triggers.", verified: true}
  - {kind: cr, ref: "603.3a", text: "A triggered ability is controlled by the player who controlled its source at the time it triggered", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Sand Scout @scout", "Plateau @plat", "Mountain @mt"]
    library_pad: 10
  p1:
    battlefield: ["Marsh Flats @mf", "Wasteland @waste"]
    library: ["Plains @pl"]
    library_pad: 10
script:
  - p1: {t: activate, source: "@mf", ability: 0}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: search, found: "@pl"}
  - check:
      stack: []
      pending: {actor: p1, kind: priority}
      p1: {life: 19, graveyard: [Marsh Flats]}
      p0: {battlefield: [{card: Sand Scout}, {card: Plateau}, {card: Mountain}]}
  - p1: {t: activate, source: "@waste", ability: 1, targets: ["@plat"]}
  - check:
      stack: [{kind: activated, source: "@waste", controller: p1, targets: ["@plat"]}]
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@scout", controller: p0}]
      pending: {actor: p1, kind: priority}
      p0: {graveyard: [Plateau]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      graveyard: [Plateau]
      battlefield:
        - {card: Sand Scout}
        - {card: Mountain}
        - {token: Sand Warrior Token, controller: p0, pt: [1, 1], sick: true}
    p1:
      life: 19
      graveyard: [Marsh Flats, Wasteland]
      library_count: 10
      battlefield: [{card: Plains, tapped: false}]
notes: >
  "Your graveyard" means Sand Scout's controller's graveyard. Marsh Flats and Wasteland go to p1's graveyard (their
  owner), so they never trigger p0's Sand Scout; the check after the fetch (stack empty) is the negative case, done
  first because the ability triggers only once each turn. Wasteland's destroyed Plateau goes to p0's graveyard and
  triggers it; p0 controls the trigger. Fetched Plains enters untapped (Marsh Flats does not say tapped). The library
  shuffle only matters through library_count. A wrong engine triggers Sand Scout for any land going to any graveyard
  (the fetch would then use up the once-per-turn trigger, which also changes nothing visible later, hence the mid-check).
---
id: mu-bdt-white-orchid-phantom-on-parlor-boros-basic-and-sand-warrior
title: White Orchid Phantom destroys Boros' Elegant Parlor; Boros (its controller) may fetch a basic tapped, and Sand Scout makes a Sand Warrior
area: matchup
cards: [White Orchid Phantom, Elegant Parlor, Sand Scout, "Sand Warrior Token", Mountain, Plains]
tags: [matchup, boros-vs-dt, white-orchid-phantom, sand-scout, elegant-parlor, nonbasic-hate, may-search, triggered-ability]
derived_from: cr
source:
  - {kind: oracle, card: White Orchid Phantom, text: "When this creature enters, destroy up to one target nonbasic land. Its controller may search their library for a basic land card, put it onto the battlefield tapped, then shuffle.", verified: true}
  - {kind: oracle, card: Sand Scout, text: "Whenever one or more land cards are put into your graveyard from anywhere, create a 1/1 red, green, and white Sand Warrior creature token.", verified: true}
  - {kind: cr, ref: "603.3b", text: "If multiple abilities have triggered since the last time a player received priority", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Sand Scout @scout", "Elegant Parlor @parlor"]
    library: ["Mountain @mt"]
    library_pad: 10
  p1:
    hand: ["White Orchid Phantom @wop"]
    battlefield: ["Plains @w1", "Plains @w2"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@wop", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_target, slot: 0, answer: "@parlor", expect_options: {include: ["@parlor"], exclude: ["@w1", "@w2"]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {decision: yes_no, purpose: may_search, answer: true}
  - p0: {decision: search, found: "@mt"}
  - check:
      stack: [{kind: triggered, source: "@scout", controller: p0}]
      pending: {actor: p1, kind: priority}
      p0: {graveyard: [Elegant Parlor], battlefield: [{card: Sand Scout}, {card: Mountain, tapped: true}]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      graveyard: [Elegant Parlor]
      library_count: 10
      battlefield:
        - {card: Sand Scout}
        - {card: Mountain, tapped: true}
        - {token: Sand Warrior Token, pt: [1, 1], sick: true}
    p1:
      battlefield:
        - {card: White Orchid Phantom, sick: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
notes: >
  The Phantom's controller p1 chooses the target; the destroyed land's controller p0 makes the "may search" choice and
  finds a basic Mountain, which enters tapped. Sand Scout triggers during that resolution (a land card went to p0's
  graveyard) and goes on the stack afterwards, before p1 gets priority. Plains are basic, so they are not offered as
  targets. A wrong engine lets p1 make p0's search choice, puts the Mountain in untapped, or misses the Sand Scout
  trigger for a land destroyed by an opponent.
---
id: mu-bdt-sand-scout-finds-quarry-when-dt-has-more-lands
title: Boros casts Sand Scout while D&T controls more lands; it searches for Lazotep Quarry (a Desert), which enters tapped and is not a land drop
area: matchup
cards: [Sand Scout, Lazotep Quarry, Plateau, Plains, Scrubland, Karakas]
tags: [matchup, boros-vs-dt, sand-scout, lazotep-quarry, intervening-if, search, enters-tapped, land-count]
derived_from: cr
source:
  - {kind: oracle, card: Sand Scout, text: "When this creature enters, if an opponent controls more lands than you, search your library for a Desert card, put it onto the battlefield tapped, then shuffle.", verified: true}
  - {kind: cr, ref: "603.4", text: "If the ability triggers, it checks the stated condition again as it resolves.", verified: true}
setup:
  turn: 6
  active: p0
  phase: main1
  p0:
    lands_played: 1
    hand: ["Sand Scout @scout"]
    battlefield: ["Plateau @l1", "Plateau @l2", "Plains @l3"]
    library: ["Lazotep Quarry @q"]
    library_pad: 10
  p1:
    battlefield: ["Plains @w1", "Plains @w2", "Scrubland @s1", "Karakas @k"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@scout", pay: {tap: ["@l1", "@l2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@scout", controller: p0}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, found: "@q"}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      lands_played: 1
      library_count: 10
      battlefield:
        - {card: Sand Scout, sick: true}
        - {card: Plateau, tapped: true}
        - {card: Plateau, tapped: true}
        - {card: Plains, tapped: false}
        - {card: Lazotep Quarry, tapped: true}
notes: >
  p1 has 4 lands, p0 has 3, so the intervening-if is true when Sand Scout enters and again on resolution (603.4). The
  search is not optional ("search", not "may search"), so the decision is a search. Lazotep Quarry is a Land — Desert.
  It enters tapped by the trigger's instruction, and p0's land drop (already used: lands_played 1) is unaffected. A
  wrong engine counts the lands after the Quarry arrives, treats the Quarry as a land play, or puts it in untapped.
