id: samwise-cannot-return-card-discarded-this-turn
title: A creature card discarded from hand this turn is not a legal Samwise target; the Ring still tempts its controller
area: card
cards: [Samwise the Stouthearted, Recruiter of the Guard, Thoughtseize, Swamp, Plains]
tags: [samwise, flash, etb-trigger, no-legal-target, the-ring-tempts-you, thoughtseize]
derived_from: oracle
source:
  - {kind: oracle, card: Samwise the Stouthearted, text: "When Samwise enters, choose up to one target permanent card in your graveyard that was put there from the battlefield this turn. Return it to your hand. Then the Ring tempts you.", verified: true}
  - {kind: oracle, card: Samwise the Stouthearted, text: "Flash", verified: true}
  - {kind: oracle, card: Thoughtseize, text: "Target player reveals their hand. You choose a nonland card from it. That player discards that card. You lose 2 life.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Recruiter of the Guard @rec", "Samwise the Stouthearted @sam"]
    battlefield: ["Plains @w1", "Plains @w2"]
    library_pad: 10
  p1:
    hand: ["Thoughtseize @pts"]
    battlefield: ["Swamp @pb"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@pts", targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_cards, purpose: discard, answer: ["@rec"], expect_options: {include: ["@rec", "@sam"]}}
  - p1: {t: pass}
  - p0: {t: cast, card: "@sam", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@sam", controller: p0, targets: []}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {decision: choose_cards, purpose: ring_bearer, answer: ["@sam"]}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      hand: []
      graveyard: [Recruiter of the Guard]
      battlefield:
        - {card: Samwise the Stouthearted}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
    p1:
      life: 18
      graveyard: [Thoughtseize]
notes: >
  Recruiter went to the graveyard from p0's hand, not from the battlefield, so the trigger has no legal target and,
  being "up to one", goes on the stack with no target (no target decision). Flash lets p0 cast Samwise on p1's turn.
  On resolution nothing returns but "Then the Ring tempts you" still happens. After each resolution the active player
  p1 gets priority. A wrong engine accepts any card that went to the graveyard this turn, or skips the tempt when
  nothing was returned.
