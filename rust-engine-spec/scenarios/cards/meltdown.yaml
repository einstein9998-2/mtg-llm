id: meltdown-x-zero-destroys-mana-value-zero-artifacts-on-both-sides
title: Meltdown with X=0 destroys Mishra's Bauble, Lotus Petal and a Treasure token, but not Cori-Steel Cutter or a Monk token
area: card
cards: [Meltdown, Mishra's Bauble, Lotus Petal, Cori-Steel Cutter, Treasure Token, Monk Token, Mountain]
tags: [meltdown, mana-value, x-spell, tokens, artifact, destroy, each-player]
derived_from: cr
source:
  - {kind: oracle, card: Meltdown, text: "Destroy each artifact with mana value X or less.", verified: true}
  - {kind: cr, ref: "202.3a", text: "The mana value of an object with no mana cost is 0, unless that object is the back face of a nonmodal double-faced permanent or spell, or it is a melded permanent.", verified: true}
  - {kind: cr, ref: "202.3e", text: "When calculating the mana value of an object with an {X} in its mana cost, X is treated as 0 while the object is not on the stack, and X is treated as the number chosen for it while the object is on the stack.", verified: true}
  - {kind: cr, ref: "702.108a", text: "Prowess is a triggered ability. “Prowess” means “Whenever you cast a noncreature spell, this creature gets +1/+1 until end of turn.”", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Meltdown @melt"]
    battlefield: ["Mountain @mtn", "Mishra's Bauble @bb", "Cori-Steel Cutter @cut", {token: Monk Token, as: monk}]
    library_pad: 10
  p1:
    battlefield: ["Lotus Petal @petal", {token: Treasure Token, as: tr}]
    library_pad: 10
script:
  - p0: {t: cast, card: "@melt", x: 0, pay: auto}
  - check:
      stack: [{kind: spell, card: "@melt", x: 0}, {kind: triggered, source: "@monk"}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: spell, card: "@melt", x: 0}]
      pending: {actor: p0, kind: priority}
      p0: {battlefield_contains: [{token: Monk Token, pt: [2, 2]}]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Meltdown, Mishra's Bauble]
      battlefield: [{card: Mountain, tapped: true}, {card: Cori-Steel Cutter}, {token: Monk Token}]
    p1: {graveyard: [Lotus Petal], battlefield: []}
notes: >
  X=0 costs just {R}. Mishra's Bauble and Lotus Petal have mana value 0, and a Treasure token has no mana cost so its mana value is 0 (202.3a): all three are destroyed,
  whoever controls them. Cori-Steel Cutter has mana value 2 and survives. The Monk token is a creature, not an artifact, and survives. The Treasure token ceases
  to exist, so it is in no graveyard (p1's graveyard holds only Lotus Petal). A wrong engine skips tokens, only hits the caster's artifacts, or destroys by
  comparing to the wrong value. Reviewer fix: the Monk token has prowess and Meltdown is a noncreature spell cast by its controller, so a prowess trigger
  goes on the stack above Meltdown and resolves first (Monk 2/2 until end of turn); the original script had no step for it.
