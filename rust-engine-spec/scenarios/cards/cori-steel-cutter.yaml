id: cutter-equip-is-sorcery-speed-and-needs-an-empty-stack
title: Cori-Steel Cutter's equip cannot be activated while a spell is on the stack, and can once the stack is empty
area: card
cards: [Cori-Steel Cutter, Dragon's Rage Channeler, Lightning Bolt, Mountain, Island]
tags: [cori-steel-cutter, equip, sorcery-timing, stack, mask-validity, negative-case]
derived_from: cr
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equip {1}{R}", verified: true}
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: cr, ref: "702.6a", text: "“Equip [cost]” means “[Cost]: Attach this permanent to target creature you control. Activate only as a sorcery.”", verified: true}
  - {kind: cr, ref: "602.5d", text: "Activated abilities that read “Activate only as a sorcery” mean the player must follow the timing rules for casting a sorcery spell, though the ability isn’t actually a sorcery.", verified: true}
  - {kind: cr, ref: "307.1", text: "A player who has priority may cast a sorcery card from their hand during a main phase of their turn when the stack is empty.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Cori-Steel Cutter @cut", "Dragon's Rage Channeler @drc", "Mountain @m1", "Mountain @m2", "Mountain @m3"]
    library: ["Island @top"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - check:
      stack: [{kind: spell, card: "@bolt"}, {kind: triggered, source: "@drc"}]
      pending: {actor: p0, kind: priority}
  - expect_illegal: {p0: {t: activate, source: "@cut", ability: 0, targets: ["@drc"], pay: auto}}
  - resolve_top: true
  - p0: {decision: surveil, to_graveyard: [], on_top_order: ["@top"]}
  - check:
      stack: [{kind: spell, card: "@bolt"}]
      pending: {actor: p0, kind: priority}
  - expect_illegal: {p0: {t: activate, source: "@cut", ability: 0, targets: ["@drc"], pay: auto}}
  - resolve_top: true
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p1: {life: 17}
      legal:
        p0:
          include: [{t: activate, source: "@cut", ability: 0}]
  - p0: {t: activate, source: "@cut", ability: 0, targets: ["@drc"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains:
        - {card: Cori-Steel Cutter, attached_to: "@drc"}
        - {card: Dragon's Rage Channeler, alias: drc, pt: [2, 2]}
notes: >
  While Lightning Bolt is on the stack the equip ability is not offered even though p0 has priority in their own main phase and the mana to pay. Once Bolt
  has resolved (p1 to 17) it is offered and works. The three Mountains pay for Bolt ({R}) and the equip ({1}{R}). A wrong engine lets equip be activated at instant speed.
  Reviewer fix: p0 controls Dragon's Rage Channeler, so casting Bolt triggers its surveil 1 above Bolt; the trigger resolves first (surveil decision,
  Island kept on top), and equip is still illegal while Bolt alone is on the stack (second probe).
---
id: cutter-monk-prowess-triggers-on-the-third-spell-and-no-second-flurry
title: Declining the attach leaves a 1/1 Monk, and a third spell triggers prowess but not flurry again
area: card
cards: [Cori-Steel Cutter, Lightning Bolt, Monk Token, Mountain]
tags: [cori-steel-cutter, flurry, monk-token, prowess, negative-case, decline-optional]
derived_from: oracle
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Flurry — Whenever you cast your second spell each turn, create a 1/1 white Monk creature token with prowess. You may attach this Equipment to it.", verified: true}
  - {kind: cr, ref: "702.108a", text: "Prowess is a triggered ability. “Prowess” means “Whenever you cast a noncreature spell, this creature gets +1/+1 until end of turn.”", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @b1", "Lightning Bolt @b2", "Lightning Bolt @b3"]
    battlefield: ["Cori-Steel Cutter @cut", "Mountain @m1", "Mountain @m2", "Mountain @m3"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: auto}
  - p0: {t: cast, card: "@b2", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: yes_no, purpose: attach_cutter, answer: false}
  - bind: {as: monk, find: {name: "Monk Token", controller: p0}}
  - check:
      stack: [{kind: spell, card: "@b1"}, {kind: spell, card: "@b2"}]
      p0:
        battlefield_contains:
          - {token: Monk Token, alias: monk, pt: [1, 1], keywords: [prowess], keywords_exclude: [trample, haste]}
          - {card: Cori-Steel Cutter, attached_to: null}
  - p0: {t: cast, card: "@b3", targets: [{player: p1}], pay: auto}
  - check:
      stack: [{kind: spell, card: "@b1"}, {kind: spell, card: "@b2"}, {kind: spell, card: "@b3"}, {kind: triggered, source: "@monk"}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: spell, card: "@b1"}, {kind: spell, card: "@b2"}, {kind: spell, card: "@b3"}]
      p0: {battlefield_contains: [{token: Monk Token, alias: monk, pt: [2, 2]}]}
  - resolve_top: true
  - resolve_top: true
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Lightning Bolt, Lightning Bolt, Lightning Bolt]
      battlefield_contains:
        - {token: Monk Token, alias: monk, pt: [2, 2]}
        - {card: Cori-Steel Cutter, attached_to: null}
    p1: {life: 11}
notes: >
  The attach is optional ("you may") and is declined, so the Monk is a plain 1/1 with prowess and the Cutter stays unattached. Casting a third noncreature
  spell triggers only the Monk's prowess (stack: three Bolts then one trigger); there is no second flurry trigger since it is the third spell, and the Monk
  becomes 2/2 until end of turn. A wrong engine triggers flurry on every spell after the first or on the third spell.
---
id: cutter-flurry-counts-only-your-own-spells
title: A spell the opponent casts does not count toward Cori-Steel Cutter's second-spell condition
area: card
cards: [Cori-Steel Cutter, Lightning Bolt, Mountain]
tags: [cori-steel-cutter, flurry, spell-count, opponent-spell, negative-case, response]
derived_from: oracle
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Flurry — Whenever you cast your second spell each turn, create a 1/1 white Monk creature token with prowess.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @b1", "Lightning Bolt @b2"]
    battlefield: ["Cori-Steel Cutter @cut", "Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @pb"]
    battlefield: ["Mountain @pm"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@b1", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@pb", targets: [{player: p0}], pay: auto}
  - check:
      stack: [{kind: spell, card: "@b1"}, {kind: spell, card: "@pb"}]
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@b1"}]
      pending: {actor: p0, kind: priority}
      p0: {life: 17}
  - p0: {t: cast, card: "@b2", targets: [{player: p1}], pay: auto}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@b1"}, {kind: spell, card: "@b2"}, {kind: triggered, source: "@cut", text_contains: "Monk"}]
    pending: {actor: p0, kind: priority}
    p0: {life: 17}
notes: >
  p1's Bolt (cast while p0's first Bolt is still on the stack) is not one of p0's spells, so it is not counted: p0's next spell is their second and flurry
  triggers. After p1's Bolt resolves the active player receives priority (117.3b). A wrong engine counts all spells cast in the turn and so would see p0's
  second spell as the third and not trigger.
---
id: cutter-equip-does-nothing-when-the-target-creature-dies-in-response
title: Cori-Steel Cutter's equip ability is removed without resolving when its target creature is killed in response
area: card
cards: [Cori-Steel Cutter, Dragon's Rage Channeler, Lightning Bolt, Mountain]
tags: [cori-steel-cutter, equip, fizzle, target-legality, response, stack]
derived_from: cr
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equip {1}{R}", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word \"target,\" are now illegal, the spell or ability doesn't resolve. It's removed from the stack and, if it's a spell, put into its owner's graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Cori-Steel Cutter @cut", "Dragon's Rage Channeler @drc", "Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @pm"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@cut", ability: 0, targets: ["@drc"], pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@bolt", targets: ["@drc"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: activated, source: "@cut"}]
      pending: {actor: p0, kind: priority}
      p0: {graveyard: [Dragon's Rage Channeler]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Dragon's Rage Channeler]
      battlefield: [{card: Cori-Steel Cutter, attached_to: null}, {card: Mountain, tapped: true}, {card: Mountain, tapped: true}]
    p1: {graveyard: [Lightning Bolt]}
notes: >
  The equip cost ({1}{R}) is paid on activation and is not refunded. Bolt kills the 1/1 channeler first; when the equip ability then reaches resolution its only
  target is gone, so it does nothing and the Cutter stays on the battlefield unattached. A wrong engine attaches the Cutter to the dead creature's graveyard
  card, or moves the Cutter to the graveyard.
