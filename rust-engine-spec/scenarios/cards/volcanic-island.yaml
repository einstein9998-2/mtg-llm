id: volcanic-island-mana-empties-at-end-of-phase
title: Mana from Volcanic Island stays through priority passes in the phase and empties when main phase 1 ends
area: card
cards: [Volcanic Island]
tags: [dual-land, mana-ability, mana-pool, phase-end]
derived_from: cr
source:
  - {kind: cr, ref: "500.5", text: "As a step or phase ends, if there are effects that last until the end of that step or phase, those effects expire. Then any unspent mana left in a player's mana pool empties.", verified: true}
  - {kind: oracle, card: Volcanic Island, text: "({T}: Add {U} or {R}.)", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Volcanic Island @volc"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@volc", ability: 0, choose_color: U}
  - check:
      p0: {mana_pool: {U: 1}}
      phase: main1
  - advance: {to: begin_combat, of: p0}
expect:
  - at: after_script
    phase: begin_combat
    active: p0
    stack: []
    p0: {mana_pool: {}, battlefield: [{card: Volcanic Island, tapped: true}]}
notes: >
  Unused mana does not carry over to the next step or phase (500.5). The land stays tapped, so the mana is simply lost. The advance step performs
  explicit passes by both players with an empty stack; no decisions arise on the way.
