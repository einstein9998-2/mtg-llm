id: disruptor-flute-acererak-aluren-cast-costs-three
title: Disruptor Flute naming Acererak makes each Aluren cast of Acererak cost {3}; with four lands the loop stops after one iteration
area: matchup
cards: [Acererak the Archlich, Aluren, Disruptor Flute, Swamp, Island, Ponder]
tags: [aluren-acererak-loop, disruptor-flute, cost-increase, alternative-cost, choose-name, tax]
derived_from: cr
source:
  - {kind: cr, ref: "118.9d", text: "If an alternative cost is being paid to cast a spell, any additional costs, cost increases, and cost reductions that affect that spell are applied to that alternative cost.", verified: true}
  - {kind: cr, ref: "601.2f", text: "The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions.", verified: true}
  - {kind: oracle, card: Disruptor Flute, text: "As this artifact enters, choose a card name.", verified: true}
  - {kind: oracle, card: Disruptor Flute, text: "Spells with the chosen name cost {3} more to cast.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: oracle, card: Acererak the Archlich, text: "When Acererak enters, if you haven't completed Tomb of Annihilation, return Acererak to its owner's hand and venture into the dungeon.", verified: true}
  - {kind: cr, ref: "118.3", text: "A player can't pay a cost without having the necessary resources to pay it fully.", verified: true}
setup:
  turn: 6
  active: p0
  phase: main1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu", "Swamp @s1", "Swamp @s2", "Swamp @s3", "Swamp @s4"]
    library: ["Ponder @pd"]
    library_pad: 10
  p1:
    hand: ["Disruptor Flute @flute"]
    battlefield: ["Island @j1", "Island @j2"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: cast, card: "@flute", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_name, answer: "Acererak the Archlich"}
  - label: flute-in
    check:
      stack: []
      phase: main1
      pending: {actor: p0, kind: priority}
      p1: {battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}, {card: Disruptor Flute}]}
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}, pay: {tap: ["@s1", "@s2", "@s3"]}}
  - check:
      stack: [{kind: spell, card: "@acer", controller: p0}]
      p0:
        mana_pool: {}
        battlefield: [{card: Aluren}, {card: Swamp, tapped: true}, {card: Swamp, tapped: true}, {card: Swamp, tapped: true}, {card: Swamp, tapped: false}]
  - resolve_top: true
  - resolve_top: true
  - p0: {decision: choose_dungeon, answer: Lost Mine of Phandelver, expect_options: {count: 3}}
  - resolve_top: true
  - p0: {decision: scry, to_bottom: [], on_top_order: ["@pd"]}
  - expect_illegal: {p0: {t: cast, card: "@acer", alt_cost: {free: aluren}, pay: auto}}
  - expect_illegal: {p0: {t: cast, card: "@acer", pay: auto}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Acererak the Archlich]
      command: [{dungeon: Lost Mine of Phandelver, room: Cave Entrance}]
      battlefield: [{card: Aluren}, {card: Swamp, tapped: true}, {card: Swamp, tapped: true}, {card: Swamp, tapped: true}, {card: Swamp, tapped: false}]
notes: >
  p1 casts the Flute (flash) after p0 passes in p0's main phase and names Acererak as it enters. The Aluren cast is an
  alternative cost; the Flute's increase applies on top, so the free cast costs {3} (three Swamps). One Swamp is left, so
  neither another Aluren cast ({3}) nor a hardcast ({2}{B} + {3}) is possible: the loop is stopped by mana. This is the
  situation in which Brady switches to completing Tomb of Annihilation (next scenarios). Bugs caught: "free" ignoring the
  Flute, the Flute taxing Aluren itself or all creatures.
