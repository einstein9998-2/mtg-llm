id: defense-grid-opponents-turn-acererak-loop-bounded-by-mana
title: Under Defense Grid, Acererak loops in the opponent's end step cost {3} each; six lands give exactly two iterations
area: matchup
cards: [Acererak the Archlich, Aluren, Defense Grid, Swamp, Ponder, Goblin Token]
tags: [aluren-acererak-loop, defense-grid, cost-increase, alternative-cost, opponents-turn, priority, tax]
derived_from: cr
source:
  - {kind: cr, ref: "118.9d", text: "If an alternative cost is being paid to cast a spell, any additional costs, cost increases, and cost reductions that affect that spell are applied to that alternative cost.", verified: true}
  - {kind: cr, ref: "601.2f", text: "The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
