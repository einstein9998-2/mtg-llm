id: mu-wrath-of-the-skies-x1-kills-goyf-bauble-army-not-bowmasters
title: UWx's Wrath of the Skies with X=1 and one energy paid destroys Nethergoyf, Mishra's Bauble and the Orc Army token but not Bowmasters or Phelia
area: matchup
cards: [Wrath of the Skies, Orcish Bowmasters, Nethergoyf, "Mishra's Bauble", "Phelia, Exuberant Shepherd", Tundra, Volcanic Island, Underground Sea, Swamp]
tags: [matchup, dimir-vs-uwx, wrath-of-the-skies, energy, mana-value, token-mana-value-zero, flash, bowmasters, amass]
derived_from: cr
source:
  - {kind: oracle, card: Wrath of the Skies, text: "You get X {E} (energy counters), then you may pay any amount of {E}. Destroy each artifact, creature, and enchantment with mana value less than or equal to the amount of {E} paid this way.", verified: true}
  - {kind: cr, ref: "202.3a", text: "The mana value of an object with no mana cost is 0", verified: true}
  - {kind: cr, ref: "701.47a", text: "If you don’t control an Army creature, create a 0/0 black [subtype] Army creature token.", verified: true}
  - {kind: oracle, card: Orcish Bowmasters, text: "When this creature enters and whenever an opponent draws a card except the first one they draw in each of their draw steps, this creature deals 1 damage to any target. Then amass Orcs 1.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    hand: ["Orcish Bowmasters @bow"]
    battlefield: ["Nethergoyf @ng", "Mishra's Bauble @bb", "Underground Sea @us1", "Swamp @sw1"]
    library_pad: 10
  p1:
    hand: ["Wrath of the Skies @wr"]
    battlefield: ["Tundra @t1", "Tundra @t2", "Volcanic Island @v1", "Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: cast, card: "@bow", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: {player: p1}}
  - resolve_top: true
  - check: {phase: main1, stack: [], pending: {actor: p1, kind: priority}, p1: {life: 19}}
  - p1: {t: cast, card: "@wr", x: 1, pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_number, purpose: pay_energy, answer: 1}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      graveyard: [Nethergoyf, "Mishra's Bauble"]
      battlefield:
        - {card: Orcish Bowmasters}
        - {card: Underground Sea, tapped: true}
        - {card: Swamp, tapped: true}
    p1:
      energy: 0
      life: 19
      graveyard: [Wrath of the Skies]
      battlefield_contains: [{card: "Phelia, Exuberant Shepherd"}]
notes: >
  p1 passes in its own main phase; p0 flashes in Bowmasters (enter trigger at p1, Army created). Back in p1's main
  phase with an empty stack, p1 casts Wrath with X=1 (three lands), gets 1 energy and chooses to pay 1 (0 or 1 is a
  real choice). Destroyed: Nethergoyf (mana value 1), Mishra's Bauble (mana value 0) and the Orc Army token (no mana
  cost, mana value 0); survivors: Bowmasters and Phelia (mana value 2). The token ceases to exist, so p0's graveyard
  holds only the two cards. Bugs caught: tokens treated as having no mana value (never destroyed), energy not spent,
  noncreature artifacts spared.
