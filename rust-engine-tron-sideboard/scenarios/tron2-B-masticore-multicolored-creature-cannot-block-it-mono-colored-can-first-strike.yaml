id: tron2-b-masticore-multicolored-creature-cannot-block-it-mono-colored-can-first-strike
title: "Attacking Argentum Masticore cannot be blocked by multicolored Lavinia; mono-white Containment Priest can block and dies to first strike without dealing damage"
area: card
cards: [Argentum Masticore, "Lavinia, Azorius Renegade", Containment Priest]
tags: [argentum-masticore, protection, protection-from-multicolored, blocking, first-strike, combat, tron-sideboard]
