  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@acer", controller: p0}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {decision: choose_dungeon, answer: Lost Mine of Phandelver, expect_options: {count: 3}}
  - check:
      stack: [{kind: triggered, controller: p0, text_contains: "Scry 1"}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {decision: scry, to_bottom: [], on_top_order: ["@pd"]}
  - p1: {t: pass}
  # iteration 2
  - p0: {t: cast, card: "@acer", alt_cost: {free: aluren}, pay: {tap: ["@s4", "@s5", "@s6"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {decision: choose_room, answer: Goblin Lair, expect_options: {exact: [Goblin Lair, Mine Tunnels]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@acer", alt_cost: {free: aluren}, pay: auto}}
