id: alt-cost-daze-can-return-a-tapped-island
title: Daze's alternative cost can return a tapped Island; with no other mana the countered spell's controller gets no pay prompt
area: core
cards: [Daze, Island, Lightning Bolt, Mountain]
tags: [alternative-cost, daze, tapped-permanent, counter-unless-pay, legal-action-mask]
derived_from: oracle
source:
  - {kind: oracle, card: Daze, text: "You may return an Island you control to its owner's hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Daze, text: "Counter target spell unless its controller pays {1}.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m"]
    library_pad: 10
  p1:
    hand: ["Daze @daze"]
    battlefield: [{card: Island, as: j1, tapped: true}]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - check:
      legal:
        p1:
          include: [{t: cast, card: "@daze", alt_cost: {return_island: "@j1"}, targets: ["@bolt"]}]
          exclude: [{t: cast, card: "@daze", alt_cost: null}]
  - p1: {t: cast, card: "@daze", alt_cost: {return_island: "@j1"}, targets: ["@bolt"]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Lightning Bolt], battlefield: [{card: Mountain, tapped: true}]}
    p1: {life: 20, hand: [Island], battlefield: [], graveyard: [Daze]}
notes: >
  The cost is "return an Island you control", with no untapped requirement. The hard cast is unaffordable. p0's only
  land paid for Bolt, so p0 cannot pay {1} and no pay prompt is raised; Bolt is countered.
