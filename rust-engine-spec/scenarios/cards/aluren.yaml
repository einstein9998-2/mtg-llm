  - {kind: cr, ref: "202.3f", text: "When calculating the mana value of an object with a hybrid mana symbol in its mana cost, use the largest component of each hybrid symbol.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
