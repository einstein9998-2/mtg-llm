id: edge-of-autumn-cycling-cost-needs-a-land
title: Edge of Autumn cannot be cycled by sacrificing a nonland permanent; with no land, cycling is not offered
area: card
cards: [Edge of Autumn, Lotus Petal, Island]
tags: [edge-of-autumn, cycling, sacrifice-cost, negative, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Edge of Autumn, text: "Cycling—Sacrifice a land.", verified: true}
  - {kind: cr, ref: "118.3", text: "A player can’t pay a cost without having the necessary resources to pay it fully.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Edge of Autumn @e"]
    battlefield: ["Lotus Petal @lp"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate_from_hand, source: "@e", ability: 0, sacrifice: ["@lp"]}}
  - expect_illegal: {p0: {t: activate_from_hand, source: "@e", ability: 0}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {hand: [Edge of Autumn], battlefield: [{card: Lotus Petal}], graveyard: []}
    legal: {p0: {exclude: [{t: activate_from_hand, source: "@e"}]}}
notes: >
  The only permanent is Lotus Petal, an artifact, so the cost "sacrifice a land" cannot be paid (118.3) and cycling must
  not appear in the legal set. (Petal makes only one mana, so Edge cannot be cast for {1}{G} either; this scenario
  asserts only that the cycling action is absent.) Paired with the positive cycling scenario above.
