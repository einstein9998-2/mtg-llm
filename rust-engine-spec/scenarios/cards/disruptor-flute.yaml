id: disruptor-flute-taxes-its-own-controller-too
title: Disruptor Flute's tax applies to its own controller too, so a named Brainstorm costs {3}{U} for them
area: card
cards: [Disruptor Flute, Brainstorm, Island]
tags: [disruptor-flute, cost-increase, choose-name, controller-also-taxed]
derived_from: oracle
source:
  - {kind: oracle, card: Disruptor Flute, text: "Spells with the chosen name cost {3} more to cast.", verified: true}
  - {kind: cr, ref: "601.2f", text: "The total cost is the mana cost or alternative cost (as determined in rule 601.2b), plus all additional costs and cost increases, and minus all cost reductions.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Disruptor Flute @fl", "Brainstorm @bs"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3", "Island @i4", "Island @i5", "Island @i6"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@fl", pay: {tap: ["@i1", "@i2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_name, answer: Brainstorm}
  - p0: {t: cast, card: "@bs", pay: auto}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@bs", controller: p0}]
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      battlefield:
        - {card: Disruptor Flute}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
notes: >
  Flute {2} taps two Islands; Brainstorm named by it costs {3}{U} = four more, so all six Islands end tapped (a wrong
  engine charging only {U} would leave two Islands untapped).
---
id: disruptor-flute-named-wasteland-blocks-destroy-but-not-mana
title: Flute naming Wasteland stops its destroy ability but not its mana ability
area: card
cards: [Disruptor Flute, Wasteland, Ancient Tomb, Island]
tags: [disruptor-flute, wasteland, mana-ability, activated-ability, choose-name, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Disruptor Flute, text: "Activated abilities of sources with the chosen name can't be activated unless they're mana abilities.", verified: true}
  - {kind: oracle, card: Wasteland, text: "{T}: Add {C}.", verified: true}
  - {kind: oracle, card: Wasteland, text: "{T}, Sacrifice this land: Destroy target nonbasic land.", verified: true}
  - {kind: cr, ref: "605.1a", text: "An activated ability is a mana ability if it meets all of the following criteria: it doesn't require a target (see rule 115.6), it could add mana to a player's mana pool when it resolves, and it's not a loyalty ability.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Disruptor Flute @fl"]
    battlefield: ["Island @i1", "Island @i2", "Ancient Tomb @tomb"]
    library_pad: 10
  p1:
    battlefield: ["Wasteland @w"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@fl", pay: {tap: ["@i1", "@i2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_name, answer: Wasteland}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: activate, source: "@w", ability: 1, targets: ["@tomb"]}}
  - p1: {t: activate, source: "@w", ability: 0}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      battlefield_contains: [{card: Ancient Tomb, tapped: false}, {card: Disruptor Flute}]
    p1:
      mana_pool: {C: 1}
      battlefield: [{card: Wasteland, tapped: true}]
notes: >
  Naming Wasteland forbids activating its sacrifice ability (not a mana ability: it has a target and makes no mana) even
  though it is untapped and has a legal target. Its {T}: Add {C} mana ability is exempt. After Flute resolves p0 passes
  with an empty stack and p1 receives priority. The failed probe must not sacrifice Wasteland.
---
