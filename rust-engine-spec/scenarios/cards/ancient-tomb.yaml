id: ancient-tomb-survive-at-three-life
title: Tapping Ancient Tomb at 3 life leaves 1 life and the game continues
area: card
cards: [Ancient Tomb]
tags: [ancient-tomb, life-loss, mana-pool]
derived_from: oracle
source:
  - {kind: oracle, card: Ancient Tomb, text: "{T}: Add {C}{C}. This land deals 2 damage to you.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 3
    battlefield: ["Ancient Tomb @tomb"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@tomb", ability: 0}
expect:
  - at: after_script
    game: {over: false}
    pending: {actor: p0, kind: priority}
    p0: {life: 1, mana_pool: {C: 2}}
notes: >
  Boundary partner of the lethal case, 3 - 2 = 1 is not 0 or less, so the game continues and the mana is available.
