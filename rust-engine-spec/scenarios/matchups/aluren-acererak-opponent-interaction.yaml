area: matchup
cards: [Aluren, Dragon's Rage Channeler, "Spider-Woman, Stunning Savior", Lightning Bolt, Volcanic Island]
tags: [aluren, cast-trigger, drc, surveil, negative]
derived_from: oracle
source:
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    hand: ["Spider-Woman, Stunning Savior @psw", "Lightning Bolt @pbolt"]
    battlefield: ["Dragon's Rage Channeler @drc", "Volcanic Island @volc"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@psw", alt_cost: {free: aluren}}
  - label: no-surveil-trigger
    check:
      stack: [{kind: spell, card: "@psw", controller: p1}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: cast, card: "@pbolt", targets: [{player: p0}], pay: auto}
