id: aluren-noncreature-spells-not-free
title: Aluren covers creature spells only; Show and Tell, Brainstorm and Lotus Petal cannot use it
area: card
cards: [Aluren, Show and Tell, Brainstorm, Lotus Petal]
tags: [aluren, alternative-cost, card-type, negative]
derived_from: oracle
source:
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Show and Tell @snt", "Brainstorm @bs", "Lotus Petal @petal"]
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@snt", alt_cost: {free: aluren}}}
  - expect_illegal: {p0: {t: cast, card: "@bs", alt_cost: {free: aluren}}}
  - expect_illegal: {p0: {t: cast, card: "@petal", alt_cost: {free: aluren}}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {hand: [Show and Tell, Brainstorm, Lotus Petal]}
    legal: {p0: {exclude: [{t: cast, card: "@snt"}, {t: cast, card: "@bs"}]}}
notes: >
  Mana value 3 or less is not enough; the spell must be a creature spell. Show and Tell and Brainstorm have no castable
  option at all here (no mana). Lotus Petal can still be cast for its normal cost {0} (not asserted either way), but not
  through Aluren.
