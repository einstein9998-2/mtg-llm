id: griselbrand-pay-seven-at-exactly-seven-life-loses-before-drawing
title: At exactly 7 life, Griselbrand's ability can be activated, and its controller loses at 0 life before the ability resolves
area: card
cards: [Griselbrand, Island]
tags: [griselbrand, pay-life, state-based-actions, game-loss]
derived_from: cr
source:
  - {kind: cr, ref: "119.4", text: "If a cost or effect allows a player to pay an amount of life greater than 0, the player may do so only if their life total is greater than or equal to the amount of the payment.", verified: true}
  - {kind: cr, ref: "704.5a", text: "If a player has 0 or less life, that player loses the game.", verified: true}
  - {kind: cr, ref: "704.3", text: "Whenever a player would get priority (see rule 117, \"Timing and Priority\"), the game checks for any of the listed conditions for state-based actions", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 7
    battlefield: [{card: Griselbrand, as: gris}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@gris", ability: 0}
expect:
  - at: after_script
    game: {over: true, winner: p1}
    p0: {life: 0}
notes: >
  7 >= 7, so the payment is legal. p0 would receive priority right after activating (117.3c); state-based actions are
  checked first and p0, at 0 life, loses before the draw-seven ability can resolve. Wrong engines: forbid paying one's
  entire life total, or resolve the draw before checking state-based actions.
