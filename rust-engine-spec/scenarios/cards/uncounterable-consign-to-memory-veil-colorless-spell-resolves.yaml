notes: >
  Grafdigger's Cage is a colorless spell (a legal Consign target). Consign's counter uses a different effect than the
  "counter target spell" family and is checked here so that every counter effect in the pool is covered against
  "can't be countered". Cage can't be countered (101.2) and resolves; Consign goes to the graveyard. A wrong engine
  counters Cage on this path.
