id: tron2-b-masticore-discard-a-land-targets-only-mana-value-zero
title: "Discarding an Island (mana value 0) to Argentum Masticore: only opposing nonland permanents with mana value 0 (a token, Lotus Petal) can be targeted"
area: card
cards: [Argentum Masticore, Island, Lightning Bolt, Lotus Petal, Goblin Token, Voltaic Key]
tags: [argentum-masticore, upkeep-trigger, reflexive-trigger, mana-value-zero, token, discard-land, targeting, tron-sideboard]
derived_from: oracle
source:
  - {kind: oracle, card: Argentum Masticore, text: "destroy target nonland permanent an opponent controls with mana value less than or equal to the mana value of the discarded card.", verified: true, note: "entry in oracle-additions-B.json"}
  - {kind: cr, ref: "202.3", text: "The mana value of an object is a number equal to the total amount of mana in its mana cost, regardless of color.", verified: true}
setup:
  turn: 2
  active: p1
  phase: end
  p0:
    hand: ["Island @isl_h", "Lightning Bolt @bolt"]
    battlefield: ["Argentum Masticore @mast", "Lotus Petal @mypetal"]
    library_pad: 10
  p1:
    battlefield: [{token: Goblin Token, as: gob}, "Lotus Petal @petal", "Voltaic Key @key", "Island @isl_b"]
    library_pad: 10
script:
  - advance: {to: upkeep, of: p0}
  - resolve_top: true
  - p0: {decision: yes_no, purpose: discard_to_keep_masticore, answer: true}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@isl_h"]}
  - p0:
      decision: choose_target
      slot: 0
      expect_options: {include: ["@gob", "@petal"], exclude: ["@key", "@isl_b", "@mypetal"], count: 2}
      answer: "@gob"
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Lightning Bolt]
      graveyard: [Island]
      battlefield: [{card: Argentum Masticore}, {card: Lotus Petal}]
    p1:
      battlefield: [{card: Lotus Petal}, {card: Voltaic Key}, {card: Island}]
      graveyard: []
notes: >
  A land card in hand has mana value 0, so the bound is 0: the opposing Goblin token (a token's mana value is 0, it has no
  mana cost) and the opposing Lotus Petal qualify, Voltaic Key (1) does not, the Island is a land and p0's own Petal is not
  an opponent's. The token is destroyed and ceases to exist (empty p1 graveyard). A wrong engine rejects the trigger
  because "the discarded card is a land", offers the lands, or treats a token's value as non-zero.
