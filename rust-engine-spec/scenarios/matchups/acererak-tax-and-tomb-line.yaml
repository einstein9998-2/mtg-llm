  active: p1
  phase: end
  priority: p1
  p0:
    hand: ["Acererak the Archlich @acer"]
    battlefield: ["Aluren @alu", "Swamp @s1", "Swamp @s2", "Swamp @s3", "Swamp @s4", "Swamp @s5", "Swamp @s6"]
