id: mu-swords-barrowgoyf-swords-itself-not-yet-in-graveyard
title: Swords to Plowshares on Barrowgoyf gives life equal to its power while Swords is still on the stack, so Swords' own instant type does not count
area: matchup
cards: [Swords to Plowshares, Barrowgoyf, Polluted Delta, Ponder, Tundra, Underground Sea]
tags: [matchup, dimir-vs-uwx, swords-to-plowshares, barrowgoyf, characteristic-defining, life-gain, resolution-order]
derived_from: cr
source:
  - {kind: oracle, card: Barrowgoyf, text: "Barrowgoyf's power is equal to the number of card types among cards in all graveyards and its toughness is equal to that number plus 1.", verified: true}
  - {kind: oracle, card: Swords to Plowshares, text: "Exile target creature. Its controller gains life equal to its power.", verified: true}
  - {kind: cr, ref: "608.2n", text: "As the final part of an instant or sorcery spell’s resolution, the spell is put into its owner’s graveyard.", verified: true}
  - {kind: cr, ref: "608.2h", text: "the effect uses the object’s last known information", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Barrowgoyf @bg", "Underground Sea @us1"]
    graveyard: ["Polluted Delta @g1"]
    library_pad: 10
  p1:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Tundra @t1"]
    graveyard: ["Ponder @g2"]
    library_pad: 10
script:
  - check: {p0: {battlefield_contains: [{card: Barrowgoyf, pt: [2, 3]}]}}
  - p1: {t: cast, card: "@stp", targets: ["@bg"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0: {life: 22, exile: [Barrowgoyf]}
    p1: {life: 20, graveyard: [Ponder, Swords to Plowshares]}
notes: >
  Barrowgoyf counts land (p0's Delta) and sorcery (p1's Ponder): 2/3. Swords goes to the graveyard only as the final
  part of its own resolution (608.2n), after the exile and life gain, so the instant type is never counted for the
  life: p0 gains 2, not 3. Bugs caught: putting Swords into the graveyard before applying its effect, or counting the
  spell on the stack.
