id: mu-prismatic-ending-x2-two-colors-misses-barrowgoyf
title: Prismatic Ending with X=2 paid with white and blue (two colors) does not exile Barrowgoyf (mana value 3)
area: matchup
cards: [Prismatic Ending, Barrowgoyf, Tundra, Underground Sea]
