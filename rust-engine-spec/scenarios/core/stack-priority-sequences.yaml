id: counter-war-four-spells-priority-returns-to-active-player-each-time
title: "Counter war: Bolt, Hydroblast, Pyroblast; after Pyroblast resolves the active player gets priority and the opponent may answer again with a second Hydroblast"
area: core
cards: [Lightning Bolt, Pyroblast, Hydroblast, Mountain, Island]
tags: [stack, priority, counter-war, lifo, modal, pyroblast, hydroblast]
derived_from: cr
source:
  - {kind: oracle, card: Hydroblast, text: "Counter target spell if it's red.", verified: true}
  - {kind: oracle, card: Pyroblast, text: "Counter target spell if it's blue.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
  - {kind: cr, ref: "117.3c", text: "If a player has priority when they cast a spell, activate an ability, or take a special action, that player receives priority afterward.", verified: true}
  - {kind: cr, ref: "117.4", text: "If all players pass in succession (that is, if all players pass without taking any actions in between passing), the spell or ability on top of the stack resolves or, if the stack is empty, the phase or step ends.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt", "Pyroblast @pyro"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    hand: ["Hydroblast @h1", "Hydroblast @h2"]
    battlefield: ["Island @j1", "Island @j2"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@m1"]}}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: cast, card: "@h1", modes: [1], targets: ["@bolt"], pay: {tap: ["@j1"]}}
  - check:
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: cast, card: "@pyro", modes: [1], targets: ["@h1"], pay: {tap: ["@m2"]}}
  - check:
      stack:
        - {kind: spell, card: "@bolt", controller: p0}
        - {kind: spell, card: "@h1", controller: p1}
        - {kind: spell, card: "@pyro", controller: p0}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0: {graveyard: [Pyroblast]}
      p1: {graveyard: [Hydroblast]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@h2", modes: [1], targets: ["@bolt"], pay: {tap: ["@j2"]}}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Lightning Bolt, Pyroblast]}
    p1:
      life: 20
      hand: []
      graveyard: [Hydroblast, Hydroblast]
notes: >
  Every caster keeps priority after casting (117.3c) and passes explicitly. Pyroblast (top) resolves first and counters
  the blue Hydroblast; after that resolution the ACTIVE player p0 gets priority (117.3b), not the player who cast the
  last spell, and Bolt resolves only after both players pass in succession again (117.4). p0 passes, so p1 gets a new
  chance and counters Bolt with the second Hydroblast (Bolt is red). Wrong engines: priority after a resolution going to
  the last caster or straight to resolving the next object, or LIFO broken (Bolt resolving before the counters).
---
id: responding-to-equip-the-bonus-stays-on-the-old-creature-until-resolution
title: In response to equipping the Monk, a 1-damage Prismari Charm kills the 1/1 Monk; the equip ability then does nothing and the Cutter stays on DRC
area: core
cards: [Cori-Steel Cutter, "Dragon's Rage Channeler", Monk Token, Prismari Charm, Mountain, Volcanic Island, Island]
tags: [stack, equip, activated-ability, respond, fizzle, layers, equipment]
derived_from: cr
source:
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equipped creature gets +1/+1 and has trample and haste.", verified: true}
  - {kind: oracle, card: Prismari Charm, text: "Prismari Charm deals 1 damage to each of one or two targets.", verified: true}
  - {kind: cr, ref: "702.6a", text: "Equip is an activated ability of Equipment cards. “Equip [cost]” means “[Cost]: Attach this permanent to target creature you control. Activate only as a sorcery.”", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word “target,” are now illegal, the spell or ability doesn’t resolve.", verified: true}
  - {kind: cr, ref: "611.3a", text: "A continuous effect generated by a static ability isn’t “locked in”; it applies at any given moment to whatever its text indicates.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield:
      - "Dragon's Rage Channeler @drc"
      - {token: Monk Token, as: monk}
      - {card: Cori-Steel Cutter, as: cut, attached_to: "@drc"}
      - "Mountain @m1"
      - "Mountain @m2"
    library_pad: 10
  p1:
    hand: ["Prismari Charm @charm"]
    battlefield: ["Volcanic Island @volc", "Island @j1"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@cut", ability: 0, targets: ["@monk"], pay: {tap: ["@m1", "@m2"]}}
  - check:
      stack: [{kind: activated, source: "@cut", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0:
        battlefield_contains:
          - {card: Cori-Steel Cutter, attached_to: "@drc"}
          - {token: Monk Token, pt: [1, 1]}
          - {card: "Dragon's Rage Channeler", pt: [2, 2]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@charm", modes: [2], targets: ["@monk"], pay: {tap: ["@volc", "@j1"]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: activated, source: "@cut", controller: p0}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: []
      battlefield:
        - {card: "Dragon's Rage Channeler", pt: [2, 2], keywords: [trample, haste]}
        - {card: Cori-Steel Cutter, attached_to: "@drc"}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
    p1: {graveyard: [Prismari Charm]}
notes: >
  Equip moves the Equipment only when the ability resolves; while it waits on the stack the Cutter is still on DRC and
  the Monk is a 1/1 (the static bonus applies to whatever the Cutter is attached to now, 611.3a). p1's Charm (mode 2,
  one target) deals 1 damage to the Monk, which dies and, being a token, ceases to exist. The equip ability's only
  target is gone, so it does not resolve (608.2b) and the Cutter stays on DRC. p1's spell triggers neither DRC nor
  prowess (both say "you cast"). Wrong engine: attaching at activation (the Monk would be a 2/2 and survive).
