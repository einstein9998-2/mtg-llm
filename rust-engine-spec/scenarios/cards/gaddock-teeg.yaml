id: teeg-stops-force-of-will-but-not-evoked-solitude
title: Under Gaddock Teeg, Force of Will (mana value 5, noncreature) cannot be cast even for its alternative cost, but Solitude (a creature) can be evoked
area: card
cards: [Gaddock Teeg, Mountain, Lightning Bolt, Force of Will, Brainstorm, Solitude, Swords to Plowshares]
tags: [gaddock-teeg, casting-restriction, mana-value, alternative-cost, evoke, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: Gaddock Teeg, text: "Noncreature spells with mana value 4 or greater can't be cast.", verified: true}
  - {kind: oracle, card: Force of Will, text: "You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
  - {kind: oracle, card: Solitude, text: "Evoke—Exile a white card from your hand.", verified: true}
  - {kind: cr, ref: "118.9c", text: "An alternative cost doesn't change a spell's mana cost, only what its controller has to pay to cast it.", verified: true}
  - {kind: cr, ref: "202.3", text: "The mana value of an object is a number equal to the total amount of mana in its mana cost, regardless of color.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    life: 20
    hand: ["Force of Will @fow", "Brainstorm @bs", "Solitude @sol", "Swords to Plowshares @stp"]
    battlefield: []
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Gaddock Teeg @teeg", "Mountain @m"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - expect_illegal: {p0: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@bolt"]}}
  - p0: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@stp"}}}
expect:
  - at: after_script
    stack:
      - {kind: spell, card: "@bolt", controller: p1}
      - {kind: spell, card: "@sol", controller: p0}
    pending: {actor: p0, kind: priority}
    p0:
      life: 20
      hand: [Force of Will, Brainstorm]
      exile: [Swords to Plowshares]
notes: >
  Force of Will's mana value stays 5 when its alternative cost is used (118.9c), so Teeg forbids it. Solitude also has
  mana value 5, but Teeg restricts only noncreature spells, so the evoked Solitude is legal (positive control in the
  same scenario). p0 has no lands, which is why only free casts are relevant. A wrong engine uses the paid amount as
  the mana value, or applies Teeg to creature spells.
---
id: teeg-stops-x-spells-even-with-x-zero
title: Under Gaddock Teeg, Meltdown ({X}{R}) cannot be cast with any X; once Teeg dies it can
area: card
cards: [Gaddock Teeg, Meltdown, Lightning Bolt, Mountain, Savannah]
tags: [gaddock-teeg, casting-restriction, x-spell, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: Gaddock Teeg, text: "Noncreature spells with {X} in their mana costs can't be cast.", verified: true}
  - {kind: oracle, card: Meltdown, text: "Destroy each artifact with mana value X or less.", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Meltdown @melt", "Lightning Bolt @bolt"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    battlefield: ["Gaddock Teeg @teeg", "Savannah @sav"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@melt", x: 0}}
  - expect_illegal: {p0: {t: cast, card: "@melt", x: 1}}
  - p0: {t: cast, card: "@bolt", targets: ["@teeg"], pay: {tap: ["@m1"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      p1: {graveyard: [Gaddock Teeg]}
  - p0: {t: cast, card: "@melt", x: 0, pay: {tap: ["@m2"]}}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@melt", controller: p0, x: 0}]
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Lightning Bolt]
notes: >
  Teeg's second sentence forbids any noncreature spell with {X} in its mana cost, whatever X would be chosen, so neither
  X=0 (payable with one Mountain) nor X=1 is offered. Bolt (mana value 1, no X) is allowed and kills the 2/2 Teeg; then
  the same Meltdown with X=0 is castable (positive control). A wrong engine computes the mana value with the chosen X
  and lets a small X through.
