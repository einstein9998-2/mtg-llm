id: tron2-a-bahamut-chapter-four-counts-permanents-when-it-resolves-not-when-it-triggers
title: "With Bahamut's chapter IV on the stack p1 destroys Grim Monolith with Abrade: the damage is Karn 4 + Voltaic Key 1 = 5, not 7"
area: card
cards: ["Summon: Bahamut", Grim Monolith, "Karn, the Great Creator", Voltaic Key, Island, Abrade, Mountain]
tags: [summon-bahamut, saga, saga-creature, chapter-ability, mana-value, damage-to-player, response, abrade, resolution-time-count]
derived_from: oracle
source:
  - {kind: oracle, card: "Summon: Bahamut", text: "IV — Mega Flare — This creature deals damage equal to the total mana value of other permanents you control to each opponent.", verified: true}
  - {kind: oracle, card: Abrade, text: "Destroy target artifact.", verified: true}
  - {kind: cr, ref: "608.2h", text: "If an effect requires information from the game (such as the number of creatures on the battlefield), the answer is determined only once, when the effect is applied. If the effect requires information from a specific object, including the source of the ability itself, the effect uses the current information of that object if it’s in the public zone it was expected to be in; if it’s no longer in that zone, or if the effect has moved it from a public zone to a hidden zone, the effect uses the object’s last known information. See rule 113.7a. If an ability states that an object does something, it’s the object as it exists—or as it most recently existed—that does it, not the ability.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main2
  p0:
    battlefield:
      - {card: "Summon: Bahamut", as: bah, counters: {lore: 3}, sick: false}
      - "Grim Monolith @gm"
      - {card: "Karn, the Great Creator", as: karn, counters: {loyalty: 4}}
      - "Voltaic Key @key"
      - "Island @isl"
    library_pad: 10
  p1:
    hand: ["Abrade @ab"]
    battlefield: ["Mountain @m1", "Mountain @m2"]
    library_pad: 10
script:
  - advance: {to: draw, of: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      phase: main1
      stack: [{kind: triggered, source: "@bah", controller: p0}]
  - p0: {t: pass}
  - p1: {t: cast, card: "@ab", modes: [2], targets: ["@gm"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@bah", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0: {graveyard: [Grim Monolith]}
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Grim Monolith, "Summon: Bahamut"]
      battlefield: [{card: "Karn, the Great Creator"}, {card: Voltaic Key}, {card: Island}]
    p1:
      life: 15
      graveyard: [Abrade]
notes: >
  The damage amount is determined on resolution from the permanents p0 controls then (608.2h: information from the game is
  found as the effect is applied): Grim Monolith (2) is destroyed in response, leaving Karn 4 + Voltaic Key 1 = 5, so p1 goes
  20 -> 15. Abrade's second mode destroys the artifact; Abrade costs {1}{R} (no Trinisphere here). The trigger stays on the stack
  throughout so the Saga is not sacrificed early. A wrong engine fixes the amount (7) when the ability triggers.
