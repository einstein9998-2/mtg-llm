    pending: {actor: p0, kind: priority}
    p0:
      exile: []
      hand_count: 5
      battlefield_contains: [{card: Quantum Riddler, tapped: false}]
notes: >
  Turn 3: warp cast (2 of 5 Islands), draw one (hand 3), exiled at the end step. The turn passes to p1 (turn 4) and back
  to p0 (turn 5); p0 draws in the draw step (hand 4; Riddler is not on the battlefield, so one card). The warp permission
  is "cast this card from your hand", so warp is not offered from exile; the mana cost {3}{U}{U} is. Cast that way, the
  warp delayed trigger is not created, its enters trigger draws one (hand 4 -> 5, more than one card so no extra), and
  at turn 5's end step nothing exiles it. Bugs caught: warp offered from exile, a warped card unable to be cast later,
  the second cast still treated as warped. The casting permission "after the current turn has ended" is not probed on
  turn 3 because sorcery timing would also forbid it at the end step.
---
id: quantum-riddler-warped-flickered-by-phelia-stays
title: A warped Quantum Riddler exiled and returned by Phelia is a new object; the warp exile trigger does nothing to it and it stays on the battlefield
area: card
cards: [Quantum Riddler, "Phelia, Exuberant Shepherd", Island]
tags: [quantum-riddler, warp, phelia, new-object, delayed-trigger, order-triggers]
derived_from: cr
source:
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "At the beginning of the next end step, return that card to the battlefield under its owner's control. If it entered under your control, put a +1/+1 counter on Phelia.", verified: true}
  - {kind: oracle, card: Quantum Riddler, text: "When this creature enters, draw a card.", verified: true}
  - {kind: cr, ref: "603.7c", text: "However, if that object is no longer in the zone it’s expected to be in at the time the delayed triggered ability resolves, the ability won’t affect it. (Note that if that object left that zone and then returned, it’s a new object and thus won’t be affected. See rule 400.7.)", verified: true}
  - {kind: cr, ref: "702.185a", text: "exile the permanent this spell becomes at the beginning of the next end step", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Quantum Riddler @qr", "Island @h1", "Island @h2"]
    battlefield: ["Phelia, Exuberant Shepherd @phelia", "Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    battlefield: ["Island @j1"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@qr", alt_cost: {warp: true}, pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - resolve_top: true
  - check: {p0: {hand_count: 3}}
  - advance: {to: begin_combat, of: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@phelia", target: {player: p1}}], expect_options: {exclude: ["@qr"]}}
  - p0: {decision: choose_target, slot: 0, answer: "@qr"}
  - resolve_top: true
  - check: {p0: {exile: [Quantum Riddler]}}
  - advance: {to: main2, of: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: order_triggers
      answer:
        - {text_contains: "exile"}
        - {source: "@phelia", text_contains: "return"}
  - check:
      stack:
        - {kind: triggered, controller: p0, text_contains: "exile"}
        - {kind: triggered, source: "@phelia", controller: p0, text_contains: "return"}
  - resolve_top: true
  - check:
      stack:
        - {kind: triggered, controller: p0, text_contains: "exile"}
        - {kind: triggered, source: "@qr", controller: p0, text_contains: "draw"}
  - resolve_top: true
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: []
      hand_count: 4
      battlefield_contains:
        - {card: Quantum Riddler, sick: true}
        - {card: "Phelia, Exuberant Shepherd", counters: {"+1/+1": 1}, pt: [3, 3]}
    p1: {life: 18}
notes: >
  Riddler is warped in main 1 (enters trigger: one draw, hand 3). Phelia attacks (the sick Riddler cannot) and exiles it.
  The script passes explicitly out of main 2 because the ordering decision is raised before anyone gets priority in the
  end step (an advance would fail on it). At the end step two delayed triggers trigger: the warp exile (created when the warped Riddler entered) and Phelia's
  return; p0 orders them, here with Phelia's on top. Phelia's resolves first: Riddler returns under its owner's control
  (counter on Phelia) as a new object and its enters trigger goes on the stack above the warp trigger; it draws one
  (hand 4). The warp trigger then resolves and does nothing, because the permanent it refers to left the battlefield and
  the Riddler now there is a new object (603.7c). Bugs caught: exiling the returned Riddler (warp state carried across the
  flicker), the warp trigger vanishing so no ordering is offered, no counter on Phelia. The warp trigger is identified by its
  text only: the CR does not fix the source of a delayed trigger created by warp's static ability (SCHEMA addenda), so
  no scenario asserts it; its controller is p0 (603.7d: the player who controlled the spell as it resolved).
