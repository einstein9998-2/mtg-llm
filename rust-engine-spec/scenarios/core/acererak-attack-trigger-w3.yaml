id: acererak-attack-trigger-opponent-declines-zombie-is-not-attacking
title: When the defending player declines to sacrifice, p0 creates a 2/2 Zombie that is not attacking and deals no combat damage
area: core
cards: [Acererak the Archlich, "Goblin Token", "Skeleton Token", "Zombie Token"]
tags: [combat, attack-trigger, triggers, stack, opponent-decision, acererak, not-attacking, token]
derived_from: oracle
source:
  - {kind: oracle, card: "Acererak the Archlich", text: "Whenever Acererak attacks, for each opponent, you create a 2/2 black Zombie creature token unless that player sacrifices a creature of their choice.", verified: true}
  - {kind: cr, ref: "508.3a", text: "An ability that reads “Whenever [a creature] attacks, . . .” triggers if that creature is declared as an attacker.", verified: true}
  - {kind: cr, ref: "508.1k", text: "Each chosen creature still controlled by the active player becomes an attacking creature.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Acererak the Archlich @acer"]
    library_pad: 10
  p1:
    battlefield: [{token: Goblin Token, as: gob}, {token: Skeleton Token, as: skel}]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@acer", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: yes_no, purpose: sacrifice_creature_instead_of_zombie, answer: false, expect_options: {include: [true, false]}}
  - check:
      priority: p0
      stack: []
      p0:
        battlefield:
          - {card: Acererak the Archlich, tapped: true}
          - {token: Zombie Token, tapped: false, pt: [2, 2]}
      p1: {battlefield: [{token: Goblin Token}, {token: Skeleton Token}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: [], expect_options: {include: ["@skel", "@gob"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
