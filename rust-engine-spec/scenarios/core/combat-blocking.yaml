  - {kind: oracle, card: "Containment Priest", text: "Flash", verified: true}
  - {kind: cr, ref: "509.1a", text: "The chosen creatures must be untapped and they can’t also be battles. For each of the chosen creatures, the defending player chooses one creature for it to block that’s attacking that player, a planeswalker they control, or a battle they protect.", verified: true}
