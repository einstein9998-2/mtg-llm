id: null-rod-stops-cori-steel-cutter-equip
title: Null Rod stops Cori-Steel Cutter's equip ability even with enough mana and a legal target
area: card
cards: [Null Rod, Cori-Steel Cutter, Dragon's Rage Channeler, Mountain]
tags: [null-rod, equip, activated-ability, artifact, cori-steel-cutter, negative-case]
derived_from: oracle
source:
  - {kind: oracle, card: Null Rod, text: "Activated abilities of artifacts can't be activated.", verified: true}
  - {kind: cr, ref: "702.6a", text: "Equip is an activated ability of Equipment cards.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Cori-Steel Cutter @cut", "Dragon's Rage Channeler @drc", "Mountain @m1", "Mountain @m2"]
    library_pad: 10
  p1:
    battlefield: ["Null Rod @rod"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate, source: "@cut", ability: 0, targets: ["@drc"], pay: auto}}
  - check:
      legal:
        p0:
          exclude: [{t: activate, source: "@cut", ability: 0}]
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield_contains: [{card: Cori-Steel Cutter, attached_to: null}, {card: Dragon's Rage Channeler, pt: [1, 1]}]
      battlefield: [{card: Cori-Steel Cutter}, {card: Dragon's Rage Channeler}, {card: Mountain, tapped: false}, {card: Mountain, tapped: false}]
notes: >
  Equip is an activated ability of an artifact card, so Null Rod (on the opponent's side) prevents it. The Mountains stay untapped and nothing is attached. The
  Mountains' own mana abilities are unaffected (they are lands, see the next scenario). A wrong engine forgets that equip is an ability of the Equipment.
