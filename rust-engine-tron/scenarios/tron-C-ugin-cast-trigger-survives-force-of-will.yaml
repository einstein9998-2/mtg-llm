id: tron-c-ugin-cast-trigger-still-resolves-when-ugin-is-countered
title: "Force of Will counters the Ugin spell, but the already-triggered cast trigger still exiles its target (the ability is independent of the spell)"
area: card
cards: ["Ugin, Eye of the Storms", Mountain, "Phelia, Exuberant Shepherd", Force of Will, Brainstorm]
tags: [ugin, planeswalker, cast-trigger, force-of-will, counterspell, ability-independent-of-source, alurentell, matchup]
derived_from: cr
source:
  - {kind: oracle, card: "Ugin, Eye of the Storms", text: "When you cast this spell, exile up to one target permanent that's one or more colors.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: cr, ref: "113.7a", text: "Once activated or triggered, an ability exists on the stack independently of its source. Destruction or removal of the source after that time won’t affect the ability.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn’t resolve and none of its effects occur. A countered spell is put into its owner’s graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Ugin, Eye of the Storms @ugin"]
    battlefield:
      - Mountain
      - Mountain
      - Mountain
      - Mountain
      - Mountain
      - Mountain
      - Mountain
    library_pad: 10
  p1:
    hand: [Force of Will @fow, Brainstorm @bs]
    battlefield: ["Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ugin", pay: auto}
  - p0: {decision: choose_target, slot: 0, answer: "@ph"}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@ugin"]}
  - check:
      stack:
        - {kind: spell, card: "@ugin", controller: p0}
        - {kind: triggered, source: "@ugin", controller: p0}
        - {kind: spell, card: "@fow", controller: p1}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@ugin", controller: p0}]
      p0: {graveyard: ["Ugin, Eye of the Storms"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: ["Ugin, Eye of the Storms"]
      battlefield_contains: []
    p1:
      life: 19
      graveyard: [Force of Will]
      exile: ["Phelia, Exuberant Shepherd", Brainstorm]
      battlefield: []
notes: >
  p1 pitches Brainstorm (blue) to Force of Will (1 life) in response, targeting the Ugin spell under the trigger.
  Force of Will resolves first and counters Ugin (graveyard), then the trigger resolves and exiles Phelia anyway. A wrong
  engine removes the trigger together with its source spell.
