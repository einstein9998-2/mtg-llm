  - {kind: cr, ref: "704.5i", text: "If a planeswalker has loyalty 0, it’s put into its owner’s graveyard.", verified: true}
  - {kind: cr, ref: "205.1b", text: "Some effects state that an object becomes an “artifact creature”; these effects also allow the object to retain all of its prior card types and subtypes.", verified: true}
setup:
