id: ur-b-pyrokinesis-one-one-one-one-four-tokens
title: "Pyrokinesis divided 1/1/1/1 over four Goblin tokens kills all four; a fifth creature that is not a target is untouched"
area: card
cards: [Pyrokinesis, Lightning Bolt, Goblin Token, "Thassa's Oracle"]
tags: [pyrokinesis, divided-damage, one-one-one-one, four-targets, tokens, non-target-unaffected]
derived_from: oracle
source:
  - {kind: oracle, card: Pyrokinesis, text: "Pyrokinesis deals 4 damage divided as you choose among any number of target creatures.", verified: true}
  - {kind: cr, ref: "601.2d", text: "If the spell requires the player to divide or distribute an effect (such as damage or counters) among one or more targets, the player announces the division. Each of these targets must receive at least one of whatever is being divided.", verified: true}
  - {kind: cr, ref: "704.5g", text: "If a creature has toughness greater than 0, it has damage marked on it, and the total damage marked on it is greater than or equal to its toughness, that creature has been dealt lethal damage and is destroyed. Regeneration can replace this event.", verified: true}
  - {kind: cr, ref: "704.5d", text: "If a token is in a zone other than the battlefield, it ceases to exist.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Pyrokinesis @pyro", "Lightning Bolt @bolt"]
    library_pad: 10
  p1:
    battlefield:
      - {token: Goblin Token, as: g1}
      - {token: Goblin Token, as: g2}
      - {token: Goblin Token, as: g3}
      - {token: Goblin Token, as: g4}
      - "Thassa's Oracle @oracle"
    library_pad: 10
script:
  - p0: {t: cast, card: "@pyro", alt_cost: {exile_red_card: "@bolt"}, divide: {"@g1": 1, "@g2": 1, "@g3": 1, "@g4": 1}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Pyrokinesis]
      exile: [Lightning Bolt]
    p1:
      battlefield: [{card: "Thassa's Oracle", damage: 0}]
      graveyard: []
notes: >
  Four targets is the maximum division (each target must receive at least 1, 601.2d, and the total is 4). Each 1/1
  Goblin token has lethal damage and is put into the graveyard by the state-based action, then ceases to exist (704.5d),
  so p1's graveyard is empty. Thassa's Oracle (1/3) is not a target and has no damage. A wrong engine gives the
  fourth target 0, damages every creature, or leaves a token in the graveyard.
