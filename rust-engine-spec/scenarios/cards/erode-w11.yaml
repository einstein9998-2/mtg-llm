id: erode-target-gone-no-search
title: If Erode's target leaves before resolution, Erode does not resolve and no search is offered
area: card
cards: [Erode, Swords to Plowshares, Plains, "Phelia, Exuberant Shepherd"]
tags: [erode, fizzle, illegal-target, may-search, swords-to-plowshares]
derived_from: cr
source:
  - {kind: oracle, card: Erode, text: "Destroy target creature or planeswalker. Its controller may search their library for a basic land card, put it onto the battlefield tapped, then shuffle.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If all its targets, for every instance of the word “target,” are now illegal, the spell or ability doesn’t resolve. It’s removed from the stack and, if it’s a spell, put into its owner’s graveyard.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Erode @erode"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Phelia, Exuberant Shepherd @phelia", "Plains @ppl"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@erode", targets: ["@phelia"]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stp", targets: ["@phelia"]}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      p1: {life: 22, exile: ["Phelia, Exuberant Shepherd"]}
      stack: [{kind: spell, card: "@erode", controller: p0}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Erode]}
    p1:
      life: 22
      graveyard: [Swords to Plowshares]
      battlefield: [{card: Plains, tapped: true}]
      library_count: 10
notes: >
  p1 exiles their own Phelia in response (gaining 2). Erode's only target is gone, so Erode does not resolve: the search
  is never offered (no yes_no step), the library keeps 10 cards. The script would fail if the engine raised the may-search
  prompt. Bug caught: the land-search half executed on a fizzled Erode.
