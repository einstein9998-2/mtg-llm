id: boros-a-static-prison-exiled-token-ceases-to-exist
title: "A token exiled by Static Prison ceases to exist and does not return when the Prison leaves"
area: card
cards: [Static Prison, Prismatic Ending, Plains, Goblin Token]
tags: [static-prison, token, ceases-to-exist, exile-until-leaves, boros]
derived_from: cr
source:
  - {kind: oracle, card: Static Prison, text: "exile target nonland permanent an opponent controls until this enchantment leaves the battlefield", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: cr, ref: "704.5d", text: "If a token is in a zone other than the battlefield, it ceases to exist.", verified: true}
  - {kind: cr, ref: "111.7", text: "A token that’s in a zone other than the battlefield ceases to exist.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    energy: 0
    hand: ["Static Prison @sp"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    hand: ["Prismatic Ending @pe"]
    battlefield: [{token: Goblin Token, as: gob}, "Plains @pw"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@sp", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@gob", expect_options: {include: ["@gob"], exclude: ["@pw"], count: 1}}
  - p0: {t: pass}
  - p1: {t: pass}
  - label: token-exiled
    check:
      stack: []
      p0: {energy: 2}
      p1:
        battlefield: [{card: Plains}]
        exile: []
  - advance: {to: main1, of: p1}
  - p1: {t: cast, card: "@pe", x: 0, targets: ["@sp"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    turn: 4
    phase: main1
    stack: []
    p0:
      energy: 2
      exile: [Static Prison]
    p1:
      battlefield: [{card: Plains, tapped: true}]
      exile: []
      graveyard: [Prismatic Ending]
notes: >
  A token is a legal target (it is a nonland permanent). When it is exiled it ceases to exist as a state-based action, so
  the exile zone is empty straight away (checked at the label) and nothing can return when the Prison later leaves. A
  wrong engine keeps the token in exile and brings it back, or refuses to target tokens.
