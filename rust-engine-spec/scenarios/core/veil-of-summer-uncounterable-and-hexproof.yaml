id: veil-of-summer-in-response-makes-force-of-will-do-nothing
title: Veil of Summer cast in response to Force of Will draws a card and makes the targeted Lightning Bolt uncounterable, so Force of Will resolves without effect
area: core
cards: [Veil of Summer, Force of Will, Brainstorm, Lightning Bolt, Ponder, Mountain, Forest]
tags: [rule-modification, cant-be-countered, counterspell, not-a-replacement-effect, veil-of-summer]
derived_from: cr
source:
  - {kind: oracle, card: Veil of Summer, text: "Draw a card if an opponent has cast a blue or black spell this turn. Spells you control can't be countered this turn.", verified: true}
  - {kind: oracle, card: Force of Will, text: "Counter target spell.", verified: true}
  - {kind: cr, ref: "611.2c", text: "A continuous effect generated by the resolution of a spell or ability that doesn't modify the characteristics or change the controller of any objects modifies the rules of the game, so it can affect objects that weren't affected when that continuous effect began.", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can't happen, the \"can't\" effect takes precedence.", verified: true}
  - {kind: cr, ref: "614.17", text: "Some effects state that something can't happen. These effects aren't replacement effects, but follow similar rules.", verified: true}
  - {kind: cr, ref: "608.2b", text: "If the spell or ability specifies targets, it checks whether the targets are still legal.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt", "Veil of Summer @veil"]
    battlefield: ["Mountain @m", "Forest @f"]
    library: ["Ponder @pd"]
    library_pad: 10
  p1:
    hand: ["Force of Will @fow", "Brainstorm @bs"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: {tap: ["@m"]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@bolt"]}
  - p1: {t: pass}
  - p0: {t: cast, card: "@veil", pay: {tap: ["@f"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack:
        - {kind: spell, card: "@bolt", controller: p0}
        - {kind: spell, card: "@fow", controller: p1}
      p0: {hand: [Ponder], graveyard: [Veil of Summer]}
      p1: {life: 19}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: spell, card: "@bolt", controller: p0}]
      p1: {graveyard: [Force of Will]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Lightning Bolt, Veil of Summer], hand: [Ponder]}
    p1: {life: 16, graveyard: [Force of Will], exile: [Brainstorm]}
notes: >
  "Can't be countered" is a rules modification from a resolved spell (611.2c): it applies to Bolt even though Bolt was
  already on the stack. It is not a replacement effect, and it does not make Bolt an illegal target: Force of Will
  resolves (its target is still a legal "spell") and its instruction to counter simply can't happen (101.2). Veil's
  draw happens because p1 cast a blue spell (Force of Will) this turn. A wrong engine fizzles Force of Will as having
  no legal target (harmless here but wrong), counters Bolt anyway, or makes Veil's effect apply only to spells cast
  later. Life tally: p1 20 - 1 (Force of Will) - 3 (Bolt) = 16.
---
id: veil-of-summer-hexproof-set-locked-at-resolution
title: A creature that enters after Veil of Summer resolves does not have hexproof from blue, but the Veil's caster still does
area: core
cards: [Veil of Summer, "Dragon's Rage Channeler", Hydroblast, Prismari Charm, Forest, Mountain, Volcanic Island, Island]
tags: [layer-6, hexproof-from, locked-in-set, veil-of-summer, player-effect]
derived_from: cr
source:
  - {kind: oracle, card: Veil of Summer, text: "You and permanents you control gain hexproof from blue and from black until end of turn.", verified: true}
  - {kind: cr, ref: "611.2c", text: "If a continuous effect generated by the resolution of a spell or ability modifies the characteristics or changes the controller of any objects, the set of objects it affects is determined when that continuous effect begins. After that point, the set won't change.", verified: true}
  - {kind: cr, ref: "613.10", text: "Some continuous effects affect players rather than objects. For example, an effect might give a player protection from red.", verified: true}
  - {kind: oracle, card: Hydroblast, text: "Destroy target permanent if it's red.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Veil of Summer @veil", "Dragon's Rage Channeler @drc"]
    battlefield: ["Forest @f", "Mountain @m"]
    library_pad: 10
  p1:
    hand: ["Hydroblast @hb", "Prismari Charm @ch"]
    battlefield: ["Volcanic Island @v", "Island @pi"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@veil", pay: {tap: ["@f"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: cast, card: "@drc", pay: {tap: ["@m"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@ch", modes: [2], targets: [{player: p0}]}}
  - p1: {t: cast, card: "@hb", modes: [2], targets: ["@drc"], pay: {tap: ["@pi"]}}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Veil of Summer, "Dragon's Rage Channeler"]}
    p1: {graveyard: [Hydroblast], hand: [Prismari Charm]}
notes: >
  The permanent part of Veil modifies characteristics, so it affects only permanents p0 controlled when it resolved
  (611.2c); DRC entered later and has no hexproof, so Hydroblast may target and destroy it (DRC is red). The player
  part keeps p0 hexproof from blue for the turn. DRC was not on the battlefield when Veil was cast, so no surveil
  trigger. A wrong engine re-evaluates "permanents you control" continuously like a static ability.
---
id: veil-of-summer-hexproof-ends-at-cleanup
title: Hexproof from blue granted by Veil of Summer in the end step is gone on the opponent's next turn
area: core
cards: [Veil of Summer, "Dragon's Rage Channeler", Hydroblast, Forest, Island]
tags: [layer-6, hexproof-from, duration, cleanup, veil-of-summer, surveil]
derived_from: cr
source:
  - {kind: oracle, card: Veil of Summer, text: "You and permanents you control gain hexproof from blue and from black until end of turn.", verified: true}
  - {kind: cr, ref: "514.2", text: "Second, the following actions happen simultaneously: all damage marked on permanents (including phased-out permanents) is removed and all \"until end of turn\" and \"this turn\" effects end.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as \"until end of turn\").", verified: true}
setup:
  turn: 4
  active: p0
  phase: end
  priority: p0
  p0:
    hand: ["Veil of Summer @veil"]
    battlefield: ["Dragon's Rage Channeler @drc", "Forest @f"]
    library: ["Island @top"]
    library_pad: 10
  p1:
    hand: ["Hydroblast @hb"]
    battlefield: ["Island @pi"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@veil", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: [], on_top_order: ["@top"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@hb", modes: [2], targets: ["@drc"]}}
  - p1: {t: pass}
  - advance: {to: main1, of: p1}
  - p1: {t: cast, card: "@hb", modes: [2], targets: ["@drc"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    turn: 5
    active: p1
    stack: []
    pending: {actor: p1, kind: priority}
    p0: {graveyard: [Veil of Summer, "Dragon's Rage Channeler"]}
    p1: {graveyard: [Hydroblast]}
notes: >
  The ability grant lasts "until end of turn" and ends in p0's cleanup step (514.2). On p1's turn, Hydroblast may target
  DRC again. The setup starts in p0's end step so that the advance does not pass through a combat in which p0 controls
  a creature. Cast order: Veil, DRC surveil trigger on top resolves first (keep the Island), then Veil. After Veil
  resolves p0 passes, p1 is probed, p1 passes, the end step ends. A wrong engine lets the grant persist (blocking the
  Hydroblast) or ends it before cleanup (letting the in-turn Hydroblast through).
