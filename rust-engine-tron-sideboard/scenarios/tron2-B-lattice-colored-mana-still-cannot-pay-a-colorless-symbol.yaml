      mana_pool: {U: 1}
      battlefield: [{card: Mycosynth Lattice}, {card: Island, tapped: true}, {card: Island, tapped: false}]
notes: >
  Lattice changes how mana may be spent as though it were any COLOR; colorless is not a color (105.4 / 105.2c), so {U}
  can pay the generic {1} but nothing but colorless mana can pay {C}. With two Islands, or with one Island tapped and {U}
  floating, Warping Wail cannot be cast. The next scenarios show colorless mana paying colored symbols. A wrong engine
  treats "any color" as "any mana including a {C} requirement".
