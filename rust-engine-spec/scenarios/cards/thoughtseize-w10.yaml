id: thoughtseize-may-target-its-caster-while-duress-may-not
title: Thoughtseize can target its own caster (target player); Duress (target opponent) cannot
area: card
cards: [Thoughtseize, Duress, Brainstorm, Swamp]
tags: [thoughtseize, duress, targeting, mask-validity, self-target]
derived_from: oracle
source:
  - {kind: oracle, card: Thoughtseize, text: "Target player reveals their hand. You choose a nonland card from it. That player discards that card. You lose 2 life.", verified: true}
  - {kind: oracle, card: Duress, text: "Target opponent reveals their hand. You choose a noncreature, nonland card from it. That player discards that card.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Thoughtseize @ts", "Duress @du", "Brainstorm @bs"]
    battlefield: ["Swamp @s1"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@du", targets: [{player: p0}]}}
  - p0: {t: cast, card: "@ts", targets: [{player: p0}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_cards, purpose: discard, answer: ["@bs"], expect_options: {include: ["@du", "@bs"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 18
      hand: [Duress]
      graveyard: [Thoughtseize, Brainstorm]
notes: >
  "Target player" includes the caster. When it resolves the hand holds Duress and Brainstorm (Thoughtseize is on the
  stack), both nonland. Duress says "target opponent", so it cannot target p0. Engines that hard-code "opponent" for
  every discard spell fail one of the two halves.
