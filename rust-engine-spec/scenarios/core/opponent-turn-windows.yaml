id: instant-in-opponents-upkeep
title: The nonactive player may cast an instant in the active player's upkeep, before the draw
area: core
cards: [Lightning Bolt, Mountain]
tags: [timing, instant-speed, upkeep, nonactive-player, priority]
derived_from: cr
source:
  - {kind: cr, ref: "117.1a", text: "A player may cast an instant spell any time they have priority.", verified: true}
  - {kind: cr, ref: "503.1", text: "The upkeep step has no turn-based actions. Once it begins, the active player gets priority.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
setup:
  turn: 3
  active: p0
  phase: upkeep
  p0:
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m"]
    library_pad: 10
script:
  - p0: {t: pass}
  - check: {phase: upkeep, active: p0, priority: p1, legal: {p1: {include: [{t: cast, card: "@bolt"}, {t: pass}]}}}
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - check: {priority: p1, stack: [{kind: spell, card: "@bolt", controller: p1}]}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    turn: 3
    phase: upkeep
    active: p0
    priority: p0
    pending: {actor: p0, kind: priority}
    stack: []
    p0: {life: 17, hand_count: 0, library_count: 10}
    p1: {graveyard: [Lightning Bolt], battlefield: [{card: Mountain, tapped: true}]}
notes: >
  p0 passes with an empty stack in its own upkeep; p1 receives priority and casts Bolt at p0. After resolution the
  active player p0 receives priority (117.3b) and the step is still the upkeep: p0's draw has not happened (hand 0,
  library untouched). A wrong engine would not offer p1 any priority in the opponent's upkeep, or would run the draw
  step before the response resolved.
---
id: instant-in-opponents-draw-step
title: The nonactive player may cast an instant in the active player's draw step, after the draw has happened
area: core
cards: [Lightning Bolt, Mountain, Island]
tags: [timing, instant-speed, draw-step, nonactive-player, priority]
derived_from: cr
source:
  - {kind: cr, ref: "117.1a", text: "A player may cast an instant spell any time they have priority.", verified: true}
  - {kind: cr, ref: "504.1", text: "First, the active player draws a card. This turn-based action doesn't use the stack.", verified: true}
  - {kind: cr, ref: "504.2", text: "Second, the active player gets priority.", verified: true}
setup:
  turn: 3
  active: p0
  phase: upkeep
  p0:
    library: ["Island @top"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m"]
    library_pad: 10
script:
  - advance: {to: draw, of: p0}
  - check: {phase: draw, priority: p0, p0: {hand: [Island]}}
  - p0: {t: pass}
  - check: {phase: draw, priority: p1, legal: {p1: {include: [{t: cast, card: "@bolt"}]}}}
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    turn: 3
    phase: draw
    active: p0
    priority: p0
    stack: []
    p0: {life: 17, hand: [Island]}
    p1: {graveyard: [Lightning Bolt]}
notes: >
  The draw is a turn-based action done before anyone has priority in the draw step, so the card is in p0's hand when p1
  gets its window. Bolt resolves in the draw step and p0 (active) receives priority again. A wrong engine could skip
  the nonactive player's priority in the draw step.
