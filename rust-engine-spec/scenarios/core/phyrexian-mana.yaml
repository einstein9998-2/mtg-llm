id: dismember-phyrexian-both-symbols-paid-with-life
title: "Dismember paid with 4 life and one generic mana kills Dragon's Rage Channeler"
area: core
cards: [Dismember, Island, Dragon's Rage Channeler]
tags: [phyrexian-mana, life-payment, dismember, casting, mana-payment]
derived_from: cr
source:
  - {kind: oracle, card: Dismember, text: "({B/P} can be paid with either {B} or 2 life.)", verified: true}
  - {kind: oracle, card: Dismember, text: "Target creature gets -5/-5 until end of turn.", verified: true}
  - {kind: cr, ref: "107.4f", text: "A Phyrexian mana symbol represents a cost that can be paid either with one mana of its color or by paying 2 life.", verified: true}
  - {kind: cr, ref: "601.2b", text: "If a cost that will be paid as the spell is being cast includes Phyrexian mana symbols, the player announces whether they intend to pay 2 life or a corresponding colored mana cost for each of those symbols.", verified: true}
  - {kind: cr, ref: "119.4", text: "If a cost or effect allows a player to pay an amount of life greater than 0, the player may do so only if their life total is greater than or equal to the amount of the payment.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Dismember @dis"]
    battlefield: ["Island @i1"]
    library_pad: 10
  p1:
    battlefield: ["Dragon's Rage Channeler @drc"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@dis", phyrexian: [life, life], targets: ["@drc"], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@dis", controller: p0, targets: ["@drc"]}
      p0: {life: 16, battlefield: [{card: Island, tapped: true}], hand: []}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 16, graveyard: [Dismember], battlefield: [{card: Island, tapped: true}]}
    p1: {life: 20, battlefield: [], graveyard: [Dragon's Rage Channeler]}
notes: >
  Dismember costs {1}{B/P}{B/P}. Paying both Phyrexian symbols with life costs 2 + 2 = 4 life (20 -> 16) and the
  remaining {1} is paid with the Island. The life is paid at cast time. At resolution the Channeler (printed 1/1) gets
  -5/-5 and dies as a state-based action. A wrong engine could charge life per symbol incorrectly, forget the generic
  {1}, or require black mana.
