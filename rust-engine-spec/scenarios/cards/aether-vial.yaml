setup:
  turn: 2
  active: p1
  phase: end
  p0:
    battlefield: [{card: Aether Vial, as: vial, counters: {charge: 1}}]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: yes_no, purpose: add_charge_counter, answer: false}
expect:
