id: boros-a-static-prison-blinked-by-flickerwisp-old-card-returns-new-prison-exiles-again
title: "Flickerwisp exiling Static Prison returns the first prisoner at once; the Prison returns at the end step as a new object, exiles again and gives two more energy"
area: card
cards: [Static Prison, "Phelia, Exuberant Shepherd", Flickerwisp, Plains]
tags: [static-prison, flickerwisp, blink, new-object, exile-until-leaves, delayed-trigger, energy, boros]
derived_from: cr
source:
  - {kind: oracle, card: Static Prison, text: "exile target nonland permanent an opponent controls until this enchantment leaves the battlefield", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: oracle, card: Flickerwisp, text: "When this creature enters, exile another target permanent. Return that card to the battlefield under its owner's control at the beginning of the next end step.", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
  - {kind: cr, ref: "610.3c", text: "An object returned to the battlefield this way returns under its owner’s control unless otherwise specified.", verified: true}
  - {kind: cr, ref: "603.6a", text: "Enters-the-battlefield abilities trigger when a permanent enters the battlefield.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    energy: 0
    hand: ["Static Prison @sp"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    hand: ["Flickerwisp @wisp"]
    battlefield: ["Phelia, Exuberant Shepherd @ph", "Plains @pw1", "Plains @pw2", "Plains @pw3"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@sp", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: "@ph"}
  - p0: {t: pass}
  - p1: {t: pass}
  - label: phelia-exiled
    check:
      p0: {energy: 2}
      p1: {exile: ["Phelia, Exuberant Shepherd"]}
  - advance: {to: main1, of: p1}
  - p1: {t: cast, card: "@wisp", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_target, slot: 0, answer: "@sp"}
  - check:
      stack: [{kind: triggered, source: "@wisp", controller: p1, targets: ["@sp"]}]
  - resolve_top: true
  - label: prison-blinked
    check:
      stack: []
      p0:
        energy: 2
        battlefield: [{card: Plains, tapped: true}]
        exile: [Static Prison]
      p1:
        battlefield:
          - {card: "Phelia, Exuberant Shepherd", controller: p1}
          - {card: Flickerwisp, controller: p1}
          - {card: Plains, tapped: true}
          - {card: Plains, tapped: true}
          - {card: Plains, tapped: true}
        exile: []
  - advance: {to: end, of: p1}
  - label: delayed-return-trigger
    check:
      turn: 4
      phase: end
      stack: [{kind: triggered, source: "@wisp", controller: p1}]
  - resolve_top: true
  - p0: {decision: choose_target, slot: 0, answer: "@wisp", expect_options: {include: ["@wisp", "@ph"], exclude: ["@pl"]}}
  - label: new-prison-trigger
    check:
      stack: [{kind: triggered, source: "@sp", controller: p0, targets: ["@wisp"]}]
      p0:
        energy: 2
        battlefield: [{card: Static Prison, types: [Enchantment]}, {card: Plains, tapped: true}]
        exile: []
  - resolve_top: true
expect:
  - at: after_script
    turn: 4
    phase: end
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      energy: 4
      battlefield: [{card: Static Prison, controller: p0}, {card: Plains, tapped: true}]
      exile: []
    p1:
      battlefield:
        - {card: "Phelia, Exuberant Shepherd", controller: p1}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
      exile: [Flickerwisp]
notes: >
  The Prison is a new object each time it enters (400.7). Flickerwisp's trigger exiles it, which ends the first "until"
  duration: Phelia returns at once under p1's control (610.3c). At the next end step Flickerwisp's delayed trigger returns
  the Prison under p0's control; that is a fresh enters event, so its enters trigger fires again, p0 picks a new target
  (Flickerwisp, which is still on the battlefield) and gets {E}{E} again (2 + 2 = 4). The second prisoner is Flickerwisp
  itself, exiled for as long as this new Prison stays. A wrong engine ties the new Prison to the old exile (so Phelia
  would be exiled again or never returned), skips the second enters trigger, or returns Phelia only at the end step.
  `resolve_top` after the Flickerwisp return trigger is followed by p0's target choice for the new Prison trigger.
