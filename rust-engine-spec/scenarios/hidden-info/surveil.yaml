id: hi-drc-surveil-trigger-owner-knows-top
title: Dragon's Rage Channeler's surveil trigger gives its controller, and only its controller, knowledge of the top card
area: hidden-info
cards: [Dragon's Rage Channeler, Lightning Bolt, Murktide Regent, Volcanic Island, Aluren, Tropical Island]
tags: [hidden-info, surveil, cast-trigger, library-knowledge, stack-order]
derived_from: oracle
source:
  - {kind: oracle, card: Dragon's Rage Channeler, text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
  - {kind: oracle, card: Lightning Bolt, text: "Lightning Bolt deals 3 damage to any target.", verified: true}
  - {kind: cr, ref: "601.2i", text: "Any abilities that trigger when a spell is cast or put onto the stack trigger at this time.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Dragon's Rage Channeler @drc", "Volcanic Island @v"]
    library: ["Murktide Regent @x"]
    library_pad: 10
  p1:
    hand: [Aluren]
    battlefield: ["Tropical Island"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@bolt", controller: p0}
        - {kind: triggered, source: "@drc", controller: p0}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: [], on_top_order: ["@x"]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    p1: {life: 17}
    p0: {graveyard: [Lightning Bolt], library_top: [Murktide Regent], library_count: 11}
  - at: after_script
    observer: p0
    obs:
      me: {library_known_top: [Murktide Regent]}
  - at: after_script
    observer: p1
    obs:
      opp: {library_count: 11}
      option_labels_exclude_names: [Murktide Regent]
      events_text_exclude: [Murktide Regent]
notes: >
  The trigger goes on the stack above Bolt and resolves first; p0 keeps Murktide on top. Then the active player p0 gets
  priority with Bolt still on the stack, both pass, Bolt resolves (p1 20 -> 17). p0's graveyard holds only an instant, so
  Delirium is off and irrelevant here.
