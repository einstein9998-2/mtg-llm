id: spider-woman-opponent-monk-token-enters-tapped
title: A Monk token created by the opponent's Cori-Steel Cutter enters tapped under Spider-Woman, and the Cutter can still be attached to it
area: core
cards: ["Spider-Woman, Stunning Savior", Cori-Steel Cutter, Lightning Bolt, Mountain, Monk Token]
tags: [replacement-effect, enters-tapped, tokens, flurry, equipment, spider-woman]
derived_from: cr
source:
  - {kind: oracle, card: "Spider-Woman, Stunning Savior", text: "Venom Blast — Artifacts and creatures your opponents control enter tapped.", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Flurry — Whenever you cast your second spell each turn, create a 1/1 white Monk creature token with prowess. You may attach this Equipment to it.", verified: true}
  - {kind: oracle, card: Cori-Steel Cutter, text: "Equipped creature gets +1/+1 and has trample and haste.", verified: true}
  - {kind: cr, ref: "614.1d", text: "Continuous effects that read \"[This permanent] enters . . .\" or \"[Objects] enter [the battlefield] . . .\" are replacement effects.", verified: true}
setup:
  turn: 5
  active: p1
  phase: main1
  p0:
    battlefield: ["Spider-Woman, Stunning Savior @sw"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @b1", "Lightning Bolt @b2"]
    battlefield: ["Cori-Steel Cutter @cut", "Mountain @m1", "Mountain @m2"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@b1", targets: [{player: p0}], pay: {tap: ["@m1"]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      p0: {life: 17}
  - p1: {t: cast, card: "@b2", targets: [{player: p0}], pay: {tap: ["@m2"]}}
  - check:
      stack:
        - {kind: spell, card: "@b2", controller: p1}
        - {kind: triggered, source: "@cut", controller: p1}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: yes_no, purpose: attach_equipment, answer: true}
  - bind: {as: monk, find: {name: Monk Token, controller: p1}}
  - check:
      stack: [{kind: spell, card: "@b2", controller: p1}]
      p1:
        battlefield_contains:
          - {token: Monk Token, alias: monk, tapped: true, pt: [2, 2], keywords: [prowess, trample, haste]}
          - {card: Cori-Steel Cutter, attached_to: "@monk"}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0: {life: 14}
    p1:
      battlefield_contains:
        - {token: Monk Token, alias: monk, tapped: true}
        - {card: Cori-Steel Cutter, attached_to: "@monk"}
      graveyard: [Lightning Bolt, Lightning Bolt]
notes: >
  Tokens enter the battlefield like any permanent, so Spider-Woman's enters-tapped replacement applies to p1's Monk.
  Attaching the Cutter to a tapped creature is fine. The Monk was created after Bolt #2 was cast, so prowess does not
  trigger for it. Life tally: p0 20 - 3 - 3 = 14. A wrong engine exempts tokens from enters replacements.
