  Spider-Woman's static ability is a replacement effect on entering: the Priest enters already tapped. Containment
  Priest's own replacement does not apply to itself here (it was cast). A wrong engine taps the creature with a trigger
  afterwards (leaving a window) or applies Spider-Woman to its controller's own permanents.
