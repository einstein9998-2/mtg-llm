id: stifle-solitude-evoke-sacrifice-trigger-solitude-stays
title: Stifling Solitude's evoke sacrifice trigger keeps Solitude on the battlefield after its exile trigger resolves
area: card
cards: [Stifle, Solitude, Swords to Plowshares, Murktide Regent, Island]
tags: [stifle, solitude, evoke, sacrifice-trigger, order-triggers, counter-ability]
derived_from: cr
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: oracle, card: Solitude, text: "Evoke—Exile a white card from your hand.", verified: true}
  - {kind: cr, ref: "702.74a", text: "“When this permanent enters, if its evoke cost was paid, its controller sacrifices it.”", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Solitude @sol", "Swords to Plowshares @stp", "Stifle @stifle"]
    battlefield: ["Island @i1"]
    library_pad: 10
  p1:
    battlefield: ["Murktide Regent @murk"]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: cast, card: "@sol", alt_cost: {evoke: {exile_white_card: "@stp"}}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: order_triggers
      answer:
        - {source: "@sol", text_contains: "exile"}
        - {source: "@sol", text_contains: "sacrifice"}
  - p0: {decision: choose_target, slot: 0, answer: "@murk"}
  - p1: {t: pass}
  - p0: {t: cast, card: "@stifle", targets: [{trigger_of: "@sol", nth: 0}]}
  - check:
      stack:
        - {kind: triggered, source: "@sol", text_contains: "exile"}
        - {kind: triggered, source: "@sol", text_contains: "sacrifice"}
        - {kind: spell, card: "@stifle", controller: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@sol", text_contains: "exile"}]
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      battlefield_contains: [{card: Solitude}]
      graveyard: [Stifle]
      exile: [Swords to Plowshares]
    p1: {life: 23, exile: [Murktide Regent]}
notes: >
  p0 puts the exile trigger on the stack first and the sacrifice trigger on top, then Stifles the sacrifice trigger
  (nth 0 = the topmost ability from Solitude). Solitude stays permanently: the evoke sacrifice is a one-time enters
  trigger. The exile trigger then resolves (Murktide's controller p1 gains 3). Bugs caught: evoke implemented as a
  non-counterable state-based sacrifice, Solitude sacrificed anyway.
---
id: stifle-lavinia-trigger-free-spell-resolves
title: Stifle on Lavinia's trigger lets the opponent's free Force of Will resolve
area: card
cards: [Stifle, "Lavinia, Azorius Renegade", Force of Will, Brainstorm, Lightning Bolt, Mountain, Island]
tags: [stifle, lavinia, alternative-cost, counter-ability, force-of-will]
derived_from: oracle
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: oracle, card: "Lavinia, Azorius Renegade", text: "Whenever an opponent casts a spell, if no mana was spent to cast it, counter that spell.", verified: true}
  - {kind: oracle, card: Force of Will, text: "You may pay 1 life and exile a blue card from your hand rather than pay this spell's mana cost.", verified: true}
setup:
  turn: 5
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Lavinia, Azorius Renegade @lav", "Mountain @mtn"]
    library_pad: 10
  p1:
    hand: ["Force of Will @fow", "Brainstorm @bs", "Stifle @stifle"]
    battlefield: ["Island @j1", "Island @j2", "Island @j3", "Island @j4", "Island @j5"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@bolt"]}
  - p1: {t: cast, card: "@stifle", targets: [{trigger_of: "@lav", nth: 0}], pay: auto}
  - check:
      stack:
        - {kind: spell, card: "@bolt"}
        - {kind: spell, card: "@fow"}
        - {kind: triggered, source: "@lav"}
        - {kind: spell, card: "@stifle", controller: p1}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Lightning Bolt]}
    p1:
      life: 19
      graveyard: [Force of Will, Stifle]
      exile: [Brainstorm]
notes: >
  Lavinia's trigger goes on the stack above Force of Will before p1 gets priority back. p1 has five lands, so Stifle
  (mana value 1) and Force of Will (5) are castable under Lavinia's first ability; Stifle is paid with mana, so it does
  not trigger Lavinia. Stifle resolves first and counters the trigger (p0 then gets priority as the active player),
  then Force of Will resolves and counters Bolt. p1 loses only the 1 life for Force of Will. Bugs caught: Lavinia's
  counter implemented as a static "can't cast" (not counterable), Stifle triggering Lavinia.
---
