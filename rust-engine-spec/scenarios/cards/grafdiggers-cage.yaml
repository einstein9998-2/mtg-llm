id: grafdiggers-cage-stops-flashback-not-casting-from-hand
title: Grafdigger's Cage stops casting a spell from the graveyard with flashback but not the same card from hand
area: card
cards: ["Grafdigger's Cage", Faithless Looting, Mountain]
tags: [grafdiggers-cage, flashback, casting-restriction, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: "Grafdigger's Cage", text: "Players can't cast spells from graveyards or libraries.", verified: true}
  - {kind: oracle, card: Faithless Looting, text: "Flashback {2}{R} (You may cast this card from your graveyard for its flashback cost. Then exile it.)", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    battlefield: ["Grafdigger's Cage @cage"]
    library_pad: 10
  p1:
    hand: ["Faithless Looting @fl_hand"]
    battlefield: ["Mountain @m1", "Mountain @m2", "Mountain @m3"]
    graveyard: ["Faithless Looting @fl_gy"]
    library_pad: 10
script:
  - expect_illegal: {p1: {t: cast, card: "@fl_gy", alt_cost: {flashback: true}}}
  - expect_illegal: {p1: {t: cast, card: "@fl_gy"}}
  - p1: {t: cast, card: "@fl_hand", pay: {tap: ["@m1"]}}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@fl_hand", controller: p1}]
    pending: {actor: p1, kind: priority}
    p1:
      hand: []
      graveyard: [Faithless Looting]
      battlefield: [{card: Mountain, tapped: true}, {card: Mountain, tapped: false}, {card: Mountain, tapped: false}]
notes: >
  p1 has the {2}{R} for flashback, so only the Cage forbids it. The copy in hand is cast normally for {R}. A wrong
  engine applies the Cage to every zone or ignores it for alternative-cost casting from the graveyard.
