id: mu-bdt-first-strike-lethal-ends-game-before-lifelink-blocker
title: At 1 life D&T blocks Sand Scout with lifelink Cloak and Dagger, but unblocked Ocelot Pride's first-strike damage ends the game before the regular damage step
area: matchup
cards: [Ocelot Pride, Sand Scout, "Cloak and Dagger, Entwined"]
tags: [matchup, boros-vs-dt, combat, first-strike, lifelink, game-end, state-based-actions, race]
derived_from: cr
source:
  - {kind: oracle, card: Ocelot Pride, text: "First strike, lifelink", verified: true}
  - {kind: cr, ref: "510.4", text: "If at least one attacking or blocking creature has first strike (see rule 702.7) or double strike (see rule 702.4) as the combat damage step begins, the only creatures that assign combat damage in that step are those with first strike or double strike.", verified: true}
  - {kind: cr, ref: "704.5a", text: "If a player has 0 or less life, that player loses the game.", verified: true}
setup:
  turn: 7
  active: p0
  phase: begin_combat
  p0:
    life: 5
    battlefield: ["Ocelot Pride @oc", "Sand Scout @scout"]
    library_pad: 10
  p1:
    life: 1
    battlefield: ["Cloak and Dagger, Entwined @cd"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: declare_attackers
      attacks:
        - {creature: "@oc", target: {player: p1}}
        - {creature: "@scout", target: {player: p1}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: [{blocker: "@cd", attacker: "@scout"}]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    game: {over: true, winner: p0}
    p1: {life: 0}
notes: >
  Ocelot is unblocked and has first strike: it deals 1 to p1 in the first combat damage step (510.4), p1 goes to 0 and
  loses as a state-based action (704.5a) before anyone gets priority in that step. Cloak's lifelink damage would only
  come in the second step, which never happens. A wrong engine deals all combat damage at once (p1 would gain 2 from
  Cloak at the same time and survive at 2).
