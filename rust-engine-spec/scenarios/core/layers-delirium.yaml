  p0:
    battlefield: ["Dragon's Rage Channeler @drc"]
    graveyard: ["Lightning Bolt", "Ponder", "Island"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: []}
expect:
