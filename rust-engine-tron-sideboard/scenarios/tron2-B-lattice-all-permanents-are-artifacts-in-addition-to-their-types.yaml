area: card
cards: [Mycosynth Lattice, Island, Mountain, Containment Priest, Goblin Token, "Karn, the Great Creator", Null Rod]
tags: [mycosynth-lattice, type-changing, artifacts, lands, tokens, planeswalker, layer-4, tron-sideboard]
