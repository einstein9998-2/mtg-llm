id: consign-to-memory-replicate-copy-retargeted-counters-two-triggers
title: Replicate copies Consign to Memory; the copy is retargeted so one Consign counters both City of Traitors' and Hedge Maze's triggers
area: card
cards: [Consign to Memory, City of Traitors, Hedge Maze, Lightning Bolt, Island]
tags: [consign-to-memory, replicate, copy, retarget, counter-ability, city-of-traitors, hedge-maze, order-triggers]
derived_from: cr
source:
  - {kind: cr, ref: "702.56a", text: "\"Replicate [cost]\" means \"As an additional cost to cast this spell, you may pay [cost] any number of times\" and \"When you cast this spell, if a replicate cost was paid for it, copy it for each time its replicate cost was paid. If the spell has any targets, you may choose new targets for any of the copies.\"", verified: true}
  - {kind: oracle, card: Consign to Memory, text: "Replicate {1}", verified: true}
  - {kind: oracle, card: City of Traitors, text: "When you play another land, sacrifice this land.", verified: true}
  - {kind: cr, ref: "603.3b", text: "each player, in APNAP order, puts each triggered ability they control with a trigger condition that isn't another ability triggering on the stack in any order they choose.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Hedge Maze @hm"]
    battlefield: ["City of Traitors @city"]
    library: ["Lightning Bolt @bolt"]
    library_pad: 10
  p1:
    hand: ["Consign to Memory @cm"]
    battlefield: ["Island @pi1", "Island @pi2"]
    library_pad: 10
script:
  - p0: {t: play_land, card: "@hm"}
  - p0: {decision: order_triggers, answer: ["@city", "@hm"]}
  - check:
      stack: [{kind: triggered, source: "@city", controller: p0}, {kind: triggered, source: "@hm", controller: p0}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: cast, card: "@cm", replicate: 1, targets: [{trigger_of: "@hm", nth: 0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: yes_no, purpose: change_targets, answer: true}
  - p1: {decision: choose_target, slot: 0, answer: {trigger_of: "@city", nth: 0}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: City of Traitors}, {card: Hedge Maze, tapped: true}]
      graveyard: []
      library_count: 11
    p1:
      graveyard: [Consign to Memory]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}]
notes: >
  Playing Hedge Maze triggers both City of Traitors (another land played) and Hedge Maze's surveil; both are p0's, so p0
  orders them (the first listed goes on the stack first: City at the bottom, Hedge Maze on top). Consign with replicate
  {1} costs {U}{1} (both Islands). The replicate trigger goes above Consign; p1 passes, p0 passes, it resolves and creates
  a copy, whose new target p1 may choose (CR 707.10c; per the SCHEMA addenda: yes_no "change targets?" answered true, then
  choose_target answering with City's trigger). Stack then (bottom to top): City
  trigger, Hedge Maze trigger, Consign (targeting Hedge Maze trigger), copy (targeting City trigger). The copy resolves first,
  then the original: both triggers are countered, so City stays and no surveil happens. The copy ceases to exist
  (it is not a card), so only the original Consign card is in p1's graveyard. Priority flow after the copy is created: the
  active player p0 gets priority (117.3b), so the script has p0 pass, p1 pass for each resolution.
