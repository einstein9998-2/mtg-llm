# Implementer-written regression scenarios for mechanics the spec thread has no scenarios for yet
# (faces, Adventure, modal lands, Ajani). They are smoke tests of our own reading of the Oracle text,
# not independent spec; the spec thread's scenarios stay the authority.
id: own-brazen-borrower-adventure-then-cast-from-exile
title: Petty Theft bounces a creature, the Borrower waits in exile and can then be cast from there
area: card
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Brazen Borrower @bor"]
    battlefield: [Island, Island, Island, Island, Island]
    library_pad: 10
  p1:
    battlefield: ["Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bor", alt_cost: {adventure: true}, targets: ["@ph"], pay: auto}
  - resolve_top: true
  - check:
      p0: {exile: ["Brazen Borrower"], hand: [], graveyard: []}
      p1: {hand: ["Phelia, Exuberant Shepherd"], battlefield: []}
  - p0: {t: cast, card: "@bor", pay: auto}
  - resolve_top: true
expect:
  - at: after_script
    p0:
      exile: []
      battlefield_contains: [{card: Brazen Borrower, pt: [3, 1], keywords: [flying, flash]}]
