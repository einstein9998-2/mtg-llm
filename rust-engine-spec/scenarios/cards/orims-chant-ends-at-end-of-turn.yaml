id: orims-chant-effect-ends-with-the-turn
title: "Orim's Chant on the opponent lasts through the end step of this turn and is gone in the opponent's own next turn, where the opponent can cast Lightning Bolt"
area: card
cards: ["Orim's Chant", Plains, Lightning Bolt, Mountain]
tags: [orims-chant, casting-restriction, duration, this-turn, turn-structure, cleanup]
derived_from: oracle
source:
  - {kind: oracle, card: "Orim's Chant", text: "Target player can't cast spells this turn.", verified: true, note: "Orim's Chant Oracle text supplied by the engine owner from Scryfall data; the card is not yet in reference/oracle.json (an entry is provided in NOTES.md)"}
  - {kind: cr, ref: "514.2", text: "all “until end of turn” and “this turn” effects end.", verified: true}
  - {kind: cr, ref: "611.2a", text: "A continuous effect generated by the resolution of a spell or ability lasts as long as stated by the spell or ability creating it (such as “until end of turn”).", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Orim's Chant @chant"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@chant", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - advance: {to: end, of: p0}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}}
  - check:
      turn: 3
      phase: end
      pending: {actor: p1, kind: priority}
      legal: {p1: {include: [{t: pass}], exclude: [{t: cast, card: "@bolt"}]}}
  - p1: {t: pass}
  - label: next-turn-upkeep
    check:
      turn: 4
      phase: upkeep
      active: p1
      pending: {actor: p1, kind: priority}
      legal: {p1: {include: [{t: cast, card: "@bolt", targets: [{player: p0}]}]}}
  - p1: {t: cast, card: "@bolt", targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    turn: 4
    phase: upkeep
    active: p1
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      life: 17
      graveyard: ["Orim's Chant"]
    p1:
      graveyard: [Lightning Bolt]
      hand: []
      battlefield: [{card: Mountain, tapped: true}]
notes: >
  p1 is still barred in p0's end step (the last point of the turn where a player gets priority), but the "this turn"
  effect ends in the cleanup step (514.2, 611.2a), so in p1's upkeep Bolt is offered and resolves (20 - 3 = 17). p1's
  Mountain untapped normally (it was never tapped). A wrong engine keeps the restriction until the Chant caster's next
  turn, until the opponent's next spell, or for the opponent's whole next turn.
