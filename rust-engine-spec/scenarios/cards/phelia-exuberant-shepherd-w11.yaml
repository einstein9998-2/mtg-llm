id: phelia-exiles-opponent-creature-returns-to-owner-no-counter
title: Phelia's attack trigger exiles an opponent's creature; it returns at the beginning of the end step under its owner's control and Phelia gets no counter
area: card
cards: ["Phelia, Exuberant Shepherd", "Dragon's Rage Channeler", Plains, Island]
tags: [phelia, attack-trigger, flicker, delayed-trigger, end-step, owner-control, new-object, targeting]
derived_from: cr
source:
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "Whenever Phelia attacks, exile up to one other target nonland permanent. At the beginning of the next end step, return that card to the battlefield under its owner's control. If it entered under your control, put a +1/+1 counter on Phelia.", verified: true}
  - {kind: cr, ref: "508.3a", text: "An ability that reads “Whenever [a creature] attacks, . . .” triggers if that creature is declared as an attacker.", verified: true}
  - {kind: cr, ref: "603.7a", text: "Delayed triggered abilities are created during the resolution of spells or abilities", verified: true}
  - {kind: cr, ref: "302.6", text: "A creature can't attack unless it has been under its controller's control continuously since their most recent turn began.", verified: true}
setup:
  turn: 5
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phelia, Exuberant Shepherd @phelia", "Plains @pl"]
    library_pad: 10
  p1:
    battlefield: ["Dragon's Rage Channeler @drc", "Island @isl"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@phelia", target: {player: p1}}]}
  - p0:
      decision: choose_target
      slot: 0
      answer: "@drc"
      expect_options: {include: ["@drc"], exclude: ["@phelia", "@isl", "@pl"]}
  - check:
      stack: [{kind: triggered, source: "@phelia", controller: p0, targets: ["@drc"]}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - label: drc-exiled
    check:
      stack: []
      phase: declare_attackers
      pending: {actor: p0, kind: priority}
      p1: {battlefield: [{card: Island}], exile: ["Dragon's Rage Channeler"]}
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, source: "@phelia", controller: p0, text_contains: "return"}]
      pending: {actor: p0, kind: priority}
      p1: {life: 18, exile: ["Dragon's Rage Channeler"]}
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield:
        - {card: "Phelia, Exuberant Shepherd", tapped: true, pt: [2, 2]}
        - {card: Plains}
    p1:
      life: 18
      exile: []
      battlefield:
        - {card: "Dragon's Rage Channeler", controller: p1, tapped: false, sick: true}
        - {card: Island}
notes: >
  The attack trigger targets "up to one other target nonland permanent": Phelia herself (other) and both lands (nonland)
  are not offered. DRC is exiled before blockers, so p1 has no creature and no declare_blockers decision is raised; Phelia
  deals 2 (p1 20 -> 18). At the beginning of p0's end step the delayed trigger created on resolution (603.7a) goes on the
  stack. It returns DRC under its OWNER's control (p1), so "if it entered under your control" is false and Phelia stays a
  2/2. DRC is a new object that came under p1's control this turn (sick). Bugs caught: returning under Phelia's
  controller, a counter on Phelia anyway, returning immediately or at the next turn's end step, Phelia targeting herself
  or a land.
---
id: phelia-flickers-own-attacking-murktide-new-object-no-counters
title: Phelia exiles p0's own attacking Murktide Regent; it is removed from combat, returns at end step as a new 3/3 without its counters, and Phelia gets a +1/+1 counter
area: card
cards: ["Phelia, Exuberant Shepherd", Murktide Regent, Island]
tags: [phelia, flicker, new-object, removed-from-combat, counters-lost, delayed-trigger, own-permanent]
derived_from: cr
source:
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "At the beginning of the next end step, return that card to the battlefield under its owner's control. If it entered under your control, put a +1/+1 counter on Phelia.", verified: true}
  - {kind: oracle, card: Murktide Regent, text: "This creature enters with a +1/+1 counter on it for each instant and sorcery card exiled with it.", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
  - {kind: cr, ref: "506.4", text: "A permanent is removed from combat if it leaves the battlefield", verified: true}
setup:
  turn: 5
  active: p0
  phase: begin_combat
  p0:
    battlefield:
      - "Phelia, Exuberant Shepherd @phelia"
      - {card: Murktide Regent, as: murk, counters: {"+1/+1": 3}}
    library_pad: 10
  p1:
    battlefield: ["Island @isl"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: declare_attackers
      attacks:
        - {creature: "@phelia", target: {player: p1}}
        - {creature: "@murk", target: {player: p1}}
  - p0: {decision: choose_target, slot: 0, answer: "@murk", expect_options: {include: ["@murk"], exclude: ["@phelia", "@isl"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      p0: {exile: [Murktide Regent], battlefield: [{card: "Phelia, Exuberant Shepherd", tapped: true}]}
  - advance: {to: end, of: p0}
  - check:
      p1: {life: 18}
      stack: [{kind: triggered, source: "@phelia", text_contains: "return"}]
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: []
      battlefield:
        - {card: "Phelia, Exuberant Shepherd", tapped: true, counters: {"+1/+1": 1}, pt: [3, 3]}
        - {card: Murktide Regent, tapped: false, pt: [3, 3], sick: true}
    p1: {life: 18}
notes: >
  Murktide (6/6 with three counters) attacked, then left the battlefield, so it is removed from combat (506.4) and deals no
  damage: p1 takes only Phelia's 2 (20 -> 18), not 8. It returns under its owner's control, which is p0, so Phelia gets a
  +1/+1 counter (3/3). The returned Murktide is a new object (400.7): its old counters are gone and it was not cast, so no
  cards were exiled with it and it enters with zero counters (3/3, printed 3/3), untapped and summoning sick. Bugs caught:
  keeping counters across the flicker, re-using the old delve count, the exiled attacker still dealing damage, no counter on
  Phelia when the card returns under her controller's control.
