id: boros-a-static-prison-triggers-only-at-its-controllers-first-main-phase
title: "Static Prison's sacrifice trigger does not happen in its controller's second main phase or in the opponent's main phases"
area: card
cards: [Static Prison, Plains]
tags: [static-prison, energy, beginning-of-main-phase, first-main-phase, boros]
derived_from: oracle
source:
  - {kind: oracle, card: Static Prison, text: "At the beginning of your first main phase, sacrifice this enchantment unless you pay {E}.", verified: true, note: "entry in oracle-additions-A.json"}
  - {kind: cr, ref: "505.1b", text: "In card text, phrases such as “first main phase,” “second main phase,” and so on count the number of main phases that have occurred only in the current turn unless that text specifies otherwise.", verified: true}
  - {kind: cr, ref: "603.2b", text: "When a phase or step begins, all abilities that trigger “at the beginning of” that phase or step trigger.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    energy: 2
    battlefield: ["Static Prison @sp", "Plains @pl"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - advance: {to: main2, of: p0}
  - label: p0-second-main
    check:
      turn: 3
      phase: main2
      stack: []
      p0: {energy: 2, battlefield: [{card: Static Prison}, {card: Plains}]}
  - advance: {to: main1, of: p1}
  - label: p1-first-main
    check:
      turn: 4
      phase: main1
      stack: []
      p0: {energy: 2, battlefield: [{card: Static Prison}, {card: Plains}]}
  - advance: {to: main2, of: p1}
expect:
  - at: after_script
    turn: 4
    phase: main2
    active: p1
    stack: []
    p0:
      energy: 2
      battlefield: [{card: Static Prison, types: [Enchantment]}, {card: Plains}]
      graveyard: []
notes: >
  The scenario begins in p0's first main phase of turn 3, which has already begun, so no trigger (the trigger event is
  the beginning of the phase). The Prison then sits through p0's second main phase and both of p1's main phases without
  triggering: "your first main phase" is p0's own first main phase only. A wrong engine triggers at every main phase, at
  both players' main phases, or at the second main phase. (advance would fail if a trigger or decision were raised on
  the way, which is the assertion.)
