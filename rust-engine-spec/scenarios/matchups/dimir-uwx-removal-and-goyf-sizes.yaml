id: mu-erode-nethergoyf-dimir-chooses-to-fetch-basic
title: UWx's Erode destroys Nethergoyf; Dimir, its controller, may search for a basic land, which enters tapped
area: matchup
cards: [Erode, Nethergoyf, Underground Sea, Swamp, Tundra]
tags: [matchup, dimir-vs-uwx, erode, opponent-decision, may-search, enters-tapped, shuffle]
derived_from: oracle
source:
  - {kind: oracle, card: Erode, text: "Destroy target creature or planeswalker. Its controller may search their library for a basic land card, put it onto the battlefield tapped, then shuffle.", verified: true}
  - {kind: cr, ref: "701.23b", text: "If a player is searching a hidden zone for cards with a stated quality, such as a card with a certain card type or color, that player isn’t required to find some or all of those cards even if they’re present in that zone.", verified: true}
setup:
  turn: 6
  active: p1
  phase: main1
  p0:
    battlefield: ["Nethergoyf @ng", "Underground Sea @us1"]
    library: ["Swamp @sw"]
    library_pad: 10
  p1:
    hand: ["Erode @er"]
    battlefield: ["Tundra @t1"]
    library_pad: 10
random: any
script:
  - p1: {t: cast, card: "@er", targets: ["@ng"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {decision: yes_no, purpose: may_search, answer: true}
  - p0: {decision: search, found: "@sw", expect_options: {include: ["@sw"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p0:
      graveyard: [Nethergoyf]
