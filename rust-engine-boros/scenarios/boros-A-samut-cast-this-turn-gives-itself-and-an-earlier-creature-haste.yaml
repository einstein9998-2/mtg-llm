id: boros-a-samut-cast-this-turn-gives-itself-and-an-earlier-creature-haste
title: "Samut cast this turn can attack immediately and also gives haste to a creature that entered earlier this turn"
area: card
cards: ["Samut, Hazoret's Champion", Dragon's Rage Channeler, Mountain]
tags: [samut, haste, continuous-effect, static-ability, summoning-sickness, boros]
derived_from: cr
source:
  - {kind: oracle, card: "Samut, Hazoret's Champion", text: "Creatures you control have haste.", verified: false, note: "Not in Savecraft; text from two card sites per SCENARIO-BRIEF.md; entry in oracle-additions-A.json"}
  - {kind: cr, ref: "702.10b", text: "If a creature has haste, it can attack even if it hasn’t been controlled by its controller continuously since their most recent turn began.", verified: true}
  - {kind: cr, ref: "611.3a", text: "A continuous effect generated by a static ability isn’t “locked in”; it applies at any given moment to whatever its text indicates.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Samut, Hazoret's Champion @samut"]
    battlefield: ["Mountain @m1", "Mountain @m2", {card: "Dragon's Rage Channeler", as: drc, sick: true}]
    library_pad: 10
  p1:
    life: 20
    library_pad: 10
script:
  - check:
      p0: {battlefield_contains: [{card: "Dragon's Rage Channeler", keywords_exclude: [haste]}]}
  - p0: {t: cast, card: "@samut", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - label: samut-on-battlefield
    check:
      stack: []
      p0:
        battlefield_contains:
          - {card: "Samut, Hazoret's Champion", types: [Creature], supertypes: [Legendary], pt: [2, 2], keywords: [haste]}
          - {card: "Dragon's Rage Channeler", keywords: [haste]}
  - advance: {to: begin_combat, of: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0:
      decision: declare_attackers
      expect_options: {include: ["@samut", "@drc"]}
      attacks:
        - {creature: "@samut", target: {player: p1}}
        - {creature: "@drc", target: {player: p1}}
  - advance: {to: main2, of: p0}
expect:
  - at: after_script
    turn: 3
    phase: main2
    p1:
      life: 17
    p0:
      battlefield:
        - {card: "Samut, Hazoret's Champion", tapped: true}
        - {card: "Dragon's Rage Channeler", tapped: true}
        - {card: Mountain, tapped: true}
        - {card: Mountain, tapped: true}
notes: >
  Samut's static ability is not locked in (611.3a): it gives haste to every creature p0 controls at any moment, including
  Samut himself (a creature spell cast this turn) and Dragon's Rage Channeler, which entered earlier this turn and could
  not attack before Samut arrived. Both attack (2 + 1 = 3 damage to p1, 20 to 17; the Channeler has no delirium). A wrong
  engine grants haste only to creatures that enter afterwards, or not to Samut himself. Samut is not in the Savecraft
  database: card text and the Legendary supertype are from the brief and unverified.
