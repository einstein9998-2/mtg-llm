id: massacre-creature-entering-afterwards-is-unaffected
title: A creature cast after Massacre resolved is not shrunk by it (the affected set is fixed on resolution)
area: card
cards: [Massacre, Orcish Bowmasters, Swamp, Plains, "Phelia, Exuberant Shepherd"]
tags: [massacre, continuous-effect, affected-set, until-end-of-turn, layers]
derived_from: cr
source:
  - {kind: cr, ref: "611.2c", text: "If a continuous effect generated by the resolution of a spell or ability modifies the characteristics or changes the controller of any objects, the set of objects it affects is determined when that continuous effect begins. After that point, the set won't change.", verified: true}
  - {kind: oracle, card: Massacre, text: "All creatures get -2/-2 until end of turn.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Massacre @ma", "Orcish Bowmasters @ob"]
    battlefield: ["Swamp @s1", "Swamp @s2"]
    library_pad: 10
  p1:
    battlefield: ["Plains @pl", "Phelia, Exuberant Shepherd @ph"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ma", alt_cost: {free: true}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check: {p1: {graveyard: ["Phelia, Exuberant Shepherd"]}, stack: []}
  - p0: {t: cast, card: "@ob", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: choose_target, slot: 0, answer: {player: p1}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Massacre]
      battlefield_contains:
        - {card: Orcish Bowmasters, pt: [1, 1]}
        - {card: Swamp, tapped: true}
    p1:
      life: 19
      graveyard: ["Phelia, Exuberant Shepherd"]
notes: >
  Massacre's -2/-2 applies to the creatures on the battlefield as it resolved (611.2c). Bowmasters, cast afterwards the
  same turn, is a normal 1/1 and survives; its enter trigger deals 1 to p1. An engine that implements "all creatures get
  -2/-2 until end of turn" as a static, re-evaluated effect kills it (and the Orc Army token).
