setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Mountain @m"]
    library_pad: 10
  p1:
    hand: ["Phelia, Exuberant Shepherd @ph"]
    battlefield: ["Spider-Woman, Stunning Savior @sw", "Plains @pl1", "Plains @pl2"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@bolt", targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: cast, card: "@ph", pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
