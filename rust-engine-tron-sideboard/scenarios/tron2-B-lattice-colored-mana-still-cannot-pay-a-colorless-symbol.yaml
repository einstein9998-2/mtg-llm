  - {kind: cr, ref: "107.4c", text: "The colorless mana symbol {C} is used to represent one colorless mana, and also to represent a cost that can be paid only with one colorless mana.", verified: true}
  - {kind: cr, ref: "609.4b", text: "If an effect allows a player to spend mana “as though it were mana of any [type or color],” this affects only how the player may", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Warping Wail @wail"]
    battlefield: ["Mycosynth Lattice @lat", "Island @i1", "Island @i2"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@wail", modes: [3]}}
  - p0: {t: activate, source: "@i1", ability: 0, choose_color: U}
  - check:
      p0: {mana_pool: {U: 1}}
  - expect_illegal: {p0: {t: cast, card: "@wail", modes: [3]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
