id: boseiju-channel-destroys-nonbasic-land-opponent-searches
title: Channel destroys an opponent's nonbasic land; that player may then fetch a basic-land-type land onto the battlefield
area: card
cards: ["Boseiju, Who Endures", Forest, Island, Volcanic Island, Mountain]
tags: [boseiju, channel, activated-from-hand, destroy, search, not-a-land-drop, opponent-decision]
derived_from: oracle
source:
  - {kind: oracle, card: "Boseiju, Who Endures", text: "Channel — {1}{G}, Discard this card: Destroy target artifact, enchantment, or nonbasic land an opponent controls.", verified: true}
  - {kind: oracle, card: "Boseiju, Who Endures", text: "That player may search their library for a land card with a basic land type, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: cr, ref: "305.4", text: "Effects may also allow players to \"put\" lands onto the battlefield. This isn't the same as \"playing a land\"", verified: true}
  - {kind: cr, ref: "113.6j", text: "An object's activated ability that has a cost that can't be paid while the object is on the battlefield functions from any zone in which its cost can be paid.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Boseiju, Who Endures @bos"]
    battlefield: ["Forest @fo", "Island @isl"]
    library_pad: 10
  p1:
    battlefield: ["Volcanic Island @volc"]
    library: ["Forest @p1f", "Island @p1i", "Mountain @p1m"]
    library_pad: 10
script:
  - p0: {t: activate_from_hand, source: "@bos", ability: 1, targets: ["@volc"], pay: auto}
  - check:
      stack: [{kind: activated, source: "@bos", controller: p0}]
      p0:
        hand: []
        graveyard: ["Boseiju, Who Endures"]
        lands_played: 0
        battlefield: [{card: Forest, tapped: true}, {card: Island, tapped: true}]
      p1: {battlefield: [{card: Volcanic Island}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: yes_no, purpose: may_search, answer: true}
  - p1: {decision: search, found: "@p1f", expect_options: {include: ["@p1f", "@p1i", "@p1m"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      lands_played: 0
      graveyard: ["Boseiju, Who Endures"]
    p1:
      battlefield: [{card: Forest, tapped: false}]
      graveyard: [Volcanic Island]
      library_count: 12
notes: >
  Channel is activated from the hand with the discard as part of the cost, so Boseiju is already in the graveyard while
  the ability is on the stack and the ability resolves independently of it. It is ability index 1 (index 0 is the {T}
  mana ability). The destroyed permanent's controller (p1) makes the "may search" choice, modelled as yes_no then search
  (see report schema-requests). The basic Forest is put onto the battlefield untapped (no enters-tapped text), p1's
  library shrinks by one (13 -> 12), and nothing counts as a land drop for either player. p0's {1}{G} was paid with
  both of p0's lands.
---
