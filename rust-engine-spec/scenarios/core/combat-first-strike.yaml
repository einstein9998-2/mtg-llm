area: core
cards: [Amped Raptor, Street Wraith]
tags: [combat, first-strike, combat-damage-steps, damage-persists, sba]
derived_from: cr
source:
  - {kind: oracle, card: Amped Raptor, text: "First strike", verified: true}
  - {kind: cr, ref: "510.4", text: "The only creatures that assign combat damage in that step are the remaining attackers and blockers that had neither first strike nor double strike as the first combat damage step began", verified: true}
  - {kind: cr, ref: "702.7c", text: "Removing first strike from a creature after it has already dealt combat damage in the first combat damage step won’t allow it to also assign combat damage in the second combat damage step (unless the creature has double strike).", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Amped Raptor @raptor"]
    library_pad: 10
  p1:
    battlefield: ["Street Wraith @sw"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@raptor", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: [{blocker: "@sw", attacker: "@raptor"}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      phase: first_strike_damage
      p0: {battlefield: [{card: Amped Raptor, damage: 0}]}
      p1: {battlefield: [{card: Street Wraith, damage: 2}]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    phase: combat_damage
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 20, battlefield: [], graveyard: [Amped Raptor]}
    p1: {life: 20, battlefield: [{card: Street Wraith, damage: 2}]}
notes: >
  First-strike step: the Raptor assigns 2 to the 3/4 Wraith, which survives with 2 damage marked. Regular step: only
  creatures without first strike assign damage (510.4), so the Wraith deals 3 to the Raptor (toughness 1, destroyed)
  and the Raptor does not deal damage a second time: the Wraith ends with 2 damage, not 4. Damage stays marked until
  cleanup. Wrong engines: the Raptor striking twice (Wraith dies), or the Wraith not striking back.
---
