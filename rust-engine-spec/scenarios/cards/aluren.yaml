id: aluren-free-cast-during-opponents-end-step
title: Aluren lets its controller cast a creature for free during the opponent's end step
area: card
cards: [Aluren, Faerie Macabre]
tags: [aluren, alternative-cost, flash, free-cast, opponents-turn]
derived_from: oracle
source:
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: cr, ref: "117.3b", text: "The active player receives priority after a spell or ability (other than a mana ability) resolves.", verified: true}
setup:
  turn: 5
  active: p1
  phase: end
  priority: p1
  p0:
    hand: ["Faerie Macabre @fm"]
    battlefield: ["Aluren @alu"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: cast, card: "@fm", alt_cost: {free: aluren}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    phase: end
    active: p1
    pending: {actor: p1, kind: priority}
    p0:
      hand: []
      battlefield: [{card: Aluren}, {card: Faerie Macabre}]
notes: >
  After the creature resolves the active player (p1) receives priority. Bug caught: Aluren's flash honoured only on the
  controller's own turn, or a mana payment demanded.
