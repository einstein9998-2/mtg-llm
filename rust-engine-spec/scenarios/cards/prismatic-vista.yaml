id: prismatic-vista-fail-to-find-allowed
title: Prismatic Vista's controller may fail to find even when basic lands are present
area: card
cards: [Prismatic Vista, Forest]
tags: [prismatic-vista, fetchland, search, fail-to-find]
derived_from: cr
source:
  - {kind: oracle, card: Prismatic Vista, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for a basic land card, put it onto the battlefield, then shuffle.", verified: true}
  - {kind: cr, ref: "701.23b", text: "If a player is searching a hidden zone for cards with a stated quality, such as a card with a certain card type or color, that player isn't required to find some or all of those cards even if they're present in that zone.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Prismatic Vista @pv"]
    library: ["Forest @fo"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@pv", ability: 0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: search, found: null}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 19
      battlefield: []
      graveyard: [Prismatic Vista]
      library_count: 11
notes: >
  Searching for a card "with a stated quality" does not force finding (701.23b). Life is still paid and the land
  sacrificed. Whether the library is shuffled after a failed search is not asserted here (shuffling still happens by the
  Oracle text, but only counts are checked).
