id: uncounterable-daze-veil-cannot-pay-resolves
title: A tapped-out player whose spell is uncounterable (Veil of Summer) is not asked to pay Daze's {1} and the spell still resolves
area: card
cards: [Veil of Summer, Grafdigger's Cage, Daze, Forest, Mountain, Island]
tags: [daze, counter-unless-pay, cant-be-countered, veil-of-summer, cannot-pay, no-decision]
derived_from: cr
source:
  - {kind: oracle, card: Daze, text: "Counter target spell unless its controller pays {1}.", verified: true}
  - {kind: oracle, card: Veil of Summer, text: "Spells you control can't be countered this turn.", verified: true}
  - {kind: cr, ref: "118.12a", text: "Some spells, activated abilities, and triggered abilities read, “[Do something] unless [a player does something else].” This means the same thing as “[A player may do something else]. If [that player] doesn’t, [do something].”", verified: true}
  - {kind: cr, ref: "101.2", text: "When a rule or effect allows or directs something to happen, and another effect states that it can't happen, the \"can't\" effect takes precedence.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Veil of Summer @veil", "Grafdigger's Cage @cage"]
    battlefield: ["Forest @f", "Mountain @m1"]
    library_pad: 10
  p1:
    hand: ["Daze @daze"]
    battlefield: ["Island @j1", "Island @j2"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@veil", pay: {tap: ["@f"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: cast, card: "@cage", pay: {tap: ["@m1"]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@daze", targets: ["@cage"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: spell, card: "@cage", controller: p0}]
      pending: {actor: p0, kind: priority}
      p1: {graveyard: [Daze]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: []
      graveyard: [Veil of Summer]
      battlefield:
        - {card: Forest, tapped: true}
        - {card: Mountain, tapped: true}
        - {card: "Grafdigger's Cage", controller: p0}
    p1:
      graveyard: [Daze]
      battlefield: [{card: Island, tapped: true}, {card: Island, tapped: true}]
notes: >
  p0 has no untapped land, so there is no choice to make when Daze resolves (the rules give the player no real option,
  the convention already used by daze-may-return-volcanic-island-because-it-is-an-island: no prompt when payment is
  impossible). The unpaid "unless" would normally counter the spell, but the spell can't be countered (101.2), so Cage
  resolves. This is the separate "cannot pay" path of the engine; a wrong engine counters on the implicit decline.
