id: hydroblast-destroy-mode-spares-nonred-permanent
title: "Hydroblast's destroy mode may target a blue Murktide Regent but does nothing to it, because it is not red"
area: core
cards: [Hydroblast, Island, Murktide Regent]
tags: [hydroblast, modes, destroy, color, conditional-destroy, legal-target-regardless-of-color]
derived_from: oracle
source:
  - {kind: oracle, card: Hydroblast, text: "• Destroy target permanent if it's red.", verified: true}
  - {kind: cr, ref: "202.2", text: "An object is the color or colors of the mana symbols in its mana cost, regardless of the color of its frame.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Hydroblast @hb"]
    battlefield: ["Island @i"]
    library_pad: 10
  p1:
    battlefield: [{card: Murktide Regent, as: murk, counters: {}}]
    library_pad: 10
script:
  - p0: {t: cast, card: "@hb", modes: [2], targets: ["@murk"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Hydroblast]}
    p1: {battlefield: [{card: Murktide Regent, counters: {}}], graveyard: []}
notes: >
  The destroy mode targets any permanent; "if it's red" is checked on resolution. Murktide Regent ({5}{U}{U}) is blue,
  not red, so it survives while Hydroblast resolves and goes to the graveyard. A wrong engine refuses the target or
  destroys it anyway.
