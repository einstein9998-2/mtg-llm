id: layers-kaito-set-three-four-then-massacre-modifies
title: On its controller's turn Kaito is set to 3/4 (layer 7b) and Massacre's -2/-2 applies after it (layer 7c), leaving a 1/2
area: core
cards: ["Kaito, Bane of Nightmares", Massacre, Swamp, Containment Priest, Island]
tags: [layers, layer-7b, layer-7c, kaito, massacre, sublayer-order]
derived_from: cr
source:
  - {kind: oracle, card: "Kaito, Bane of Nightmares", text: "During your turn, as long as Kaito has one or more loyalty counters on him, he's a 3/4 Ninja creature and has hexproof.", verified: true}
  - {kind: oracle, card: Massacre, text: "All creatures get -2/-2 until end of turn.", verified: true}
  - {kind: cr, ref: "613.4b", text: "Layer 7b: Effects that set power and/or toughness to a specific number or value are applied.", verified: true}
  - {kind: cr, ref: "613.4c", text: "Layer 7c: Effects and counters that modify power and/or toughness (but don’t set power and/or toughness to a specific number or value) are applied.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main1
  p0:
    hand: ["Massacre @mass"]
    battlefield:
      - {card: "Kaito, Bane of Nightmares", as: kaito, counters: {loyalty: 3}}
      - "Swamp @s1"
      - "Swamp @s2"
      - "Swamp @s3"
      - "Swamp @s4"
    library_pad: 10
  p1:
    battlefield: ["Containment Priest @cp", "Island @j1"]
    library_pad: 10
script:
  - check:
      p0: {battlefield_contains: [{card: "Kaito, Bane of Nightmares", pt: [3, 4], subtypes: [Ninja]}]}
  - p0: {t: cast, card: "@mass", pay: {tap: ["@s1", "@s2", "@s3", "@s4"]}}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Massacre]
      battlefield_contains: [{card: "Kaito, Bane of Nightmares", pt: [1, 2], counters: {loyalty: 3}}]
    p1:
      graveyard: [Containment Priest]
      battlefield: [{card: Island}]
notes: >
  Kaito's own static ability sets his P/T to 3/4 (layer 7b). Massacre's -2/-2 is a modification (layer 7c), applied
  after every 7b effect regardless of timestamp, so Kaito is 1/2 and survives; Containment Priest (2/2) dies. p1
  controls no Plains, so Massacre is paid with four Swamps. Massacre has no target, so Kaito's hexproof is irrelevant.
  A wrong engine applies the set-to-3/4 after the -2/-2 (Kaito stays 3/4) or lets the newer timestamp win across
  sublayers.
---
id: layers-kaito-emblem-and-massacre-both-modify-after-the-set
title: "Kaito with his +1 emblem (\"Ninjas you control get +1/+1\") and Massacre's -2/-2: 3/4 set, then +1/+1 and -2/-2, ends 2/3"
area: core
cards: ["Kaito, Bane of Nightmares", Massacre, Swamp]
tags: [layers, layer-7b, layer-7c, kaito, emblem, massacre, timestamps]
derived_from: cr
