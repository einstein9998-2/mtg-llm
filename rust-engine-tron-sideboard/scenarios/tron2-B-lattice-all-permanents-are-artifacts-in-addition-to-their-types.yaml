script:
  - check:
      p0:
        battlefield:
          - {card: Mycosynth Lattice, types: [Artifact]}
          - {card: Island, types: [Land, Artifact]}
          - {card: Containment Priest, types: [Creature, Artifact]}
          - {token: Goblin Token, types: [Creature, Artifact]}
          - {card: "Karn, the Great Creator", types: [Planeswalker, Artifact]}
      p1:
