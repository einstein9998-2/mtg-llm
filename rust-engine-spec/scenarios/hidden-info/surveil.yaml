id: hi-surveil-to-graveyard-card-becomes-public
title: A card surveilled into the graveyard becomes public and leaves no known top card
area: hidden-info
cards: [Thundering Falls, Murktide Regent, Lightning Bolt, Aluren, Tropical Island]
tags: [hidden-info, surveil, graveyard, public-zone, enters-tapped]
derived_from: cr
source:
  - {kind: oracle, card: Thundering Falls, text: "This land enters tapped.", verified: true}
  - {kind: oracle, card: Thundering Falls, text: "When this land enters, surveil 1.", verified: true}
  - {kind: cr, ref: "701.25a", text: "To \"surveil N\" means to look at the top N cards of your library, then put any number of them into your graveyard and the rest on top of your library in any order.", verified: true}
  - {kind: cr, ref: "404.2", text: "Each graveyard is kept in a single face-up pile. A player can examine the cards in any graveyard at any time", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Thundering Falls @tf", "Lightning Bolt @bolt"]
    library: ["Murktide Regent @x"]
    library_pad: 10
  p1:
    hand: [Aluren]
    battlefield: ["Tropical Island"]
    library_pad: 10
script:
  - p0: {t: play_land, card: "@tf"}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: surveil, to_graveyard: ["@x"], on_top_order: []}
expect:
  - at: after_script
    stack: []
    p0:
      battlefield: [{card: Thundering Falls, tapped: true}]
      graveyard: [Murktide Regent]
      library_count: 10
  - at: after_script
    observer: p0
    obs:
      me: {library_known_top: []}
  - at: after_script
    observer: p1
    obs:
      opp: {hand_count: 1, library_count: 10}
      option_labels_exclude_names: [Lightning Bolt]
notes: >
  Murktide Regent goes to p0's graveyard, a public zone, so p1 sees it there (asserted on the true state, which is public).
  p0 knows nothing about the new top card. Lightning Bolt, still in p0's hand, must stay invisible to p1.
