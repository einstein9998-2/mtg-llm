id: lions-eye-diamond-mana-pays-faithless-looting-flashback
title: Lion's Eye Diamond's red mana pays Faithless Looting's flashback from the graveyard after the hand is discarded
area: card
cards: ["Lion's Eye Diamond", Faithless Looting, Griselbrand, Archon of Cruelty, Island]
tags: [lions-eye-diamond, faithless-looting, flashback, mana-pool, graveyard-cast]
derived_from: oracle
source:
  - {kind: oracle, card: "Lion's Eye Diamond", text: "Discard your hand, Sacrifice this artifact: Add three mana of any one color.", verified: true}
  - {kind: oracle, card: Faithless Looting, text: "Flashback {2}{R}", verified: true}
  - {kind: cr, ref: "702.34a", text: "“Flashback [cost]” means “You may cast this card from your graveyard if the resulting spell is an instant or sorcery spell by paying [cost] rather than paying its mana cost”", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Griselbrand @g", "Archon of Cruelty @a"]
    battlefield: ["Lion's Eye Diamond @led"]
    graveyard: ["Faithless Looting @fl"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@led", ability: 0, choose_color: R}
  - check:
      p0: {mana_pool: {R: 3}, hand: [], graveyard: [Faithless Looting, "Lion's Eye Diamond", Griselbrand, Archon of Cruelty]}
  - p0: {t: cast, card: "@fl", alt_cost: {flashback: true}, pay: auto}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@fl", controller: p0}]
    pending: {actor: p0, kind: priority}
    p0:
      mana_pool: {}
      hand: []
      graveyard: ["Lion's Eye Diamond", Griselbrand, Archon of Cruelty]
      battlefield: []
notes: >
  The classic Reanimator line: LED for {R}{R}{R} puts both creatures in the graveyard and leaves Looting (already in the
  graveyard) castable by flashback for {2}{R}, paid entirely from the pool. The script stops with Looting on the stack;
  its resolution (draw two, discard two) is covered in faithless-looting.yaml. Wrong engines: refuse a graveyard cast,
  or require lands for the flashback cost.
