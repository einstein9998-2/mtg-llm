id: tron-c-urzas-tower-with-planar-nexus-alone-adds-three
title: Planar Nexus is both an Urza's Mine and an Urza's Power-Plant, so Urza's Tower with only a Nexus adds {C}{C}{C}
area: card
cards: ["Urza's Tower", Planar Nexus]
tags: [planar-nexus, urzas-tower, tron, land-types, conjunction-satisfied-by-one-permanent]
