id: collective-brutality-escalate-needs-a-card-to-discard
title: With no other card in hand, Collective Brutality cannot be cast with two modes but can be cast with one
area: card
cards: [Collective Brutality, Island, Swamp]
tags: [collective-brutality, escalate, additional-cost, negative, mask-validity]
derived_from: cr
source:
  - {kind: cr, ref: "702.120a", text: "“Escalate [cost]” means “For each mode you choose beyond the first as you cast this spell, you pay an additional [cost].”", verified: true}
  - {kind: cr, ref: "118.3", text: "A player can’t pay a cost without having the necessary resources to pay it fully.", verified: true}
  - {kind: cr, ref: "601.2a", text: "To propose the casting of a spell, a player first moves that card (or that copy of a card) from where it is to the stack.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 20
    hand: ["Collective Brutality @cb"]
    battlefield: ["Swamp @s1", "Swamp @s2"]
    library_pad: 10
  p1:
    life: 20
    hand: [Island]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@cb", modes: [1, 3], targets: [{player: p1}, {player: p1}]}}
  - p0: {t: cast, card: "@cb", modes: [3], targets: [{player: p1}], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 22, graveyard: [Collective Brutality], hand: []}
    p1: {life: 18, hand: [Island]}
notes: >
  Collective Brutality itself is on the stack while costs are paid (601.2a), so the hand is empty and the escalate
  discard cannot be paid: the two-mode cast is illegal. The one-mode cast has no escalate cost and drains 2.
