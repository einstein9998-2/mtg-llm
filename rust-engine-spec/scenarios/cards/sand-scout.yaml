id: sand-scout-no-trigger-when-lands-are-equal
title: Sand Scout's enters ability does not trigger when the opponent controls the same number of lands
area: card
cards: [Sand Scout, Plains, Lazotep Quarry, Plateau]
tags: [sand-scout, intervening-if, negative]
derived_from: cr
source:
  - {kind: oracle, card: Sand Scout, text: "When this creature enters, if an opponent controls more lands than you, search your library for a Desert card, put it onto the battlefield tapped, then shuffle.", verified: true}
  - {kind: cr, ref: "603.4", text: "The ability triggers only if it is; otherwise it does nothing.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Sand Scout @ss"]
    battlefield: ["Plains @a", "Plains @b"]
    library: ["Lazotep Quarry @lq"]
    library_pad: 10
  p1:
    battlefield: ["Plateau @x1", "Plateau @x2"]
    library_pad: 10
random: []
script:
  - p0: {t: cast, card: "@ss", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      library_count: 11
      library_top: [Lazotep Quarry]
      battlefield:
        - {card: Sand Scout, sick: true}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: true}
notes: >
  Two lands each: "more lands than you" is false, so nothing triggers, nothing is searched and nothing is shuffled
  (random: [] makes a stray shuffle fail the scenario).
