id: erode-targets-creature-not-land-or-player
title: Erode cannot target a land or a player, only a creature (or planeswalker)
area: card
cards: [Erode, Plains, "Dragon's Rage Channeler", Plateau]
tags: [erode, targeting, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: Erode, text: "Destroy target creature or planeswalker.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Erode @er"]
    battlefield: ["Plains @pl"]
    library_pad: 10
  p1:
    battlefield: ["Dragon's Rage Channeler @drc", "Plateau @plat"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@er", targets: ["@plat"]}}
  - expect_illegal: {p0: {t: cast, card: "@er", targets: [{player: p1}]}}
  - p0: {t: cast, card: "@er", targets: ["@drc"], pay: auto}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@er", controller: p0, targets: ["@drc"]}]
    pending: {actor: p0, kind: priority}
notes: >
  Lands and players are not legal targets; the creature is (positive control). Planeswalkers are not in this scenario
  because no planeswalker loyalty values are available.
