id: first-strike-on-both-sides-deals-damage-simultaneously-in-the-first-step
title: Amped Raptor (first strike) blocked by White Orchid Phantom (first strike) - both deal damage in the first-strike step and both die
area: core
cards: [Amped Raptor, White Orchid Phantom]
tags: [combat, first-strike, combat-damage-steps, simultaneous-damage, sba]
derived_from: cr
source:
  - {kind: oracle, card: Amped Raptor, text: "First strike", verified: true}
  - {kind: oracle, card: White Orchid Phantom, text: "Flying, first strike", verified: true}
  - {kind: cr, ref: "510.4", text: "After that step, instead of proceeding to the end of combat step, the phase gets a second combat damage step.", verified: true}
  - {kind: cr, ref: "510.2", text: "Second, all combat damage that’s been assigned is dealt simultaneously.", verified: true}
setup:
  turn: 3
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Amped Raptor @raptor"]
    library_pad: 10
  p1:
    battlefield: ["White Orchid Phantom @wop"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@raptor", target: {player: p1}}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: [{blocker: "@wop", attacker: "@raptor"}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      phase: first_strike_damage
      pending: {actor: p0, kind: priority}
      p0: {battlefield: [], graveyard: [Amped Raptor]}
      p1: {battlefield: [], graveyard: [White Orchid Phantom]}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    phase: combat_damage
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {life: 20, graveyard: [Amped Raptor]}
    p1: {life: 20, graveyard: [White Orchid Phantom]}
notes: >
  Both creatures have first strike, so both assign and deal their damage in the first combat damage step,
  simultaneously (510.2): Raptor (2/1) takes 2, Phantom (2/2) takes 2, both destroyed by SBA. The phase still gets a
  second combat damage step (510.4, unconditional), in which no creature remains. Wrong engines: the attacker's first
  strike resolved before the blocker's (only the Phantom dies), or no second step.
---
