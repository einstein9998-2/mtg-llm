  - check:
      stack: [{kind: activated, source: "@tz", controller: p0}]
      p0: {battlefield: [{card: Lotus Petal}, {card: Aether Vial}], graveyard: ["Tezzeret, Cruel Captain"]}
  - p0: {t: pass}
  - p1: {t: pass}
