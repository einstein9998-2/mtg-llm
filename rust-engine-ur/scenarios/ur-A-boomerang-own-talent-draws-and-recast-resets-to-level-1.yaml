notes: >
  Boomerang Basics is a sorcery cast at level 3: the Talent triggers (first Otter) before the bounce resolves. The
  returned Talent is a new object (400.7) and a Class with no level counts as level 1 (716.2d), so after recasting it the
  Otter trigger runs again (second Otter, 1/1; the first Otter is pumped by the Talent spell's prowess, an enchantment spell
  being noncreature) and Level 2 is offered but Level 3 is not, even though its level was 3 before. The leveled-again
  Talent then returns Boomerang Basics (the only instant or sorcery in the graveyard) via the level 2 trigger. p0 draws the
  top Island for controlling the bounced Talent. Casting a creature or an enchantment would not have made an Otter at
  level 3; only the sorcery did. A wrong engine keeps the old level counter, or forgets to draw.
