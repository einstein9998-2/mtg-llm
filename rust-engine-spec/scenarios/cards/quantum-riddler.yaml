id: quantum-riddler-warp-cast-draws-then-exiled-at-end-step
title: Quantum Riddler cast for its warp cost enters, its enters trigger draws, and it is exiled at the beginning of the end step
area: card
cards: [Quantum Riddler, Island, Ponder]
tags: [quantum-riddler, warp, alternative-cost, delayed-trigger, end-step, exile]
derived_from: cr
source:
  - {kind: oracle, card: Quantum Riddler, text: "Warp {1}{U}", verified: true}
  - {kind: oracle, card: Quantum Riddler, text: "When this creature enters, draw a card.", verified: true}
  - {kind: cr, ref: "702.185a", text: "“Warp [cost]” means “You may cast this card from your hand by paying [cost] rather than its mana cost” and “If this spell’s warp cost was paid, exile the permanent this spell becomes at the beginning of the next end step. Its owner may cast this card after the current turn has ended for as long as it remains exiled.”", verified: true}
  - {kind: cr, ref: "608.3g", text: "that delayed triggered ability is created as that permanent is put onto the battlefield", verified: true}
  - {kind: cr, ref: "603.7d", text: "If a spell creates a delayed triggered ability, the source of that delayed triggered ability is that spell. The controller of that delayed triggered ability is the player who controlled that spell as it resolved.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Quantum Riddler @qr", "Island @h1", "Island @h2"]
    battlefield: ["Island @i1", "Island @i2", "Island @i3"]
    library: ["Ponder @c1"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@qr", alt_cost: {warp: true}, pay: auto}
  - check:
      p0: {battlefield_contains: [{card: Island, tapped: false}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - resolve_top: true
  - check:
      stack: []
      p0: {hand: [Island, Island, Ponder], battlefield_contains: [{card: Quantum Riddler, sick: true}]}
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, controller: p0, text_contains: "exile"}]
      pending: {actor: p0, kind: priority}
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: [Quantum Riddler]
      battlefield:
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
        - {card: Island, tapped: false}
      hand: [Island, Island, Ponder]
notes: >
  Warp {1}{U} is an alternative cost (two of the three Islands tap; one stays untapped, which shows the full {3}{U}{U} was
  not paid). The enters trigger draws one card (two cards in hand, so no extra draw). The summoning-sick Riddler cannot
  attack, so advance passes combat without a decision. At the beginning of p0's end step the warp delayed trigger exiles
  it. Bugs caught: warp charged at full cost, no end-step exile, Riddler going to the graveyard instead of exile, the
  exile happening at cleanup or next turn.
---
id: quantum-riddler-warped-card-cast-from-exile-later-turn-for-mana-cost
