id: stifle-phelia-attack-trigger-nothing-exiled-no-return
title: Stifle on Phelia's attack trigger exiles nothing and creates no delayed return; the targeted creature can still block
area: card
cards: [Stifle, "Phelia, Exuberant Shepherd", "Dragon's Rage Channeler", Island]
tags: [stifle, phelia, attack-trigger, delayed-trigger-not-created, counter-ability]
derived_from: cr
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "Whenever Phelia attacks, exile up to one other target nonland permanent. At the beginning of the next end step, return that card to the battlefield under its owner's control.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn’t resolve and none of its effects occur.", verified: true}
  - {kind: cr, ref: "603.7a", text: "A delayed triggered ability won’t trigger until it has actually been created", verified: true}
  - {kind: oracle, card: "Dragon's Rage Channeler", text: "Whenever you cast a noncreature spell, surveil 1.", verified: true}
setup:
  turn: 5
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phelia, Exuberant Shepherd @phelia"]
    library_pad: 10
  p1:
    hand: ["Stifle @stifle"]
    battlefield: ["Dragon's Rage Channeler @drc", "Island @isl"]
    library: ["Island @p1top"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@phelia", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: "@drc"}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stifle", targets: [{trigger_of: "@phelia", nth: 0}]}
  - check:
      stack:
        - {kind: triggered, source: "@phelia", controller: p0}
        - {kind: spell, card: "@stifle", controller: p1}
        - {kind: triggered, source: "@drc", controller: p1, text_contains: "surveil"}
      pending: {actor: p1, kind: priority}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: surveil, to_graveyard: [], on_top_order: ["@p1top"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p1: {battlefield: [{card: "Dragon's Rage Channeler"}, {card: Island, tapped: true}], exile: []}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {decision: declare_blockers, blocks: []}
  - advance: {to: end, of: p0}
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {battlefield: [{card: "Phelia, Exuberant Shepherd", pt: [2, 2], tapped: true}]}
    p1:
      life: 18
      exile: []
      graveyard: [Stifle]
      battlefield: [{card: "Dragon's Rage Channeler"}, {card: Island, tapped: true}]
notes: >
  Stifle is a noncreature spell cast by DRC's controller, so DRC's surveil 1 triggers above Stifle and resolves first
  (p1 keeps the card on top). The countered trigger never resolves, so DRC is not exiled and the delayed return is never
  created: at p0's end step the stack is empty. DRC stays and could block (p1 declares no block). Phelia deals 2. Bugs caught: the exile happening
  anyway, a delayed trigger created at trigger time rather than at resolution, DRC unable to block.
---
id: stifle-phelia-return-trigger-card-stays-exiled
title: Stifle on Phelia's delayed return trigger leaves the exiled creature in exile for good and Phelia gets no counter
area: card
cards: [Stifle, "Phelia, Exuberant Shepherd", "Dragon's Rage Channeler", Island]
tags: [stifle, phelia, delayed-trigger, end-step, counter-ability, permanent-exile]
derived_from: cr
source:
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: oracle, card: "Phelia, Exuberant Shepherd", text: "At the beginning of the next end step, return that card to the battlefield under its owner's control.", verified: true}
  - {kind: cr, ref: "603.7b", text: "A delayed triggered ability will trigger only once—the next time its trigger event occurs—unless it has a stated duration", verified: true}
setup:
  turn: 5
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Phelia, Exuberant Shepherd @phelia"]
    library_pad: 10
  p1:
    hand: ["Stifle @stifle"]
    battlefield: ["Dragon's Rage Channeler @drc", "Island @isl"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: [{creature: "@phelia", target: {player: p1}}]}
  - p0: {decision: choose_target, slot: 0, answer: "@drc"}
  - resolve_top: true
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, source: "@phelia", controller: p0, text_contains: "return"}]
  - p0: {t: pass}
  - p1: {t: cast, card: "@stifle", targets: [{trigger_of: "@phelia", nth: 0}]}
  - p1: {t: pass}
  - p0: {t: pass}
  - advance: {to: upkeep, of: p1}
expect:
  - at: after_script
    turn: 6
    phase: upkeep
    stack: []
    p0: {battlefield: [{card: "Phelia, Exuberant Shepherd", pt: [2, 2]}]}
    p1:
      life: 18
      exile: ["Dragon's Rage Channeler"]
      graveyard: [Stifle]
      battlefield: [{card: Island}]
notes: >
  DRC is exiled during combat; at the end step the return trigger is Stifled, so DRC never comes back: it is still in
  exile at the next turn's upkeep (a delayed trigger triggers only once, 603.7b). Phelia gets no counter. p1's Island
  untaps in p1's untap step. Bugs caught: the return re-triggering at a later end step, the card returned by a
  "cleanup" path when the trigger is countered.
---
