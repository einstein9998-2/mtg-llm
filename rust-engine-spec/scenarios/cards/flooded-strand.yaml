id: flooded-strand-pay-life-at-one-life-loses
title: Flooded Strand can be activated at 1 life; the life payment takes the player to 0 and they lose before the ability resolves
area: card
cards: [Flooded Strand, Island]
tags: [fetchland, life-payment, state-based-actions, game-over]
derived_from: cr
source:
  - {kind: cr, ref: "119.4", text: "If a cost or effect allows a player to pay an amount of life greater than 0, the player may do so only if their life total is greater than or equal to the amount of the payment. If a player pays life, the payment is subtracted from their life total; in other words, the player loses that much life.", verified: true}
  - {kind: cr, ref: "704.5a", text: "If a player has 0 or less life, that player loses the game.", verified: true}
  - {kind: oracle, card: Flooded Strand, text: "{T}, Pay 1 life, Sacrifice this land: Search your library for a Plains or Island card, put it onto the battlefield, then shuffle.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    life: 1
    battlefield: ["Flooded Strand @strand"]
    library: ["Island @isl"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: activate, source: "@strand", ability: 0}
expect:
  - at: after_script
    game: {over: true, winner: p1}
    p0:
      life: 0
      graveyard: [Flooded Strand]
notes: >
  Paying 1 life with a life total of 1 is allowed (119.4: total greater than or equal to the payment). The payment leaves the player at 0, and the
  next state-based action check (before any player would receive priority, 704.3) ends the game (704.5a); the search never happens. A wrong engine
  refuses the activation at 1 life (offers no activate action) or lets the search resolve first. The game-over assertion key winner is a schema request.
