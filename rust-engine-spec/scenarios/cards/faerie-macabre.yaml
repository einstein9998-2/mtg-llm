id: faerie-macabre-cannot-be-activated-from-battlefield
title: Faerie Macabre on the battlefield cannot use its discard ability
area: card
cards: [Faerie Macabre, Lightning Bolt]
tags: [faerie-macabre, activated-ability, zone-restriction, mask-validity]
derived_from: cr
source:
  - {kind: oracle, card: Faerie Macabre, text: "Discard this card: Exile up to two target cards from graveyards.", verified: true}
  - {kind: cr, ref: "113.6j", text: "An object's activated ability that has a cost that can't be paid while the object is on the battlefield functions from any zone in which its cost can be paid.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Faerie Macabre @fm"]
    library_pad: 10
  p1:
    graveyard: ["Lightning Bolt @bolt"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate, source: "@fm", ability: 0, targets: ["@bolt"]}}
  - expect_illegal: {p0: {t: activate_from_hand, source: "@fm", ability: 0, targets: ["@bolt"]}}
expect:
  - at: after_script
    stack: []
    p0:
      battlefield: [{card: Faerie Macabre}]
      graveyard: []
    p1:
      graveyard: [Lightning Bolt]
notes: >
  "Discard this card" can only be paid from a hand, so a Faerie Macabre that is a permanent cannot activate it (and a
  "from hand" activation is impossible because the card is not in a hand). Nothing may change.
