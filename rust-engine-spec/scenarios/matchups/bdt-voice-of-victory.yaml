id: mu-bdt-vialed-skyclave-exiles-voice-then-swords-castable
title: Under Voice of Victory D&T cannot cast Swords on Boros' turn; a Vialed-in Skyclave Apparition exiles Voice, after which Swords can be cast in the same step
area: matchup
cards: [Voice of Victory, Ocelot Pride, Aether Vial, Skyclave Apparition, Swords to Plowshares, Plains]
tags: [matchup, boros-vs-dt, voice-of-victory, aether-vial, skyclave-apparition, casting-restriction, static-ability-ends]
derived_from: cr
source:
  - {kind: oracle, card: Voice of Victory, text: "Your opponents can't cast spells during your turn.", verified: true}
  - {kind: oracle, card: Aether Vial, text: "{T}: You may put a creature card with mana value equal to the number of charge counters on this artifact from your hand onto the battlefield.", verified: true}
  - {kind: oracle, card: Skyclave Apparition, text: "When this creature enters, exile up to one target nonland, nontoken permanent you don't control with mana value 4 or less.", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
setup:
  turn: 7
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Voice of Victory @vov", "Ocelot Pride @oc"]
    library_pad: 10
  p1:
    hand: ["Skyclave Apparition @sky", "Swords to Plowshares @stp"]
    battlefield: [{card: Aether Vial, as: vial, counters: {charge: 3}}, "Plains @w"]
    library_pad: 10
script:
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@stp", targets: ["@oc"], pay: auto}}
  - p1: {t: activate, source: "@vial", ability: 0}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_cards, purpose: put_onto_battlefield, answer: ["@sky"]}
  - p1: {decision: choose_target, slot: 0, answer: "@vov", expect_options: {include: ["@vov", "@oc"], exclude: ["@vial", "@w"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {exile: [Voice of Victory]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stp", targets: ["@oc"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    phase: begin_combat
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 21
      exile: [Voice of Victory, Ocelot Pride]
      battlefield: []
    p1:
      hand: []
      graveyard: [Swords to Plowshares]
      battlefield:
        - {card: Skyclave Apparition, sick: true}
        - {card: Aether Vial, tapped: true, counters: {charge: 3}}
        - {card: Plains, tapped: true}
notes: >
  Voice stops p1's spells on p0's turn (601.3), but not the Vial's ability. Skyclave (mana value 3) enters and exiles
  Voice (mana value 2). Voice's static ability stops applying as soon as it leaves, so in the same beginning of combat
  step p1 may cast Swords; Ocelot is exiled and p0 gains 1. A wrong engine keeps the restriction after Voice is gone
  (stale casting mask), or lets p1 cast Swords while Voice is still there.
---
id: mu-bdt-flickerwisp-exiles-voice-window-closes-when-it-returns
title: A Vialed-in Flickerwisp exiles Voice of Victory so D&T can cast Swords; Voice returns at Boros' end step and D&T again cannot cast spells that turn
area: matchup
cards: [Voice of Victory, Ocelot Pride, Sand Scout, Aether Vial, Flickerwisp, Swords to Plowshares, Plains]
tags: [matchup, boros-vs-dt, voice-of-victory, flickerwisp, aether-vial, delayed-trigger, casting-restriction, end-step]
derived_from: cr
source:
  - {kind: oracle, card: Voice of Victory, text: "Your opponents can't cast spells during your turn.", verified: true}
  - {kind: oracle, card: Flickerwisp, text: "When this creature enters, exile another target permanent. Return that card to the battlefield under its owner's control at the beginning of the next end step.", verified: true}
  - {kind: cr, ref: "603.7e", text: "The controller of that delayed triggered ability is the player who controlled that other ability as it resolved.", verified: true}
  - {kind: cr, ref: "508.8", text: "If no creatures are declared as attackers or put onto the battlefield attacking, skip the declare blockers and combat damage steps.", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
setup:
  turn: 7
  active: p0
  phase: begin_combat
  p0:
    battlefield: ["Voice of Victory @vov", "Ocelot Pride @oc", "Sand Scout @scout"]
    library_pad: 10
  p1:
    hand: ["Flickerwisp @wisp", "Swords to Plowshares @stp1", "Swords to Plowshares @stp2"]
    battlefield: [{card: Aether Vial, as: vial, counters: {charge: 3}}, "Plains @w1", "Plains @w2"]
    library_pad: 10
script:
  - p0: {t: pass}
  - p1: {t: activate, source: "@vial", ability: 0}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: choose_cards, purpose: put_onto_battlefield, answer: ["@wisp"]}
  - p1: {decision: choose_target, slot: 0, answer: "@vov"}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stp1", targets: ["@oc"], pay: {tap: ["@w1"]}}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      phase: begin_combat
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {life: 21, exile: [Voice of Victory, Ocelot Pride]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: declare_attackers, attacks: []}
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, source: "@wisp", controller: p1}]
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      p0: {exile: [Ocelot Pride], battlefield: [{card: Voice of Victory, controller: p0}, {card: Sand Scout}]}
      pending: {actor: p0, kind: priority}
  - p0: {t: pass}
  - expect_illegal: {p1: {t: cast, card: "@stp2", targets: ["@scout"], pay: {tap: ["@w2"]}}}
expect:
  - at: after_script
    turn: 7
    phase: end
    stack: []
    pending: {actor: p1, kind: priority}
    legal: {p1: {include: [{t: pass}], exclude: [{t: cast, card: "@stp2"}]}}
    p0:
      life: 21
      exile: [Ocelot Pride]
      battlefield: [{card: Voice of Victory}, {card: Sand Scout}]
    p1:
      hand: [Swords to Plowshares]
      battlefield:
        - {card: Flickerwisp}
        - {card: Aether Vial, tapped: true, counters: {charge: 3}}
        - {card: Plains, tapped: true}
        - {card: Plains, tapped: false}
notes: >
  Flickerwisp enters during p0's beginning of combat, so "the next end step" is p0's end step this turn. While Voice is
  in exile p1 casts Swords on Ocelot (p0 gains 1). p0 then declares no attackers (Sand Scout could attack, so the empty
  declaration is a real decision; 508.8 skips blockers and damage). At p0's end step p1's delayed trigger returns Voice
  under p0's control; Voice's restriction applies again at once, so p1, holding an untapped Plains and a second Swords,
  is offered no cast. Nothing triggers on Voice's return (no Guide of Souls here; Ocelot is gone so it has no end-step
  trigger). A wrong engine returns Voice in the cleanup step or next turn, or forgets to reapply the restriction to
  the returned Voice.
