id: tropical-island-taps-for-green-or-blue
title: Tropical Island (Forest Island) taps for {G} or {U} and not for other colors
area: card
cards: [Tropical Island, Forest, Island]
tags: [tropical-island, mana-ability, basic-land-types, choose-color]
derived_from: cr
source:
  - {kind: oracle, card: Tropical Island, text: "({T}: Add {G} or {U}.)", verified: true}
  - {kind: cr, ref: "305.6", text: "An object with the land card type and a basic land type has the intrinsic ability \"{T}: Add [mana symbol],\"", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Tropical Island @ti"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - expect_illegal: {p0: {t: activate, source: "@ti", ability: 0, choose_color: W}}
  - p0: {t: activate, source: "@ti", ability: 0, choose_color: G}
expect:
  - at: after_script
    stack: []
    p0:
      mana_pool: {G: 1}
      battlefield: [{card: Tropical Island, tapped: true, subtypes: [Forest, Island]}]
notes: >
  Ability index 0 is the intrinsic mana ability. Only G and U are legal; no life loss (it is not a painland).
