id: consign-to-memory-counters-hedge-maze-surveil-trigger
title: Consign to Memory counters Hedge Maze's enters trigger; the land stays but no surveil happens
area: card
cards: [Consign to Memory, Hedge Maze, Lightning Bolt, Island]
tags: [consign-to-memory, counter-ability, triggered-ability, hedge-maze, surveil]
derived_from: oracle
source:
  - {kind: oracle, card: Consign to Memory, text: "Counter target triggered ability or colorless spell.", verified: true}
  - {kind: oracle, card: Hedge Maze, text: "When this land enters, surveil 1.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Hedge Maze @hm"]
    library: ["Lightning Bolt @bolt"]
    library_pad: 10
  p1:
    hand: ["Consign to Memory @cm"]
    battlefield: ["Island @pi"]
    library_pad: 10
script:
  - p0: {t: play_land, card: "@hm"}
  - p0: {t: pass}
  - p1: {t: cast, card: "@cm", targets: [{trigger_of: "@hm", nth: 0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      battlefield: [{card: Hedge Maze, tapped: true}]
      library_count: 11
      library_top: [Lightning Bolt]
      graveyard: []
    p1:
      graveyard: [Consign to Memory]
notes: >
  The ETB surveil trigger is countered; no surveil decision is raised, the library is unchanged (Bolt still on top,
  11 cards), and Hedge Maze stays on the battlefield tapped.
