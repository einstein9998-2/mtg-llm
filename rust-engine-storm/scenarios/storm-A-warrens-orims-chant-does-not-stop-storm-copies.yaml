id: storm-a-warrens-orims-chant-does-not-stop-storm-copies
title: "Orim's Chant on the Storm player in response to the storm trigger does not stop the Warrens copies: four Goblins"
area: card
cards: [Empty the Warrens, Dark Ritual, "Orim's Chant", Goblin Token, Swamp, Mountain, Plains]
tags: [empty-the-warrens, storm, orims-chant, casting-restriction, copies-not-cast, tokens, legal-action-mask]
derived_from: cr
source:
  - {kind: oracle, card: "Orim's Chant", text: "Target player can't cast spells this turn.", verified: true}
  - {kind: cr, ref: "707.10", text: "a copy of a spell isn’t cast", verified: true}
  - {kind: cr, ref: "601.3", text: "A player can begin to cast a spell only if a rule or effect allows that player to cast it and no rule or effect prohibits that player from casting it.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Dark Ritual @rit", "Dark Ritual @rit2", "Empty the Warrens @ew"]
    battlefield: ["Swamp @s1", "Swamp @s2", "Mountain @m1"]
    library_pad: 10
  p1:
    hand: ["Orim's Chant @chant"]
    battlefield: ["Plains @pp"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@rit", pay: {tap: ["@s1"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: cast, card: "@ew", pay: {tap: ["@m1"]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@chant", kicked: false, targets: [{player: p0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      pending: {actor: p0, kind: priority}
      stack:
        - {kind: spell, card: "@ew", controller: p0}
        - {kind: triggered, source: "@ew", text_contains: "copy"}
      legal: {p0: {exclude: [{t: cast, card: "@rit2"}]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack:
        - {kind: spell, card: "@ew", controller: p0}
        - {kind: spell, card: Empty the Warrens, copy: true, controller: p0}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: [Dark Ritual]
      graveyard: [Dark Ritual, Empty the Warrens]
      battlefield_contains:
        - {card: Swamp}
        - {card: Swamp}
        - {card: Mountain}
        - {token: Goblin Token, controller: p0, pt: [1, 1], colors: [R], sick: true}
        - {token: Goblin Token, controller: p0, pt: [1, 1], colors: [R], sick: true}
        - {token: Goblin Token, controller: p0, pt: [1, 1], colors: [R], sick: true}
        - {token: Goblin Token, controller: p0, pt: [1, 1], colors: [R], sick: true}
    p1: {graveyard: ["Orim's Chant"]}
notes: >
  The Warrens is already cast when Chant resolves; the storm trigger then creates one copy. Copies are put on the stack, not cast
  (707.10), so "can't cast spells" does not stop them: original and copy both resolve for four Goblins. The control is that p0 is
  barred from casting the second Dark Ritual while the untapped Swamp could pay for it.
