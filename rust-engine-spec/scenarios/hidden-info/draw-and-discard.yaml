id: hi-draw-step-opponent-stream-independent-of-drawn-card
title: The opponent's observation stream is identical whichever card the active player draws
area: hidden-info
cards: [Lightning Bolt, Murktide Regent, Ponder, Volcanic Island, Aluren, Island, Tropical Island]
tags: [hidden-info, draw, non-interference, paired-world]
derived_from: cr
source:
  - {kind: cr, ref: "402.3", text: "A player can't look at the cards in another player's hand but may count those cards at any time.", verified: true}
  - {kind: cr, ref: "401.2", text: "Each library must be kept in a single face-down pile. Players can't look at or change the order of cards in a library.", verified: true}
setup:
  turn: 3
  active: p0
  phase: upkeep
  priority: p0
  p0:
    hand: ["Lightning Bolt @bolt"]
    battlefield: ["Volcanic Island @v"]
    library: ["Murktide Regent @top"]
    library_pad: 10
  p1:
    hand: ["Aluren @alu", "Island @i1"]
    battlefield: ["Tropical Island @t"]
    library_pad: 10
world_b:
  p0: {library: ["Ponder @top"]}
assert_streams_identical: {observer: p1}
script:
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    phase: draw
    pending: {actor: p0, kind: priority}
    p0: {hand_count: 2, library_count: 10}
notes: >
  Paired worlds differ only in the identity of p0's top card (Murktide Regent vs Ponder), which p1 is not entitled to know
  before or after the draw. p1's whole stream (observations, option lists, event text, view ids, view hash) must be
  byte-identical. Catches draw events carrying names, ViewIds derived from CardIds, and hashes over full state.
