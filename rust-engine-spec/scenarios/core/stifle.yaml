id: stifle-wasteland-land-already-sacrificed-target-survives
title: "Stifle on Wasteland's ability: Wasteland is already sacrificed, its target land is not destroyed"
area: core
cards: [Wasteland, Stifle, Volcanic Island, Island]
tags: [stifle, wasteland, counter-ability, costs, no-refund, sacrifice-cost]
derived_from: cr
source:
  - {kind: oracle, card: Wasteland, text: "{T}, Sacrifice this land: Destroy target nonbasic land.", verified: true}
  - {kind: oracle, card: Stifle, text: "Counter target activated or triggered ability.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur.", verified: true}
  - {kind: cr, ref: "701.6b", text: "The player who cast a countered spell or activated a countered ability doesn't get a \"refund\" of any costs that were paid.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Wasteland @w"]
    library_pad: 10
  p1:
    hand: ["Stifle @stifle"]
    battlefield: ["Volcanic Island @volc", "Island @j1"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@w", ability: 1, targets: ["@volc"]}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stifle", targets: [{ability_of: "@w", nth: 0}], pay: {tap: ["@j1"]}}
  - check:
      stack:
        - {kind: activated, source: "@w", controller: p0}
        - {kind: spell, card: "@stifle", controller: p1}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {graveyard: [Wasteland], battlefield: []}
    p1:
      graveyard: [Stifle]
      battlefield: [{card: Volcanic Island, tapped: false}, {card: Island, tapped: true}]
notes: >
  The sacrifice was a cost, so Wasteland is in the graveyard before Stifle is even cast, and the countering does not give
  it back. The ability never resolves, so Volcanic Island survives untapped. Catches an engine that returns the cost
  payment, or that resolves the destroy anyway.
---
id: stifle-mishras-bauble-no-draw-because-delayed-trigger-never-created
title: "Stifle on Mishra's Bauble's ability: the Bauble is already sacrificed and no card is ever drawn, because the delayed trigger is created on resolution"
area: core
cards: [Mishra's Bauble, Stifle, Island, Ponder]
tags: [stifle, mishras-bauble, delayed-triggers, counter-ability, costs, no-refund, upkeep]
derived_from: cr
source:
  - {kind: oracle, card: Mishra's Bauble, text: "{T}, Sacrifice this artifact: Look at the top card of target player's library. Draw a card at the beginning of the next turn's upkeep.", verified: true}
  - {kind: cr, ref: "603.7a", text: "Delayed triggered abilities are created during the resolution of spells or abilities, as the result of a replacement effect being applied, or as a result of a static ability that allows a player to take an action. A delayed triggered ability won't trigger until it has actually been created, even if its trigger event occurred just beforehand.", verified: true}
  - {kind: cr, ref: "701.6a", text: "To counter a spell or ability means to cancel it, removing it from the stack. It doesn't resolve and none of its effects occur.", verified: true}
  - {kind: cr, ref: "701.6b", text: "The player who cast a countered spell or activated a countered ability doesn't get a \"refund\" of any costs that were paid.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    battlefield: ["Mishra's Bauble @bauble"]
    library: ["Ponder @pond"]
    library_pad: 10
  p1:
    hand: ["Stifle @stifle"]
    battlefield: ["Island @j1"]
    library_pad: 10
script:
  - p0: {t: activate, source: "@bauble", ability: 0, targets: [{player: p0}]}
  - check:
      stack:
        - {kind: activated, source: "@bauble", controller: p0}
      p0: {graveyard: [Mishra's Bauble], battlefield: []}
  - p0: {t: pass}
  - p1: {t: cast, card: "@stifle", targets: [{ability_of: "@bauble", nth: 0}], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0: {hand_count: 0, graveyard: [Mishra's Bauble], library_count: 11}
  - advance: {to: upkeep, of: p1}
  - check:
      turn: 4
      stack: []
      p0: {hand_count: 0, library_count: 11}
  - advance: {to: upkeep, of: p0}
expect:
  - at: after_script
    turn: 5
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {hand_count: 0, library_top: [Ponder], graveyard: [Mishra's Bauble]}
notes: >
  The whole ability is countered (701.6a: none of its effects occur). "Draw a card at the beginning of the next turn's
  upkeep" is the second sentence of the same ability: it creates a delayed triggered ability when the ability resolves
  (603.7a), so a countered ability never creates it. The Bauble is already gone as a cost (701.6b). Therefore no draw trigger
  appears at turn 4's upkeep (the "next turn") nor at turn 5's upkeep, and p0's hand stays empty at both upkeeps (the
  draw-step draw has not happened yet). The "look at the top card" part is also countered; it is not observable as state.
  Catches an engine that registers the delayed trigger at activation time instead of at resolution.
---
