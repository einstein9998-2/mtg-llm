id: hi-surveil-opponent-stream-independent-of-kept-card
title: The opponent's stream is identical whatever card is surveilled and kept on top
area: hidden-info
cards: [Hedge Maze, Aluren, Show and Tell, "Atraxa, Grand Unifier", Lightning Bolt, Volcanic Island]
tags: [hidden-info, surveil, non-interference, paired-world]
derived_from: cr
source:
  - {kind: cr, ref: "701.20e", text: "Looking at a card follows the same rules as revealing a card, except that the card is shown only to the specified player.", verified: true}
  - {kind: oracle, card: Hedge Maze, text: "When this land enters, surveil 1.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: [Lightning Bolt]
    battlefield: ["Volcanic Island"]
    library_pad: 10
  p1:
    lands_played: 0
    hand: ["Hedge Maze @hm", "Aluren @alu"]
    library: ["Show and Tell @x"]
    library_pad: 10
world_b:
  p1: {library: ["Atraxa, Grand Unifier @x"]}
assert_streams_identical: {observer: p0}
script:
  - p1: {t: play_land, card: "@hm"}
  - p1: {t: pass}
  - p0: {t: pass}
  - p1: {decision: surveil, to_graveyard: [], on_top_order: ["@x"]}
expect:
  - at: after_script
    stack: []
    p1: {library_count: 11, graveyard: []}
notes: >
  Only the identity of the kept card differs between the worlds; p0's stream must be byte-identical.
