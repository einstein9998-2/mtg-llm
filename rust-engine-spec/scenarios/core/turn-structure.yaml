id: turn-one-first-player-has-no-draw-step
title: The first player skips the draw step of turn 1, so upkeep leads straight to the first main phase
area: core
cards: [Brainstorm, Ponder]
tags: [turn-structure, draw-step, first-player, priority]
derived_from: cr
source:
  - {kind: cr, ref: "103.8a", text: "In a two-player game, the player who plays first skips the draw step (see rule 504, \"Draw Step\") of their first turn.", verified: true}
  - {kind: cr, ref: "503.1", text: "The upkeep step has no turn-based actions. Once it begins, the active player gets priority.", verified: true}
  - {kind: cr, ref: "505.6", text: "Fourth, the active player gets priority.", verified: true}
setup:
  turn: 1
  active: p0
  phase: upkeep
  p0:
    hand: ["Brainstorm @bs"]
    library: ["Ponder @pd"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check: {turn: 1, phase: upkeep, active: p0, priority: p0, p0: {hand: [Brainstorm], library_count: 11}}
  - p0: {t: pass}
  - check: {phase: upkeep, priority: p1, stack: []}
  - p1: {t: pass}
expect:
  - at: after_script
    turn: 1
    phase: main1
    active: p0
    priority: p0
    stack: []
    pending: {actor: p0, kind: priority}
    p0: {hand: [Brainstorm], library_count: 11, library_top: [Ponder]}
    p1: {hand_count: 0, library_count: 10}
notes: >
  Turn 1 belongs to p0 (the first player). Rule 103.8a says that player skips the draw step, so after both players pass
  with an empty stack in the upkeep, the next step is the first main phase, and nobody draws. A wrong engine would run a
  draw step and draw (hand 2, library 10), or give priority in a draw step that should not exist. p1 does not draw either
  (it is not p1's turn).
