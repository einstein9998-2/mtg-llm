id: hide-on-the-ceiling-returned-moonshadow-is-a-new-object
title: Hide on the Ceiling (X=1) on a damaged-down Moonshadow wearing Cori-Steel Cutter returns it at the end step as a new 1/1 with six fresh -1/-1 counters and no Equipment
area: card
cards: [Hide on the Ceiling, Moonshadow, Cori-Steel Cutter, Island]
tags: [hide-on-the-ceiling, flicker, new-object, delayed-trigger, end-step, enters-with-counters, equipment, layers]
derived_from: cr
source:
  - {kind: oracle, card: Hide on the Ceiling, text: "Exile X target artifacts and/or creatures. Return the exiled cards to the battlefield under their owners' control at the beginning of the next end step.", verified: true}
  - {kind: oracle, card: Moonshadow, text: "This creature enters with six -1/-1 counters on it.", verified: true}
  - {kind: cr, ref: "400.7", text: "An object that moves from one zone to another becomes a new object with no memory of, or relation to, its previous existence.", verified: true}
  - {kind: cr, ref: "301.5c", text: "An Equipment that equips an illegal or nonexistent permanent becomes unattached from that permanent but remains on the battlefield.", verified: true}
  - {kind: cr, ref: "603.7d", text: "If a spell creates a delayed triggered ability, the source of that delayed triggered ability is that spell. The controller of that delayed triggered ability is the player who controlled that spell as it resolved.", verified: true}
setup:
  turn: 4
  active: p0
  phase: main2
  p0:
    hand: ["Hide on the Ceiling @hide"]
    battlefield:
      - {card: Moonshadow, as: ms, counters: {"-1/-1": 2}}
      - {card: Cori-Steel Cutter, as: cut, attached_to: "@ms"}
      - "Island @i1"
      - "Island @i2"
    library_pad: 10
  p1:
    library_pad: 10
script:
  - check:
      p0: {battlefield_contains: [{card: Moonshadow, pt: [6, 6], counters: {"-1/-1": 2}}]}
  - p0: {t: cast, card: "@hide", x: 1, targets: ["@ms"], pay: {tap: ["@i1", "@i2"]}}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: []
      pending: {actor: p0, kind: priority}
      p0:
        exile: [Moonshadow]
        graveyard: [Hide on the Ceiling]
        battlefield_contains: [{card: Cori-Steel Cutter, attached_to: null}]
  - advance: {to: end, of: p0}
  - check:
      stack: [{kind: triggered, controller: p0}]
      p0: {exile: [Moonshadow]}
  - resolve_top: true
expect:
  - at: after_script
    phase: end
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      exile: []
      graveyard: [Hide on the Ceiling]
      battlefield:
        - {card: Moonshadow, pt: [1, 1], counters: {"-1/-1": 6}, sick: true, keywords: [menace]}
        - {card: Cori-Steel Cutter, attached_to: null}
        - {card: Island, tapped: true}
        - {card: Island, tapped: true}
notes: >
  Moonshadow (printed 7/7) has lost four of its counters: 5/5, plus the Cutter 6/6. Hide (X=1, {1}{U}) exiles it; the
  Cutter is left equipping a nonexistent permanent and becomes unattached (SBA). At the beginning of p0's end step the
  delayed trigger (controlled by p0, 603.7d; its source is not asserted) returns the card as a new object (400.7):
  Moonshadow's "enters with six -1/-1 counters" applies again, so it is a 1/1 with six counters, summoning sick, and the
  Cutter does not follow it. Hide is p0's first spell this turn, so the Cutter's flurry does not trigger. Cast in main2
  so no attack declaration interrupts the advance. Wrong engines: counters or attachment kept across the zone change, or
  the old counter count restored.
