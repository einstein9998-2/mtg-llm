id: lifelink-gain-simultaneous-with-combat-damage-prevents-loss
title: Lifelink life gain happens at the same time as combat damage, so a player at 2 life taking 2 and gaining 7 does not lose
area: core
cards: ["Atraxa, Grand Unifier", "Goblin Token", "Zombie Token"]
tags: [combat, lifelink, simultaneous, state-based-actions, atraxa, life-loss]
derived_from: cr
source:
  - {kind: cr, ref: "510.2", text: "Second, all combat damage that’s been assigned is dealt simultaneously. This turn-based action doesn’t use the stack.", verified: true}
  - {kind: cr, ref: "702.15b", text: "Damage dealt by a source with lifelink causes that source’s controller, or its owner if it has no controller, to gain that much life (in addition to any other results that damage causes).", verified: true}
  - {kind: cr, ref: "120.3f", text: "Damage dealt by a source with lifelink causes that source’s controller to gain that much life, in addition to the damage’s other results.", verified: true}
  - {kind: cr, ref: "120.3a", text: "Damage dealt to a player by a source without infect causes that player to lose that much life.", verified: true}
  - {kind: cr, ref: "704.3", text: "Whenever a player would get priority (see rule 117, “Timing and Priority”), the game checks for any of the listed conditions for state-based actions, then performs all applicable state-based actions simultaneously as a single event.", verified: true}
  - {kind: cr, ref: "704.5a", text: "If a player has 0 or less life, that player loses the game.", verified: true}
setup:
  turn: 4
  active: p1
  phase: begin_combat
  p0:
    life: 2
    battlefield: ["Atraxa, Grand Unifier @atraxa"]
    library_pad: 10
  p1:
    battlefield: [{token: Goblin Token, as: gob}, {token: Zombie Token, as: zomb}]
    library_pad: 10
script:
  - p1: {t: pass}
  - p0: {t: pass}
  - p1:
      decision: declare_attackers
      attacks:
        - {creature: "@gob", target: {player: p0}}
        - {creature: "@zomb", target: {player: p0}}
  - p1: {t: pass}
  - p0: {t: pass}
  - p0: {decision: declare_blockers, blocks: [{blocker: "@atraxa", attacker: "@gob"}], expect_options: {include: ["@atraxa"]}}
  - p1: {t: pass}
  - p0: {t: pass}
expect:
  - at: after_script
    game: {over: false}
    phase: combat_damage
    active: p1
    priority: p1
    p0:
      life: 7
      battlefield: [{card: "Atraxa, Grand Unifier", damage: 1, tapped: false}]
    p1:
      life: 20
      battlefield: [{token: Zombie Token, tapped: true}]
notes: >
  p1 (active, turn 4) attacks with a 1/1 Goblin and a 2/2 Zombie; p0, at 2 life, blocks only the Goblin with Atraxa. All
  combat damage is dealt simultaneously (510.2): the unblocked Zombie deals 2 to p0 (2 - 2) while Atraxa deals 7 to the Goblin
  and lifelink gains 7 as part of the same damage event (120.3f). The state-based action check afterwards (704.3) sees
  2 - 2 + 7 = 7 life, so p0 does not lose (704.5a). A wrong engine applies the life loss, runs the SBA check (p0 loses at 0),
  and only then applies the lifelink gain. Atraxa takes 1 and survives; the Goblin token is gone.
---
