id: mu-fow-counters-aluren-no-free-creatures
title: Countering Aluren means the UR player cannot cast Dragon's Rage Channeler on the Alurentell player's turn
area: matchup
cards: [Force of Will, Ponder, Aluren, "Dragon's Rage Channeler", Volcanic Island, Island, Tropical Island, Hedge Maze]
tags: [matchup, force-of-will, aluren, timing, legal-actions]
derived_from: cr
source:
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: cr, ref: "117.1a", text: "A player may cast a noninstant spell during their main phase any time they have priority and the stack is empty.", verified: true}
  - {kind: cr, ref: "701.6a", text: "A countered spell is put into its owner's graveyard.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Force of Will @fow", "Ponder @pd", "Dragon's Rage Channeler @drc"]
    battlefield: ["Volcanic Island"]
    library_pad: 10
  p1:
    hand: ["Aluren @alu"]
    battlefield: ["Island", "Tropical Island", "Tropical Island", "Hedge Maze"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@alu", pay: auto}
  - p1: {t: pass}
  - p0: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@pd", pay_life: 1}, targets: ["@alu"]}
  - p0: {t: pass}
  - p1: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    phase: main1
    pending: {actor: p0, kind: priority}
    p1: {graveyard: [Aluren], battlefield: [{card: Island}, {card: Tropical Island}, {card: Tropical Island}, {card: Hedge Maze}]}
    p0: {life: 19, hand: ["Dragon's Rage Channeler"]}
    legal:
      p0:
        include: [{t: pass}]
        exclude: [{t: cast, card: "@drc"}]
notes: >
  After Force of Will resolves, p1 (active) passes in its main phase with an empty stack, so p0 has priority there. With
  Aluren on the battlefield p0 could cast DRC (mana value 1) for free with flash; with Aluren countered, DRC is a creature
  without flash on the opponent's turn and is not offered. Compare mu-aluren-ur-casts-drc-at-instant-speed.
