id: skyclave-apparition-with-nothing-exiled-leaves-no-token
title: A Skyclave Apparition that exiled nothing creates no Illusion token when it leaves
area: card
cards: [Skyclave Apparition, Griselbrand, Swords to Plowshares, Plains]
tags: [skyclave-apparition, leaves-battlefield, up-to-one-target, no-legal-target]
derived_from: oracle
source:
  - {kind: oracle, card: Skyclave Apparition, text: "When this creature enters, exile up to one target nonland, nontoken permanent you don't control with mana value 4 or less.", verified: true}
  - {kind: oracle, card: Skyclave Apparition, text: "When this creature leaves the battlefield, the exiled card's owner creates an X/X blue Illusion creature token, where X is the mana value of the exiled card.", verified: true}
  - {kind: cr, ref: "609.3", text: "If an effect attempts to do something impossible, it does only as much as possible.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Skyclave Apparition @sky"]
    battlefield: ["Plains @w1", "Plains @w2", "Plains @w3"]
    library_pad: 10
  p1:
    hand: ["Swords to Plowshares @stp"]
    battlefield: ["Griselbrand @gris", "Plains @pw"]
    library_pad: 10
script:
  - p0: {t: cast, card: "@sky", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@sky", controller: p0, targets: []}]
      pending: {actor: p0, kind: priority}
  - resolve_top: true
  - p0: {t: pass}
  - p1: {t: cast, card: "@stp", targets: ["@sky"], pay: auto}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@sky", controller: p0}]
  - resolve_top: true
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      life: 22
      exile: [Skyclave Apparition]
    p1:
      exile: []
      battlefield: [{card: Griselbrand}, {card: Plains, tapped: true}]
notes: >
  Griselbrand (mana value 8) is the only nonland permanent p0 does not control, so the ETB has no legal target. "Up to
  one" allows zero targets, so no target decision is raised and the trigger goes on the stack with no target and does
  nothing. When Skyclave leaves, its LTB trigger has no exiled card, so nobody creates a token (a wrong engine might
  create a 0/0 Illusion, which would then die, or reuse stale data).
