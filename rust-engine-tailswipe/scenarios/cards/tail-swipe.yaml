id: tail-swipe-main-phase-atraxa-lifelink
title: "Tail Swipe in its controller's main phase pumps +1/+1, Atraxa fights a Channeler, kills it and gains life equal to her power"
area: card
cards: [Tail Swipe, Tropical Island, "Atraxa, Grand Unifier", "Dragon's Rage Channeler"]
tags: [tail-swipe, fight, lifelink]
derived_from: oracle
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Tail Swipe @ts"]
    battlefield: ["Tropical Island @ti", {card: "Atraxa, Grand Unifier", as: atx}]
    library_pad: 10
  p1:
    battlefield: [{card: "Dragon's Rage Channeler", as: drc}]
    library_pad: 10
script:
  - p0: {t: cast, card: "@ts", targets: ["@atx", "@drc"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    p0:
      life: 28
      graveyard: [Tail Swipe]
      battlefield: [{card: Tropical Island, tapped: true}, {card: "Atraxa, Grand Unifier", pt: [8, 8], damage: 1}]
    p1:
      life: 20
      battlefield: []
      graveyard: ["Dragon's Rage Channeler"]
notes: >
  Cast in p0's main phase, so Atraxa gets +1/+1 (8/8) before the fight; she deals 8 to the Channeler and takes 1.
  Lifelink gains 8 (20 -> 28), which is the point of the test: the damage is dealt by Atraxa, not by the spell.
