id: hi-ponder-opponent-stream-independent-of-cards
title: The opponent's stream is identical whatever three cards Ponder looks at
area: hidden-info
cards: [Ponder, Daze, Lightning Bolt, Murktide Regent, Brainstorm, Preordain, Force of Will, Volcanic Island, Aluren, Tropical Island]
tags: [hidden-info, ponder, non-interference, paired-world]
derived_from: cr
source:
  - {kind: cr, ref: "701.20e", text: "Looking at a card follows the same rules as revealing a card, except that the card is shown only to the specified player.", verified: true}
  - {kind: cr, ref: "402.3", text: "A player can't look at the cards in another player's hand but may count those cards at any time.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Ponder @p"]
    battlefield: ["Volcanic Island @v"]
    library: ["Daze @a", "Lightning Bolt @b", "Murktide Regent @c"]
    library_pad: 10
  p1:
    hand: [Aluren]
    battlefield: ["Tropical Island"]
    library_pad: 10
world_b:
  p0: {library: ["Brainstorm @a", "Preordain @b", "Force of Will @c"]}
assert_streams_identical: {observer: p1}
script:
  - p0: {t: cast, card: "@p", pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
  - p0: {decision: order_cards, purpose: ponder_put_back, answer: ["@c", "@a", "@b"]}
  - p0: {decision: yes_no, purpose: ponder_shuffle, answer: false}
expect:
  - at: after_script
    stack: []
    p0: {hand_count: 1, library_count: 12}
notes: >
  The worlds differ only in the identities of p0's top three cards. Look-at events go only to the looker (701.20e), so p1's
  stream must be byte-identical.
