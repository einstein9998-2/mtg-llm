  - {kind: cr, ref: "702.16f", text: "Attacking creatures with protection can’t be blocked by creatures that have the stated quality.", verified: true}
  - {kind: cr, ref: "702.7b", text: "If at least one attacking or blocking creature has first strike or double strike (see rule 702.4) as the combat damage step begins, the only creatures that assign combat damage in that step are those with first strike or double strike.", verified: true}
  - {kind: cr, ref: "105.2b", text: "A multicolored object is two or more of the five colors.", verified: true}
