id: mu-unholy-heat-kills-faerie-macabre-cast-via-aluren
title: Unholy Heat without delirium deals 2 and kills a Faerie Macabre cast through Aluren
area: matchup
cards: [Unholy Heat, Faerie Macabre, Aluren, Lightning Bolt, Volcanic Island, Island, Tropical Island, Hedge Maze]
tags: [matchup, unholy-heat, delirium-off, aluren, free-cast, state-based-actions, lethal-damage]
derived_from: cr
source:
  - {kind: oracle, card: Unholy Heat, text: "Unholy Heat deals 2 damage to target creature or planeswalker.", verified: true}
  - {kind: oracle, card: Aluren, text: "Any player may cast creature spells with mana value 3 or less without paying their mana costs and as though they had flash.", verified: true}
  - {kind: cr, ref: "704.5g", text: "If a creature has toughness greater than 0, it has damage marked on it, and the total damage marked on it is greater than or equal to its toughness, that creature has been dealt lethal damage and is destroyed.", verified: true}
setup:
  turn: 4
  active: p1
  phase: main1
  p0:
    hand: ["Unholy Heat @uh"]
    battlefield: ["Volcanic Island"]
    graveyard: [Lightning Bolt]
    library_pad: 10
  p1:
    hand: ["Faerie Macabre @fm"]
    battlefield: ["Aluren", "Island", "Tropical Island", "Hedge Maze"]
    library_pad: 10
script:
  - p1: {t: cast, card: "@fm", alt_cost: {free: aluren}}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
      stack: []
      p1: {battlefield_contains: [{card: Faerie Macabre, pt: [2, 2], keywords: [flying], sick: true}]}
  - p1: {t: pass}
  - p0: {t: cast, card: "@uh", targets: ["@fm"], pay: auto}
  - p0: {t: pass}
  - p1: {t: pass}
expect:
  - at: after_script
    stack: []
    pending: {actor: p1, kind: priority}
    p1: {graveyard: [Faerie Macabre], battlefield: [{card: Aluren}, {card: Island}, {card: Tropical Island}, {card: Hedge Maze}]}
    p0: {graveyard: [Lightning Bolt, Unholy Heat]}
notes: >
  Faerie Macabre has mana value 3, so Aluren lets p1 cast it free. p0's graveyard holds one card type (instant), so Unholy
  Heat deals 2, which is lethal for a 2/2 (704.5g). p1 does not respond here (it could discard Macabre only while it is in
  hand, which it no longer is).
