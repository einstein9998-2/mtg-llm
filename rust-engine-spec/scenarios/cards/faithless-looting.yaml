id: faithless-looting-grafdiggers-cage-stops-flashback-not-hand-cast
title: Grafdigger's Cage forbids casting Faithless Looting from the graveyard but not from the hand
area: card
cards: [Faithless Looting, "Grafdigger's Cage", Badlands, Island]
tags: [faithless-looting, grafdiggers-cage, flashback, casting-restriction, mask-validity]
derived_from: oracle
source:
  - {kind: oracle, card: "Grafdigger's Cage", text: "Players can't cast spells from graveyards or libraries.", verified: true}
  - {kind: oracle, card: Faithless Looting, text: "Flashback {2}{R}", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Faithless Looting @hfl"]
    battlefield: ["Badlands @b1", "Badlands @b2", "Badlands @b3"]
    graveyard: ["Faithless Looting @gfl"]
    library_pad: 10
  p1:
    battlefield: ["Grafdigger's Cage @cage"]
    library_pad: 10
script:
  - expect_illegal: {p0: {t: cast, card: "@gfl", alt_cost: {flashback: true}}}
  - p0: {t: cast, card: "@hfl", pay: {tap: ["@b1"]}}
expect:
  - at: after_script
    stack: [{kind: spell, card: "@hfl", controller: p0}]
    pending: {actor: p0, kind: priority}
    p0:
      graveyard: [Faithless Looting]
      battlefield:
        - {card: Badlands, tapped: true}
        - {card: Badlands, tapped: false}
        - {card: Badlands, tapped: false}
notes: >
  Three untapped Badlands could pay {2}{R}, so only the Cage stops the flashback; the graveyard copy must not be in the
  legal set. The hand copy is cast normally. The Cage is controlled by p1 and still binds p0 ("Players"). Wrong
  engines: enumerate the flashback (a Forge enumerator gap noted in the interaction tests) or forbid the hand cast too.
