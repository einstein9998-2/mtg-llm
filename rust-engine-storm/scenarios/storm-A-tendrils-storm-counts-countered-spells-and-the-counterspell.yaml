    library_pad: 10
script:
  - p0: {t: cast, card: "@rit", pay: {tap: ["@s1"]}}
  - p0: {t: pass}
  - p1: {t: cast, card: "@fow", alt_cost: {exile_blue_card: "@bs", pay_life: 1}, targets: ["@rit"]}
  - p1: {t: pass}
  - p0: {t: pass}
  - check:
