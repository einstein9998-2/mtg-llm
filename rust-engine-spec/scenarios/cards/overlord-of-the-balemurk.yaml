id: overlord-impending-enters-with-time-counters-not-a-creature-and-returns-creature
title: Overlord of the Balemurk cast for its impending cost enters with five time counters as a noncreature enchantment, mills four and may return a non-Avatar creature or planeswalker card
area: card
cards: [Overlord of the Balemurk, "Phelia, Exuberant Shepherd", Lightning Bolt, "Jace, Wielder of Mysteries", Swamp, Plains]
tags: [overlord-of-the-balemurk, impending, alternative-cost, time-counters, type-changing, etb-trigger, mill, may-choice]
derived_from: cr
source:
  - {kind: oracle, card: Overlord of the Balemurk, text: "Whenever this permanent enters or attacks, mill four cards, then you may return a non-Avatar creature card or a planeswalker card from your graveyard to your hand.", verified: true}
  - {kind: oracle, card: Overlord of the Balemurk, text: "Impending 5—{1}{B}", verified: true}
  - {kind: cr, ref: "702.176a", text: "“Impending N—[cost]” means “You may choose to pay [cost] rather than pay this spell’s mana cost,” “If you chose to pay this permanent’s impending cost, it enters with N time counters on it,” “As long as this permanent’s impending cost was paid and it has a time counter on it, it’s not a creature,”", verified: true}
  - {kind: cr, ref: "701.17a", text: "For a player to mill a number of cards, that player puts that many cards from the top of their library into their graveyard.", verified: true}
setup:
  turn: 3
  active: p0
  phase: main1
  p0:
    hand: ["Overlord of the Balemurk @ov"]
    battlefield: ["Swamp @b1", "Plains @w1"]
    library: ["Phelia, Exuberant Shepherd @ph", "Overlord of the Balemurk @ov2", "Lightning Bolt @bolt", "Jace, Wielder of Mysteries @jace"]
    library_pad: 10
  p1:
    library_pad: 10
script:
  - p0: {t: cast, card: "@ov", alt_cost: {impending: true}, pay: auto}
  - check:
      stack: [{kind: spell, card: "@ov", controller: p0}]
      p0: {battlefield: [{card: Swamp, tapped: true}, {card: Plains, tapped: true}]}
  - p0: {t: pass}
  - p1: {t: pass}
  - check:
      stack: [{kind: triggered, source: "@ov", controller: p0}]
      pending: {actor: p0, kind: priority}
      p0: {battlefield_contains: [{card: Overlord of the Balemurk, counters: {time: 5}, types: [Enchantment]}]}
  - resolve_top: true
  - p0: {decision: choose_cards, purpose: return_to_hand, answer: ["@ph"], expect_options: {include: ["@ph", "@jace"], exclude: ["@ov2", "@bolt"]}}
expect:
  - at: after_script
    stack: []
    pending: {actor: p0, kind: priority}
    p0:
      hand: ["Phelia, Exuberant Shepherd"]
      graveyard: [Overlord of the Balemurk, Lightning Bolt, "Jace, Wielder of Mysteries"]
      library_count: 10
      battlefield:
        - {card: Overlord of the Balemurk, counters: {time: 5}, types: [Enchantment]}
        - {card: Swamp, tapped: true}
        - {card: Plains, tapped: true}
notes: >
  Impending is an alternative cost ({1}{B}, paid by Swamp and Plains). The permanent enters with five time counters
  (a replacement, 614.1c) and is not a creature while it has one, so its types are only Enchantment. Its "enters" trigger
  still fires (it says "this permanent", not "this creature"). The four milled cards are Phelia, a second Overlord
  (an Avatar, not returnable), Lightning Bolt (not a creature) and Jace (a planeswalker card, returnable). The "may
  return" is one choose_cards that may be empty. A wrong engine makes it a 5/5 creature, skips the trigger, or offers
  the Avatar.
